<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos 2026 - Fundição Erus</title>

    <!-- Bibliotecas de Estilo e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        /* --- 1. ROOT VARIABLES (MODERN DARK THEME - AMBER/ZINC) --- */
        :root {
            /* Typography */
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Palette */
            --color-primary: #0ea5e9;
            /* Sky 500 (Differente do Carteira para diferenciar) */
            --color-primary-dim: #0284c7;
            /* Sky 600 */

            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.7);

            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;

            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --border-separator: rgba(255, 255, 255, 0.06);

            --status-success: #10b981;
            --status-danger: #ef4444;
            --status-info: #06b6d4;
            --status-purple: #a855f7;
            --status-warning: #f59e0b;

            /* Dimensions */
            --header-height: 80px;
            --footer-height: 40px;

            /* Radius & Shadows */
            --radius-md: 12px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 15px rgba(14, 165, 233, 0.2);
        }

        /* --- 2. RESET & GLOBAL --- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 3. HEADER --- */
        .top-header {
            height: var(--header-height);
            min-height: var(--header-height);
            margin: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;
            box-shadow: var(--shadow-glow);
        }

        .header-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            line-height: 1.2;
        }

        .page-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 2px 0 0 0;
            font-weight: 400;
        }

        /* --- 4. DASHBOARD --- */
        .dashboard-content {
            flex-grow: 1;
            padding: 0 32px 10px 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kpi-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
            height: 100px;
            min-height: 100px;
        }

        .kpi-card {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(5px);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--border-highlight);
        }

        .kpi-card.kpi-default::before {
            background: var(--color-primary);
        }

        .kpi-card.kpi-success::before {
            background: var(--status-success);
        }

        .kpi-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            font-family: var(--font-mono);
            line-height: 1.1;
        }

        .kpi-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* --- TABLE --- */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: auto;
            width: 100%;
            flex-grow: 1;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        th {
            background: #18181b;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 16px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-main);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--color-primary);
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .search-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
        }

        .search-input {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            width: 300px;
            font-family: var(--font-main);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .tag-year {
            background: rgba(14, 165, 233, 0.15);
            color: var(--color-primary);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <header class="top-header">
            <div class="header-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-sync"></i>
                </div>
                <div class="header-text">
                    <h1 class="page-title">Pedidos 2026</h1>
                    <p class="page-subtitle">Sincronizado via Firebird -> Vercel</p>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-input"
                    placeholder="Buscar pedido, produto ou cliente...">
            </div>
        </header>

        <main class="dashboard-content">
            <!-- KPIs -->
            <div class="kpi-row">
                <div class="kpi-card kpi-default">
                    <span class="kpi-title">Total de Pedidos</span>
                    <span class="kpi-value" id="kpi-count">-</span>
                </div>
                <div class="kpi-card kpi-default">
                    <span class="kpi-title">Peso Líquido Total</span>
                    <span class="kpi-value" id="kpi-weight">-</span>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center">Pedido</th>
                            <th class="text-center">Empresa</th>
                            <th class="text-center">Cód. Prod</th>
                            <th>Produto</th>
                            <th class="text-center">Ano</th>
                            <th class="text-right">Qtd</th>
                            <th class="text-right">Peso (Kg)</th>
                            <th>Entrega</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando dados...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const currency = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        const number = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2 });
        let allData = [];

        async function init() {
            try {
                const res = await fetch('/api/pedidos-sync');
                if (!res.ok) throw new Error('Erro na API');
                allData = await res.json();
                render(allData);
                updateKPIs(allData);
            } catch (err) {
                console.error(err);
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="8" style="text-align:center; color:#ef4444; padding:20px;">
                        Erro ao carregar dados. Verifique a conexão.
                    </td></tr>
                `;
            }
        }

        function render(list) {
            const tbody = document.getElementById('table-body');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px;">Nenhum registro.</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(item => `
                <tr>
                    <td class="text-center" style="font-weight:700; color:var(--color-primary);">#${item.CODIGO_PPR}</td>
                    <td class="text-center">${item.EMPRESA_PPR}</td>
                    <td class="text-center" style="font-family:var(--font-mono); color:var(--text-muted);">${item.PRODUTO_PPR}</td>
                    <td>${item.NOME_PRODUTO_PPR || item.PRODUTO_PPR}</td>
                    <td class="text-center"><span class="tag-year">${item.ANO_PPR}</span></td>
                    <td class="text-right">${item.QUANTIDADE_PPR}</td>
                    <td class="text-right">${number.format(item.PESO_LIQUIDO_NPR || 0)}</td>
                    <td>
                        ${item.ENTREGA_PETR ? new Date(item.ENTREGA_PETR).toLocaleDateString() :
                    (item.DATA_ENTREGA_PPR ? new Date(item.DATA_ENTREGA_PPR).toLocaleDateString() : '-')}
                    </td>
                </tr>
            `).join('');
        }

        function updateKPIs(list) {
            document.getElementById('kpi-count').innerText = list.length;

            const totalWeight = list.reduce((acc, i) => acc + (Number(i.PESO_LIQUIDO_NPR) || 0), 0);
            document.getElementById('kpi-weight').innerText = number.format(totalWeight) + ' kg';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(i =>
                String(i.CODIGO_PPR).includes(term) ||
                String(i.NOME_PRODUTO_PPR || '').toLowerCase().includes(term) ||
                String(i.PRODUTO_PPR || '').toLowerCase().includes(term)
            );
            render(filtered);
            updateKPIs(filtered);
        });

        init();
    </script>
</body>

</html>
