<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos 2026 - Fundição Erus</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dark .glass {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'media', // Usa preferência do sistema
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-brand-600 text-white p-2 rounded-lg font-bold">FE</div>
                    <span class="font-semibold text-xl tracking-tight">Pedidos 2026</span>
                </div>
                <div class="text-sm text-gray-500 dark:text-gray-400">
                    Sincronizado do Firebird
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div
                class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Pedidos</p>
                <h3 class="text-3xl font-bold mt-2" id="totalCount">-</h3>
            </div>
            <div
                class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Peso Total (Liq)</p>
                <h3 class="text-3xl font-bold mt-2 text-brand-600" id="totalWeight">- kg</h3>
            </div>
            <div
                class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Valor Total</p>
                <h3 class="text-3xl font-bold mt-2 text-green-600" id="totalValue">-</h3>
            </div>
        </div>

        <!-- Table Section -->
        <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
            <div
                class="p-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center gap-4 flex-wrap">
                <h2 class="text-lg font-semibold">Listagem Completa</h2>
                <input type="text" id="searchInput" placeholder="Buscar pedido, cliente ou código..."
                    class="px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-500 focus:outline-none w-full md:w-64 text-sm">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead
                        class="bg-gray-50 dark:bg-gray-700/50 text-gray-500 dark:text-gray-400 font-medium border-b border-gray-100 dark:border-gray-700">
                        <tr>
                            <th class="px-6 py-4">Pedido</th>
                            <th class="px-6 py-4">Cliente (Cod)</th>
                            <th class="px-6 py-4">Produto</th>
                            <th class="px-6 py-4 text-center">Ano</th>
                            <th class="px-6 py-4 text-right">Qtd</th>
                            <th class="px-6 py-4 text-right">Peso (Kg)</th>
                            <th class="px-6 py-4 text-right">Valor Total</th>
                            <th class="px-6 py-4">Entrega</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 dark:divide-gray-700">
                        <!-- Rows injected via JS -->
                        <tr>
                            <td colspan="8" class="px-6 py-8 text-center text-gray-500">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Formatter util
        const currency = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        const number = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2 });

        let allData = [];

        async function loadData() {
            try {
                const res = await fetch('/api/pedidos-sync');
                if (!res.ok) throw new Error('Falha ao carregar');
                allData = await res.json();
                renderTable(allData);
                updateStats(allData);
            } catch (error) {
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="8" class="px-6 py-8 text-center text-red-500">Erro ao carregar dados. Verifique o servidor.</td></tr>
                `;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">Nenhum pedido encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                    <td class="px-6 py-4 font-medium text-brand-600">#${item.CODIGO_PPR}</td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900 dark:text-gray-100">CLIENTE EXIBIÇÃO?</div>
                        <div class="text-xs text-gray-500">Cód: ${item.EMPRESA_PPR}</div> 
                    </td>
                    <td class="px-6 py-4 max-w-xs truncate" title="${item.NOME_PRODUTO_PPR || item.PRODUTO_PPR}">
                        ${item.NOME_PRODUTO_PPR || 'Produto ' + item.PRODUTO_PPR}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300">
                            ${item.ANO_PPR}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right font-mono">${item.QUANTIDADE_PPR}</td>
                    <td class="px-6 py-4 text-right font-mono">${number.format(item.PESO_LIQUIDO_NPR || 0)}</td>
                    <td class="px-6 py-4 text-right font-medium text-gray-900 dark:text-white">
                        ${currency.format(item.VALOR_ITEM_PPR || 0)}
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">
                        ${item.ENTREGA_PETR ? new Date(item.ENTREGA_PETR).toLocaleDateString() : (item.DATA_ENTREGA_PPR ? new Date(item.DATA_ENTREGA_PPR).toLocaleDateString() : '-')}
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;

            const totalWeight = data.reduce((acc, item) => acc + (parseFloat(item.PESO_LIQUIDO_NPR) || 0), 0);
            document.getElementById('totalWeight').textContent = number.format(totalWeight) + ' kg';

            const totalValue = data.reduce((acc, item) => acc + (parseFloat(item.VALOR_ITEM_PPR) || 0), 0);
            document.getElementById('totalValue').textContent = currency.format(totalValue);
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(item =>
                (item.CODIGO_PPR && item.CODIGO_PPR.toString().includes(term)) ||
                (item.NOME_PRODUTO_PPR && item.NOME_PRODUTO_PPR.toLowerCase().includes(term)) ||
                (item.PRODUTO_PPR && item.PRODUTO_PPR.toString().includes(term))
            );
            renderTable(filtered);
            updateStats(filtered); // Update stats based on filtered view? Optional.
        });

        // Init
        loadData();
    </script>
</body>

</html>
