<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Dureza - Qualidade</title>

    <!-- Bibliotecas de Estilo e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bibliotecas Funcionais (XLSX, Charts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="js/activity-logger.js"></script>

    <style>
        /* --- BLOQUEIO DE SELEÇÃO GLOBAL --- */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            outline: none;
        }

        /* Permitir seleção apenas em inputs e textareas */
        input,
        textarea,
        .selectable-text,
        [contenteditable="true"] {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            cursor: text;
        }

        /* --- 1. ROOT VARIABLES (PEDIDOS STANDARD - AMBER/ZINC) --- */
        :root {
            /* Typography */
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Palette - Amber */
            --color-primary: #fbbf24;
            /* Amber 400 */
            --color-primary-dim: #d97706;
            /* Amber 600 */
            --color-accent: #f59e0b;
            /* Amber 500 */

            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.7);
            --bg-modal: #18181b;

            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;

            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --border-separator: rgba(255, 255, 255, 0.06);

            --status-success: #10b981;
            --status-danger: #ef4444;
            --status-info: #06b6d4;
            --status-purple: #a855f7;

            /* Dimensions */
            --radius-md: 12px;
            --radius-sm: 6px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        /* --- 2. RESET & GLOBAL --- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            /* Background gradiente igual Carteira (Laranja) */
            background-image:
                radial-gradient(circle at 15% 50%, rgba(234, 88, 12, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #09090b;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(251, 191, 36, 0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- 4. HEADER --- */
        /* --- SIDE NAVIGATION (PEDIDOS STANDARD) --- */
        .side-menu-trigger {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 15px;
            z-index: 2000;
            background: transparent;
        }

        .side-menu {
            position: fixed;
            right: -320px;
            top: 20px;
            bottom: 20px;
            width: 300px;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(20px) saturate(2);
            -webkit-backdrop-filter: blur(20px) saturate(2);
            border: 1px solid var(--border-subtle);
            border-right: none;
            border-radius: 20px 0 0 20px;
            z-index: 2001;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
        }

        .side-menu-trigger:hover + .side-menu,
        .side-menu:hover {
            right: 0;
        }

        .side-menu-header {
            margin-bottom: 40px;
        }

        .side-menu-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
        }

        .side-menu-subtitle {
            font-size: 0.7rem;
            color: var(--color-primary);
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .side-menu-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .side-btn:hover:not(:disabled) {
            background: rgba(251, 191, 36, 0.1);
            border-color: var(--color-primary);
            color: var(--color-primary);
            transform: translateX(-5px);
        }

        .side-btn.btn-back-side {
            margin-top: auto;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .side-btn.btn-back-side:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fff;
        }

        /* --- 5. MAIN CONTENT --- */
        .dashboard-content {
            flex-grow: 1;
            padding: 20px 32px 32px 32px;
        }

        /* KPIs */
        .kpi-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .kpi-card {
            flex: 1;
            min-width: 200px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(5px);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .kpi-default::before {
            background: var(--color-primary);
        }

        .kpi-purple::before {
            background: var(--status-purple);
        }

        .kpi-accent::before {
            background: var(--color-accent);
        }

        .kpi-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            font-family: var(--font-mono);
        }

        /* Charts */
        .charts-row {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .chart-panel {
            flex: 1;
            min-width: 450px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px;
            height: 620px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .chart-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 10px;
        }

        /* Table & Filters */
        .table-header-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .active-filter-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(234, 88, 12, 0.15);
            /* Ajustado para Laranja */
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            animation: fadeIn 0.3s;
        }

        .btn-clear-filter {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-clear-filter:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin-bottom: 20px;
            min-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            min-width: 1000px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-separator);
            white-space: nowrap;
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--color-primary);
        }

        td {
            color: var(--text-main);
        }

        .filter-input-table {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--color-primary);
            padding: 4px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .filter-input-table:focus {
            border-color: var(--color-primary);
            outline: none;
        }

        /* --- 6. MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: var(--bg-modal);
            padding: 32px;
            border-radius: var(--radius-md);
            width: 90%;
            max-width: 800px;
            border: 1px solid var(--border-highlight);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--color-primary);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-full {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 5px;
        }

        .form-group label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--color-primary);
        }

        .btn-save {
            background: var(--color-primary);
            color: #000;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.1s;
        }

        .btn-save:hover {
            background: var(--color-primary-dim);
            color: #fff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-full {
                grid-column: span 1;
            }

            .top-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <!-- Sessão gerenciada centralmente por js/activity-logger.js -->

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="color: var(--text-muted); font-family: var(--font-main);">Processando dados...</div>
    </div>

    <!-- HEADER -->
    <!-- Side Menu Trigger Area -->
    <div class="side-menu-trigger"></div>
    <nav class="side-menu">
        <div class="side-menu-header">
            <div class="side-menu-title">Opções</div>
            <div class="side-menu-subtitle">CONTROLE DE DUREZA</div>
        </div>

        <div class="side-menu-actions">
            <!-- Functional Actions -->
            <button class="side-btn" onclick="openRegisterModal()">
                <i class="fa-solid fa-plus-circle" style="color: var(--color-primary);"></i> Novo Registro
            </button>
            <button class="side-btn" onclick="exportToExcel()">
                <i class="fa-solid fa-file-excel" style="color: var(--status-success);"></i> Exportar Excel
            </button>
            <div style="height: 1px; background: var(--border-separator); margin: 5px 0;"></div>
            <button class="side-btn" onclick="clearAllData()" style="color: var(--status-danger);">
                <i class="fa-solid fa-trash"></i> Limpar Banco
            </button>

            <a href="index.html" class="side-btn btn-back-side">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </a>
        </div>
    </nav>

    <!-- DASHBOARD CONTENT -->
    <main class="dashboard-content">

        <!-- KPIs -->
        <div class="kpi-row">
            <div class="kpi-card kpi-default">
                <div class="kpi-title">Total de Testes</div>
                <div class="kpi-value" id="cardTotalTestes">0</div>
            </div>

            <div class="kpi-card kpi-purple">
                <div class="kpi-title">Última Dureza</div>
                <div class="kpi-value" id="cardLastDureza">-</div>
            </div>

            <div class="kpi-card kpi-accent">
                <div class="kpi-title">Cliente Mais Frequente</div>
                <div class="kpi-value" id="cardTopClient" style="font-size: 1.5rem;">-</div>
            </div>
        </div>

        <!-- GRÁFICOS -->
        <div class="charts-row">
            <!-- Gráfico Interativo -->
            <div class="chart-panel">
                <div class="chart-title">
                    Histórico Diário <span class="chart-subtitle">(Clique na barra para filtrar a tabela)</span>
                </div>
                <div style="position: relative; flex: 1; width: 100%;">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div class="chart-panel">
                <div class="chart-title">Testes por Cliente (Top 5)</div>
                <div style="position: relative; flex: 1; width: 100%;">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- AREA DE CONTROLE DA TABELA -->
        <div class="table-header-control" id="filterControl" style="display: none;">
            <div class="active-filter-badge">
                <i class="fa-solid fa-filter"></i>
                <span id="filterDateDisplay">Data: --/--/----</span>
                <button class="btn-clear-filter" onclick="clearDateFilter()" title="Remover Filtro">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- TABELA -->
        <div class="table-container" id="tableWrapper">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>DATA</th>
                        <th>OP</th>
                        <th>CLIENTE</th>
                        <th>CÓDIGO</th>
                        <th>MATERIAL</th>
                        <th>DESCRIÇÃO</th>
                        <th>DUREZA</th>
                        <th>AÇÕES</th>
                    </tr>
                    <tr>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th><input type="text" class="filter-input-table" placeholder="Filtrar..."
                                onkeyup="applyFilters()"></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL DE REGISTRO -->
    <div id="registerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-pen-to-square"></i> Registrar Dureza</h2>
                <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
            </div>

            <form id="durezaForm" onsubmit="saveRegister(event)" autocomplete="off">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inputData">Data do Teste</label>
                        <input type="date" id="inputData" required>
                    </div>

                    <div class="form-group">
                        <label for="inputOP">Ordem de Produção (OP)</label>
                        <input type="text" id="inputOP" placeholder="Ex: 123456" required>
                    </div>

                    <div class="form-group form-full">
                        <label for="inputCliente">Cliente</label>
                        <input type="text" id="inputCliente" placeholder="Nome do Cliente" required>
                    </div>

                    <div class="form-group">
                        <label for="inputCodigo">Código</label>
                        <input type="text" id="inputCodigo" placeholder="Cód. Produto">
                    </div>

                    <div class="form-group">
                        <label for="inputMaterial">Material</label>
                        <input type="text" id="inputMaterial" placeholder="Ex: SAE 1045, FOFO...">
                    </div>

                    <div class="form-group">
                        <label for="inputDureza">Dureza Encontrada</label>
                        <input type="text" id="inputDureza" placeholder="Ex: 45 HRC" required>
                    </div>

                    <div class="form-group">
                        <label for="inputDescricao">Descrição do Item</label>
                        <input type="text" id="inputDescricao" placeholder="Descrição completa...">
                    </div>
                </div>

                <button type="submit" class="btn-save">SALVAR REGISTRO</button>
            </form>
        </div>
    </div>

    <script>
        // =========================================================
        // LÓGICA JAVASCRIPT
        // =========================================================

        let hardnessData = [];
        let lineChartInstance = null;
        let barChartInstance = null;
        let activeDateFilter = null;

        // Configurações globais Chart.js
        Chart.defaults.color = '#a1a1aa';
        Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';
        Chart.defaults.font.family = "'JetBrains Mono', monospace";

        // Cores Atualizadas para o Tema Carteira (Laranja Queimado)
        const COLOR_PRIMARY = '#ea580c';
        const COLOR_PURPLE = '#a855f7';

        // --- Inicialização ---
        document.addEventListener('DOMContentLoaded', () => {
            loadDataFromDB();

            document.addEventListener('click', function (event) {
                const dropdown = document.getElementById('functionsDropdown');
                const isClickInside = dropdown.contains(event.target);
                if (!isClickInside) dropdown.classList.remove('open');
            });
        });

        // --- FUNÇÕES DE LOADING (SINCRONIZADAS COM ADERÊNCIA) ---
        function showSpinner() {
            const spinner = document.getElementById('loading-screen');
            if (spinner) {
                spinner.style.display = 'flex';
                spinner.style.opacity = '1';
            }
        }

        function hideSpinner() {
            const spinner = document.getElementById('loading-screen');
            if (spinner) {
                spinner.style.opacity = '0';
                setTimeout(() => {
                    spinner.style.display = 'none';
                }, 500); // Tempo de 500ms identico a aderencia
            }
        }

        function toggleDropdown() { document.getElementById('functionsDropdown').classList.toggle('open'); }

        // --- API & Database Functions ---
        async function loadDataFromDB() {
            showSpinner();
            try {
                // Rota unificada
                const response = await fetch('/api/dureza');
                const data = await response.json();
                hardnessData = Array.isArray(data) ? data : [];

                renderTable();
                updateDashboard();
            } catch (error) {
                console.error("Erro ao carregar:", error);
                hardnessData = [];
                renderTable();
            } finally {
                hideSpinner();
            }
        }

        async function saveRegister(event) {
            event.preventDefault();
            showSpinner();

            const newRecord = {
                data: document.getElementById('inputData').value,
                op: document.getElementById('inputOP').value.toUpperCase(),
                cliente: document.getElementById('inputCliente').value.toUpperCase(),
                codigo: document.getElementById('inputCodigo').value.toUpperCase(),
                material: document.getElementById('inputMaterial').value.toUpperCase(),
                descricao: document.getElementById('inputDescricao').value.toUpperCase(),
                dureza: document.getElementById('inputDureza').value.toUpperCase()
            };

            try {
                // Rota unificada com ?action=registrar
                const response = await fetch('/api/dureza?action=registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRecord)
                });

                if (!response.ok) throw new Error("Falha ao salvar");
                const result = await response.json();

                if (result.success) {
                    closeRegisterModal();
                    loadDataFromDB();
                }
            } catch (error) {
                alert("Erro de conexão ao salvar.");
            } finally {
                hideSpinner();
            }
        }

        async function deleteRecord(id) {
            if (!confirm("Excluir este registro permanentemente?")) return;
            showSpinner();
            try {
                // Método DELETE na rota unificada
                const response = await fetch('/api/dureza', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                const result = await response.json();
                if (result.success) loadDataFromDB();
            } catch (e) {
                console.error(e);
            } finally {
                hideSpinner();
            }
        }

        async function clearAllData() {
            if (!confirm("ATENÇÃO: APAGAR TODO O BANCO DE DADOS?")) return;
            showSpinner();
            try {
                // Rota unificada com ?action=limpar
                const response = await fetch('/api/dureza?action=limpar', { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    loadDataFromDB();
                    toggleDropdown();
                }
            } catch (e) { console.error(e); } finally { hideSpinner(); }
        }

        // --- Modais ---
        function openRegisterModal() {
            toggleDropdown();
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('inputData').value = `${year}-${month}-${day}`;
            document.getElementById('inputOP').value = '';
            document.getElementById('inputCliente').value = '';
            document.getElementById('inputCodigo').value = '';
            document.getElementById('inputMaterial').value = '';
            document.getElementById('inputDescricao').value = '';
            document.getElementById('inputDureza').value = '';
            document.getElementById('registerModal').classList.add('active');
        }
        function closeRegisterModal() { document.getElementById('registerModal').classList.remove('active'); }

        // --- Funções de Filtragem por Data ---
        function setDateFilter(dateStr) {
            activeDateFilter = dateStr;
            const controlDiv = document.getElementById('filterControl');
            const displaySpan = document.getElementById('filterDateDisplay');
            const [y, m, d] = dateStr.split('-');
            displaySpan.innerText = `Data: ${d}/${m}/${y}`;
            controlDiv.style.display = 'flex';
            renderTable();
        }

        function clearDateFilter() {
            activeDateFilter = null;
            document.getElementById('filterControl').style.display = 'none';
            renderTable();
        }

        // --- Renderização ---
        function renderTable() {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';

            let dataToShow = hardnessData;
            if (activeDateFilter) {
                dataToShow = hardnessData.filter(item => item.data === activeDateFilter);
            }

            if (!dataToShow || dataToShow.length === 0) {
                const msg = activeDateFilter
                    ? `Nenhum registro para a data selecionada.`
                    : `Nenhum registro encontrado.`;
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 20px; color:var(--text-muted);">${msg}</td></tr>`;
                return;
            }

            const sortedData = [...dataToShow].sort((a, b) => new Date(b.data) - new Date(a.data));

            sortedData.forEach(item => {
                const tr = document.createElement('tr');
                let formattedDate = item.data;
                if (item.data && item.data.includes('-')) {
                    const parts = item.data.split('-');
                    if (parts.length === 3) formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }

                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>${item.op || ''}</td>
                    <td>${item.cliente || ''}</td>
                    <td>${item.codigo || ''}</td>
                    <td>${item.material || ''}</td>
                    <td>${item.descricao || ''}</td>
                    <td style="font-weight: bold; color: var(--color-primary);">${item.dureza || ''}</td>
                    <td style="text-align: center;">
                        <button onclick="deleteRecord(${item.id})" style="background: transparent; border: 1px solid var(--status-danger); color: var(--status-danger); cursor: pointer; padding: 4px 8px; border-radius: 4px;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            applyFilters();
        }

        function updateDashboard() {
            document.getElementById('cardTotalTestes').innerText = hardnessData.length;
            if (hardnessData.length > 0) {
                const lastRecord = hardnessData[hardnessData.length - 1];
                document.getElementById('cardLastDureza').innerText = lastRecord.dureza;
                const clients = {};
                hardnessData.forEach(d => { if (d.cliente) clients[d.cliente] = (clients[d.cliente] || 0) + 1; });
                let topClient = "-"; let maxVal = 0;
                for (const [cli, count] of Object.entries(clients)) {
                    if (count > maxVal) { maxVal = count; topClient = cli; }
                }
                document.getElementById('cardTopClient').innerText = topClient;
            } else {
                document.getElementById('cardLastDureza').innerText = "-";
                document.getElementById('cardTopClient').innerText = "-";
            }
            updateCharts();
        }

        function updateCharts() {
            const countsPerDay = {};
            hardnessData.forEach(d => {
                if (d.data) {
                    countsPerDay[d.data] = (countsPerDay[d.data] || 0) + 1;
                }
            });
            const sortedDates = Object.keys(countsPerDay).sort();
            const recentDates = sortedDates.slice(-20);
            const recentCounts = recentDates.map(date => countsPerDay[date]);
            const chartLabels = recentDates.map(dateStr => {
                const parts = dateStr.split('-');
                return `${parts[2]}/${parts[1]}`;
            });

            const ctxLine = document.getElementById('lineChart').getContext('2d');
            if (lineChartInstance) lineChartInstance.destroy();
            lineChartInstance = new Chart(ctxLine, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Qtd. Testes',
                        data: recentCounts,
                        backgroundColor: COLOR_PRIMARY,
                        hoverBackgroundColor: '#fbbf24',
                        borderRadius: 4,
                        maxBarThickness: 40
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (tooltipItems) => {
                                    return 'Data: ' + tooltipItems[0].label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    },
                    onClick: (evt, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const rawDate = recentDates[index];
                            setDateFilter(rawDate);
                        }
                    },
                    onHover: (event, chartElement) => {
                        event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
                    }
                }
            });

            const clientCounts = {};
            hardnessData.forEach(d => {
                if (d.cliente) clientCounts[d.cliente] = (clientCounts[d.cliente] || 0) + 1;
            });
            const sortedClients = Object.entries(clientCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const labelsBar = sortedClients.map(x => x[0]);
            const valuesBar = sortedClients.map(x => x[1]);

            const ctxBar = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labelsBar,
                    datasets: [{
                        label: 'Qtd. Testes',
                        data: valuesBar,
                        // ALTERADO PARA COR LARANJA (Igual Carteira)
                        backgroundColor: COLOR_PRIMARY,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true, ticks: { stepSize: 1 } },
                        y: { grid: { display: false } }
                    }
                }
            });
        }

        function applyFilters() {
            const table = document.getElementById("dataTable");
            const trs = table.getElementsByTagName("tbody")[0].getElementsByTagName("tr");
            const inputs = document.querySelectorAll('.filter-input-table');
            for (let i = 0; i < trs.length; i++) {
                if (trs[i].cells.length < 2) continue;
                let showRow = true;
                const tds = trs[i].getElementsByTagName("td");
                for (let j = 0; j < inputs.length; j++) {
                    const filterVal = inputs[j].value.toUpperCase();
                    if (!filterVal) continue;
                    if (tds[j]) {
                        const txtValue = tds[j].textContent || tds[j].innerText;
                        if (txtValue.toUpperCase().indexOf(filterVal) === -1) {
                            showRow = false; break;
                        }
                    }
                }
                trs[i].style.display = showRow ? "" : "none";
            }
        }

        function exportToExcel() {
            if (hardnessData.length === 0) {
                alert("Sem dados para exportar.");
                return;
            }
            const dataToExport = activeDateFilter
                ? hardnessData.filter(d => d.data === activeDateFilter)
                : hardnessData;
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dureza");
            XLSX.writeFile(wb, `Controle_Dureza_${new Date().toISOString().slice(0, 10)}.xlsx`);
            toggleDropdown();
        }
    </script>
    <script src="js/activity-logger.js"></script>
</body>

</html>
