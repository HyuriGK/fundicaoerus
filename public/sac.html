<body><main class="page">
  <header class="top"><div><div class="eyebrow">ATENDIMENTO AO CLIENTE</div><h1>Serviço de Atendimento</h1></div><p>Consulta operacional · dados em tempo real do SIGE</p></header>
  <section class="stats"><div class="card stat"><span>Total exibido</span><strong id="total">—</strong></div><div class="card stat"><span>Abertos</span><strong id="abertos">—</strong></div><div class="card stat"><span>Resolvidos</span><strong id="resolvidos">—</strong></div><div class="card stat"><span>Cancelados</span><strong id="cancelados">—</strong></div></section>
  <section class="panel table-wrap"><table class="table"><thead><tr><th class="sort" data-sort="CODIGO_SAV">Código <i></i></th><th>Situação</th><th class="sort" data-sort="DATA_CADASTRO_SAV">Cadastro <i></i></th><th>Cliente</th><th>Reclamante</th><th class="sort" data-sort="ORIGEM_SAV">Origem <i></i></th><th class="sort" data-sort="DATA_LIMITE_SAV">Prazo <i></i></th><th>Produtos</th><th>Ações</th></tr><tr class="filter-row"><th><input data-filter="CODIGO_SAV" placeholder="Filtrar"></th><th><input data-filter="SITUACAO_NOME" placeholder="Filtrar"></th><th><input data-filter="DATA_CADASTRO_SAV" placeholder="dd/mm/aaaa"></th><th><input data-filter="NOME_CLIENTE_SAV" placeholder="Filtrar"></th><th><input data-filter="RECLAMANTE_NOME_SAV" placeholder="Filtrar"></th><th><input data-filter="ORIGEM_SAV" placeholder="Filtrar"></th><th><input data-filter="DATA_LIMITE_SAV" placeholder="dd/mm/aaaa"></th><th><input data-filter="TOTAL_PRODUTOS" placeholder="Filtrar"></th><th><input data-filter="TOTAL_ACOES" placeholder="Filtrar"></th></tr></thead><tbody id="lista"><tr><td colspan="9" class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Carregando SACs…</td></tr></tbody></table></section>
</main>
<div class="modal" id="modal"><article class="detail"><header class="detail-head"><div><div class="eyebrow">SAC <span id="d-code"></span></div><h2 id="d-client">—</h2><span id="d-status" class="tag"></span></div><button class="close" id="fechar"><i class="fa-solid fa-xmark"></i></button></header><section class="info-grid" id="info"></section><nav class="tabs" id="tabs"><button class="tab active" data-tab="principal">Principal</button><button class="tab" data-tab="analise">Análise e resolução</button><button class="tab" data-tab="produtos">Produtos</button><button class="tab" data-tab="acoes">Ações</button><button class="tab" data-tab="historico">Linha do tempo</button><button class="tab" data-tab="anexos">Anexos</button><button class="tab" data-tab="ressarcimento">Ressarcimento</button></nav><div id="conteudo"></div></article></div>
<script>
const $=s=>document.querySelector(s)||{addEventListener(){}}, esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const limpar=v=>{if(typeof v==='string'&&/^\{\\rtf/i.test(v))return v.replace(/\\par[d]?/gi,'\n').replace(/\\tab/gi,'\t').replace(/\\u(-?\d+)\??/g,(_,n)=>String.fromCharCode((+n+65536)%65536)).replace(/\\'([0-9a-f]{2})/gi,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,'').replace(/\\([\\{}])/g,'$1').replace(/^[A-Za-z0-9 _-]+;\s*(?:;;\s*)?/,'').replace(/\n{3,}/g,'\n\n').trim();if(Array.isArray(v))return v.map(limpar);if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,limpar(x)]));return v};
const enriquecer=d=>{if(d&&Array.isArray(d.acoes)){d.acoes.forEach(a=>a.RESPONSAVEIS=(d.responsaveis||[]).filter(r=>Number(r.SVAC_ID_SVU)===Number(a.ID_SVAC)).map(r=>`${r.USU_CODIGO_SVU} - ${r.NOME_USUARIO_SVU}`).filter(Boolean).join(', ')||'—');window.__sacAcoes=d.acoes;window.__sacHistorico=d.historico||[]}return d};
const fetchOriginal=window.fetch;window.fetch=async(...args)=>{const url=String(args[0]).includes('/api/sac/detail/')?`${args[0]}${String(args[0]).includes('?')?'&':'?'}_=${Date.now()}`:args[0],controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetchOriginal(url,{...(args[1]||{}),signal:controller.signal});if(String(url).includes('/api/sac/')){const json=response.json.bind(response);response.json=async()=>enriquecer(limpar(await json()))}return response}finally{clearTimeout(timer)}};
const date=v=>{if(!v)return '—';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:new Intl.DateTimeFormat('pt-BR').format(new Date(v))}; const hora=v=>v?new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date(v)): '—'; const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let dados=[];
function badge(s){let c=s==='ABERTO'?'open':s==='RESOLVIDO'?'done':'cancel';return `<span class="tag ${c}">${esc(s)}</span>`}
let sortKey='DATA_LIMITE_SAV',sortDir='asc';
async function carregar(){$('#lista').innerHTML='<tr><td colspan="9" class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Carregando SACs…</td></tr>';try{const r=await fetch('/api/sac/list');if(!r.ok)throw Error();dados=await r.json();render()}catch(e){$('#lista').innerHTML='<tr><td colspan="9" class="empty">Não foi possível consultar os dados sincronizados.</td></tr>'}}
function render(){const filters=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(i=>[i.dataset.filter,i.value.trim().toLocaleLowerCase('pt-BR')]));const view=dados.filter(x=>Object.entries(filters).every(([key,value])=>!value||String(key.includes('DATA_')?date(x[key]):x[key]??'').toLocaleLowerCase('pt-BR').includes(value))).sort((a,b)=>{const av=a[sortKey]??'',bv=b[sortKey]??'';const order=sortKey.includes('DATA_')?String(av).localeCompare(String(bv)):typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'pt-BR',{numeric:true});return sortDir==='asc'?order:-order});const count=s=>view.filter(x=>x.SITUACAO_NOME===s).length;$('#total').textContent=view.length;$('#abertos').textContent=count('ABERTO');$('#resolvidos').textContent=count('RESOLVIDO');$('#cancelados').textContent=count('CANCELADO');document.querySelectorAll('.sort i').forEach(i=>i.className='');const icon=document.querySelector(`[data-sort="${sortKey}"] i`);if(icon)icon.className=`fa-solid fa-sort-${sortDir==='asc'?'up':'down'}`;$('#lista').innerHTML=view.length?view.map(x=>`<tr data-code="${x.CODIGO_SAV}"><td class="code">#${x.CODIGO_SAV}</td><td>${badge(x.SITUACAO_NOME)}</td><td>${date(x.DATA_CADASTRO_SAV)}</td><td><b>${esc(x.NOME_CLIENTE_SAV)}</b><br><span class="muted">${esc(x.CLI_CODIGO_SAV||'')}</span></td><td>${esc(x.RECLAMANTE_NOME_SAV||'—')}</td><td>${esc(x.ORIGEM_SAV||'—')}</td><td>${date(x.DATA_LIMITE_SAV)}</td><td>${x.TOTAL_PRODUTOS||0}</td><td>${x.TOTAL_ACOES||0}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">Nenhuma ocorrência encontrada.</td></tr>';document.querySelectorAll('#lista tr[data-code]').forEach(r=>r.onclick=()=>abrir(r.dataset.code))}
function table(rows,cols){return rows.length?`<table class="mini"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="muted">Nenhum registro informado.</p>'}
async function abrir(codigo){$('#modal').classList.add('show');$('#conteudo').innerHTML='<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Carregando detalhe…</div>';try{const r=await fetch('/api/sac/detail/'+codigo);if(!r.ok)throw Error();const d=await r.json();detalhe(d)}catch(e){$('#conteudo').innerHTML='<div class="empty">Não foi possível carregar este SAC.</div>'}}
function detalhe(d){$('#d-code').textContent='#'+d.CODIGO_SAV;$('#d-client').textContent=d.NOME_CLIENTE_SAV;$('#d-status').className='tag '+(d.SITUACAO_NOME==='ABERTO'?'open':d.SITUACAO_NOME==='RESOLVIDO'?'done':'cancel');$('#d-status').textContent=d.SITUACAO_NOME;const infos=[['Cliente',d.NOME_CLIENTE_SAV],['Reclamante',d.RECLAMANTE_NOME_SAV],['Contato',[d.RECLAMANTE_FONE_SAV,d.RECLAMANTE_EMAIL_SAV].filter(Boolean).join(' · ')||'—'],['Cadastro',date(d.DATA_CADASTRO_SAV)],['Limite',date(d.DATA_LIMITE_SAV)],['Procedência',d.PROCEDENCIA_NOME],['Origem',d.ORIGEM_SAV||'—'],['Disposição',d.DISPOSICAO_SAV||'—']];$('#info').innerHTML=infos.map(x=>`<div class="card info"><label>${x[0]}</label><div>${esc(x[1]||'—')}</div></div>`).join('');const respons=table(d.responsaveis,[['Nome',r=>esc(r.NOME_USUARIO_SVU)],['Setor',r=>esc(r.NOME_SETOR_SVU||'—')]]);const principal=`<section class="detail-grid"><div class="card section"><h3>Relato do cliente</h3><div class="text">${esc(d.RELATO_CLIENTE_TEXTO||'Nenhum relato informado.')}</div></div><div class="card section"><h3>Responsáveis</h3>${respons}</div></section>`;const analise=`<section class="detail-grid"><div class="card section"><h3>Causas identificadas</h3>${table(d.causas,[['Causa',r=>esc(r.DESCRICAO_OPP||'—')]])}<div class="text" style="margin-top:15px">${esc(d.CAUSA_PROBLEMA_TEXTO||'')}</div></div><div class="card section"><h3>Disposição</h3><div class="text">${esc(d.DISPOSICAO_OBS_SAV||'Nenhuma observação informada.')}</div><h3 style="margin-top:18px">Resolução</h3><div class="text">${d.DATA_RESOLVIDO_SAV?'Resolvido em '+date(d.DATA_RESOLVIDO_SAV):'Em aberto'}</div></div></section>`;const produtos=`<section class="card section"><h3>Produtos com defeito / reposição</h3>${table(d.produtos,[['Produto',r=>`<b>${esc(r.NOME_PRODUTO_SVP||'—')}</b><br><span class="muted">${esc(r.PRO_CODIGO_SVP||'')}</span>`],['Nota / item',r=>esc([r.NOTA_SVP,r.ITEM_SVP].filter(Boolean).join(' / ')||'—')],['Quantidade',r=>esc(r.QUANTIDADE_SVP||'—')+' '+esc(r.UNIDADE_SVP||'')],['Valor',r=>money(r.VALOR_TOTAL_SVP)],['Lote',r=>esc(r.LOTE_SVP||'—')],['Fabricação',r=>date(r.DATA_FABRICACAO_SVP)],['Reposição',r=>esc(r.TIPO_REPOSICAO_SVP||'—')]])}</section>`;const acoes=`<section class="card section"><h3>Ações corretivas</h3>${table(d.acoes,[['Ordem',r=>esc(r.ORDEM_SVAC)],['Observação',r=>`<div class="text">${esc(r.OBS_TEXTO||'—')}</div>`],['Prazo',r=>date(r.DATA_PRAZO_SVAC)],['Setor',r=>esc(r.SETOR_SVAC||'—')]])}<h3 style="margin-top:22px">Outros custos</h3>${table(d.custos,[['Descrição',r=>esc(r.DESCRICAO_SVOC)],['Valor',r=>`<span class="cost">${money(r.VALOR_SVOC)}</span>`]])}</section>`;const historico=`<section class="card section"><h3>Histórico do atendimento</h3><div class="timeline">${d.historico.map(h=>`<div class="event"><small>${date(h.DATA_SVAP)} · ${esc(h.HORA_SVAP||'')}</small><strong>${esc(h.NOME_OCORRENCIA_SVAP)}</strong><div class="muted">${esc(h.NOME_USUARIO_SVAP||h.USU_CODIGO_SVAP||'')}</div><div class="text">${esc(h.OBSERVACAO_TEXTO||'')}</div></div>`).join('')||'<p class="muted">Sem eventos.</p>'}</div></section>`;const anexos=`<section class="card section"><h3>Anexos registrados</h3>${table(d.anexos,[['Descrição',r=>esc(r.DESCRICAO_SVA||'—')],['Data',r=>date(r.DATA_SVA)],['Usuário',r=>esc(r.USU_CODIGO_SVA||'—')]])}</section>`;const ress=`<section class="detail-grid"><div class="card section"><h3>Dados bancários</h3><div class="text">Banco: ${esc(d.BAN_CODIGO_RESSARCIMENTO_SAV||'—')}<br>Agência: ${esc(d.AGENCIA_RESSARCIMENTO_SAV||'—')}<br>Conta: ${esc(d.CONTA_RESSARCIMENTO_SAV||'—')}<br>Operação: ${esc(d.OPERACAO_RESSARCIMENTO_SAV||'—')}</div></div><div class="card section"><h3>Titular</h3><div class="text">${esc(d.TITULAR_RESSARCIMENTO_SAV||'Nenhum ressarcimento informado.')}<br>${esc(d.CNPJ_CPF_RESSARCIMENTO_SAV||'')}</div></div></section>`;$('#conteudo').innerHTML=[['principal',principal],['analise',analise],['produtos',produtos],['acoes',acoes],['historico',historico],['anexos',anexos],['ressarcimento',ress]].map(([id,v])=>`<div class="tabcontent ${id==='principal'?'active':''}" data-content="${id}">${v}</div>`).join('');$('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.tabcontent').forEach(x=>x.classList.toggle('active',x.dataset.content===t.dataset.tab))})}
