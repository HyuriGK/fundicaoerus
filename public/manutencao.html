<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP Erus — Manutenção</title>
    <link rel="icon" type="image/png" href="/logo-centered.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark;
            --background: #09090b;
            --surface: #111114;
            --surface-soft: #18181b;
            --border: rgba(255, 255, 255, 0.09);
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --dim: #71717a;
            --accent: #fbbf24;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 40px);
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% 30%, rgba(251, 191, 36, 0.035), transparent 34%),
                var(--background);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .maintenance-shell {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: page-in 0.45s ease-out both;
        }

        .maintenance-card {
            width: min(100%, 520px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(30px, 6vw, 48px) clamp(22px, 6vw, 40px) clamp(26px, 5vw, 38px);
            text-align: center;
            background: rgba(17, 17, 20, 0.94);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
            animation: card-in 0.55s cubic-bezier(.2, .8, .2, 1) 0.08s both;
        }

        .status-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 26px;
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: dot-pulse 2s ease-in-out infinite;
        }

        .icon-wrap {
            width: 82px;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
            border: 1px solid rgba(251, 191, 36, 0.18);
            border-radius: 22px;
            background: rgba(251, 191, 36, 0.07);
            color: var(--accent);
            font-size: 2rem;
            animation: tool-float 3.8s ease-in-out infinite;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.65rem, 5vw, 2.15rem);
            line-height: 1.18;
            letter-spacing: -0.04em;
        }

        .description {
            max-width: 410px;
            margin: 15px 0 0;
            color: var(--muted);
            font-size: clamp(0.88rem, 2.5vw, 0.95rem);
            line-height: 1.7;
        }

        .description strong { color: #e4e4e7; font-weight: 600; }

        .automatic-return {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            margin: 27px 0 24px;
            padding: 13px 15px;
            text-align: left;
            background: var(--surface-soft);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 11px;
        }

        .automatic-return i {
            margin-top: 2px;
            color: var(--accent);
            font-size: 0.84rem;
        }

        .automatic-return span {
            color: var(--dim);
            font-size: 0.76rem;
            line-height: 1.55;
        }

        .logout-button {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 19px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.045);
            color: #d4d4d8;
            font: 600 0.78rem Inter, Arial, sans-serif;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .logout-button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .brand {
            margin-top: 28px;
            color: #52525b;
            font-size: 0.64rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
        @keyframes dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
        @keyframes tool-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-3deg); } }

        @media (max-width: 520px) {
            body { align-items: flex-start; }
            .maintenance-card { border-radius: 17px; }
            .status-label { margin-bottom: 21px; }
            .icon-wrap { width: 72px; height: 72px; margin-bottom: 22px; border-radius: 19px; font-size: 1.75rem; }
            .automatic-return { margin: 23px 0 21px; }
            .brand { margin-top: 24px; }
        }

        @media (max-height: 680px) and (min-width: 521px) {
            body { align-items: flex-start; padding-block: 16px; }
            .maintenance-card { padding-block: 27px 24px; }
            .status-label, .icon-wrap { margin-bottom: 18px; }
            .icon-wrap { width: 68px; height: 68px; border-radius: 18px; font-size: 1.65rem; }
            .automatic-return { margin-block: 19px; }
            .brand { margin-top: 21px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="maintenance-shell">
        <section class="maintenance-card" aria-labelledby="maintenance-title">
            <div class="status-label"><span class="status-dot"></span>Em manutenção</div>
            <div class="icon-wrap" aria-hidden="true"><i class="fa-solid fa-screwdriver-wrench"></i></div>
            <h1 id="maintenance-title">Acesso temporariamente suspenso</h1>
            <p class="description">O SGP Erus está em <strong>manutenção</strong> para receber melhorias. O acesso será restaurado em breve.</p>
            <div class="automatic-return">
                <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                <span>Você não precisa atualizar a página. Assim que a manutenção terminar, o sistema será liberado automaticamente.</span>
            </div>
            <button class="logout-button" type="button" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sair da minha conta</button>
            <div class="brand">Fundição Erus · Gestão de Produção</div>
        </section>
    </main>
    <script>
        function logout() {
            ['erus_auth', 'erus_token', 'erus_username', 'erus_user', 'erus_role', 'erus_monetary_pages', 'erus_can_view_monetary', 'erus_system_maintenance'].forEach(key => localStorage.removeItem(key));
            window.location.replace('login.html');
        }

        async function checkMaintenance() {
            if (!localStorage.getItem('erus_auth') || !localStorage.getItem('erus_token')) return logout();
            try {
                const response = await fetch('/api/page-locks', { headers: { Authorization: 'Bearer ' + localStorage.getItem('erus_token') } });
                const data = await response.json();
                const lock = (data.data || []).find(item => item.page_id === '__system_maintenance__');
                if (data.can_bypass_system_maintenance || !lock || !lock.is_locked) {
                    localStorage.removeItem('erus_system_maintenance');
                    window.location.replace('index.html');
                } else {
                    localStorage.setItem('erus_system_maintenance', 'true');
                }
            } catch (_) {}
        }

        checkMaintenance();
        setInterval(checkMaintenance, 10000);
    </script>
</body>
</html>
