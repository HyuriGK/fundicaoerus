<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acabamento Externo - Fundição Erus</title>

    <!-- Bibliotecas de Estilo e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bibliotecas Funcionais (Charts, Excel, PDF) -->
    <script src="js/activity-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* --- BLOQUEIO DE SELEÇÃO GLOBAL --- */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            outline: none;
        }

        /* Permitir seleção apenas em inputs e textareas */
        input,
        textarea,
        .selectable-text,
        [contenteditable="true"] {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            cursor: text;
        }

        /* --- ROOT VARIABLES --- */
        :root {
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-primary: #fbbf24;
            --color-primary-dim: #d97706;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.7);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --border-separator: rgba(255, 255, 255, 0.06);
            --status-success: #10b981;
            --status-danger: #ef4444;
            --status-info: #06b6d4;
            --status-purple: #a855f7;
            --status-pending: #f59e0b;
            --header-height: 0px;
            --footer-height: 55px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image: radial-gradient(circle at 15% 50%, rgba(251, 191, 36, 0.03), transparent 25%), radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            height: 100vh;
            overflow: hidden;
            padding-bottom: 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

            }

            try { await apiRequest('recebidos', 'POST', { id, carga, checked }); await carregarRegistrosERecebidos(); renderTable(); } catch (e) { }
        }

        async function marcarCargaRecebida() {
            const role = checkUserRole();
            if (role !== 'desenvolvedor' && role !== 'comercial') {
                showToast("Você não tem permissão", "Apenas adminsitradores e comercial podem receber cargas", "danger");
                return;
            }

            const c = document.getElementById('cargaModal').getAttribute('data-current-carga');
            const ids = registros.filter(r => r.carga === c && !recebidos[c]?.some(re => re.id === r.id)).map(r => r.id);
            if (ids.length === 0) return;
            try { await Promise.all(ids.map(id => apiRequest('recebidos', 'POST', { id, carga: c, checked: true }))); await carregarRegistrosERecebidos(); renderTable(); showCargaDetails(c); } catch (e) { }
        }

        function showItemDetails(id) {
            const item = registros.find(r => r.id === id);
            if (!item) return;

            const role = checkUserRole();
            const allowed = (role === 'desenvolvedor' || role === 'comercial' || role === 'administrador');

            const vUnit = allowed && item.valor_unit ? formatCurrency(parseFloat(item.valor_unit)) : '****';
            const vTotalSales = allowed && item.valor_unit ? formatCurrency(parseFloat(item.valor_unit) * (item.quant || 0)) : '****';
            const vCost = allowed ? formatCurrency(parseFloat(item.valor || 0)) : '****';

            const html = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div><small style="color:#a1a1aa; display:block;">CÓDIGO</small><strong style="font-size:1.1rem;">${item.codigo}</strong></div>
                     <div><small style="color:#a1a1aa; display:block;">DATA</small><strong>${formatDate(item.data)}</strong></div>
                </div>
                <div style="margin-bottom:15px;"><small style="color:#a1a1aa; display:block;">DESCRIÇÃO</small><strong>${item.descricao}</strong></div>
                <div style="margin-bottom:15px;"><small style="color:#a1a1aa; display:block;">CLIENTE</small><strong>${item.cliente || '-'}</strong></div>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:15px; background:rgba(255,255,255,0.05); padding:10px; border-radius:6px;">
                    <div><small style="color:#a1a1aa; display:block;">QTD TOTAL</small><strong>${item.quant}</strong></div>
                    <div><small style="color:#a1a1aa; display:block;">ESCARIAÇÃO</small><strong>${item.quant_escariar || 0}</strong></div>
                    <div><small style="color:#a1a1aa; display:block;">REBARBA</small><strong>${item.quant_rebarba || 0}</strong></div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px; background:rgba(255,255,255,0.05); padding:10px; border-radius:6px;">
                    <div><small style="color:#a1a1aa; display:block;">PREÇO VENDA (UN)</small><strong>${vUnit}</strong></div>
                    <div><small style="color:#a1a1aa; display:block;">TOTAL VENDA</small><strong style="color:var(--status-purple);">${vTotalSales}</strong></div>
                </div>
                 <div style="margin-bottom:15px; background:#ef444420; padding:10px; border-radius:6px; border:1px solid #ef444450;">
                    <small style="color:#ef4444; display:block;">CUSTO SERVIÇO (TOTAL)</small><strong style="color:#ef4444; font-size:1.1rem;">${vCost}</strong>
                </div>

                <div style="margin-top:10px;">
                    <small style="color:#a1a1aa; display:block;">OBSERVAÇÕES</small>
                    <div style="background:rgba(0,0,0,0.2); padding:8px; border-radius:4px; min-height:40px;">${item.observacoes || 'Nenhuma observação.'}</div>
                </div>
            `;

            document.getElementById('itemDetailsBody').innerHTML = html;
            document.getElementById('itemDetailsTitle').innerText = `Detalhes do Item`;
            abrirModalPorId('itemDetailsModal');
        }

        function generateCargaPDF(carga) {
            const role = checkUserRole();
            if (role === 'visitante') {
                showToast("Acesso Negado", "Visitantes não podem gerar relatórios financeiros.", "danger");
                return;
            }

            const { jsPDF } = window.jspdf;
            const cStr = carga.replace(/<[^>]*>?/gm, '').trim();
            const items = registros.filter(r => r.carga === cStr);
            if (!items.length) return;
            const doc = new jsPDF('l', 'mm', 'a4');
            const pW = doc.internal.pageSize.getWidth(); const pH = doc.internal.pageSize.getHeight();
            doc.setFillColor(24, 24, 27); doc.rect(0, 0, pW, 35, 'F');
            doc.setFontSize(24); doc.setTextColor(251, 191, 36); doc.setFont("helvetica", "bold"); doc.text("FUNDIÇÃO ERUS", 14, 18);
            doc.setFontSize(10); doc.setTextColor(161, 161, 170); doc.text("SISTEMA DE GESTÃO DE ACABAMENTO EXTERNO", 14, 25);
            doc.setFontSize(12); doc.setTextColor(255, 255, 255); doc.text(`CARGA: ${cStr}`, pW - 14, 18, { align: 'right' }); doc.text(`TERCEIRO: ${items[0].terceiro}`, pW - 14, 25, { align: 'right' });
            doc.setDrawColor(251, 191, 36); doc.setLineWidth(1); doc.line(14, 30, pW - 14, 30);
            doc.autoTable({
                startY: 45,
                head: [['DATA', 'CÓDIGO', 'DESCRIÇÃO', 'CLIENTE', 'PESO UN.', 'QTD', 'VALOR UNIT', 'TOTAL']],
                body: items.map(r => [formatDate(r.data), r.codigo, r.descricao, r.cliente || '-', formatNumber(r.peso) + " kg", r.quant, formatCurrency(r.quant > 0 ? r.valor / r.quant : 0), formatCurrency(r.valor)]),
                styles: { fontSize: 9, cellPadding: 3, valign: 'middle', halign: 'center' },
                headStyles: { fillColor: [39, 39, 42], textColor: [251, 191, 36], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [250, 250, 250] },
                columnStyles: {
                    2: { halign: 'left', cellWidth: 50 },
                    3: { halign: 'left', cellWidth: 40 },
                    7: { fontStyle: 'bold' }
                },
                margin: { bottom: 70 }
            });
            const tP = items.reduce((s, i) => s + (parseFloat(i.quant || 0) * parseFloat(i.peso || 0)), 0);
            const tV = items.reduce((s, i) => s + parseFloat(i.valor || 0), 0);
            const tQ = items.reduce((s, i) => s + parseInt(i.quant || 0), 0);
            const summaryY = pH - 65;
            doc.setFillColor(248, 250, 252); doc.rect(14, summaryY, pW - 28, 20, 'F'); doc.setDrawColor(226, 232, 240); doc.rect(14, summaryY, pW - 28, 20, 'S');
            doc.setFontSize(10); doc.setTextColor(51, 65, 85); doc.setFont("helvetica", "bold");
            doc.text(`QUANTIDADE TOTAL: ${tQ}`, 20, summaryY + 12); doc.text(`PESO TOTAL: ${formatNumber(tP)} KG`, (pW / 2) - 30, summaryY + 12); doc.text(`VALOR TOTAL: ${formatCurrency(tV)}`, pW - 20, summaryY + 12, { align: 'right' });
            const sigY = pH - 30; doc.setDrawColor(200); doc.line(20, sigY, 90, sigY); doc.line(pW - 90, sigY, pW - 20, sigY);
            doc.setFontSize(8); doc.text("RESPONSÁVEL EXPEDIÇÃO", 55, sigY + 5, { align: 'center' }); doc.text("RESPONSÁVEL RECEBIMENTO (TERCEIRO)", pW - 55, sigY + 5, { align: 'center' });
            doc.setFontSize(7); doc.setTextColor(150); doc.text(`Documento gerado em: ${new Date().toLocaleString('pt-BR')} | Fundição Erus Software`, 14, pH - 10);
            doc.save(`Carga_${cStr}_Erus.pdf`);
        }

        function fazerBackup() {
            const data = { registros: registros.filter(r => r.tipo === 'terceiro'), recebidos, itens: Array.from(itensConhecidos.entries()) };
            const b = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = `Backup_Erus_${new Date().toISOString().slice(0, 10)}.json`; a.click();
        }

        function iniciarImportacao() { document.getElementById('importFile').click(); }
        document.getElementById('importFile').onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader(); r.onload = async ev => { try { await apiRequest('import', 'POST', JSON.parse(ev.target.result)); location.reload(); } catch (e) { } }; r.readAsText(f);
        };

        function iniciarRelatorioMensal() {
            const mA = prompt("Mês/Ano (MM/AAAA):", new Date().toLocaleDateString('pt-BR', { month: '2-digit', year: 'numeric' }));
            if (!mA) return;
            const filtrados = registros.filter(r => formatMonthYear(r.data) === mA);
            if (!filtrados.length) return alert('Sem dados.');
            const wsData = [["DATA", "CARGA", "TERCEIRO", "CÓDIGO", "CLIENTE", "QTD", "VALOR"]];
            filtrados.forEach(r => wsData.push([formatDate(r.data), r.carga, r.terceiro, r.codigo, r.cliente || '-', r.quant, r.valor]));
            const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Relatorio"); XLSX.writeFile(wb, `Relatorio_${mA.replace('/', '-')}.xlsx`);
        }

        function applyColumnFilters() {
            const filters = Array.from(document.querySelectorAll('#terceiroTable .filter-input-table')).map(i => i.value.toUpperCase());
            let visibleWeight = 0;
            let visibleQty = 0;

            document.querySelectorAll('#terceiroTable tbody tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                let vis = true;
                for (let i = 0; i < 6; i++) if (filters[i] && !cells[i].textContent.toUpperCase().includes(filters[i])) vis = false;
                row.style.display = vis ? '' : 'none';

                if (vis) {
                    // Cell 3 is Weight, Cell 4 is Qty based on Table Head order
                    const wStr = cells[3].textContent;
                    const qStr = cells[4].textContent;
                    visibleWeight += parseNumberSafe(wStr);
                    visibleQty += parseNumberSafe(qStr);
                }
            });
            updateFooterTotals(visibleWeight, visibleQty);
        }

        function limparFormularioParcialmente() { ['inputCodigo', 'inputDescricao', 'inputPesoUn', 'inputValorUnit', 'inputQuantidade', 'inputQtdEscariar', 'inputQtdRebarba', 'inputCliente', 'inputObservacoes'].forEach(id => document.getElementById(id).value = ''); document.getElementById('inputCodigo').focus(); }
        function confirmAndClear() { if (prompt("Digite 'CONFIRMAR':") === 'CONFIRMAR') apiRequest('delete-all-terceiro', 'POST', { type: 'terceiro' }).then(() => carregarDados()); }
        function redirectToLink() { window.location.href = 'index.html'; }

        document.addEventListener('DOMContentLoaded', () => {
            carregarDados();
            document.querySelectorAll('.filter-input-table').forEach(i => i.oninput = applyColumnFilters);
            document.getElementById('inputData').valueAsDate = new Date();
        });
    </script>
    <script src="js/activity-logger.js"></script>
</body>

</html>
