<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/theme-manager.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acabamento Externo - Fundição Erus</title>
    <!-- Bibliotecas de Estilo e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <!-- Bibliotecas Funcionais (Charts, Excel, PDF) -->
    <script src="js/activity-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* --- BLOQUEIO DE SELEÇÃO GLOBAL --- */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            outline: none;
        }
        /* Permitir seleção apenas em inputs e textareas */
        input,
        textarea,
        .selectable-text,
        [contenteditable="true"] {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            cursor: text;
        }
        /* --- ROOT VARIABLES --- */
        :root {
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-primary: #fbbf24;
            --color-primary-dim: #d97706;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.7);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --border-separator: rgba(255, 255, 255, 0.06);
            --status-success: #10b981;
            --status-danger: #ef4444;
            --status-info: #06b6d4;
            --status-purple: #a855f7;
            --status-pending: #f59e0b;
            --header-height: 0px;
            --footer-height: 55px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 15px rgba(251, 191, 36, 0.2);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image: radial-gradient(circle at 15% 50%, rgba(251, 191, 36, 0.03), transparent 25%), radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            height: 100vh;
            overflow: hidden;
            padding-bottom: 0;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
        body.modal-open {
            overflow: hidden;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #09090b;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(251, 191, 36, 0.3);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        body.no-scroll {
            overflow: hidden !important;
        }
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-height: 100vh;
        }
        /* --- SIDE NAVIGATION (PEDIDOS STANDARD) --- */
        .side-menu-trigger {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 45px;
            z-index: 2000;
            background: transparent;
        }
        .side-menu {
            position: fixed;
            left: -320px;
            top: 20px;
            bottom: 20px;
            width: 300px;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(20px) saturate(2);
            -webkit-backdrop-filter: blur(20px) saturate(2);
            border: 1px solid var(--border-subtle);
            border-left: none;
            border-radius: 0 20px 20px 0;
            z-index: 2001;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.6);
        }
        .side-menu-trigger:hover + .side-menu, .side-menu:hover {
            left: 0;
        }
        .side-menu-header {
            margin-bottom: 40px;
        }
        .side-menu-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
        }
        .side-menu-subtitle {
            font-size: 0.7rem;
            color: var(--color-primary);
            font-weight: 700;
            letter-spacing: 0.1em;
        }
        .side-menu-actions {
            display: flex; flex-direction: column; gap: 15px; flex: 1;
        }
        .side-btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .side-btn:hover {
            background: rgba(251, 191, 36, 0.1);
            border-color: var(--color-primary);
            color: var(--color-primary);
            transform: translateX(5px);
        }
        .side-btn.btn-back-side {
            margin-top: auto;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .side-btn.btn-back-side:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fff;
        }
        .dashboard-content {
            flex-grow: 1;
            padding: 20px 32px 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        .kpi-row {
            margin: 0 !important;
            flex-shrink: 0;
        }
        .chart-panel {
            background: rgba(255, 255, 255, 0.02);
            /* Fundo sutilíssimo para dar corpo */
            border: none;
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 0 !important;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 1);
            /* Sombra preta sólida embaixo */
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            /* Linha divisória bem visível */
        }
        .chart-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
        }
        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 !important;
            padding: 0 !important;
            flex-wrap: nowrap;
            gap: 15px;
            flex-shrink: 0;
            border-bottom: none !important; /* Remove a linha divisória */
        }
        .year-select {
            background: #18181b !important;
            background-image: none !important;
            border: 1px solid var(--border-subtle) !important;
            color: #fff !important;
            padding: 0 !important;
            border-radius: 6px !important;
            font-family: var(--font-mono) !important;
            font-size: 0.79rem !important;
            font-weight: 700 !important;
            width: 70px !important;
            height: 32px !important;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center !important;
            text-align-last: center !important;
            appearance: none !important;
            -webkit-appearance: none !important;
            outline: none !important;
        }
        .year-select:hover {
            border-color: var(--border-highlight);
            background: #1c1c1f !important;
        }
        .year-select option {
            background: #18181b;
            color: #f4f4f5;
        }
        .months-group {
            display: flex;
            gap: 5px;
        }
        .month-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 0 14px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.79rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .month-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .month-btn.active {
            background: var(--color-primary) !important;
            color: #000 !important;
            border-color: var(--color-primary) !important;
            font-weight: 800;
        }
        .month-btn.all-btn.active {
            background: var(--status-info);
            color: #000;
        }
        .chart-filters {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .chart-container-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
            width: 100%;
        }
        select {
            background: #18181b;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        select:hover {
            border-color: var(--border-highlight);
            background: #1c1c1f;
        }
        select option {
            background: #18181b;
            color: #f4f4f5;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            align-items: flex-end;
        }
        .form-group {
            flex: 1;
            min-width: 140px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            background: #18181b;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .form-group input:hover,
        .form-group select:hover {
            border-color: var(--border-highlight);
            background: #1c1c1f;
        }
        .btn-modern {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-add {
            background: var(--color-primary);
            color: #000;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .btn-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        .controls-panel {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .controls-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin-bottom: 20px;
            min-height: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            min-width: 1000px;
        }
        th,
        td {
            padding: 12px;
            text-align: center;
            white-space: nowrap;
            border-bottom: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-separator);
        }
        thead th {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .group-row {
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: var(--color-primary);
            cursor: pointer;
        }
        .row-received {
            background-color: rgba(16, 185, 129, 0.15) !important;
        }
        .row-received td {
            color: #6ee7b7;
        }
        .filter-input-table {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--color-primary);
            padding: 4px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-align: center;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.visible {
            opacity: 1;
        }
        .modal-content {
            background: #18181b;
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-md);
            width: 98vw;
            max-width: 98vw;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .modal-overlay.visible .modal-content {
            transform: scale(1);
        }
        #cargaModal .modal-content {
            height: 96vh;
        }
        #novoEnvioModal .modal-content,
        #registrosModal .modal-content,
        #buscaModal .modal-content {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }
        .modal-close {
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-muted);
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-main);
        }
        .modal-stat strong {
            color: var(--color-primary);
        }
        .action-icon {
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }
        .action-icon:hover {
            transform: scale(1.2);
        }
        .icon-delete {
            color: var(--status-danger);
        }
        /* --- TOAST NOTIFICATION --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: #18181b;
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--color-primary);
            color: #fff;
            padding: 16px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-family: var(--font-main);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out forwards;
            min-width: 350px;
        }
        .toast.danger {
            border-left-color: var(--status-danger);
        }
        .toast-icon {
            font-size: 1.2rem;
        }
        .toast.danger .toast-icon {
            color: var(--status-danger);
        }
        .toast-content {
            display: flex;
            flex-direction: column;
        }
        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .toast-subtitle {
            font-size: 0.75rem;
            color: #a1a1aa;
            margin-top: 4px;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }
        /* --- CUSTOM CONFIRM DIALOG --- */
        #customConfirmOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 9000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        #customConfirmOverlay.visible {
            display: flex;
        }
        #customConfirmBox {
            background: #18181b;
            border: 1px solid rgba(251,191,36,0.25);
            border-top: 3px solid #f59e0b;
            border-radius: 12px;
            padding: 28px 32px 24px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            animation: confirmPop 0.18s ease-out;
        }
        @keyframes confirmPop {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
        #customConfirmBox .confirm-icon {
            font-size: 2rem;
            color: #f59e0b;
            margin-bottom: 14px;
        }
        #customConfirmBox .confirm-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 8px;
        }
        #customConfirmBox .confirm-msg {
            font-size: 0.875rem;
            color: #a1a1aa;
            line-height: 1.55;
            margin-bottom: 24px;
        }
        #customConfirmBox .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        #customConfirmBox .btn-confirm-cancel {
            padding: 9px 18px;
            border-radius: 7px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: #a1a1aa;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        #customConfirmBox .btn-confirm-cancel:hover {
            background: rgba(255,255,255,0.1);
            color: #f4f4f5;
        }
        #customConfirmBox .btn-confirm-ok {
            padding: 9px 18px;
            border-radius: 7px;
            border: none;
            background: #f59e0b;
            color: #000;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        #customConfirmBox .btn-confirm-ok:hover {
            background: #fbbf24;
        }
        /* Ajuste para os formulários de busca */
        #buscaModal .form-row {
            align-items: flex-start;
        }
        #buscaModal .form-group {
            min-width: 160px;
        }
        /* Estilo para gráfico de linha */
        .line-chart-point {
            background-color: var(--color-primary);
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }
        /* Colunas ocultas para não desenvolvedores */
        .value-hidden {
            color: var(--text-muted) !important;
            background: rgba(0, 0, 0, 0.2) !important;
        }
        .value-hidden::before {
            content: "••••";
            letter-spacing: 2px;
        }
        /* Estilo para o filtro de código no modal */
        .code-filter-input {
            width: 220px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            color: #fff;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 0.85rem;
        }
        .code-filter-input::placeholder {
            color: var(--text-muted);
        }

    <script>
        // Toast Notification Function
        function showToast(title, subtitle, type = 'info') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'danger' ? '<i class="fa-solid fa-ban toast-icon"></i>' : '<i class="fa-solid fa-circle-info toast-icon"></i>';
            toast.innerHTML = `
                ${icon} 
                <div class="toast-content">
                    <span class="toast-title">${title}</span>
                    <span class="toast-subtitle">${subtitle}</span>
                </div>
            `;
            container.appendChild(toast);
            // Remove após 4 segundos
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 500);
            }, 4000);
        }
        // Check user role
        function checkUserRole() {
            return localStorage.getItem('erus_role');

        function showSpinner() { const s = document.getElementById('loading-screen'); if (s) { s.style.display = 'flex'; s.style.opacity = '1'; document.body.classList.add('no-scroll'); } }
        function hideSpinner() { const s = document.getElementById('loading-screen'); if (s) { s.style.opacity = '0'; document.body.classList.remove('no-scroll'); setTimeout(() => s.style.display = 'none', 500); } }
        Chart.defaults.font.family = "'Inter', sans-serif";

        Chart.defaults.plugins.tooltip.backgroundColor = _ltAcab ? 'rgba(255,255,255,0.98)' : 'rgba(10,10,14,0.97)';
        Chart.defaults.plugins.tooltip.titleColor = _ltAcab ? '#b45309' : '#fbbf24';
        Chart.defaults.plugins.tooltip.bodyColor = _ltAcab ? '#374151' : '#f4f4f5';
        Chart.defaults.plugins.tooltip.borderColor = _ltAcab ? 'rgba(0,0,0,0.1)' : 'rgba(251,191,36,0.3)';
        Chart.register(ChartDataLabels);
        const MONTHS_SHORT = ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"];
        let selectedMonthIndex = new Date().getMonth(); // 0-11
        let selectedYear = new Date().getFullYear();
        let registros = [];
        let recebidos = {};
        let itensConhecidos = new Map();
        let mainChartInstance = null;
        const modalStack = [];
        // Variável para contolar visibilidade do valor total
        let isValorTotalVisible = false;
        // Variável para filtro de código
        let currentCodeFilter = '';
        function abrirModalPorId(id) {
            const m = document.getElementById(id);
            if (!m) return;
            m.style.display = 'flex';
            setTimeout(() => m.classList.add('visible'), 10);
            document.body.classList.add('modal-open');
            modalStack.push(id);
        }
        function fecharModalTopo() {
            if (modalStack.length === 0) return;
            const id = modalStack.pop();
            const m = document.getElementById(id);
            if (m) {
                m.classList.remove('visible');
                setTimeout(() => m.style.display = 'none', 300);
            }
            if (modalStack.length === 0) {

        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                fecharModalTopo();
            }
        });
        async function apiRequest(actionOrEndpoint, method = 'GET', data = null) {
            let url = '/api/acabamento-externo';
            if (method === 'POST') {
                const actionMap = {
                    'registros': 'add-registro',
                    'recebidos': 'toggle-recebido',
                    'itens': 'save-item',
                    'itens-delete': 'delete-item',
                    'delete': 'delete-registro',
                    'delete-all-terceiro': 'clear-all',
                    'import': 'import'
                };
                const action = actionMap[actionOrEndpoint] || actionOrEndpoint;
                url += `?action=${action}`;
            }
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'x-role': localStorage.getItem('erus_role'),
                    'x-user': localStorage.getItem('erus_user')
                }
            };
            if (data) options.body = JSON.stringify(data);
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`Erro: ${response.status}`);
                return await response.json();
            } catch (error) { console.error(error); throw error; }
        }
        const formatNumber = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const formatCurrency = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatDate = iso => { if (!iso || !iso.includes('-')) return ''; const [y, m, d] = iso.split('T')[0].split('-'); return `${d}/${m}/${y}`; };
        const parseNumberSafe = t => { const s = String(t || '').trim().replace(/,/g, '.'); const n = parseFloat(s); return isNaN(n) ? 0 : n; };
        const formatMonthYear = d => { if (!d) return ''; const p = d.split('T')[0].split('-'); return p.length < 3 ? '' : `${p[1]}/${p[0]}`; };
        // --- FUNÇÃO PARA ATUALIZAR O FOOTER ---
        function updateFooterTotals(weight, qty) {
            const wEl = document.getElementById('footer-total-weight');
            const qEl = document.getElementById('footer-total-qty');
            if (wEl) wEl.textContent = formatNumber(weight) + ' KG';
            if (qEl) qEl.textContent = qty.toLocaleString('pt-BR');
        }
        function calcularValorItem(reg) {
            const terc = String(reg.terceiro || '').toUpperCase();
            const peso = parseFloat(reg.peso || 0);
            const qEsc = parseInt(reg.quant_escariar || 0);
            const qReb = parseInt(reg.quant_rebarba || 0);
            if (terc === 'BSP REBARBAÇÃO') return (qEsc * peso * 1.30) + (qReb * peso * 1.10);
            if (terc === 'VG REBARBAÇÃO') return (qEsc + qReb) * peso * 1.00;
            if (terc === 'JM REBARBAÇÃO') return (qEsc * peso * 1.10) + (qReb * peso * 1.00);
            return 0;
        }
        function atualizarQuantidades(origem) {
            const tIn = document.getElementById('inputQuantidade'), eIn = document.getElementById('inputQtdEscariar'), rIn = document.getElementById('inputQtdRebarba');
            let t = parseInt(tIn.value) || 0, e = parseInt(eIn.value) || 0, r = parseInt(rIn.value) || 0;
            if (origem === 'total') { r = (e > 0) ? t - e : t; if (r < 0) { r = 0; e = t; } }
            else if (origem === 'escariar') { if (e > t) e = t; r = t - e; }
            else if (origem === 'rebarba') { if (r > t) r = t; e = t - r; }
            tIn.value = t; eIn.value = e; rIn.value = r;
        }
        function showCustomConfirm(title, msg) {
            return new Promise(resolve => {
                document.getElementById('customConfirmTitle').textContent = title;
                document.getElementById('customConfirmMsg').textContent = msg;
                const overlay = document.getElementById('customConfirmOverlay');
                overlay.classList.add('visible');
                const ok = document.getElementById('customConfirmOk');
                const cancel = document.getElementById('customConfirmCancel');
                const cleanup = (result) => {
                    overlay.classList.remove('visible');
                    ok.replaceWith(ok.cloneNode(true));
                    cancel.replaceWith(cancel.cloneNode(true));
                    resolve(result);
                };
                document.getElementById('customConfirmOk').addEventListener('click', () => cleanup(true), { once: true });
                document.getElementById('customConfirmCancel').addEventListener('click', () => cleanup(false), { once: true });
            });
        }
        async function carregarItensConhecidos() { return Promise.resolve(); }
        async function verificarCodigoParaAutopreenchimento() {
            const cod = document.getElementById('inputCodigo').value.trim().toUpperCase();
            if (!cod) return;
            let pesoFromPedidos = false;
            let descFromPedidos = false;
            // 1. Busca peso, descrição e saldo da carteira de pedidos
            try {
                const res = await fetch(`/api/pedidos-sync/peso-lookup?codigo=${encodeURIComponent(cod)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.peso && data.peso > 0) {
                        document.getElementById('inputPesoUn').value = data.peso;
                        pesoFromPedidos = true;
                    }
                    if (data.descricao) {
                        document.getElementById('inputDescricao').value = data.descricao;
                        descFromPedidos = true;
                    }
                    // Aviso de saldo zerado
                    if ((data.saldo === 0 || data.saldo === null) && (data.peso || data.descricao)) {
                        const continuar = await showCustomConfirm(
                            'Sem saldo em aberto na carteira',
                            'Este código não possui quantidade a faturar na carteira de pedidos. Deseja continuar com a terceirização mesmo assim?'
                        );
                        if (!continuar) {
                            document.getElementById('inputCodigo').value = '';
                            document.getElementById('inputPesoUn').value = '';
                            document.getElementById('inputDescricao').value = '';
                            document.getElementById('inputCodigo').focus();
                            return;
                        }
                    }
                }
            } catch (e) { /* ignora erros de rede */ }
            // 2. Se o código existe em registros anteriores, oferece preencher cliente
            // (peso e descrição só se não vieram de pedidos)
            if (itensConhecidos.has(cod)) {
                setTimeout(() => {
                    if (confirm('Código encontrado. Preencher dados automaticamente?')) {
                        const item = itensConhecidos.get(cod);
                        if (!descFromPedidos) document.getElementById('inputDescricao').value = item.descricao;
                        document.getElementById('inputCliente').value = item.cliente;
                        if (!pesoFromPedidos) document.getElementById('inputPesoUn').value = item.peso;
                    }
                }, 100);
            }
        }
        async function salvarOuAtualizarItem(data) {
            try { const res = await apiRequest('itens', 'POST', data); if (res.success) itensConhecidos.set(data.codigo, data); } catch (e) { }
        }

        function realizarBuscaAvancada() {
            const cod = document.getElementById('buscaCodigo').value.trim().toUpperCase();
            const desc = document.getElementById('buscaDescricao').value.trim().toUpperCase();
            const cli = document.getElementById('buscaCliente').value.trim().toUpperCase();
            const res = registros.filter(r => {
                let mCo = true, mDe = true, mCl = true;
                if (cod) {
                    mCo = r.codigo && r.codigo.toUpperCase().includes(cod);
                }
                if (desc) {
                    mDe = r.descricao && r.descricao.toUpperCase().includes(desc);
                }
                if (cli) {
                    mCl = r.cliente && r.cliente.toUpperCase().includes(cli);
                }
                return mCo && mDe && mCl;
            });

            const ids = registros.filter(r => r.carga === c && !recebidos[c]?.some(re => re.id === r.id)).map(r => r.id);
            if (ids.length === 0) return;
            try { await Promise.all(ids.map(id => apiRequest('recebidos', 'POST', { id, carga: c, checked: true }))); await carregarRegistrosERecebidos(); renderTable(); showCargaDetails(c); } catch (e) { }
        }
        function showItemDetails(id) {
            const item = registros.find(r => r.id === id);
            if (!item) return;
            const role = checkUserRole();
            const allowed = (role === 'desenvolvedor' || role === 'comercial' || role === 'diretor' || role === 'administrador' || role === 'gerente comercial');
            const vUnit = allowed && item.valor_unit ? formatCurrency(parseFloat(item.valor_unit)) : 'R$ -----';
            const vTotalSales = allowed && item.valor_unit ? formatCurrency(parseFloat(item.valor_unit) * (item.quant || 0)) : 'R$ -----';
            const vCost = allowed ? formatCurrency(parseFloat(item.valor || 0)) : 'R$ -----';
            const html = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div><small style="color:#a1a1aa; display:block;">CÓDIGO</small><strong style="font-size:1.1rem;">${item.codigo}</strong></div>
                     <div><small style="color:#a1a1aa; display:block;">DATA</small><strong>${formatDate(item.data)}</strong></div>
                </div>
                <div style="margin-bottom:15px;"><small style="color:#a1a1aa; display:block;">DESCRIÇÃO</small><strong>${item.descricao}</strong></div>
                <div style="margin-bottom:15px;"><small style="color:#a1a1aa; display:block;">CLIENTE</small><strong>${item.cliente || '-'}</strong></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:15px; background:rgba(255,255,255,0.05); padding:10px; border-radius:6px;">
                    <div><small style="color:#a1a1aa; display:block;">QTD TOTAL</small><strong>${item.quant}</strong></div>
                    <div><small style="color:#a1a1aa; display:block;">ESCARIAÇÃO</small><strong>${item.quant_escariar || 0}</strong></div>
                    <div><small style="color:#a1a1aa; display:block;">REBARBA</small><strong>${item.quant_rebarba || 0}</strong></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px; background:rgba(255,255,255,0.05); padding:10px; border-radius:6px;">
                    <div><small style="color:#a1a1aa; display:block;">PREÇO VENDA (UN)</small><strong>${vUnit}</strong></div>
                    <div><small style="color:#a1a1aa; display:block;">TOTAL VENDA</small><strong style="color:var(--status-purple);">${vTotalSales}</strong></div>
                </div>
                 <div style="margin-bottom:15px; background:#ef444420; padding:10px; border-radius:6px; border:1px solid #ef444450;">
                    <small style="color:#ef4444; display:block;">CUSTO SERVIÇO (TOTAL)</small><strong style="color:#ef4444; font-size:1.1rem;">${vCost}</strong>
                </div>
                <div style="margin-top:10px;">
                    <small style="color:#a1a1aa; display:block;">OBSERVAÇÕES</small>
                    <div style="background:rgba(0,0,0,0.2); padding:8px; border-radius:4px; min-height:40px;">${item.observacoes || 'Nenhuma observação.'}</div>
                </div>
            `;
            document.getElementById('itemDetailsBody').innerHTML = html;
            document.getElementById('itemDetailsTitle').innerText = `Detalhes do Item`;
            abrirModalPorId('itemDetailsModal');
        }
        function generateCargaPDF(carga) {
            const role = checkUserRole();
            if (role === 'visitante' || !role) {
                showToast("Acesso Negado", "Você não tem permissão para gerar relatórios.", "danger");
                return;
            }
            const { jsPDF } = window.jspdf;
            const cStr = carga.replace(/<[^>]*>?/gm, '').trim();
            const items = registros.filter(r => r.carga === cStr);
            if (!items.length) return;
            const doc = new jsPDF('l', 'mm', 'a4');
            const pW = doc.internal.pageSize.getWidth(); const pH = doc.internal.pageSize.getHeight();
            doc.setFillColor(24, 24, 27); doc.rect(0, 0, pW, 35, 'F');
            doc.setFontSize(24); doc.setTextColor(251, 191, 36); doc.setFont("helvetica", "bold"); doc.text("FUNDICAO ERUS", 14, 18);
            doc.setFontSize(10); doc.setTextColor(161, 161, 170); doc.text("SISTEMA DE GESTAO DE ACABAMENTO EXTERNO", 14, 25);
            doc.setFontSize(12); doc.setTextColor(255, 255, 255); doc.text(`CARGA: ${cStr}`, pW - 14, 18, { align: 'right' }); doc.text(`TERCEIRO: ${items[0].terceiro}`, pW - 14, 25, { align: 'right' });
            doc.setDrawColor(251, 191, 36); doc.setLineWidth(1); doc.line(14, 30, pW - 14, 30);
            doc.autoTable({
                startY: 45,
                head: [['DATA', 'CODIGO', 'DESCRICAO', 'CLIENTE', 'PESO UN.', 'QTD', 'VALOR UNIT', 'TOTAL']],
                body: items.map(r => [formatDate(r.data), r.codigo, r.descricao, r.cliente || '-', formatNumber(r.peso) + " kg", r.quant, formatCurrency(r.quant > 0 ? r.valor / r.quant : 0), formatCurrency(r.valor)]),
                styles: { fontSize: 9, cellPadding: 3, valign: 'middle', halign: 'center' },
                headStyles: { fillColor: [39, 39, 42], textColor: [251, 191, 36], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [250, 250, 250] },
                columnStyles: {
                    2: { halign: 'left', cellWidth: 60, overflow: 'ellipsize', minCellHeight: 0 },
                    3: { halign: 'center', cellWidth: 35 },
                    7: { fontStyle: 'bold' }
                },
                margin: { bottom: 70 }
            });
            const tP = items.reduce((s, i) => s + (parseFloat(i.quant || 0) * parseFloat(i.peso || 0)), 0);
            const tV = items.reduce((s, i) => s + parseFloat(i.valor || 0), 0);
            const tQ = items.reduce((s, i) => s + parseInt(i.quant || 0), 0);
            const summaryY = pH - 65;
            doc.setFillColor(248, 250, 252); doc.rect(14, summaryY, pW - 28, 20, 'F'); doc.setDrawColor(226, 232, 240); doc.rect(14, summaryY, pW - 28, 20, 'S');
            doc.setFontSize(10); doc.setTextColor(51, 65, 85); doc.setFont("helvetica", "bold");
            doc.text(`QUANTIDADE TOTAL: ${tQ}`, 20, summaryY + 12); doc.text(`PESO TOTAL: ${formatNumber(tP)} KG`, (pW / 2) - 30, summaryY + 12); doc.text(`VALOR TOTAL: ${formatCurrency(tV)}`, pW - 20, summaryY + 12, { align: 'right' });
            const sigY = pH - 30; doc.setDrawColor(200); doc.line(20, sigY, 90, sigY); doc.line(pW - 90, sigY, pW - 20, sigY);
            doc.setFontSize(8); doc.text("RESPONSAVEL EXPEDICAO", 55, sigY + 5, { align: 'center' }); doc.text("RESPONSAVEL RECEBIMENTO (TERCEIRO)", pW - 55, sigY + 5, { align: 'center' });
            doc.setFontSize(7); doc.setTextColor(150); doc.text(`Documento gerado em: ${new Date().toLocaleString('pt-BR')} | Fundição Erus Software`, 14, pH - 10);
            doc.save(`Carga_${cStr}_Erus.pdf`);
        }
        function fazerBackup() {
            const data = { registros: registros.filter(r => r.tipo === 'terceiro'), recebidos, itens: Array.from(itensConhecidos.entries()) };
            const b = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = `Backup_Erus_${new Date().toISOString().slice(0, 10)}.json`; a.click();
        }
        function iniciarImportacao() { document.getElementById('importFile').click(); }
        document.getElementById('importFile').onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader(); r.onload = async ev => { try { await apiRequest('import', 'POST', JSON.parse(ev.target.result)); location.reload(); } catch (e) { } }; r.readAsText(f);
        };
        function iniciarRelatorioMensal() {
            const mA = prompt("Mês/Ano (MM/AAAA):", new Date().toLocaleDateString('pt-BR', { month: '2-digit', year: 'numeric' }));
            if (!mA) return;
            const filtrados = registros.filter(r => formatMonthYear(r.data) === mA);
            if (!filtrados.length) return alert('Sem dados.');
            const wsData = [["DATA", "CARGA", "TERCEIRO", "CODIGO", "CLIENTE", "QTD", "VALOR"]];
            filtrados.forEach(r => wsData.push([formatDate(r.data), r.carga, r.terceiro, r.codigo, r.cliente || '-', r.quant, r.valor]));
            const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Relatorio"); XLSX.writeFile(wb, `Relatorio_${mA.replace('/', '-')}.xlsx`);
        }
        function applyColumnFilters() {
            const filters = Array.from(document.querySelectorAll('#terceiroTable .filter-input-table')).map(i => i.value.toUpperCase());
            let visibleWeight = 0;
            let visibleQty = 0;
            document.querySelectorAll('#terceiroTable tbody tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                let vis = true;
                for (let i = 0; i < 6; i++) if (filters[i] && !cells[i].textContent.toUpperCase().includes(filters[i])) vis = false;
                row.style.display = vis ? '' : 'none';
                if (vis) {
                    // Cell 3 is Weight, Cell 4 is Qty based on Table Head order
                    const wStr = cells[3].textContent;
                    const qStr = cells[4].textContent;
                    visibleWeight += parseNumberSafe(wStr);
                    visibleQty += parseNumberSafe(qStr);
                }
            });
            updateFooterTotals(visibleWeight, visibleQty);
        }
        function limparFormularioParcialmente() { ['inputCodigo', 'inputDescricao', 'inputPesoUn', 'inputValorUnit', 'inputQuantidade', 'inputQtdEscariar', 'inputQtdRebarba', 'inputCliente', 'inputObservacoes'].forEach(id => document.getElementById(id).value = ''); document.getElementById('inputCodigo').focus(); }
        function confirmAndClear() { if (prompt("Digite 'CONFIRMAR':") === 'CONFIRMAR') apiRequest('delete-all-terceiro', 'POST', { type: 'terceiro' }).then(() => carregarDados()); }
        function redirectToLink() { window.location.href = 'index.html'; }
        document.addEventListener('DOMContentLoaded', () => {
            carregarDados();
            document.querySelectorAll('.filter-input-table').forEach(i => i.oninput = applyColumnFilters);
            document.getElementById('inputData').valueAsDate = new Date();
        });
    </script>
