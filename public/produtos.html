<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-theme-lock="dark" data-theme-styles="local">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07080a">
    <title>Cadastro de Produtos · SGP ERUS</title>
    <link rel="icon" href="logo-centered.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;550;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/index1-design.css">
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        .products-page { min-height: 100dvh; padding: 32px; }
        .products-content { max-width: 1400px; margin: 0 auto; }
        .products-breadcrumb { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 12px; color: var(--text-dim); }
        .products-breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .products-breadcrumb a:hover { color: var(--color-primary); }
        .products-breadcrumb i { font-size: 8px; }
        .products-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
        .products-heading h1 { margin: 0 0 10px; font: 600 clamp(24px, 3vw, 32px) 'Manrope', sans-serif; letter-spacing: -.8px; }
        .products-heading p { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
        .products-badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; background: #edc0730a; border: 1px solid #edc07326; border-radius: 6px; color: var(--color-primary); font-size: 11px; white-space: nowrap; }
        .products-catalog { border: 1px solid var(--border-subtle); border-radius: 14px; background: var(--bg-card); overflow: hidden; }
        .products-catalog-header { display: flex; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--border-subtle); }
        .products-catalog-header i { color: var(--color-primary); font-size: 14px; }
        .products-catalog-header h2 { margin: 0; font-size: 13px; font-weight: 550; }
        .products-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 340px; padding: 48px 24px; text-align: center; }
        .products-empty-icon { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 22px; border-radius: 16px; background: var(--surface-muted); border: 1px solid var(--border-subtle); color: var(--color-primary); font-size: 25px; }
        .products-empty h3 { margin: 0 0 12px; font: 600 20px 'Manrope', sans-serif; }
        .products-empty p { max-width: 380px; margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.8; }
        .products-back { display: inline-flex; align-items: center; gap: 9px; margin-top: 24px; padding: 10px 14px; border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--surface-muted); color: var(--text-main); text-decoration: none; font-size: 12px; transition: background .2s, border-color .2s; }
        .products-back:hover { background: var(--bg-card-hover); border-color: var(--border-highlight); }
        @media (max-width: 900px) { .products-page { padding: 80px 20px 24px; } }
        @media (max-width: 540px) { .products-heading { flex-direction: column; gap: 16px; } .products-empty { min-height: 280px; padding: 36px 20px; } }
    </style>
</head>
<body class="process-ui">
    <main class="products-page">
        <div class="products-content">
            <nav class="products-breadcrumb" aria-label="Localização"><a href="index.html">Dashboard</a><i class="fa-solid fa-chevron-right" aria-hidden="true"></i><span>Produtos</span></nav>
            <header class="products-heading">
                <div><h1>Cadastro de Produtos</h1><p>Organização das informações e especificações dos produtos.</p></div>
                <span class="products-badge"><i class="fa-regular fa-clock" aria-hidden="true"></i> Em preparação</span>
            </header>
            <section class="products-catalog" aria-labelledby="catalogTitle">
                <div class="products-catalog-header"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i><h2 id="catalogTitle">Catálogo de produtos</h2></div>
                <div class="products-empty">
                    <div class="products-empty-icon" aria-hidden="true"><i class="fa-solid fa-box-open"></i></div>
                    <h3>Cadastro em preparação</h3>
                    <p>Este será o espaço para consultar e cadastrar produtos. As funcionalidades serão disponibilizadas em breve.</p>
                    <a class="products-back" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao painel</a>
                </div>
            </section>
        </div>
    </main>
    <script src="js/sidebar.js?v=20260909-produtos"></script>
    <script src="js/activity-logger.js?v=20260901b"></script>
</body>
</html>
