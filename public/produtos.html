<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080a">
  <title>Cadastro de Produtos · SGP ERUS</title>
  <script src="js/loader.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/sidebar.js?v=20260706-light-sidebar"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/confirm-dialog.js?v=20260617"></script>
  <link rel="icon" href="logo-centered.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard-design-system.css">
  <link rel="stylesheet" href="css/produtos.css?v=20260913">
</head>
<body>
  <main class="products-page">
    <div class="products-content">
      <nav class="products-breadcrumb" aria-label="Localização"><a href="index.html">Painel</a><i class="fa-solid fa-chevron-right"></i><span>Produtos</span></nav>
      <header class="products-heading">
        <div><span class="products-eyebrow">Cadastros</span><h1>Produtos</h1><p>Consulte especificações, custos, materiais, fotos e informações comerciais.</p></div>
        <span class="products-live"><span></span> Integração Firebird</span>
      </header>
      <section class="products-search-card" aria-labelledby="productsSearchTitle">
        <div class="products-search-copy"><i class="fa-solid fa-cube"></i><div><h2 id="productsSearchTitle">Localizar produto</h2><p>Pesquise pelo código, nome ou apelido da peça.</p></div></div>
        <label class="products-search-input"><i class="fa-solid fa-magnifying-glass"></i><input id="productSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Ex.: 273000100 ou mancal" aria-label="Pesquisar produto"><kbd>Enter</kbd></label>
      </section>
      <section class="products-results" aria-live="polite">
        <div class="products-results-title"><span id="productsResultStatus">Digite ao menos 2 caracteres para pesquisar</span><span id="productsResultCount"></span></div>
        <div id="productsGrid" class="products-grid"></div>
      </section>
    </div>
  </main>
  <dialog id="productDialog" class="product-dialog" aria-labelledby="productDialogTitle">
    <div class="product-dialog-shell">
      <header class="product-dialog-head"><div><span id="modalCode" class="products-eyebrow"></span><h2 id="productDialogTitle">Produto</h2><p id="modalSubtitle"></p></div><button id="closeProductDialog" class="product-close" type="button" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button></header>
      <div id="productModalLoading" class="product-modal-loading"><i class="fa-solid fa-spinner"></i><span>Carregando cadastro</span></div>
      <div id="productModalContent" hidden>
        <div class="product-tabs" role="tablist" aria-label="Informações do produto"><button type="button" class="active" role="tab" data-tab="principal">Principal</button><button type="button" role="tab" data-tab="precos">Preços</button><button type="button" role="tab" data-tab="material">Material</button><button type="button" role="tab" data-tab="fotos">Fotos</button><button type="button" role="tab" data-tab="compras">Compras</button><button type="button" role="tab" data-tab="medidas">Medidas / Certificado</button><button type="button" role="tab" data-tab="comercial">Comercial</button></div>
        <div id="productPanels" class="product-panels"></div>
      </div>
    </div>
  </dialog>
  <script src="js/produtos.js?v=20260913"></script>
</body>
</html>
