<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chão de Fábrica - SGP Erus</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ef4444">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --card2: #111114;
            --border: rgba(255,255,255,0.08);
            --text: #fafafa;
            --muted: #a1a1aa;
            --primary: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }
        header {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
            background: linear-gradient(180deg, #141416, #0c0c0e);
            border-bottom: 1px solid var(--border);
        }
        header img { width: 34px; height: 34px; object-fit: contain; }
        header .h-title { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; }
        header .h-sub { font-size: 0.68rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        header .h-user { margin-left: auto; text-align: right; }
        header .h-user .u-name { font-size: 0.8rem; font-weight: 600; }
        header .h-user .u-role { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; }
        .logout-btn { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); width: 40px; height: 40px; border-radius: 10px; font-size: 1rem; cursor: pointer; flex-shrink: 0; }

        .tabs { display: flex; gap: 8px; padding: 14px 16px 0; }
        .tab { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card2); color: var(--muted); font-weight: 700; font-size: 0.84rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab.active { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4); color: var(--primary); }

        main { padding: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }

        label { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 7px; }
        .field { margin-bottom: 16px; }
        input, select, textarea {
            width: 100%; box-sizing: border-box;
            background: #0c0c0e; border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); padding: 14px; font-size: 1rem; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-save {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            background: var(--danger); color: #fff; font-weight: 800; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px;
        }
        .btn-save:active { transform: scale(0.99); }
        .btn-save:disabled { opacity: 0.5; }

        .install-bar { display: none; align-items: center; gap: 10px; margin: 0 16px 8px; padding: 12px 14px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 12px; font-size: 0.84rem; }
        .install-bar button { margin-left: auto; background: var(--primary); color: #000; border: none; border-radius: 9px; padding: 9px 14px; font-weight: 800; font-size: 0.8rem; cursor: pointer; }

        .day-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .day-head h2 { font-size: 1rem; margin: 0; }
        .day-head .pick { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 0.82rem; }
        .parada-item { background: var(--card2); border: 1px solid rgba(239,68,68,0.2); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .parada-item .pi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .pi-setor { font-weight: 800; font-size: 0.92rem; }
        .pi-dur { background: rgba(245,158,11,0.15); color: var(--primary); font-weight: 800; font-size: 0.74rem; padding: 4px 9px; border-radius: 7px; white-space: nowrap; }
        .pi-period { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
        .pi-motivo { font-size: 0.88rem; line-height: 1.5; color: #e4e4e7; white-space: pre-wrap; word-break: break-word; }
        .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 0.9rem; }

        #toast { position: fixed; left: 16px; right: 16px; bottom: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--success); color: #fff; padding: 14px 18px; border-radius: 12px; font-weight: 700; text-align: center; transform: translateY(160%); transition: transform .35s; z-index: 100; }
        #toast.show { transform: translateY(0); }
        #toast.err { background: var(--danger); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Erus">
        <div>
            <div class="h-title">Chão de Fábrica</div>
            <div class="h-sub">SGP Erus</div>
        </div>
        <div class="h-user">
            <div class="u-name" id="userName">—</div>
            <div class="u-role" id="userRole"></div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
    </header>

    <div class="install-bar" id="installBar">
        <i class="fa-solid fa-mobile-screen-button" style="color:var(--primary);"></i>
        <span>Instale o app na tela inicial</span>
        <button onclick="doInstall()">Instalar</button>
    </div>

    <div class="tabs">
        <button class="tab active" id="tab-reg" onclick="showTab('reg')"><i class="fa-solid fa-circle-plus"></i> Registrar</button>
        <button class="tab" id="tab-list" onclick="showTab('list')"><i class="fa-solid fa-list-check"></i> Paradas</button>
    </div>

    <main>
        <!-- REGISTRAR PARADA -->
        <section id="view-reg">
            <div class="card">
                <form id="paradaForm">
                    <div class="field">
                        <label>Data</label>
                        <input type="date" id="f-data" required>
                    </div>
                    <div class="row2">
                        <div class="field">
                            <label>Início</label>
                            <input type="time" id="f-inicio">
                        </div>
                        <div class="field">
                            <label>Fim</label>
                            <input type="time" id="f-fim">
                        </div>
                    </div>
                    <div class="field">
                        <label>Setor afetado</label>
                        <select id="f-setor" onchange="onSetorChange()">
                            <option value="Moldagem Geral">Moldagem Geral</option>
                            <option value="Moldagem Leve">Moldagem Leve</option>
                            <option value="Moldagem Manual">Moldagem Manual</option>
                            <option value="Moldagem Pesada">Moldagem Pesada</option>
                            <option value="Fusão">Fusão</option>
                            <option value="Acabamento">Acabamento</option>
                            <option value="Tratamento Térmico">Tratamento Térmico</option>
                            <option value="Qualidade">Qualidade</option>
                            <option value="Expedição">Expedição</option>
                            <option value="Geral">Geral (Toda a Fábrica)</option>
                        </select>
                    </div>
                    <div class="field hidden" id="maquinaWrap">
                        <label>Máquina / Equipamento</label>
                        <select id="f-maquina">
                            <option value="">Selecione...</option>
                            <option value="Ponte Rolante">Ponte Rolante</option>
                            <option value="Forno 1t">Forno 1t</option>
                            <option value="Forno 2,5t">Forno 2,5t</option>
                            <option value="Forno 4t">Forno 4t</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Motivo</label>
                        <textarea id="f-motivo" placeholder="Descreva o motivo da parada..." required></textarea>
                    </div>
                    <button type="submit" class="btn-save" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> Salvar Parada</button>
                </form>
            </div>
        </section>

        <!-- PARADAS DO DIA -->
        <section id="view-list" class="hidden">
            <div class="card">
                <div class="day-head">
                    <h2>Paradas</h2>
                    <input type="date" id="listDate" class="pick" onchange="loadParadas()">
                </div>
                <div id="paradasList"><div class="empty">Carregando...</div></div>
            </div>
        </section>
    </main>

    <div id="toast"></div>

    <script>
        // ---- Auth ----
        const token = localStorage.getItem('erus_token');
        const user = localStorage.getItem('erus_user') || localStorage.getItem('erus_username') || '';
        const role = (localStorage.getItem('erus_role') || '').trim();
        if (!token) { window.location.replace('login.html'); }
        document.getElementById('userName').textContent = user || 'Usuário';
        document.getElementById('userRole').textContent = role;

        function logout() {
            localStorage.removeItem('erus_token');
            localStorage.removeItem('erus_role');
            localStorage.removeItem('erus_user');
            window.location.replace('login.html');
        }

        // ---- Helpers ----
        const todayStr = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local
        function toast(msg, isErr) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = isErr ? 'err show' : 'show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function duracao(inicio, fim) {
            if (!inicio || !fim) return '—';
            const toMin = (s) => { const [h, m] = String(s).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
            let d = toMin(fim) - toMin(inicio); if (d < 0) d += 1440;
            const h = Math.floor(d / 60), m = d % 60;
            return h && m ? `${h}h ${m}min` : (h ? `${h}h` : `${m}min`);
        }

        // ---- Setor default por role ----
        const ROLE_SETOR = { 'moldagem': 'Moldagem Geral', 'fusao': 'Fusão', 'fusão': 'Fusão', 'acabamento': 'Acabamento' };
        (function initDefaults() {
            const t = todayStr();
            document.getElementById('f-data').value = t;
            document.getElementById('listDate').value = t;
            const def = ROLE_SETOR[role.toLowerCase()];
            if (def) document.getElementById('f-setor').value = def;
            onSetorChange();
        })();

        function onSetorChange() {
            const isFusao = document.getElementById('f-setor').value === 'Fusão';
            document.getElementById('maquinaWrap').classList.toggle('hidden', !isFusao);
            if (!isFusao) document.getElementById('f-maquina').value = '';
        }

        function showTab(which) {
            document.getElementById('tab-reg').classList.toggle('active', which === 'reg');
            document.getElementById('tab-list').classList.toggle('active', which === 'list');
            document.getElementById('view-reg').classList.toggle('hidden', which !== 'reg');
            document.getElementById('view-list').classList.toggle('hidden', which !== 'list');
            if (which === 'list') loadParadas();
        }

        // ---- Salvar parada ----
        document.getElementById('paradaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const motivo = document.getElementById('f-motivo').value.trim();
            if (!motivo) { toast('Informe o motivo.', true); return; }
            const setor = document.getElementById('f-setor').value;
            const parada = {
                data: document.getElementById('f-data').value,
                inicio: document.getElementById('f-inicio').value,
                fim: document.getElementById('f-fim').value,
                setor,
                maquina: setor === 'Fusão' ? document.getElementById('f-maquina').value : '',
                motivo,
                usuario: user
            };
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            try {
                const res = await fetch('/api/producao-postgres/paradas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-user': user || 'Desconhecido' },
                    body: JSON.stringify(parada)
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Falha');
                toast('Parada registrada!');
                document.getElementById('f-motivo').value = '';
                document.getElementById('f-inicio').value = '';
                document.getElementById('f-fim').value = '';
            } catch (err) {
                toast('Erro ao salvar. Verifique a conexão.', true);
            } finally {
                btn.disabled = false;
            }
        });

        // ---- Listar paradas do dia ----
        async function loadParadas() {
            const date = document.getElementById('listDate').value || todayStr();
            const box = document.getElementById('paradasList');
            box.innerHTML = '<div class="empty">Carregando...</div>';
            try {
                const res = await fetch(`/api/producao-postgres/paradas?startDate=${date}&endDate=${date}`);
                const json = await res.json();
                const list = (json.data || []);
                if (!list.length) { box.innerHTML = '<div class="empty">Nenhuma parada registrada neste dia.</div>'; return; }
                box.innerHTML = list.map(p => `
                    <div class="parada-item">
                        <div class="pi-top">
                            <span class="pi-setor">${p.setor || '—'}${p.maquina ? ' · ' + p.maquina : ''}</span>
                            <span class="pi-dur">${duracao(p.inicio, p.fim)}</span>
                        </div>
                        <div class="pi-period"><i class="fa-regular fa-clock"></i> ${p.inicio || '?'} até ${p.fim || '?'}${p.usuario ? ' · ' + p.usuario : ''}</div>
                        <div class="pi-motivo">${(p.motivo || '—').replace(/</g, '&lt;')}</div>
                    </div>`).join('');
            } catch (err) {
                box.innerHTML = '<div class="empty">Erro ao carregar. Verifique a conexão.</div>';
            }
        }

        // ---- PWA: instalação + service worker ----
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBar').style.display = 'flex';
        });
        async function doInstall() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            document.getElementById('installBar').style.display = 'none';
        }
        window.addEventListener('appinstalled', () => { document.getElementById('installBar').style.display = 'none'; });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
