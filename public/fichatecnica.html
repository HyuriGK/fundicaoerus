<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica | Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js"></script>
    <style>
        :root {
            --color-primary: #ea580c;
            --color-primary-hover: #f97316;
            --color-primary-rgb: 234, 88, 12;
            --bg-main: #09090b;
            --bg-card: #18181b;
            --border-subtle: rgba(255,255,255,0.07);
            --text-main: #f4f4f5;
            --text-muted: #71717a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { height: 100%; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* ── AMBIENT ── */
        .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .ambient::before {
            content: '';
            position: absolute;
            top: -30%; left: -10%;
            width: 70%; height: 70%;
            background: radial-gradient(ellipse, rgba(234,88,12,0.07) 0%, transparent 65%);
            animation: drift1 18s ease-in-out infinite alternate;
        }
        .ambient::after {
            content: '';
            position: absolute;
            bottom: -20%; right: -10%;
            width: 55%; height: 60%;
            background: radial-gradient(ellipse, rgba(234,88,12,0.04) 0%, transparent 65%);
            animation: drift2 22s ease-in-out infinite alternate;
        }
        @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(5%,8%); } }
        @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-6%,-5%); } }

        /* ── LAYOUT ── */
        .page { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

        /* ── SIDE MENU ── */
        .side-menu-trigger { position: fixed; left: 0; top: 0; bottom: 0; width: 45px; z-index: 2000; background: transparent; }
        .side-menu { position: fixed; left: -320px; top: 20px; bottom: 20px; width: 300px; background: rgba(9,9,11,0.95); backdrop-filter: blur(20px) saturate(2); border: 1px solid var(--border-subtle); border-left: none; border-radius: 0 20px 20px 0; z-index: 2001; transition: all 0.4s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; padding: 40px 30px; box-shadow: 10px 0 40px rgba(0,0,0,0.6); }
        .side-menu-trigger:hover + .side-menu, .side-menu:hover { left: 0; }
        .side-menu-header { margin-bottom: 40px; }
        .side-menu-title { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
        .side-menu-subtitle { font-size: 0.7rem; color: var(--color-primary); font-weight: 700; letter-spacing: 0.1em; }
        .side-menu-actions { display: flex; flex-direction: column; gap: 15px; flex: 1; }
        .side-btn { width: 100%; padding: 14px 20px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); color: var(--text-muted); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s; text-decoration: none; font-family: 'Inter', sans-serif; }
        .side-btn:hover { background: rgba(234,88,12,0.1); border-color: var(--color-primary); color: var(--color-primary); transform: translateX(5px); }
        .side-btn.btn-back-side { margin-top: auto; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); color: #ef4444; }
        .side-btn.btn-back-side:hover { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #fff; transform: translateX(5px); }

        /* ── MAIN CONTENT ── */
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }


        /* ── TIPO GRID ── */
        .tipo-section { width: 100%; max-width: 900px; margin-bottom: 40px; }
        .tipo-section-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); margin-bottom: 16px; }
        .tipo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

        .tipo-card {
            position: relative;
            padding: 24px 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            overflow: visible;
            min-height: 140px;
        }
        .tipo-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(var(--color-primary-rgb),0.06) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.25s;
        }
        .tipo-card:hover:not(.disabled)::before { opacity: 1; }
        .tipo-card:hover:not(.disabled) {
            border-color: rgba(var(--color-primary-rgb), 0.4);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(var(--color-primary-rgb),0.1);
        }
        .tipo-card.active {
            border-color: var(--color-primary);
            background: rgba(var(--color-primary-rgb), 0.08);
            box-shadow: 0 0 0 1px var(--color-primary), 0 16px 40px rgba(var(--color-primary-rgb),0.2);
            transform: translateY(-3px);
        }
        .tipo-card.active::before { opacity: 1; }
        .tipo-card.disabled { opacity: 0.38; cursor: not-allowed; }

        .tipo-icon-wrap {
            width: 52px; height: 52px; border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: var(--text-muted);
            transition: all 0.25s;
        }
        .tipo-card.active .tipo-icon-wrap {
            background: rgba(var(--color-primary-rgb),0.15);
            border-color: rgba(var(--color-primary-rgb),0.3);
            color: var(--color-primary);
        }
        .tipo-card:hover:not(.disabled) .tipo-icon-wrap { color: var(--color-primary); }

        .tipo-name { font-size: 0.7rem; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.25s; white-space: normal; line-height: 1.3; }
        .tipo-card.active .tipo-name, .tipo-card:hover:not(.disabled) .tipo-name { color: #fff; }

        .soon-chip {
            font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
            padding: 3px 7px; border-radius: 6px;
            background: rgba(255,255,255,0.05); color: #52525b; border: 1px solid rgba(255,255,255,0.06);
        }

        /* ── SEARCH PANEL ── */
        .search-panel { width: 100%; max-width: 900px; }
        .search-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 32px 36px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.5);
        }
        .search-top { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; }
        .search-field { flex: 1; }
        .search-field label { display: block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 8px; }
        .search-input-wrap { display: flex; gap: 10px; }
        .search-input {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            padding: 16px 22px;
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            letter-spacing: 0.06em;
        }
        .search-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb),0.12); }
        .search-input::placeholder { font-family: 'Inter', sans-serif; font-weight: 400; letter-spacing: 0; color: #3f3f46; font-size: 0.95rem; }
        .btn-go {
            background: linear-gradient(135deg, var(--color-primary), #c2410c);
            border: none; color: #fff;
            padding: 16px 30px;
            border-radius: 12px;
            font-weight: 800; font-size: 0.9rem;
            cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 6px 20px rgba(var(--color-primary-rgb),0.3);
            letter-spacing: 0.02em;
        }
        .btn-go:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(var(--color-primary-rgb),0.4); filter: brightness(1.08); }
        .btn-go:active { transform: translateY(0); }

        /* ── INFO BAR ── */
        .info-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 18px; border-top: 1px solid var(--border-subtle);
        }
        .info-tipo { display: flex; align-items: center; gap: 10px; }
        .info-tipo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); box-shadow: 0 0 8px rgba(var(--color-primary-rgb),0.6); }
        .info-tipo-text { font-size: 0.8rem; color: var(--text-muted); }
        .info-tipo-text strong { color: #fff; font-weight: 700; }
        .info-shortcuts { font-size: 0.72rem; color: #3f3f46; }
        .kbd { display: inline-block; padding: 2px 7px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: #71717a; }

        /* ── ERROR ── */
        .error-toast {
            display: none; margin-top: 12px;
            padding: 12px 18px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 10px;
            font-size: 0.8rem; color: #f87171;
            display: none; align-items: center; gap: 10px;
        }

        /* ── FOOTER ── */
        footer { padding: 24px 48px; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; }
        .footer-brand { font-size: 0.75rem; color: #3f3f46; font-weight: 500; }
        .footer-brand strong { color: #52525b; }
        .footer-status { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #3f3f46; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse-dot 2.5s ease-in-out infinite; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div class="ambient"></div>

    <div class="side-menu-trigger"></div>
    <aside class="side-menu">
        <div class="side-menu-header">
            <span class="side-menu-subtitle">MENU DASHBOARD</span>
            <div class="side-menu-title">Opções</div>
        </div>
        <div class="side-menu-actions">
            <a href="index.html" class="side-btn btn-back-side">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Voltar
            </a>
        </div>
    </aside>

    <div class="page">
        <!-- MAIN -->
        <main>
            <!-- TIPO -->
            <div class="tipo-section">
                <div class="tipo-section-label">Selecionar processo</div>
                <div class="tipo-grid">
                    <button class="tipo-card active" data-tipo="moldagem" onclick="selectTipo(this)">
                        <div class="tipo-icon-wrap"><i class="fa-solid fa-layer-group"></i></div>
                        <span class="tipo-name">Moldagem</span>
                    </button>
                    <button class="tipo-card" data-tipo="fusao" onclick="selectTipo(this)">
                        <div class="tipo-icon-wrap"><i class="fa-solid fa-fire-flame-curved"></i></div>
                        <span class="tipo-name">Fusão</span>
                    </button>
                    <button class="tipo-card disabled" data-tipo="acabamento" onclick="selectTipo(this)">
                        <div class="tipo-icon-wrap"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                        <span class="tipo-name">Acabamento</span>
                        <span class="soon-chip">Em breve</span>
                    </button>
                    <button class="tipo-card disabled" data-tipo="qualidade" onclick="selectTipo(this)">
                        <div class="tipo-icon-wrap"><i class="fa-solid fa-clipboard-check"></i></div>
                        <span class="tipo-name">Controle de Qualidade</span>
                        <span class="soon-chip">Em breve</span>
                    </button>
                </div>
            </div>

            <!-- SEARCH -->
            <div class="search-panel">
                <div class="search-card">
                    <div class="search-input-wrap" style="margin-bottom:20px;">
                        <input type="text" id="searchInput" class="search-input"
                            placeholder="Código do produto..."
                            onkeypress="if(event.key==='Enter') goToFicha()">
                        <button class="btn-go" onclick="goToFicha()"> Abrir Ficha
 </button>
                    </div>
                    <div class="info-bar">
                        <div class="info-tipo">
                            <div class="info-tipo-dot"></div>
                            <div class="info-tipo-text">
                                Processo selecionado: <strong id="tipoLabel">Moldagem</strong>
                                <span id="tipoDescSpan" style="margin-left:6px; color:#52525b;">— pesos, machos, luvas e observações</span>
                            </div>
                        </div>
                        <div class="info-shortcuts">
                            <span class="kbd">Enter</span> para abrir
                        </div>
                    </div>
                    <div class="error-toast" id="errorToast">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span id="errorText"></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer>
            <div class="footer-brand"><strong>Fundição Erus</strong> — Processos de Qualidade Assegurada</div>
            <div class="footer-status"><div class="status-dot"></div> Sistema operacional</div>
        </footer>
    </div>

    <script>
        const TIPOS = {
            moldagem:   { url: 'fichatecmoldagem.html', label: 'Moldagem',        desc: 'pesos, machos, luvas e observações', disponivel: true },
            fusao:      { url: 'fichatecfusao.html',    label: 'Fusão',           desc: 'composição química e parâmetros de fusão', disponivel: true },
            acabamento: { url: null,                    label: 'Acabamento',      desc: 'em desenvolvimento', disponivel: false },
            qualidade:  { url: null,                    label: 'Controle de Qualidade', desc: 'em desenvolvimento', disponivel: false },
        };

        let tipoAtivo = 'moldagem';

        function selectTipo(btn) {
            if (btn.classList.contains('disabled')) return;
            tipoAtivo = btn.dataset.tipo;
            document.querySelectorAll('.tipo-card').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const t = TIPOS[tipoAtivo];
            document.getElementById('tipoLabel').innerText = t.label;
            document.getElementById('tipoDescSpan').innerText = '— ' + t.desc;
            hideError();
            document.getElementById('searchInput').focus();
        }

        function goToFicha() {
            const codigo = document.getElementById('searchInput').value.trim();
            if (!codigo) { showError('Informe o código do produto.'); return; }
            const t = TIPOS[tipoAtivo];
            if (!t.disponivel) { showError('Este processo ainda não está disponível.'); return; }
            window.location.href = `${t.url}?codigo=${encodeURIComponent(codigo)}`;
        }

        function showError(msg) {
            const el = document.getElementById('errorToast');
            document.getElementById('errorText').innerText = msg;
            el.style.display = 'flex';
        }
        function hideError() { document.getElementById('errorToast').style.display = 'none'; }

        window.onload = () => document.getElementById('searchInput').focus();
    </script>
</body>
</html>
