<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica | Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js"></script>
    <style>
        :root {
            --color-primary: #ea580c;
            --color-primary-hover: #f97316;
            --color-primary-rgb: 234, 88, 12;
            --bg-main: #09090b;
            --bg-card: #18181b;
            --border-subtle: rgba(255,255,255,0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 20% 20%, rgba(234,88,12,0.05) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(234,88,12,0.03) 0%, transparent 40%); }

        .portal { width: 100%; max-width: 640px; padding: 30px 20px; }

        .portal-header { text-align: center; margin-bottom: 40px; }
        .portal-header .badge { display: inline-block; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.15em; color: var(--color-primary); text-transform: uppercase; margin-bottom: 12px; }
        .portal-header h1 { font-size: 2.2rem; font-weight: 900; color: #fff; letter-spacing: 0.02em; line-height: 1.1; }
        .portal-header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; }

        /* TIPO SELECTOR */
        .tipo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 30px; }
        .tipo-btn {
            padding: 14px 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
        }
        .tipo-btn i { font-size: 1.4rem; }
        .tipo-btn:hover { border-color: rgba(var(--color-primary-rgb), 0.4); color: #fff; background: rgba(var(--color-primary-rgb), 0.05); }
        .tipo-btn.active { border-color: var(--color-primary); background: rgba(var(--color-primary-rgb), 0.1); color: var(--color-primary); box-shadow: 0 0 20px rgba(var(--color-primary-rgb), 0.15); }
        .tipo-btn.disabled { opacity: 0.35; cursor: not-allowed; }
        .tipo-btn.disabled:hover { border-color: var(--border-subtle); background: rgba(255,255,255,0.02); color: var(--text-muted); box-shadow: none; }
        .soon-badge { font-size: 0.55rem; background: rgba(255,255,255,0.06); border-radius: 4px; padding: 2px 5px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.05em; }

        /* SEARCH */
        .search-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .search-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 10px; display: block; }
        .search-row { display: flex; gap: 10px; }
        .search-input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: #fff;
            padding: 13px 18px;
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 0.05em;
        }
        .search-input:focus { border-color: var(--color-primary); }
        .search-input::placeholder { font-family: 'Inter', sans-serif; font-weight: 400; letter-spacing: 0; color: #52525b; }
        .btn-go {
            background: var(--color-primary);
            border: none;
            color: #000;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }
        .btn-go:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
        .btn-go:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .tipo-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 8px; }
        .tipo-desc i { color: var(--color-primary); font-size: 0.8rem; }

        /* BACK LINK */
        .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); text-decoration: none; margin-bottom: 30px; transition: color 0.2s; }
        .back-link:hover { color: var(--color-primary); }

        /* ERROR */
        .error-msg { margin-top: 14px; padding: 12px 16px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; font-size: 0.8rem; color: #ef4444; display: none; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>

    <div class="portal">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao painel
        </a>

        <div class="portal-header">
            <div class="badge">Fundição Erus</div>
            <h1>Ficha Técnica</h1>
            <p>Selecione o tipo de ficha e informe o código do produto</p>
        </div>

        <div class="tipo-grid">
            <button class="tipo-btn active" data-tipo="moldagem" onclick="selectTipo(this)">
                <i class="fa-solid fa-layer-group"></i>
                Moldagem
            </button>
            <button class="tipo-btn" data-tipo="fusao" onclick="selectTipo(this)">
                <i class="fa-solid fa-fire-flame-curved"></i>
                Fusão
            </button>
            <button class="tipo-btn disabled" data-tipo="acabamento" onclick="selectTipo(this)">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                Acabamento
                <span class="soon-badge">Em breve</span>
            </button>
            <button class="tipo-btn disabled" data-tipo="termico" onclick="selectTipo(this)">
                <i class="fa-solid fa-temperature-high"></i>
                Trat. Térmico
                <span class="soon-badge">Em breve</span>
            </button>
            <button class="tipo-btn disabled" data-tipo="usinagem" onclick="selectTipo(this)">
                <i class="fa-solid fa-gear"></i>
                Usinagem
                <span class="soon-badge">Em breve</span>
            </button>
        </div>

        <div class="search-card">
            <span class="search-label">Código do Produto</span>
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Ex: 00001"
                    onkeypress="if(event.key==='Enter') goToFicha()">
                <button class="btn-go" id="btnGo" onclick="goToFicha()">
                    <i class="fa-solid fa-arrow-right"></i> Abrir Ficha
                </button>
            </div>
            <div class="tipo-desc" id="tipoDesc">
                <i class="fa-solid fa-circle-info"></i>
                <span id="tipoDescText">Ficha de Moldagem — pesos, machos, luvas, modelo e observações de moldagem.</span>
            </div>
            <div class="error-msg" id="errorMsg">
                <i class="fa-solid fa-triangle-exclamation"></i> <span id="errorText"></span>
            </div>
        </div>
    </div>

    <script>
        const TIPOS = {
            moldagem:   { url: 'fichatecmoldagem.html',  desc: 'Ficha de Moldagem — pesos, machos, luvas, modelo e observações de moldagem.', disponivel: true },
            fusao:      { url: 'fichatecfusao.html',     desc: 'Ficha de Fusão — composição química, parâmetros de fusão e propriedades mecânicas.', disponivel: true },
            acabamento: { url: null,                     desc: 'Ficha de Acabamento — em desenvolvimento.', disponivel: false },
            termico:    { url: null,                     desc: 'Ficha de Tratamento Térmico — em desenvolvimento.', disponivel: false },
            usinagem:   { url: null,                     desc: 'Ficha de Usinagem — em desenvolvimento.', disponivel: false },
        };

        let tipoAtivo = 'moldagem';

        function selectTipo(btn) {
            const tipo = btn.dataset.tipo;
            if (btn.classList.contains('disabled')) return;
            tipoAtivo = tipo;
            document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tipoDescText').innerText = TIPOS[tipo].desc;
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('searchInput').focus();
        }

        function goToFicha() {
            const codigo = document.getElementById('searchInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            errorMsg.style.display = 'none';

            if (!codigo) {
                errorText.innerText = 'Informe o código do produto.';
                errorMsg.style.display = 'block';
                document.getElementById('searchInput').focus();
                return;
            }

            const tipo = TIPOS[tipoAtivo];
            if (!tipo.disponivel) {
                errorText.innerText = 'Este tipo de ficha ainda não está disponível.';
                errorMsg.style.display = 'block';
                return;
            }

            window.location.href = `${tipo.url}?codigo=${encodeURIComponent(codigo)}`;
        }

        window.onload = () => document.getElementById('searchInput').focus();
    </script>
</body>
</html>
