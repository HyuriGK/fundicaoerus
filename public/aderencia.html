<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aderência PCP - Fundição</title>
    
    <!-- Bibliotecas de Estilo e Gráficos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-primary: #fbbf24;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.9);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.08);
            
            --color-moldagem: #3b82f6; 
            --color-fusao: #f97316;    
            --color-acabamento: #10b981;
            
            --status-danger: #ef4444;
            --radius-md: 12px;
        }

        body {
            margin: 0; font-family: var(--font-main); background-color: var(--bg-body); color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(251, 191, 36, 0.05), transparent 40%);
            height: 100vh;
            overflow: hidden; /* Remove barra de rolagem da página principal */
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .top-header { 
            padding: 15px 32px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid var(--border-subtle); 
            background: rgba(0,0,0,0.3); 
            flex-shrink: 0;
        }
        .header-brand { display: flex; align-items: center; gap: 15px; }
        .header-actions { display: flex; align-items: center; gap: 12px; }

        .brand-icon { width: 35px; height: 35px; background: var(--color-primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.1rem; }

        .btn-back {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-back:hover { background: #ef4444; color: #fff; }

        /* TABS */
        .sector-tabs { display: flex; gap: 8px; background: #18181b; padding: 6px; border-radius: 12px; margin: 20px 32px 0 32px; width: fit-content; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .tab-btn { 
            padding: 10px 24px; border: none; background: transparent; color: var(--text-muted); 
            cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .tab-btn.active[data-sector="MOLDAGEM"] { background: var(--color-moldagem); color: #fff; }
        .tab-btn.active[data-sector="FUSAO"] { background: var(--color-fusao); color: #fff; }
        .tab-btn.active[data-sector="ACABAMENTO"] { background: var(--color-acabamento); color: #fff; }

        /* DASHBOARD CONTENT */
        .dashboard-content { 
            padding: 20px 32px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; flex-shrink: 0; }
        .kpi-card { 
            background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 18px; 
            border-radius: var(--radius-md); border-left: 4px solid var(--color-primary);
        }
        .kpi-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; font-family: var(--font-mono); margin-top: 5px; }

        /* GRÁFICOS - AJUSTADO PARA CONTROLE DE ALTURA */
        .charts-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1; /* Ocupa o espaço restante */
            min-height: 0; /* CRUCIAL: Impede que o flex item estoure o tamanho */
            margin-bottom: 20px;
            width: 100%;
        }
        
        .chart-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .month-picker {
            background: #18181b;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: var(--font-main);
            color-scheme: dark;
            cursor: pointer;
        }

        .panel { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-md); 
            padding: 20px; 
            
            /* Aqui está o controle de altura */
            flex-grow: 1; /* Faz o painel crescer para preencher o container */
            height: 100%; /* Garante que o painel tenha altura definida */
            
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* Wrapper para o Canvas para garantir que o height funcione */
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 100%; /* Isso força o canvas a respeitar o pai */
            min-height: 0;
        }

        /* TABLE (DENTRO DO MODAL) */
        .table-container { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-md); 
            overflow-x: auto;
            flex-grow: 1; /* Ocupa o resto do modal */
            overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: rgba(0,0,0,0.5); padding: 14px; text-align: left; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(5px); }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* ESTILOS DE AGRUPAMENTO */
        .group-row {
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 1px solid var(--border-subtle);
        }
        .group-row:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        .group-icon {
            margin-right: 8px;
            transition: transform 0.2s;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .group-row.expanded .group-icon {
            transform: rotate(90deg);
        }
        .child-row {
            background: rgba(0, 0, 0, 0.2);
            display: none; 
        }
        .child-row.visible {
            display: table-row;
        }
        .child-row td:first-child {
            padding-left: 35px; 
            border-left: 2px solid var(--border-subtle);
        }

        /* EDIÇÃO EM LINHA */
        .editable-cell {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.5);
            border-radius: 4px;
            padding: 4px 12px;
            color: var(--color-primary);
            font-weight: 700;
            cursor: pointer;
            min-width: 60px;
            display: inline-block;
            text-align: center;
        }
        .input-inline-edit {
            width: 70px; background: #fff; color: #000; border: none; padding: 4px; border-radius: 4px; font-weight: 700; text-align: center; font-family: var(--font-mono);
        }

        /* MODAL */
        .modal-overlay { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content { background: #18181b; padding: 25px; border-radius: 12px; border: 1px solid var(--border-subtle); box-sizing: border-box; }
        
        .modal-standard { width: 420px; }
        
        /* Modal Grande (Tela Cheia) */
        .modal-large { 
            width: 100vw; 
            height: 100vh; 
            max-width: none; 
            max-height: none; 
            border-radius: 0; /* Remove bordas arredondadas para tela cheia */
            display: flex; 
            flex-direction: column; 
            padding: 30px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .modal-title { margin: 0; font-size: 1.5rem; }
        .btn-close-modal { background: none; border: none; color: var(--text-muted); font-size: 2rem; cursor: pointer; }
        .btn-close-modal:hover { color: #fff; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .full { grid-column: span 2; }
        label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; display: block; }
        input, select { background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        
        .btn-main { background: var(--color-primary); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;}
        .btn-secondary { background: #27272a; border: 1px solid var(--border-subtle); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;}
        .btn-secondary:hover { background: #3f3f46; }

        .btn-save-modal { width: 100%; margin-top: 20px; height: 45px; justify-content: center; }

        .badge-sector { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
        .badge-m { background: rgba(59, 130, 246, 0.2); color: var(--color-moldagem); }
        .badge-f { background: rgba(249, 115, 22, 0.2); color: var(--color-fusao); }
        .badge-a { background: rgba(16, 185, 129, 0.2); color: var(--color-acabamento); }
    </style>
</head>
<body>

    <script>
    (function() {
        const tempoLimite = 30 * 60 * 1000; 
        
        function verificarSessao() {
            if (window.location.pathname.includes('login.html')) return;

            const logado = localStorage.getItem('erus_auth');
            const ultimaAtividade = localStorage.getItem('erus_last_activity');
            const agora = Date.now();

            if (logado !== 'true' || !ultimaAtividade) {
                redirecionarLogin();
                return;
            }

            if (agora - parseInt(ultimaAtividade) > tempoLimite) {
                alert("Sua sessão expirou por inatividade.");
                redirecionarLogin();
                return;
            }
        }

        function atualizarAtividade() {
            if (localStorage.getItem('erus_auth') === 'true') {
                localStorage.setItem('erus_last_activity', Date.now().toString());
            }
        }

        function redirecionarLogin() {
            localStorage.clear();
            window.location.replace('login.html');
        }

        verificarSessao();

        const eventos = ['mousedown', 'mousemove', 'keypress', 'touchstart', 'scroll'];
        eventos.forEach(evento => {
            window.addEventListener(evento, atualizarAtividade, { passive: true });
        });

        setInterval(verificarSessao, 60000);
    })();
</script>

    <!-- MODAL DE LANÇAMENTO -->
    <div id="modalEntry" class="modal-overlay">
        <div class="modal-content modal-standard">
            <h3 style="margin:0">Nova Programação PCP</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Setor</label>
                    <select id="fSetor" onchange="updateModalLabels()">
                        <option value="MOLDAGEM">MOLDAGEM</option>
                        <option value="FUSAO">FUSÃO</option>
                        <option value="ACABAMENTO">ACABAMENTO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="fData">
                </div>
                <div class="form-group">
                    <label>OP</label>
                    <input type="text" id="fOP" placeholder="Ex: 5050">
                </div>
                <div class="form-group">
                    <label>Cód. Item</label>
                    <input type="text" id="fCod" placeholder="REF...">
                </div>
                <div class="form-group">
                    <label>Liga / Corrida</label>
                    <input type="text" id="fLiga" placeholder="WCB / GG25">
                </div>
                <div class="form-group">
                    <label id="lblProg">Prog. (Un)</label>

            </div>
            <button class="btn-main btn-save-modal" onclick="saveEntry()">SALVAR REGISTRO</button>

    <!-- MODAL DE REGISTROS (TELA CHEIA) -->
    <div id="modalRecords" class="modal-overlay">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fa-solid fa-list"></i> Registros de Produção</h3>
                <button class="btn-close-modal" onclick="closeRecordsModal()">&times;</button>
            </div>
            <!-- A tabela aqui dentro será preenchida com o setor atual -->
            <div class="table-container">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>OP</th>
                            <th>Item</th>
                            <th>Liga / Corrida</th>
                            <th id="th-prog">Prog. (Un)</th>
                            <th id="th-real">Real. (Un)</th>

                        </tr>
                    </thead>

        </div>
    </div>

    <div class="app-layout">
        <header class="top-header">
            <div class="header-brand">
                <div class="brand-icon"><i class="fa-solid fa-industry"></i></div>
                <h2 style="margin:0; font-size:1.1rem; letter-spacing: -0.5px;">Aderência Industrial</h2>
            </div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="openRecordsModal()"><i class="fa-solid fa-table-list"></i> REGISTROS</button>
                <button class="btn-main" onclick="openModal()"><i class="fa-solid fa-plus"></i> LANÇAR PROGRAMAÇÃO</button>
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Voltar
                </a>
            </div>
        </header>

        <!-- NAVEGAÇÃO ENTRE SETORES -->
        <nav class="sector-tabs">
            <button class="tab-btn active" data-sector="MOLDAGEM" onclick="setSector('MOLDAGEM')"><i class="fa-solid fa-cubes"></i> Moldagem</button>
            <button class="tab-btn" data-sector="FUSAO" onclick="setSector('FUSAO')"><i class="fa-solid fa-fire"></i> Fusão</button>
            <button class="tab-btn" data-sector="ACABAMENTO" onclick="setSector('ACABAMENTO')"><i class="fa-solid fa-broom"></i> Acabamento</button>
        </nav>

        <main class="dashboard-content">
            <!-- CARDS DE RESUMO -->
            <div class="kpi-row">
                <div class="kpi-card" style="border-left-color: #a855f7;">
                    <div class="kpi-title">Aderência Atual</div>
                    <div id="kpi-adh" class="kpi-value">0%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title" id="lbl-kpi-prog">Programado</div>
                    <div id="kpi-prog" class="kpi-value">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title" id="lbl-kpi-real">Realizado</div>
                    <div id="kpi-real" class="kpi-value">0</div>
                </div>
                <div class="kpi-card" style="border-left-color: var(--status-danger);">
                    <div class="kpi-title">Diferença</div>
                    <div id="kpi-diff" class="kpi-value">0</div>
                </div>
            </div>

            <!-- GRÁFICO (OCUPA A TELA COM MARGEM INFERIOR) -->
            <div class="charts-container">
                <div class="chart-controls">
                    <input type="month" id="chartMonthFilter" class="month-picker" onchange="render()">
                </div>
                <div class="panel">
                    <!-- Div Wrapper adicionada para garantir o height: 100% -->

                        <canvas id="chartLine"></canvas>
                    </div>
                </div>

    <script>
    // Variáveis Globais
    let db = [];
    let currentSector = 'MOLDAGEM';
    let lineChart = null;
    
    // Define o mês atual como padrão no filtro
    const today = new Date();
    const currentMonthStr = today.toISOString().slice(0, 7); // YYYY-MM
    document.getElementById('chartMonthFilter').value = currentMonthStr;

    // --- ESC PARA FECHAR MODAIS ---
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeRecordsModal();
            closeModal();
        }
    });

    // --- FUNÇÕES DE COMUNICAÇÃO COM O BANCO ---
    async function loadData() {
        try {
            const response = await fetch('/api/aderencia');
            db = await response.json();
            render();
        } catch (e) {
            console.error("Erro ao carregar dados:", e);
        }
    }

    async function saveEntry() {
        const entry = {
            sector: document.getElementById('fSetor').value,
            date: document.getElementById('fData').value,
            op: document.getElementById('fOP').value,
            code: document.getElementById('fCod').value,
            heat: document.getElementById('fLiga').value,
            prog: parseFloat(document.getElementById('fProg').value) || 0,
            real: parseFloat(document.getElementById('fReal').value) || 0
        };

        if(!entry.date || !entry.op) return alert("Por favor, preencha a Data e a OP.");

        try {
            const res = await fetch('/api/aderencia?action=save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(entry)
            });
            if (res.ok) {
                closeModal();
                loadData(); // Recarrega do banco
            }
        } catch (e) {
            alert("Erro ao salvar no banco de dados.");
        }
    }

    async function finishEdit(input, id) {
        const newVal = parseFloat(input.value) || 0;
        try {
            const res = await fetch('/api/aderencia?action=update-real', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, real: newVal })
            });
            if (res.ok) loadData();
        } catch (e) {
            console.error(e);
        }
    }

    async function deleteEntry(id) {
        if(!confirm('Excluir este registro permanentemente?')) return;
        try {
            const res = await fetch('/api/aderencia?action=delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            if (res.ok) loadData();
        } catch (e) {
            console.error(e);
        }
    }

    // --- FUNÇÕES DE INTERFACE ---
    function openModal() { document.getElementById('modalEntry').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalEntry').style.display = 'none'; }
    
    function openRecordsModal() { document.getElementById('modalRecords').style.display = 'flex'; }
    function closeRecordsModal() { document.getElementById('modalRecords').style.display = 'none'; }

    function updateModalLabels() {
        const s = document.getElementById('fSetor').value;
        const u = s === 'FUSAO' ? '(kg)' : '(Un)';
        document.getElementById('lblProg').innerText = `Prog. ${u}`;
        document.getElementById('lblReal').innerText = `Real. ${u}`;
    }

    function setSector(s) {
        currentSector = s;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-sector="${s}"]`).classList.add('active');
        render(); // Re-renderiza gráficos e tabela com o novo setor
    }

    function makeEditable(el, id) {
        if (el.querySelector('input')) return;
        const val = el.innerText;
        el.innerHTML = `<input type="number" class="input-inline-edit" value="${val}">`;
        const input = el.querySelector('input');
        input.focus();
        input.onblur = () => finishEdit(input, id);
        input.onkeydown = (e) => { if(e.key === 'Enter') finishEdit(input, id); };
    }

    function toggleGroup(groupId) {
        const header = document.querySelector(`.group-row[data-group="${groupId}"]`);
        const children = document.querySelectorAll(`.child-row[data-group="${groupId}"]`);
        
        if (header.classList.contains('expanded')) {
            header.classList.remove('expanded');
            children.forEach(row => row.classList.remove('visible'));
        } else {
            header.classList.add('expanded');
            children.forEach(row => row.classList.add('visible'));
        }
    }

    // --- RENDERIZAÇÃO CENTRALIZADA (Gráficos + Tabela) ---
    function render() {
        // Filtra os dados globais APENAS para o setor atual
        const filtered = db.filter(i => i.sector === currentSector);

        // Atualiza a tabela (que fica dentro do modal)
        updateTable(filtered);
        
        // Atualiza KPIs e Gráficos
        let tProgGlobal = 0, tRealGlobal = 0;
        filtered.forEach(item => {
            tProgGlobal += parseFloat(item.prog);
            tRealGlobal += parseFloat(item.real);
        });

        updateKPIs(tProgGlobal, tRealGlobal);
        updateCharts(filtered);
    }

    function updateTable(data) {
        const tbody = document.querySelector('#mainTable tbody');
        tbody.innerHTML = '';

        const unit = currentSector === 'FUSAO' ? 'kg' : 'Un';
        document.getElementById('th-prog').innerText = `Prog. (${unit})`;
        document.getElementById('th-real').innerText = `Real. (${unit})`;
        document.getElementById('lbl-kpi-prog').innerText = `Total Programado (${unit})`;
        document.getElementById('lbl-kpi-real').innerText = `Total Realizado (${unit})`;

        // Agrupar os dados por DATA + CORRIDA
        const groups = {};
        data.forEach(item => {
            const heatKey = item.heat ? item.heat.toUpperCase() : "GERAL";
            const groupKey = `${item.date}_${heatKey}`;
            
            if (!groups[groupKey]) {
                groups[groupKey] = {
                    key: groupKey,
                    date: item.date,
                    heat: heatKey,
                    items: [],
                    progTotal: 0,
                    realTotal: 0
                };
            }
            groups[groupKey].items.push(item);
            groups[groupKey].progTotal += parseFloat(item.prog);
            groups[groupKey].realTotal += parseFloat(item.real);
        });

        const sortedGroups = Object.values(groups).sort((a, b) => {
            if (b.date !== a.date) return new Date(b.date) - new Date(a.date);
            return a.heat.localeCompare(b.heat);
        });

        sortedGroups.forEach(group => {
            const gAdh = group.progTotal > 0 ? (group.realTotal / group.progTotal) * 100 : 0;
            const formattedDate = group.date.split('-').reverse().join('/');
            const groupId = `grp_${group.key.replace(/[^a-zA-Z0-9]/g, '')}`;

            const trHeader = document.createElement('tr');
            trHeader.className = 'group-row';
            trHeader.dataset.group = groupId;
            trHeader.onclick = () => toggleGroup(groupId);
            
            trHeader.innerHTML = `
                <td><i class="fa-solid fa-chevron-right group-icon"></i> ${formattedDate}</td>
                <td colspan="2" style="color:var(--text-muted); font-weight:400; font-size:0.8rem">${group.items.length} item(s)</td>
                <td><span class="badge-sector ${getBadge(currentSector)}">${group.heat}</span></td>
                <td style="color:#60a5fa; font-weight:700">${group.progTotal}</td>
                <td style="color:#fff; font-weight:700">${group.realTotal}</td>
                <td style="font-weight:700; color:${gAdh >= 95 ? '#10b981' : (gAdh < 80 ? '#ef4444' : '#fbbf24')}">${gAdh.toFixed(1)}% (Méd)</td>
                <td></td>
            `;
            tbody.appendChild(trHeader);

            group.items.forEach(item => {
                const prog = parseFloat(item.prog);
                const real = parseFloat(item.real);
                const adh = prog > 0 ? (real / prog) * 100 : 0;
                const trChild = document.createElement('tr');
                trChild.className = 'child-row';
                trChild.dataset.group = groupId;
                trChild.innerHTML = `
                    <td style="color:var(--text-muted)"></td> 
                    <td><b>${item.op}</b></td>
                    <td>${item.code}</td>
                    <td style="opacity:0.5; font-size:0.8rem">"${item.heat}"</td>
                    <td style="color:#60a5fa">${prog}</td>
                    <td><span class="editable-cell" onclick="makeEditable(this, ${item.id})">${real}</span></td>
                    <td style="color:${adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24')}">${adh.toFixed(1)}%</td>
                    <td><button onclick="deleteEntry(${item.id})" style="background:none; border:none; color:rgba(239,68,68,0.3); cursor:pointer"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(trChild);
            });
        });
    }

    function getBadge(s) { return s === 'MOLDAGEM' ? 'badge-m' : (s === 'FUSAO' ? 'badge-f' : 'badge-a'); }

    function updateKPIs(p, r) {
        const adh = p > 0 ? (r / p) * 100 : 0;
        document.getElementById('kpi-adh').innerText = adh.toFixed(1) + '%';
        document.getElementById('kpi-prog').innerText = p.toLocaleString();
        document.getElementById('kpi-real').innerText = r.toLocaleString();
        document.getElementById('kpi-diff').innerText = (r - p).toLocaleString();
        document.getElementById('kpi-adh').style.color = adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24');
    }

    function updateCharts(data) {
        const ctxLine = document.getElementById('chartLine').getContext('2d');
        const selectedMonth = document.getElementById('chartMonthFilter').value; // YYYY-MM
        
        if (!selectedMonth) return;

        const [yearStr, monthStr] = selectedMonth.split('-');
        const year = parseInt(yearStr);
        const month = parseInt(monthStr) - 1; 

        // Dias do mês
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const labels = [];
        const values = [];

        // Agrupamento diário
        const dailyData = {};
        data.forEach(d => {
            if (d.date.startsWith(selectedMonth)) {
                dailyData[d.date] = (dailyData[d.date] || {p:0, r:0});
                dailyData[d.date].p += parseFloat(d.prog);
                dailyData[d.date].r += parseFloat(d.real);
            }
        });

        // Preencher 01 até fim do mês
        for (let i = 1; i <= daysInMonth; i++) {
            const dayStr = i.toString().padStart(2, '0');
            const fullDate = `${selectedMonth}-${dayStr}`; 
            labels.push(dayStr); 
            if (dailyData[fullDate] && dailyData[fullDate].p > 0) {
                const adh = (dailyData[fullDate].r / dailyData[fullDate].p) * 100;
                values.push(adh);
            } else {
                values.push(0);
            }
        }

        if(lineChart) lineChart.destroy();

        lineChart = new Chart(ctxLine, {
            type: 'bar',
            data: { 
                labels: labels, 
                datasets: [{ 
                    label: 'Aderência %', 
                    data: values, 
                    borderColor: '#fbbf24',
                    borderWidth: 1,
                    backgroundColor: 'rgba(251, 191, 36, 0.4)',
                    borderRadius: 4,
                    barPercentage: 0.6
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, /* Importante para o gráfico crescer com flexbox */
                plugins: { legend: { display: false } }, 
                scales: { 
                    y: { 
                        beginAtZero: true, 
                        max: 120,
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#a1a1aa' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#a1a1aa' }
                    }
                } 
            }
        });
    }

    // Inicialização
    document.getElementById('fData').valueAsDate = new Date();
    loadData(); 
</script>
</body>
</html>
