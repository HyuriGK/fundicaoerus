<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260605b"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aderência PCP - Fundição</title>

    <!-- Bibliotecas de Estilo e Gráficos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/activity-logger.js?v=20260605d"></script>

    <style>
        /* --- BLOQUEIO DE SELEÇÃO GLOBAL --- */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            outline: none;
        }

        /* Permitir seleção apenas em inputs e textareas */
        input,
        textarea,
        .selectable-text,
        [contenteditable="true"] {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            cursor: text;
        }

        /* --- 1. ROOT VARIABLES --- */
        :root {
            /* Typography */
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Palette */
            --color-primary: #fbbf24;
            /* Amber 400 */
            --color-primary-dim: #d97706;
            /* Amber 600 */

            --bg-body: #09090b;
            /* Zinc 950 */
            --bg-card: rgba(24, 24, 27, 0.7);
            /* Zinc 900 Glass */

            --text-main: #f4f4f5;
            /* Zinc 100 */
            --text-muted: #a1a1aa;
            /* Zinc 400 */

            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --border-separator: rgba(255, 255, 255, 0.06);

            --status-success: #10b981;
            --status-danger: #ef4444;
            --status-info: #06b6d4;
            --status-purple: #a855f7;
            --status-warning: #f59e0b;
            --status-teal: #14b8a6;

            /* Setor Colors */
            --color-moldagem: #3b82f6;
            --color-fusao: #f97316;
            --color-acabamento: #10b981;

            /* Dimensions */
            --radius-md: 12px;
            --footer-height: 40px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        /* --- 2. RESET & GLOBAL --- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(251, 191, 36, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            overflow: hidden;
            height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDE NAVIGATION (PEDIDOS STANDARD) --- */
        .side-menu-trigger {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 45px;
            z-index: 2000;
            background: transparent;
           /* Global Layout Handled by Design System */
        .app-layout {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding: 24px 32px 16px 32px;
        }
      }

        /* Sidebar Filter Style */
        .sidebar-filter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .sidebar-filter label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .sidebar-filter input[type="month"] {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-highlight);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-family: var(--font-mono);
        }

        .btn-modern {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            color: #000;
        }

        /* INPUTS & SELECTS */
        input[type="date"],
        input[type="text"],
        input[type="number"],
        input[type="month"],
        select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 0.85rem;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        /* Custom Select Arrow */
        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23fbbf24%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 8px auto;
            padding-right: 30px;
        }

        option {
            background-color: #18181b;
            color: #fff;
        }

        /* --- 4. CONTENT --- */
        .dashboard-content {
            flex-grow: 1;
            padding: 10px 32px 24px 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TABS STYLE (Updated) --- */
        .sector-tabs {
            display: flex;
            gap: 8px;
            background: rgba(24, 24, 27, 0.7);
            padding: 6px;
            border-radius: 12px;
            margin: 5px 32px 5px 32px;
            width: fit-content;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            backdrop-filter: blur(5px);
        }

        .tab-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.79rem;
            font-weight: 700;
            padding: 0 14px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .tab-btn.active[data-sector="MOLDAGEM"] {
            background: var(--color-moldagem);
            color: #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .tab-btn.active[data-sector="FUSAO"] {
            background: var(--color-fusao);
            color: #fff;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.3);
        }

        .tab-btn.active[data-sector="ACABAMENTO"] {
            background: var(--color-acabamento);
            color: #fff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        /* --- FOOTER (HIDDEN) --- */
        .app-footer { display: none; }

        }

        .kpi-card.kpi-default::before {
            background: var(--color-primary);
        }

        .kpi-card.kpi-info::before {
            background: var(--status-info);
        }

        .kpi-card.kpi-purple::before {
            background: var(--status-purple);
        }

        .kpi-card.kpi-teal::before {
            background: var(--status-teal);
        }

        .kpi-card.kpi-danger::before {
            background: var(--status-danger);
        }

        .kpi-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            font-family: var(--font-mono);
            line-height: 1.1;
        }

        /* Chart Panel - Reduzido 10px */
        .chart-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 10px 20px;
            /* Reduzido de 20px para 10px no topo/baixo */
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .chart-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        /* TABLE (DENTRO DO MODAL) */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow-x: auto;
            flex-grow: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-separator);
            white-space: nowrap;
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* ESTILOS DE AGRUPAMENTO */
        .group-row {
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 1px solid var(--border-subtle);
        }

        .group-row:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .group-icon {
            margin-right: 8px;
            transition: transform 0.2s;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .group-row.expanded .group-icon {
            transform: rotate(90deg);
        }

        .child-row {
            background: rgba(0, 0, 0, 0.2);
            display: none;
        }

        .child-row.visible {
            display: table-row;
        }

        .child-row td:first-child {
            padding-left: 35px;
            border-left: 2px solid var(--border-subtle);
        }

        /* EDIÇÃO EM LINHA */
        .editable-cell {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.5);
            border-radius: 4px;
            padding: 4px 12px;
            color: var(--color-primary);
            font-weight: 700;
            cursor: pointer;
            min-width: 60px;
            display: inline-block;
            text-align: center;
        }

        .input-inline-edit {
            width: 70px;
            background: #fff;
            color: #000;
            border: none;
            padding: 4px;
            border-radius: 4px;
            font-weight: 700;
            text-align: center;
            font-family: var(--font-mono);
        }

        /* BADGES */
        .badge-sector {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .badge-m {
            background: rgba(59, 130, 246, 0.2);
            color: var(--color-moldagem);
        }

        .badge-f {
            background: rgba(249, 115, 22, 0.2);
            color: var(--color-fusao);
        }

        .badge-a {
            background: rgba(16, 185, 129, 0.2);
            color: var(--color-acabamento);
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-card {
            background: #18181b;
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-md);
            padding: 20px;
            /* Reduzido de 24px para 20px */
            width: 95%;
            max-width: 550px;
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Reduzido de 20px para 16px */
        }

        .modal-card.fullscreen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            margin: 0;
            padding: 30px 40px;
            background: #09090b;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 12px;
            /* Reduzido */
            margin-bottom: 16px;
            /* Reduzido */
            gap: 15px;
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--color-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            flex: 1;
        }

        .modal-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            color: var(--status-danger);
            cursor: pointer;
            font-size: 2rem;
            transition: transform 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            transform: scale(1.1);
            color: #ff0000;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
            /* Reduzido */
        }

        .full {
            grid-column: span 3;
        }

        .span-2 {
            grid-column: span 2;
        }

        label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        input,
        select {
            background: #000;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-save-modal {
            width: 100%;
            margin-top: 16px;
            /* Reduzido */
            height: 45px;
            justify-content: center;
            background: var(--color-primary);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-main {
            background: var(--color-primary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .btn-secondary {
            background: #27272a;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .btn-secondary:hover {
            background: #3f3f46;
        }

        /* --- TOAST NOTIFICATION STYLES --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #18181b;
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--color-primary);
            color: #fff;
            padding: 16px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-family: var(--font-main);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out forwards;
            min-width: 350px;
        }

        .toast.danger {
            border-left-color: var(--status-danger);
        }

        .toast-icon {
            font-size: 1.2rem;
        }

        .toast.danger .toast-icon {
            color: var(--status-danger);
        }

        .toast-content {
            display: flex;
            flex-direction: column;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .toast-subtitle {
            font-size: 0.75rem;
            color: #a1a1aa;
            margin-top: 4px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }
    </style>
</head>

<body>

    <!-- Container para Toasts -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Sessão gerenciada centralmente por js/activity-logger.js -->
    <script>
        // --- RELÓGIO DO RODAPÉ ---
        setInterval(() => {
            const now = new Date();
            const timeEl = document.getElementById('clock-time');
            const dateEl = document.getElementById('clock-date');
            if (timeEl) timeEl.innerText = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            if (dateEl) dateEl.innerText = now.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
        }, 1000);
    </script>

    <!-- MODAL DE LANÇAMENTO -->
    <div id="modalEntry" class="modal-overlay">
        <div class="modal-card">
            <h3 style="margin:0; color: var(--color-primary);">Nova Programação PCP</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Setor</label>
                    <select id="fSetor" onchange="updateModalLabels()" autocomplete="off">
                        <option value="MOLDAGEM">MOLDAGEM</option>
                        <option value="FUSAO">FUSÃO</option>
                        <option value="ACABAMENTO">ACABAMENTO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="fData" autocomplete="off">
                </div>
                <div class="form-group span-2">
                    <label>OP</label>
                    <input type="text" id="fOP" placeholder="Ex: 5050" autocomplete="off">
                </div>
                <div class="form-group full">
                    <label>Cód. Item</label>
                    <input type="text" id="fCod" placeholder="REF..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Liga / Corrida</label>
                    <input type="text" id="fLiga" placeholder="WCB / GG25" autocomplete="off">
                </div>
                <div class="form-group">
                    <label id="lblProg">Prog. (Un)</label>
                    <input type="number" id="fProg" value="0" autocomplete="off">
                </div>
                <div class="form-group">
                    <label id="lblReal">Real. (Un)</label>
                    <input type="number" id="fReal" value="0" autocomplete="off">
                </div>
            </div>
            <button class="btn-save-modal" onclick="saveEntry()"> SALVAR REGISTRO
 </button>
            <button onclick="closeModal()"
                style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:12px; cursor:pointer; font-weight: 500;">
 Cancelar
 </button>
        </div>
    </div>

    <!-- MODAL DE REGISTROS (TELA CHEIA) -->
    <div id="modalRecords" class="modal-overlay">
        <div class="modal-card fullscreen">
            <div class="modal-header">
                <h2 class="modal-title"><i class="fa-solid fa-list-check" style="margin-right: 15px;"></i>Detalhamento
                    de Registros</h2>
                <div class="modal-header-actions">
                    <span class="modal-close" onclick="closeRecordsModal()" title="Fechar (ESC)">&times;</span>
                </div>
            </div>

            <div class="table-container">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>OP</th>
                            <th>Item</th>
                            <th>Liga / Corrida</th>
                            <th id="th-prog">Prog. (Un)</th>
                            <th id="th-real">Real. (Un)</th>
                            <th>Aderência</th>
                            <th style="width:40px"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div style="text-align: center; color: var(--text-muted); margin-top: 20px; font-size: 0.8rem;">
                Pressione ESC para fechar
            </div>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="app-layout">

    <!-- Side Menu Trigger Area -->
    <div class="side-menu-trigger"></div>
    <nav class="side-menu">
        <div class="side-menu-header">
            <div class="side-menu-title">Opções</div>
            <div class="side-menu-subtitle">ADERÊNCIA PCP</div>
        </div>

        <div class="side-menu-actions">
            <!-- Filter -->
            <div class="sidebar-filter">
                <label for="chartMonthFilter">Mês de Referência</label>
                <input type="month" id="chartMonthFilter" onchange="render()">
            </div>

            <!-- Actions -->
            <button class="side-btn" onclick="openModal()"> Lançar Programação
 </button>
            <button class="side-btn" onclick="openRecordsModal(); this.blur()"> Ver Registros
 </button>

            <a href="index.html" class="side-btn btn-back-side">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Voltar
            </a>
        </div>
    </nav>

    <div class="app-layout">

        <!-- NAVEGAÇÃO ENTRE SETORES -->
        <nav class="sector-tabs">
            <button class="tab-btn active" data-sector="MOLDAGEM" onclick="setSector('MOLDAGEM')"> Moldagem
 </button>
            <button class="tab-btn" data-sector="FUSAO" onclick="setSector('FUSAO')"> Fusão
 </button>
            <button class="tab-btn" data-sector="ACABAMENTO" onclick="setSector('ACABAMENTO')"> Acabamento
 </button>
        </nav>

        <!-- DASHBOARD CONTENT -->
        <main class="dashboard-content">

            <!-- KPIS ROW -->
            <div class="kpi-row">
                <div class="kpi-card kpi-default" title="Clique para ver os registros" >
                    <div class="kpi-title">Aderência Atual</div>
                    <div id="kpi-adh" class="kpi-value">0%</div>
                </div>

                <div class="kpi-card kpi-info" title="Clique para ver os registros" >
                    <div class="kpi-title" id="lbl-kpi-prog">Programado</div>
                    <div id="kpi-prog" class="kpi-value">0</div>
                </div>

                <div class="kpi-card kpi-purple" title="Clique para ver os registros" >
                    <div class="kpi-title" id="lbl-kpi-real">Realizado</div>
                    <div id="kpi-real" class="kpi-value">0</div>
                </div>

                <div class="kpi-card kpi-danger" title="Clique para ver os registros" >
                    <div class="kpi-title">Diferença</div>
                    <div id="kpi-diff" class="kpi-value">0</div>
                </div>
            </div>

            <!-- GRÁFICO -->
            <div class="chart-panel">
                <div class="chart-wrapper">
                    <canvas id="chartLine"></canvas>
                </div>
            </div>

        </main>


    </div>

    <script>
        // Variáveis Globais
        let db = [];
        let currentSector = 'MOLDAGEM';
        let lineChart = null;

        // Define o mês atual como padrão no filtro
        const today = new Date();
        const currentMonthStr = today.toISOString().slice(0, 7); // YYYY-MM
        document.getElementById('chartMonthFilter').value = currentMonthStr;

        // --- ESC PARA FECHAR MODAIS ---
        document.addEventListener('keydown', function (event) {
            if (event.key === "Escape") {
                closeRecordsModal();
                closeModal();
            }
        });

        // --- TOAST FUNCTION ---
        function showToast(title, subtitle, type = 'info') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icon = type === 'danger' ? '<i class="fa-solid fa-ban toast-icon"></i>' : '<i class="fa-solid fa-circle-info toast-icon"></i>';

            toast.innerHTML = `
            ${icon} 
            <div class="toast-content">
                <span class="toast-title">${title}</span>
                <span class="toast-subtitle">${subtitle}</span>
            </div>
        `;

            container.appendChild(toast);

            // Remove após 4 segundos
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 500);
            }, 4000);
        }

        // --- FUNÇÕES DE COMUNICAÇÃO COM O BANCO ---
        async function loadData() {
            try {
                const response = await fetch('/api/aderencia', {
                    headers: {
                        'x-role': localStorage.getItem('erus_role') || '',
                        'x-user': localStorage.getItem('erus_user') || localStorage.getItem('erus_username') || ''
                    }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const payload = await response.json();
                db = Array.isArray(payload) ? payload : (payload.data || []);
                render();
            } catch (e) {
                console.error("Erro ao carregar dados:", e);
                db = [];
                render();
                showToast("Erro de Conexão", "Não foi possível carregar os dados do servidor", "danger");
            }
        }

        async function saveEntry() {
            const entry = {
                sector: document.getElementById('fSetor').value,
                date: document.getElementById('fData').value,
                op: document.getElementById('fOP').value,
                code: document.getElementById('fCod').value,
                heat: document.getElementById('fLiga').value,
                prog: parseFloat(document.getElementById('fProg').value) || 0,
                real: parseFloat(document.getElementById('fReal').value) || 0
            };

            if (!entry.date || !entry.op) {
                showToast("Campos obrigatórios", "Por favor, preencha a Data e a OP", "danger");
                return;
            }

            try {
                const res = await fetch('/api/aderencia?action=save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-role': localStorage.getItem('erus_role') || '',
                        'x-user': localStorage.getItem('erus_user') || localStorage.getItem('erus_username') || ''
                    },
                    body: JSON.stringify(entry)
                });
                if (res.ok) {
                    // Limpar campos do modal
                    clearModalFields();

                    closeModal();
                    showToast("Sucesso", "Registro salvo com sucesso", "info");
                    loadData(); // Recarrega do banco
                } else {
                    showToast("Erro", "Falha ao salvar no servidor", "danger");
                }
            } catch (e) {
                showToast("Erro", "Não foi possível conectar ao servidor", "danger");
            }
        }

        // Função para limpar campos do modal
        function clearModalFields() {
            document.getElementById('fOP').value = '';
            document.getElementById('fCod').value = '';
            document.getElementById('fLiga').value = '';
            document.getElementById('fProg').value = '0';
            document.getElementById('fReal').value = '0';
            // Mantém a data atual e o setor atual
            document.getElementById('fData').valueAsDate = new Date();
            // O setor já está configurado para o setor atual
        }

        async function finishEdit(input, id) {
            const newVal = parseFloat(input.value) || 0;
            try {
                const res = await fetch('/api/aderencia?action=update-real', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-role': localStorage.getItem('erus_role') || '',
                        'x-user': localStorage.getItem('erus_user') || localStorage.getItem('erus_username') || ''
                    },
                    body: JSON.stringify({ id, real: newVal })
                });
                if (res.ok) {
                    loadData();
                    showToast("Atualizado", "Valor real atualizado", "info");
                }
            } catch (e) {
                console.error(e);
                showToast("Erro", "Falha ao atualizar", "danger");
            }
        }

        async function deleteEntry(id) {
            if (!await classicConfirm('Excluir este registro permanentemente?')) return;
            try {
                const res = await fetch('/api/aderencia?action=delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-role': localStorage.getItem('erus_role') || '',
                        'x-user': localStorage.getItem('erus_user') || localStorage.getItem('erus_username') || ''
                    },
                    body: JSON.stringify({ id })
                });
                if (res.ok) {
                    loadData();
                    showToast("Excluído", "Registro removido", "info");
                }
            } catch (e) {
                console.error(e);
                showToast("Erro", "Falha ao excluir", "danger");
            }
        }

        // --- FUNÇÕES DE INTERFACE ---
        function openModal() {
            // Configurar o setor do modal para o setor atual
            document.getElementById('fSetor').value = currentSector;
            updateModalLabels(); // Atualiza labels baseado no setor

            // Configurar data atual
            document.getElementById('fData').valueAsDate = new Date();

            // Abrir modal
            document.getElementById('modalEntry').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalEntry').style.display = 'none';
        }

        function openRecordsModal() {
            document.getElementById('modalRecords').style.display = 'flex';
        }

        function closeRecordsModal() {
            document.getElementById('modalRecords').style.display = 'none';
        }

        function updateModalLabels() {
            const s = document.getElementById('fSetor').value;
            const u = s === 'FUSAO' ? '(kg)' : '(Un)';
            document.getElementById('lblProg').innerText = `Prog. ${u}`;
            document.getElementById('lblReal').innerText = `Real. ${u}`;
        }

        function setSector(s) {
            currentSector = s;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-sector="${s}"]`).classList.add('active');
            render(); // Re-renderiza gráficos e tabela com o novo setor
        }

        function makeEditable(el, id) {
            if (el.querySelector('input')) return;
            const val = el.innerText;
            el.innerHTML = `<input type="number" class="input-inline-edit" value="${val}">`;
            const input = el.querySelector('input');
            input.focus();
            input.onblur = () => finishEdit(input, id);
            input.onkeydown = (e) => { if (e.key === 'Enter') finishEdit(input, id); };
        }

        function toggleGroup(groupId) {
            const header = document.querySelector(`.group-row[data-group="${groupId}"]`);
            const children = document.querySelectorAll(`.child-row[data-group="${groupId}"]`);

            if (header.classList.contains('expanded')) {
                header.classList.remove('expanded');
                children.forEach(row => row.classList.remove('visible'));
            } else {
                header.classList.add('expanded');
                children.forEach(row => row.classList.add('visible'));
            }
        }

        function getBadge(s) {
            return s === 'MOLDAGEM' ? 'badge-m' : (s === 'FUSAO' ? 'badge-f' : 'badge-a');
        }

        // --- RENDERIZAÇÃO CENTRALIZADA (Gráficos + Tabela) ---
        function render() {
            // Filtra os dados globais APENAS para o setor atual
            const filtered = db.filter(i => i.sector === currentSector);

            // Atualiza a tabela (que fica dentro do modal)
            updateTable(filtered);

            // Atualiza KPIs e Gráficos
            let tProgGlobal = 0, tRealGlobal = 0;
            filtered.forEach(item => {
                tProgGlobal += parseFloat(item.prog);
                tRealGlobal += parseFloat(item.real);
            });

            updateKPIs(tProgGlobal, tRealGlobal);
            updateCharts(filtered);
        }

        function updateTable(data) {
            const tbody = document.querySelector('#mainTable tbody');
            tbody.innerHTML = '';

            const unit = currentSector === 'FUSAO' ? 'kg' : 'Un';
            document.getElementById('th-prog').innerText = `Prog. (${unit})`;
            document.getElementById('th-real').innerText = `Real. (${unit})`;
            document.getElementById('lbl-kpi-prog').innerText = `Total Programado (${unit})`;
            document.getElementById('lbl-kpi-real').innerText = `Total Realizado (${unit})`;

            // Agrupar os dados APENAS por DATA (removido a corrida do agrupamento)
            const groups = {};
            data.forEach(item => {
                const groupKey = item.date; // Agora agrupa apenas por data

                if (!groups[groupKey]) {
                    groups[groupKey] = {
                        key: groupKey,
                        date: item.date,
                        items: [],
                        progTotal: 0,
                        realTotal: 0
                    };
                }
                groups[groupKey].items.push(item);
                groups[groupKey].progTotal += parseFloat(item.prog);
                groups[groupKey].realTotal += parseFloat(item.real);
            });

            const sortedGroups = Object.values(groups).sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });

            sortedGroups.forEach(group => {
                const gAdh = group.progTotal > 0 ? (group.realTotal / group.progTotal) * 100 : 0;
                const formattedDate = group.date.split('-').reverse().join('/');
                const groupId = `grp_${group.key.replace(/[^a-zA-Z0-9]/g, '')}`;

                const trHeader = document.createElement('tr');
                trHeader.className = 'group-row';
                trHeader.dataset.group = groupId;
                trHeader.onclick = () => toggleGroup(groupId);

                trHeader.innerHTML = `
                <td><i class="fa-solid fa-chevron-right group-icon"></i> ${formattedDate}</td>
                <td colspan="2" style="color:var(--text-muted); font-weight:400; font-size:0.8rem">${group.items.length} item(s)</td>
                <td><span class="badge-sector ${getBadge(currentSector)}">${currentSector}</span></td>
                <td style="color:#60a5fa; font-weight:700">${group.progTotal}</td>
                <td style="color:#fff; font-weight:700">${group.realTotal}</td>
                <td style="font-weight:700; color:${gAdh >= 95 ? '#10b981' : (gAdh < 80 ? '#ef4444' : '#fbbf24')}">${gAdh.toFixed(1)}%</td>
                <td></td>
            `;
                tbody.appendChild(trHeader);

                // Ordenar itens dentro do grupo por OP
                group.items.sort((a, b) => a.op.localeCompare(b.op)).forEach(item => {
                    const prog = parseFloat(item.prog);
                    const real = parseFloat(item.real);
                    const adh = prog > 0 ? (real / prog) * 100 : 0;
                    const trChild = document.createElement('tr');
                    trChild.className = 'child-row';
                    trChild.dataset.group = groupId;
                    trChild.innerHTML = `
                    <td style="color:var(--text-muted)"></td> 
                    <td><b>${item.op}</b></td>
                    <td>${item.code}</td>
                    <td style="opacity:0.5; font-size:0.8rem">${item.heat || ""}</td>
                    <td style="color:#60a5fa">${prog}</td>
                    <td><span class="editable-cell" onclick="makeEditable(this, ${item.id})">${real}</span></td>
                    <td style="color:${adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24')}">${adh.toFixed(1)}%</td>
                    <td><button onclick="deleteEntry(${item.id})" style="background:none; border:none; color:rgba(239,68,68,0.3); cursor:pointer"> </button></td>
                `;
                    tbody.appendChild(trChild);
                });
            });
        }

        function updateKPIs(p, r) {
            const adh = p > 0 ? (r / p) * 100 : 0;
            const diff = r - p;

            document.getElementById('kpi-adh').innerText = adh.toFixed(1) + '%';
            document.getElementById('kpi-prog').innerText = p.toLocaleString();
            document.getElementById('kpi-real').innerText = r.toLocaleString();
            document.getElementById('kpi-diff').innerText = diff.toLocaleString();

            // Cores dinâmicas
            document.getElementById('kpi-adh').style.color = adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24');

            // Atualizar footer também
            document.getElementById('footer-adh').textContent = adh.toFixed(1) + '%';
            document.getElementById('footer-prog').textContent = p.toLocaleString();
            document.getElementById('footer-real').textContent = r.toLocaleString();
            document.getElementById('footer-adh').style.color = adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24');
        }

        function updateCharts(data) {
            const ctxLine = document.getElementById('chartLine').getContext('2d');
            const selectedMonth = document.getElementById('chartMonthFilter').value; // YYYY-MM

            if (!selectedMonth) return;

            const [yearStr, monthStr] = selectedMonth.split('-');
            const year = parseInt(yearStr);
            const month = parseInt(monthStr) - 1;

            // Dias do mês
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const labels = [];
            const values = [];

            // Agrupamento diário
            const dailyData = {};
            data.forEach(d => {
                if (d.date.startsWith(selectedMonth)) {
                    dailyData[d.date] = (dailyData[d.date] || { p: 0, r: 0 });
                    dailyData[d.date].p += parseFloat(d.prog);
                    dailyData[d.date].r += parseFloat(d.real);
                }
            });

            // Preencher 01 até fim do mês
            for (let i = 1; i <= daysInMonth; i++) {
                const dayStr = i.toString().padStart(2, '0');
                const fullDate = `${selectedMonth}-${dayStr}`;
                labels.push(dayStr);
                if (dailyData[fullDate] && dailyData[fullDate].p > 0) {
                    const adh = (dailyData[fullDate].r / dailyData[fullDate].p) * 100;
                    values.push(adh);
                } else {
                    values.push(0);
                }
            }

            if (lineChart) lineChart.destroy();

            // Determinar cor do setor atual
            let lineColor;
            if (currentSector === 'MOLDAGEM') {
                lineColor = '#3b82f6';
            } else if (currentSector === 'FUSAO') {
                lineColor = '#f97316';
            } else if (currentSector === 'ACABAMENTO') {
                lineColor = '#10b981';
            } else {
                lineColor = '#fbbf24';
            }

            lineChart = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Aderência %',
                        data: values,
                        borderColor: lineColor,
                        backgroundColor: lineColor + '20',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: lineColor,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#a1a1aa',
                                font: {
                                    family: "'Inter', sans-serif"
                                }
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(24, 24, 27, 0.95)',
                            titleColor: '#fbbf24',
                            bodyColor: '#fff',
                            borderColor: 'rgba(251, 191, 36, 0.2)',
                            borderWidth: 1,
                            callbacks: {
                                label: function (context) {
                                    return `Aderência: ${context.parsed.y.toFixed(1)}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 120,
                            grid: {
                                color: 'rgba(255,255,255,0.05)'
                            },
                            ticks: {
                                color: '#a1a1aa',
                                callback: function (value) {
                                    return value + '%';
                                }
                            },
                            title: {
                                display: true,
                                text: 'Aderência (%)',
                                color: '#a1a1aa'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(255,255,255,0.05)'
                            },
                            ticks: {
                                color: '#a1a1aa'
                            },
                            title: {
                                display: true,
                                text: 'Dias do Mês',
                                color: '#a1a1aa'
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // Inicialização
        window.onload = function () {
            document.getElementById('fData').valueAsDate = new Date();
            updateModalLabels(); // Atualiza labels do modal
            loadData(); // Carrega dados do banco

            // Configurar o filtro de mês para chamar render quando mudar
            document.getElementById('chartMonthFilter').addEventListener('change', function () {
                render();
            });
        };
    </script>
    <script src="session-guard.js"></script>
</body>

</html>
