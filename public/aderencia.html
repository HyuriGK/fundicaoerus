<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aderência PCP - Fundição</title>
    
    <!-- Bibliotecas de Estilo e Gráficos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-primary: #fbbf24;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.9);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.08);
            
            --color-moldagem: #3b82f6; 
            --color-fusao: #f97316;    
            --color-acabamento: #10b981;
            
            --status-danger: #ef4444;
            --radius-md: 12px;
        }

        body {
            margin: 0; font-family: var(--font-main); background-color: var(--bg-body); color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(251, 191, 36, 0.05), transparent 40%);
            min-height: 100vh; overflow-x: hidden;
        }

        /* HEADER */
        .top-header { 
            padding: 15px 32px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid var(--border-subtle); 
            background: rgba(0,0,0,0.3); 
        }
        .header-brand { display: flex; align-items: center; gap: 15px; }
        .header-actions { display: flex; align-items: center; gap: 12px; }

        .brand-icon { width: 35px; height: 35px; background: var(--color-primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.1rem; }

        .btn-back {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-back:hover { background: #ef4444; color: #fff; }

        /* TABS - ORDEM: MOLDAGEM, FUSAO, ACABAMENTO */
        .sector-tabs { display: flex; gap: 8px; background: #18181b; padding: 6px; border-radius: 12px; margin: 20px 32px 0 32px; width: fit-content; border: 1px solid var(--border-subtle); }
        .tab-btn { 
            padding: 10px 24px; border: none; background: transparent; color: var(--text-muted); 
            cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .tab-btn.active[data-sector="MOLDAGEM"] { background: var(--color-moldagem); color: #fff; }
        .tab-btn.active[data-sector="FUSAO"] { background: var(--color-fusao); color: #fff; }
        .tab-btn.active[data-sector="ACABAMENTO"] { background: var(--color-acabamento); color: #fff; }

        /* DASHBOARD CONTENT */
        .dashboard-content { padding: 20px 32px; }
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { 
            background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 18px; 
            border-radius: var(--radius-md); border-left: 4px solid var(--color-primary);
        }
        .kpi-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; font-family: var(--font-mono); margin-top: 5px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; margin-bottom: 24px; }
        .panel { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 20px; }

        /* TABLE */
        .table-container { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: rgba(0,0,0,0.5); padding: 14px; text-align: left; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-subtle); }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* EDIÇÃO EM LINHA */
        .editable-cell {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.5);
            border-radius: 4px;
            padding: 4px 12px;
            color: var(--color-primary);
            font-weight: 700;
            cursor: pointer;
            min-width: 60px;
            display: inline-block;
            text-align: center;
        }
        .input-inline-edit {
            width: 70px; background: #fff; color: #000; border: none; padding: 4px; border-radius: 4px; font-weight: 700; text-align: center; font-family: var(--font-mono);
        }

        /* MODAL */
        .modal-overlay { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content { background: #18181b; width: 420px; padding: 25px; border-radius: 12px; border: 1px solid var(--border-subtle); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .full { grid-column: span 2; }
        label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; display: block; }
        input, select { background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        
        .btn-main { background: var(--color-primary); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-save-modal { width: 100%; margin-top: 20px; height: 45px; justify-content: center; }

        .badge-sector { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
        .badge-m { background: rgba(59, 130, 246, 0.2); color: var(--color-moldagem); }
        .badge-f { background: rgba(249, 115, 22, 0.2); color: var(--color-fusao); }
        .badge-a { background: rgba(16, 185, 129, 0.2); color: var(--color-acabamento); }
    </style>
</head>
<body>

    <!-- MODAL DE LANÇAMENTO -->
    <div id="modalEntry" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin:0">Nova Programação PCP</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Setor</label>
                    <select id="fSetor" onchange="updateModalLabels()">
                        <option value="MOLDAGEM">MOLDAGEM</option>
                        <option value="FUSAO">FUSÃO</option>
                        <option value="ACABAMENTO">ACABAMENTO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="fData">
                </div>
                <div class="form-group">
                    <label>OP</label>
                    <input type="text" id="fOP" placeholder="Ex: 5050">
                </div>
                <div class="form-group">
                    <label>Cód. Item</label>
                    <input type="text" id="fCod" placeholder="REF...">
                </div>
                <div class="form-group">
                    <label>Liga / Corrida</label>
                    <input type="text" id="fLiga" placeholder="WCB / GG25">
                </div>
                <div class="form-group">
                    <label id="lblProg">Prog. (Un)</label>
                    <input type="number" id="fProg" value="0">
                </div>
                <div class="form-group">
                    <label id="lblReal">Real. (Un)</label>
                    <input type="number" id="fReal" value="0">
                </div>
            </div>
            <button class="btn-main btn-save-modal" onclick="saveEntry()">SALVAR REGISTRO</button>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:12px; cursor:pointer; font-weight: 500;">Cancelar</button>
        </div>
    </div>

    <div class="app-layout">
        <header class="top-header">
            <div class="header-brand">
                <div class="brand-icon"><i class="fa-solid fa-industry"></i></div>
                <h2 style="margin:0; font-size:1.1rem; letter-spacing: -0.5px;">Aderência Industrial</h2>
            </div>
            <div class="header-actions">
                <button class="btn-main" onclick="openModal()"><i class="fa-solid fa-plus"></i> LANÇAR PROGRAMAÇÃO</button>
                <a href="processos.html" class="btn-back">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Voltar
                </a>
            </div>
        </header>

        <!-- NAVEGAÇÃO ENTRE SETORES -->
        <nav class="sector-tabs">
            <button class="tab-btn active" data-sector="MOLDAGEM" onclick="setSector('MOLDAGEM')"><i class="fa-solid fa-cubes"></i> Moldagem</button>
            <button class="tab-btn" data-sector="FUSAO" onclick="setSector('FUSAO')"><i class="fa-solid fa-fire"></i> Fusão</button>
            <button class="tab-btn" data-sector="ACABAMENTO" onclick="setSector('ACABAMENTO')"><i class="fa-solid fa-broom"></i> Acabamento</button>
        </nav>

        <main class="dashboard-content">
            <!-- CARDS DE RESUMO -->
            <div class="kpi-row">
                <div class="kpi-card" style="border-left-color: #a855f7;">
                    <div class="kpi-title">Aderência Atual</div>
                    <div id="kpi-adh" class="kpi-value">0%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title" id="lbl-kpi-prog">Programado</div>
                    <div id="kpi-prog" class="kpi-value">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title" id="lbl-kpi-real">Realizado</div>
                    <div id="kpi-real" class="kpi-value">0</div>
                </div>
                <div class="kpi-card" style="border-left-color: var(--status-danger);">
                    <div class="kpi-title">Diferença</div>
                    <div id="kpi-diff" class="kpi-value">0</div>
                </div>
            </div>

            <!-- GRÁFICOS -->
            <div class="charts-grid">
                <div class="panel">
                    <canvas id="chartLine" height="120"></canvas>
                </div>
                <div class="panel">
                    <canvas id="chartDonut"></canvas>
                </div>
            </div>

            <!-- TABELA DE DADOS -->
            <div class="table-container">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>OP</th>
                            <th>Item</th>
                            <th>Liga / Corrida</th>
                            <th id="th-prog">Prog. (Un)</th>
                            <th id="th-real">Real. (Un)</th>
                            <th>Aderência</th>
                            <th style="width:40px"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Banco de Dados Simulado em LocalStorage
        let db = JSON.parse(localStorage.getItem('aderencia_fundicao_v4')) || [];
        let currentSector = 'MOLDAGEM';
        let lineChart = null;
        let donutChart = null;

        function openModal() { document.getElementById('modalEntry').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalEntry').style.display = 'none'; }

        // Ajusta as unidades conforme o setor (Fusão usa kg)
        function updateModalLabels() {
            const s = document.getElementById('fSetor').value;
            const u = s === 'FUSAO' ? '(kg)' : '(Un)';
            document.getElementById('lblProg').innerText = `Prog. ${u}`;
            document.getElementById('lblReal').innerText = `Real. ${u}`;
        }

        function saveEntry() {
            const entry = {
                id: Date.now(),
                sector: document.getElementById('fSetor').value,
                date: document.getElementById('fData').value,
                op: document.getElementById('fOP').value,
                code: document.getElementById('fCod').value,
                heat: document.getElementById('fLiga').value,
                prog: parseFloat(document.getElementById('fProg').value) || 0,
                real: parseFloat(document.getElementById('fReal').value) || 0
            };
            if(!entry.date || !entry.op) return alert("Por favor, preencha a Data e a OP.");
            db.push(entry);
            save();
            closeModal();
        }

        function setSector(s) {
            currentSector = s;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-sector="${s}"]`).classList.add('active');
            render();
        }

        // Função de Edição Direta na Tabela
        function makeEditable(el, id) {
            if (el.querySelector('input')) return;
            const val = el.innerText;
            el.innerHTML = `<input type="number" class="input-inline-edit" value="${val}">`;
            const input = el.querySelector('input');
            input.focus();
            input.onblur = () => finishEdit(input, id);
            input.onkeydown = (e) => { if(e.key === 'Enter') finishEdit(input, id); };
        }

        function finishEdit(input, id) {
            const newVal = parseFloat(input.value) || 0;
            const idx = db.findIndex(i => i.id === id);
            if(idx !== -1) { db[idx].real = newVal; save(); }
        }

        function deleteEntry(id) { if(confirm('Excluir este registro?')) { db = db.filter(i => i.id !== id); save(); } }

        function save() {
            localStorage.setItem('aderencia_fundicao_v4', JSON.stringify(db));
            render();
        }

        function render() {
            const filtered = db.filter(i => i.sector === currentSector);
            const tbody = document.querySelector('#mainTable tbody');
            tbody.innerHTML = '';

            const unit = currentSector === 'FUSAO' ? 'kg' : 'Un';
            document.getElementById('th-prog').innerText = `Prog. (${unit})`;
            document.getElementById('th-real').innerText = `Real. (${unit})`;
            document.getElementById('lbl-kpi-prog').innerText = `Total Programado (${unit})`;
            document.getElementById('lbl-kpi-real').innerText = `Total Realizado (${unit})`;

            let tProg = 0, tReal = 0;

            filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                tProg += item.prog; tReal += item.real;
                const adh = item.prog > 0 ? (item.real / item.prog) * 100 : 0;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:var(--text-muted)">${item.date.split('-').reverse().join('/')}</td>
                    <td><b>${item.op}</b></td>
                    <td>${item.code}</td>
                    <td><span class="badge-sector ${getBadge(item.sector)}">${item.heat}</span></td>
                    <td style="color:#60a5fa; font-weight:600">${item.prog}</td>
                    <td><span class="editable-cell" onclick="makeEditable(this, ${item.id})">${item.real}</span></td>
                    <td style="font-weight:700; color:${adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24')}">${adh.toFixed(1)}%</td>
                    <td><button onclick="deleteEntry(${item.id})" style="background:none; border:none; color:rgba(239,68,68,0.3); cursor:pointer"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });

            updateKPIs(tProg, tReal);
            updateCharts(filtered);
        }

        function getBadge(s) { return s === 'MOLDAGEM' ? 'badge-m' : (s === 'FUSAO' ? 'badge-f' : 'badge-a'); }

        function updateKPIs(p, r) {
            const adh = p > 0 ? (r / p) * 100 : 0;
            document.getElementById('kpi-adh').innerText = adh.toFixed(1) + '%';
            document.getElementById('kpi-prog').innerText = p.toLocaleString();
            document.getElementById('kpi-real').innerText = r.toLocaleString();
            document.getElementById('kpi-diff').innerText = (r - p).toLocaleString();
            document.getElementById('kpi-adh').style.color = adh >= 95 ? '#10b981' : (adh < 80 ? '#ef4444' : '#fbbf24');
        }

        function updateCharts(data) {
            const ctxLine = document.getElementById('chartLine').getContext('2d');
            const ctxDonut = document.getElementById('chartDonut').getContext('2d');
            const grouped = {};
            data.forEach(d => { grouped[d.date] = (grouped[d.date] || {p:0,r:0}); grouped[d.date].p+=d.prog; grouped[d.date].r+=d.real; });
            const labels = Object.keys(grouped).sort();
            const values = labels.map(l => grouped[l].p > 0 ? (grouped[l].r / grouped[l].p) * 100 : 0);

            if(lineChart) lineChart.destroy();
            if(donutChart) donutChart.destroy();

            lineChart = new Chart(ctxLine, {
                type: 'line',
                data: { labels: labels.map(d=>d.split('-').reverse().slice(0,2).join('/')), datasets: [{ label: 'Aderência %', data: values, borderColor: '#fbbf24', tension: 0.3, fill: true, backgroundColor: 'rgba(251, 191, 36, 0.05)' }] },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 120 } } }
            });

            donutChart = new Chart(ctxDonut, {
                type: 'doughnut',
                data: { labels: ['Realizado', 'Pendente'], datasets: [{ data: [data.reduce((a,b)=>a+b.real,0), Math.max(0, data.reduce((a,b)=>a+b.prog,0)-data.reduce((a,b)=>a+b.real,0))], backgroundColor: ['#10b981', '#1f2937'], borderWidth: 0 }] },
                options: { plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
            });
        }

        // Inicialização
        document.getElementById('fData').valueAsDate = new Date();
        render();
    </script>
</body>
</html>
