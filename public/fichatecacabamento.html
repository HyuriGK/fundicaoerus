<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260605b"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica | Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="js/activity-logger.js?v=20260601c"></script>
    <style>
        :root {
            --color-primary: #ea580c;
            --color-primary-hover: #f97316;
            --color-primary-rgb: 234, 88, 12;
            --bg-main: #09090b;
            --bg-card: #18181b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --glass-bg: rgba(24, 24, 27, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.4;
            min-height: 100vh;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(var(--color-primary-rgb), 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(var(--color-primary-rgb), 0.03) 0%, transparent 40%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--color-primary), #c2410c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(var(--color-primary-rgb), 0.3);
        }

        .logo-box i {
            font-size: 1.2rem;
            color: #000;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #09090b;
        }

        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
            border: 2px solid #09090b;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        .top-header {
            width: 100%;
            height: auto;
            min-height: 70px;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--color-primary), #c2410c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1.3rem;
            box-shadow: 0 0 20px rgba(var(--color-primary-rgb), 0.2);
        }

        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: #fff;
            margin: 0;
            line-height: 1.1;
        }

        .header-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 3px 0 0 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-glass {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-glass:hover {
            transform: scale(1.1);
            color: #fff;
        }

        .btn-back {
            background: transparent;
            color: #ef4444;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-back:hover {
            transform: scale(1.1);
            color: #ff6b6b;
        }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card.fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            background: #09090b;
            border: none;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 30px;
            background: #18181b;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--color-primary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-close {
            font-size: 2.2rem;
            color: #ef4444;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: #ff5555;
            transform: scale(1.15) rotate(90deg);
        }

        .modal-toolbar {
            padding: 20px 30px;
            background: rgba(17, 17, 19, 0.4);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .records-counter {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .records-counter strong {
            color: var(--color-primary);
        }

        .table-container {
            flex: 1;
            overflow: auto;
            padding: 0 10px;
        }

        table#recordsTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: fixed;
        }

        #recordsTable thead th {
            position: sticky;
            top: 0;
            background: #18181b;
            padding: 12px 10px;
            text-align: left;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-subtle);
            z-index: 10;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #recordsTable tbody td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-subtle);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #recordsTable tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .filter-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            color: #fff;
            padding: 6px 10px;
            font-size: 0.75rem;
            margin-top: 8px;
            outline: none;
        }

        .filter-input:focus {
            border-color: var(--color-primary);
        }

        .btn-view-record {
            padding: 5px 12px;
            background: var(--color-primary);
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-view-record:hover {
            background: var(--color-primary-hover);
        }

        .search-wrapper {
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .search-container {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 12px 18px;
            font-size: 1.05rem;
            outline: none;
        }

        .btn-search {
            background: var(--color-primary);
            border: none;
            color: #000;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-search:hover {
            transform: scale(1.05);
        }

        /* Technical Sheet Layout */
        #sheetContent {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sheet-container {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .sheet-header {
            margin-bottom: 25px;
        }

        .item-main-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-main-info h2 {
            font-size: 2rem;
            font-weight: 850;
            color: var(--color-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .item-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-block {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
        }

        .info-label {
            display: block;
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 3px;
            letter-spacing: 0.1em;
        }

        .info-value {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-divider {
            height: 1px;
            background: var(--border-subtle);
            margin: 25px 0;
            position: relative;
        }

        .section-divider span {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: var(--bg-card);
            padding: 0 12px;
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--color-primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .notes-area {
            margin-top: 15px;
            background: rgba(var(--color-primary-rgb), 0.03);
            border: 1px solid rgba(var(--color-primary-rgb), 0.1);
            border-radius: 8px;
            padding: 15px;
        }

        .notes-text {
            font-size: 0.85rem;
            color: var(--text-main);
            white-space: pre-wrap;
            line-height: 1.6;
        }

        /* Large Image Area at bottom */
        .image-container-large {
            margin-top: 30px;
            width: 100%;
            height: 380px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px dashed var(--border-subtle);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
        }

        .image-container-large i {
            font-size: 4rem;
            opacity: 0.15;
            margin-bottom: 15px;
        }

        /* Print Overrides */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }

            body {
                background: #fff !important;
                color: #000 !important;
                font-size: 10pt;
            }

            .ambient-bg,
            .nav-buttons,
            .search-wrapper,
            header {
                display: none !important;
            }

            .container {
                max-width: 100%;
                padding: 0;
            }

            .sheet-container {
                border: 1px solid #000 !important;
                box-shadow: none !important;
                background: #fff !important;
                border-radius: 0 !important;
                padding: 15px !important;
                min-height: 275mm;
            }

            .info-block {
                background: #fdfdfd !important;
                border: 1px solid #ccc !important;
                color: #000 !important;
            }

            .info-label {
                color: #444 !important;
                font-size: 6pt !important;
            }

            .info-value {
                color: #000 !important;
                font-size: 9pt !important;
            }

            .item-main-info h2 {
                color: #000 !important;
                font-size: 22pt !important;
            }

            .section-divider {
                background: #000 !important;
            }

            .section-divider span {
                background: #fff !important;
                color: #000 !important;
            }

            .notes-area {
                background: #fdfdfd !important;
                border: 1px solid #ccc !important;
                height: auto !important;
                min-height: 100px;
            }

            #notesObservationsPanel {
                height: 500px !important;
            }

            .image-container-large {
                border: 1px solid #ccc !important;
                background: #fff !important;
                height: 500px !important;
                margin-top: 15px !important;
            }

            .image-container-large i {
                display: none;
            }

            .sheet-title-container {
                border-bottom: 2px solid #000 !important;
                margin-bottom: 20px !important;
            }

            .sheet-title-container h1 {
                color: #000 !important;
                font-size: 24pt !important;
            }
        }

        /* Loader & Empty */
        .loader,
        .status-empty {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(var(--color-primary-rgb), 0.1);
            border-left-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="ambient-bg"></div>

    <!-- Header (Screen Only) -->
    <header class="top-header">
        <div class="header-brand">
            <div class="brand-icon"><i class="fa-solid fa-file-invoice"></i></div>
            <div class="header-text">
                <h1>Ficha Técnica de Acabamento</h1>
                <p>Padrões de rebarbação, jateamento e inspeção final • Fundição Erus</p>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> VOLTAR
            </a>
        </div>
    </header>

    <div class="container">

        <!-- Technical Sheet Content -->
        <div id="sheetContent" style="display: block;">

            <div class="sheet-container"
                style="min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <i class="fa-solid fa-person-digging"
                    style="font-size: 4rem; color: var(--color-primary); margin-bottom: 20px; opacity: 0.8;"></i>
                <h2 style="font-size: 2rem; color: #fff; margin-bottom: 10px;">Página em Desenvolvimento</h2>
                <p style="color: var(--text-muted); max-width: 500px; font-size: 1.1rem;">A <strong>Ficha Técnica de
                        Acabamento</strong> está atualmente em construção e estará disponível em breve com novos
                    recursos e integrações exclusivas.</p>
            </div>
        </div>

    </div>

    <script src="session-guard.js"></script>
</body>

</html>
