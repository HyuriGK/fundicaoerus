<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260615d"></script>
    <script src="js/confirm-dialog.js?v=20260617"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicado Interno - Melhorias SGP</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #fbbf24;
            --primary-strong: #d97706;
            --bg: #070708;
            --panel: #111114;
            --panel-soft: #17171b;
            --panel-input: #0d0d10;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(251,191,36,0.24);
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --dim: #71717a;
            --danger: #ef4444;
            --success: #10b981;
            --blue: #38bdf8;
            --shadow: 0 22px 70px rgba(0,0,0,0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Inter, system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 14% 20%, rgba(251,191,36,0.08), transparent 28%),
                radial-gradient(circle at 90% 16%, rgba(56,189,248,0.05), transparent 26%),
                linear-gradient(135deg, #060607, #0b0b0e 55%, #070708);
        }

        button, input, textarea, select { font: inherit; }
        input, textarea { user-select: text; }

        .app {
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            padding: 24px 28px 26px 96px;
            gap: 18px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 58px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .title-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(251,191,36,0.11);
            border: 1px solid rgba(251,191,36,0.24);
            color: var(--primary);
            box-shadow: 0 0 24px rgba(251,191,36,0.08);
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.45rem;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text);
            background: rgba(255,255,255,0.055);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: background .15s, border-color .15s, transform .15s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.16);
        }

        .btn-primary {
            color: #080809;
            background: linear-gradient(180deg, #fbbf24, #d97706);
            border-color: rgba(251,191,36,0.4);
        }

        .btn-success {
            color: #fff;
            background: linear-gradient(180deg, #10b981, #047857);
            border-color: rgba(16,185,129,0.4);
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 8px;
        }

        .workspace {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(440px, 0.9fr) minmax(520px, 1.1fr);
            gap: 18px;
        }

        .panel {
            min-height: 0;
            background: rgba(17,17,20,0.88);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(18px);
        }

        .panel-head {
            min-height: 56px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.025);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
        }

        .panel-body {
            min-height: 0;
            overflow: auto;
            padding: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full { grid-column: 1 / -1; }

        label {
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea, select {
            width: 100%;
            color: var(--text);
            background: var(--panel-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            padding: 11px 12px;
            font-size: 0.88rem;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        textarea {
            min-height: 92px;
            resize: vertical;
            line-height: 1.45;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(251,191,36,0.08);
            background: #101014;
        }

        .section-label {
            margin: 22px 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .section-label h2 {
            font-size: 0.76rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .improvement-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .improvement {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.025);
            padding: 12px;
            display: grid;
            grid-template-columns: 130px 1fr auto;
            gap: 10px;
            align-items: start;
        }

        .improvement .wide {
            grid-column: 1 / 3;
        }

        .empty {
            border: 1px dashed rgba(255,255,255,0.14);
            border-radius: 8px;
            padding: 18px;
            color: var(--dim);
            text-align: center;
            font-size: 0.86rem;
        }

        .preview-shell {
            min-height: 0;
            overflow: auto;
            padding: 22px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0)),
                #0b0b0d;
        }

        .subject-line {
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.035);
            display: flex;
            gap: 10px;
            align-items: center;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .subject-line strong {
            color: var(--text);
            font-weight: 700;
        }

        .notice-card {
            width: min(720px, 100%);
            margin: 0 auto;
            background: #fff;
            color: #1f2937;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 18px 60px rgba(0,0,0,0.45);
            font-family: Arial, Helvetica, sans-serif;
        }

        .notice-hero {
            background: #111827;
            color: #fff;
            padding: 28px 32px;
            border-top: 5px solid #fbbf24;
        }

        .notice-hero .kicker {
            color: #fbbf24;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            margin-bottom: 8px;
        }

        .notice-hero h3 {
            font-size: 24px;
            line-height: 1.2;
            margin: 0 0 7px;
        }

        .notice-hero .meta {
            color: #d1d5db;
            font-size: 13px;
        }

        .notice-content {
            padding: 28px 32px 30px;
            font-size: 15px;
            line-height: 1.65;
        }

        .notice-content p { margin: 0 0 16px; }

        .notice-section-title {
            margin: 24px 0 12px;
            color: #92400e;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .notice-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .notice-list li {
            padding: 12px 0 12px 26px;
            border-bottom: 1px solid #e5e7eb;
            position: relative;
        }

        .notice-list li::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            position: absolute;
            left: 4px;
            top: 20px;
        }

        .notice-list strong {
            color: #111827;
        }

        .tag {
            display: inline-block;
            margin-right: 8px;
            color: #92400e;
            background: #fef3c7;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .notice-box {
            margin-top: 22px;
            background: #f9fafb;
            border-left: 4px solid #f59e0b;
            padding: 15px 17px;
            color: #4b5563;
            border-radius: 0 6px 6px 0;
        }

        .notice-footer {
            padding: 18px 32px 24px;
            background: #f9fafb;
            color: #6b7280;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }

        .toast {
            position: fixed;
            right: 28px;
            bottom: 28px;
            z-index: 9999;
            padding: 12px 14px;
            border-radius: 8px;
            background: #18181b;
            border: 1px solid rgba(16,185,129,0.35);
            color: #d1fae5;
            box-shadow: var(--shadow);
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.86rem;
            font-weight: 700;
        }

        .toast.show { display: flex; }

        @media (max-width: 1100px) {
            body { overflow: auto; }
            .app { height: auto; min-height: 100vh; padding: 18px; }
            .workspace { grid-template-columns: 1fr; }
            .panel { min-height: 520px; }
        }

        @media (max-width: 620px) {
            .topbar { align-items: stretch; flex-direction: column; }
            .toolbar { justify-content: flex-start; }
            .form-grid, .improvement { grid-template-columns: 1fr; }
            .improvement .wide { grid-column: auto; }
            .notice-hero, .notice-content, .notice-footer { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="title-wrap">
                <div class="title-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
                <div>
                    <h1>Comunicado Interno do SGP</h1>
                    <div class="subtitle">Mensagem padronizada para comunicar atualizações aos usuários.</div>
                </div>
            </div>
            <div class="toolbar">
                <button class="btn" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> Restaurar</button>
                <button class="btn" id="copySubjectBtn"><i class="fa-solid fa-heading"></i> Copiar título</button>
                <button class="btn btn-success" id="copyMessageBtn"><i class="fa-solid fa-copy"></i> Copiar mensagem</button>
                <button class="btn btn-primary" id="sendBtn"><i class="fa-solid fa-paper-plane"></i> Enviar no SGP</button>
            </div>
        </header>

        <section class="workspace">
            <form class="panel" id="messageForm">
                <div class="panel-head">
                    <div class="panel-title"><i class="fa-solid fa-sliders"></i> Dados da mensagem</div>
                </div>
                <div class="panel-body">
                    <div class="form-grid">
                        <div class="field full">
                            <label for="subject">Título do comunicado</label>
                            <input id="subject" name="subject" type="text">
                        </div>
                        <div class="field">
                            <label for="period">Período</label>
                            <input id="period" name="period" type="text">
                        </div>
                        <div class="field">
                            <label for="sender">Remetente</label>
                            <input id="sender" name="sender" type="text">
                        </div>
                        <div class="field">
                            <label for="expiryDays">Validade (dias)</label>
                            <input id="expiryDays" name="expiryDays" type="number" min="0" step="1">
                        </div>
                        <div class="field full">
                            <label for="greeting">Saudação</label>
                            <input id="greeting" name="greeting" type="text">
                        </div>
                        <div class="field full">
                            <label for="summary">Resumo</label>
                            <textarea id="summary" name="summary"></textarea>
                        </div>
                    </div>

                    <div class="section-label">
                        <h2>Melhorias</h2>
                        <button type="button" class="btn btn-primary" id="addItemBtn"><i class="fa-solid fa-plus"></i> Adicionar</button>
                    </div>
                    <div class="improvement-list" id="improvementList"></div>

                    <div class="section-label">
                        <h2>Fechamento</h2>
                    </div>
                    <div class="form-grid">
                        <div class="field full">
                            <label for="impact">Impacto esperado</label>
                            <textarea id="impact" name="impact"></textarea>
                        </div>
                        <div class="field full">
                            <label for="nextSteps">Próximos passos</label>
                            <textarea id="nextSteps" name="nextSteps"></textarea>
                        </div>
                    </div>
                </div>
            </form>

            <section class="panel">
                <div class="panel-head">
                    <div class="panel-title"><i class="fa-solid fa-eye"></i> Prévia do comunicado</div>
                    <button class="btn btn-icon" id="printBtn" title="Imprimir"><i class="fa-solid fa-print"></i></button>
                </div>
                <div class="preview-shell">
                    <div class="subject-line"><span>Título:</span> <strong id="subjectPreview"></strong></div>
                    <article class="notice-card" id="messagePreview"></article>
                </div>
            </section>
        </section>
    </main>

    <div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText"></span></div>

    <script>
        const defaults = {
            subject: 'Atualizações e melhorias realizadas no SGP',
            period: new Date().toLocaleDateString('pt-BR'),
            sender: 'Equipe SGP',
            expiryDays: 7,
            greeting: 'Olá, pessoal.',
            summary: 'Segue um resumo das melhorias implementadas no SGP para deixar os processos mais claros, rápidos e confiáveis no uso diário.',
            impact: 'As mudanças melhoram a rastreabilidade das informações, reduzem divergências entre telas e deixam a navegação mais padronizada para os usuários.',
            nextSteps: 'Continuarei acompanhando os pontos de melhoria e novas solicitações para manter o sistema evoluindo conforme a rotina da fábrica.',
            items: [
                {
                    area: 'Monitoramento',
                    title: 'Espelhamento das OPs em carteira',
                    description: 'A tela de monitoramento passou a seguir as mesmas OPs da posição industrial em pedidos, mantendo as visões alinhadas.',
                    impact: 'Mais confiança na comparação entre carteira e operação.'
                },
                {
                    area: 'Interface',
                    title: 'Popups de confirmação padronizados',
                    description: 'As confirmações do sistema foram unificadas em um novo popup visual com blur, layout padrão e botões consistentes.',
                    impact: 'Experiência mais clara e profissional para ações importantes.'
                },
                {
                    area: 'Qualidade de dados',
                    title: 'Correções de texto e acentuação',
                    description: 'Foram corrigidos textos com caracteres quebrados em telas, permissões e logs do sistema.',
                    impact: 'Comunicação mais limpa e fácil de entender.'
                }
            ]
        };

        let state = loadState();

        const fields = ['subject', 'period', 'sender', 'expiryDays', 'greeting', 'summary', 'impact', 'nextSteps'];
        const listEl = document.getElementById('improvementList');
        const previewEl = document.getElementById('messagePreview');
        const subjectPreviewEl = document.getElementById('subjectPreview');

        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem('sgp_internal_update_message') || 'null');
                if (saved && Array.isArray(saved.items)) return { ...defaults, ...saved };
            } catch (error) {}
            return JSON.parse(JSON.stringify(defaults));
        }

        function saveState() {
            localStorage.setItem('sgp_internal_update_message', JSON.stringify(state));
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function textToHtml(value) {
            return escapeHtml(value).replace(/\n/g, '<br>');
        }

        function plainText() {
            const lines = [
                state.greeting,
                '',
                state.summary,
                '',
                'Melhorias realizadas:'
            ];
            state.items.forEach((item, index) => {
                lines.push(`${index + 1}. [${item.area}] ${item.title}`);
                lines.push(`   ${item.description}`);
                if (item.impact) lines.push(`   Impacto: ${item.impact}`);
            });
            lines.push('', 'Impacto esperado:', state.impact);
            if (state.nextSteps) lines.push('', 'Próximos passos:', state.nextSteps);
            lines.push('', 'Mensagem enviada por:', state.sender);
            return lines.join('\n');
        }

        function noticeHtml() {
            const items = state.items.map(item => `
                <li>
                    <span class="tag">${escapeHtml(item.area)}</span>
                    <strong>${escapeHtml(item.title)}</strong><br>
                    ${textToHtml(item.description)}
                    ${item.impact ? `<br><span style="color:#6b7280;"><strong>Impacto:</strong> ${textToHtml(item.impact)}</span>` : ''}
                </li>
            `).join('');

            return `
                <div class="notice-hero">
                    <div class="kicker">SGP · Comunicado interno</div>
                    <h3>${escapeHtml(state.subject)}</h3>
                    <div class="meta">${escapeHtml(state.period)}</div>
                </div>
                <div class="notice-content">
                    <p>${textToHtml(state.greeting)}</p>
                    <p>${textToHtml(state.summary)}</p>
                    <div class="notice-section-title">Melhorias realizadas</div>
                    <ul class="notice-list">${items || '<li>Nenhuma melhoria informada.</li>'}</ul>
                    <div class="notice-box"><strong>Impacto esperado:</strong><br>${textToHtml(state.impact)}</div>
                    ${state.nextSteps ? `<div class="notice-section-title">Próximos passos</div><p>${textToHtml(state.nextSteps)}</p>` : ''}
                    <p style="margin-top:24px;">Mensagem enviada por:<br><strong>${escapeHtml(state.sender)}</strong></p>
                </div>
                <div class="notice-footer">Comunicado interno gerado pelo SGP.</div>
            `;
        }

        function renderForm() {
            fields.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = state[id] || '';
            });
            renderItems();
            renderPreview();
        }

        function renderItems() {
            listEl.innerHTML = '';
            if (!state.items.length) {
                listEl.innerHTML = '<div class="empty">Nenhuma melhoria adicionada.</div>';
                return;
            }
            state.items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'improvement';
                row.innerHTML = `
                    <div class="field">
                        <label>Área</label>
                        <input data-index="${index}" data-key="area" value="${escapeHtml(item.area)}">
                    </div>
                    <div class="field">
                        <label>Título</label>
                        <input data-index="${index}" data-key="title" value="${escapeHtml(item.title)}">
                    </div>
                    <button type="button" class="btn btn-icon" data-remove="${index}" title="Remover"><i class="fa-solid fa-trash"></i></button>
                    <div class="field wide">
                        <label>Descrição</label>
                        <textarea data-index="${index}" data-key="description">${escapeHtml(item.description)}</textarea>
                    </div>
                    <div class="field">
                        <label>Impacto</label>
                        <textarea data-index="${index}" data-key="impact">${escapeHtml(item.impact)}</textarea>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function renderPreview() {
            subjectPreviewEl.textContent = state.subject || 'Sem assunto';
            previewEl.innerHTML = noticeHtml();
            saveState();
        }

        function syncField(event) {
            const el = event.target;
            if (fields.includes(el.id)) {
                state[el.id] = el.value;
                renderPreview();
                return;
            }
            if (el.dataset.index !== undefined) {
                const index = Number(el.dataset.index);
                const key = el.dataset.key;
                state.items[index][key] = el.value;
                renderPreview();
            }
        }

        function addItem() {
            state.items.push({
                area: 'SGP',
                title: 'Nova melhoria',
                description: 'Descreva aqui o que foi desenvolvido.',
                impact: 'Informe o ganho prático para a rotina.'
            });
            renderItems();
            renderPreview();
        }

        function removeItem(index) {
            state.items.splice(index, 1);
            renderItems();
            renderPreview();
        }

        async function copyMessage() {
            const html = `<div style="font-family:Arial,Helvetica,sans-serif;color:#1f2937;">${noticeHtml()}</div>`;
            const text = plainText();
            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            'text/html': new Blob([html], { type: 'text/html' }),
                            'text/plain': new Blob([text], { type: 'text/plain' })
                        })
                    ]);
                } else {
                    await navigator.clipboard.writeText(text);
                }
                toast('Mensagem copiada.');
            } catch (error) {
                await navigator.clipboard.writeText(text);
                toast('Texto copiado sem formatação.');
            }
        }

        async function copySubject() {
            await navigator.clipboard.writeText(state.subject || '');
            toast('Título copiado.');
        }

        async function sendInternalMessage() {
            const confirmed = await erusConfirm(
                'O comunicado será enviado para todos os usuários do SGP.',
                { title: 'Enviar comunicado interno?', okText: 'Enviar', variant: 'success', icon: 'fa-solid fa-bullhorn' }
            );
            if (!confirmed) return;

            const btn = document.getElementById('sendBtn');
            const old = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando';

            try {
                const response = await fetch('/api/communications', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user': localStorage.getItem('erus_user') || 'Admin'
                    },
                    body: JSON.stringify({
                        recipient_ids: [],
                        subject: state.subject,
                        message: plainText(),
                        expiry_days: Number(state.expiryDays) || 0,
                        expiry_hours: 0,
                        expiry_minutes: 0
                    })
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.message || 'Erro ao enviar comunicado.');
                toast('Comunicado enviado no SGP.');
            } catch (error) {
                toast(error.message || 'Erro ao enviar comunicado.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = old;
            }
        }

        function toast(message) {
            const el = document.getElementById('toast');
            document.getElementById('toastText').textContent = message;
            el.classList.add('show');
            clearTimeout(window.__reportToast);
            window.__reportToast = setTimeout(() => el.classList.remove('show'), 2200);
        }

        document.getElementById('messageForm').addEventListener('input', syncField);
        document.getElementById('addItemBtn').addEventListener('click', addItem);
        document.getElementById('copyMessageBtn').addEventListener('click', copyMessage);
        document.getElementById('copySubjectBtn').addEventListener('click', copySubject);
        document.getElementById('sendBtn').addEventListener('click', sendInternalMessage);
        document.getElementById('printBtn').addEventListener('click', () => window.print());
        document.getElementById('resetBtn').addEventListener('click', () => {
            state = JSON.parse(JSON.stringify(defaults));
            renderForm();
            toast('Modelo restaurado.');
        });
        listEl.addEventListener('click', event => {
            const btn = event.target.closest('[data-remove]');
            if (btn) removeItem(Number(btn.dataset.remove));
        });

        renderForm();
    </script>
    <script src="session-guard.js"></script>
</body>
</html>
