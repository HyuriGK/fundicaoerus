<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insumos de Moldagem | Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { height: 100%; font-family: 'Inter', sans-serif; background: #09090b; color: #f4f4f5; }

        :root {
            --color-primary: #fbbf24;
            --color-primary-rgb: 251,191,36;
            --bg-card: #18181b;
            --border: rgba(255,255,255,0.07);
            --text-muted: #71717a;
        }

        html, body { overflow: hidden; }
        .page-wrap {
            padding: 32px 36px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        #content {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        /* HEADER */
        .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
        .page-title-block {}
        .page-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em; color: var(--color-primary); margin-bottom: 6px; }
        .page-title { font-size: 1.65rem; font-weight: 800; color: #fff; letter-spacing: -0.03em; }
        .page-sub   { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

        /* FILTERS */
        .filter-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
        .filter-input {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            border-radius: 8px; color: #fff; padding: 9px 14px; font-size: 0.82rem;
            font-family: 'Inter', sans-serif; outline: none;
            transition: border-color 0.2s;
        }
        .filter-input:focus { border-color: var(--color-primary); }
        .btn-buscar {
            background: linear-gradient(135deg, var(--color-primary), #d97706);
            border: none; color: #000; padding: 10px 22px; border-radius: 8px;
            font-weight: 800; font-size: 0.82rem; cursor: pointer; display: flex;
            align-items: center; gap: 8px; transition: all 0.2s; white-space: nowrap;
        }
        .btn-buscar:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* KPI STRIP */
        .kpi-strip { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
        .kpi-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 140px;
        }
        .kpi-value { font-size: 1.6rem; font-weight: 800; color: #fff; line-height: 1; }
        .kpi-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
        .kpi-card.accent { border-color: rgba(var(--color-primary-rgb), 0.3); }
        .kpi-card.accent .kpi-value { color: var(--color-primary); }

        /* STATUS BAR */
        #statusBar { margin-bottom: 20px; font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .spinner-sm { width: 14px; height: 14px; border: 2px solid rgba(251,191,36,0.2); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* CORRIDA CARD */
        .corrida-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s;
        }
        .corrida-card:hover { border-color: rgba(var(--color-primary-rgb), 0.25); }

        .corrida-header {
            display: flex; align-items: center; gap: 16px; padding: 16px 20px;
            cursor: pointer; user-select: none;
        }
        .corrida-header:hover { background: rgba(255,255,255,0.02); }

        .corrida-num {
            font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700;
            color: var(--color-primary); min-width: 64px;
        }
        .corrida-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
        .corrida-chip {
            font-size: 0.7rem; font-weight: 600; padding: 3px 9px; border-radius: 6px;
            border: 1px solid var(--border); color: #a1a1aa; background: rgba(255,255,255,0.03);
            display: flex; align-items: center; gap: 5px;
        }
        .corrida-chip i { font-size: 0.62rem; opacity: 0.7; }
        .corrida-chip.forno { border-color: rgba(59,130,246,0.3); color: #60a5fa; background: rgba(59,130,246,0.06); }
        .corrida-chip.material { border-color: rgba(167,139,250,0.3); color: #a78bfa; background: rgba(167,139,250,0.06); }
        .corrida-chip.nitens { border-color: rgba(var(--color-primary-rgb),0.3); color: var(--color-primary); background: rgba(var(--color-primary-rgb),0.06); }
        .corrida-chip.sem-ficha { border-color: rgba(239,68,68,0.3); color: #f87171; background: rgba(239,68,68,0.05); }

        .corrida-toggle { color: var(--text-muted); font-size: 0.75rem; transition: transform 0.2s; }
        .corrida-card.open .corrida-toggle { transform: rotate(180deg); }

        .btn-pdf {
            margin-left: auto;
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
            color: #f87171; border-radius: 7px; padding: 5px 12px; font-size: 0.72rem;
            font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s; white-space: nowrap; font-family: 'Inter', sans-serif;
        }
        .btn-pdf:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); color: #fca5a5; }

        /* ITEMS TABLE */
        .corrida-body { display: none; border-top: 1px solid var(--border); }
        .corrida-card.open .corrida-body { display: block; }

        .item-row {
            display: grid;
            grid-template-columns: 28px 1fr auto;
            gap: 0;
            border-bottom: 1px solid var(--border);
        }
        .item-row:last-child { border-bottom: none; }

        .item-seq {
            display: flex; align-items: flex-start; justify-content: center;
            padding: 14px 0; font-size: 0.65rem; font-weight: 700;
            font-family: 'JetBrains Mono', monospace; color: #3f3f46;
            border-right: 1px solid var(--border);
        }

        .item-main { padding: 14px 18px; }
        .item-nome { font-size: 0.82rem; font-weight: 600; color: #e4e4e7; margin-bottom: 10px; line-height: 1.35; }
        .item-codigo { font-size: 0.65rem; font-family: 'JetBrains Mono', monospace; color: #52525b; margin-bottom: 8px; }

        .insumos-wrap { display: flex; flex-direction: column; gap: 8px; }

        .insumo-section-title {
            font-size: 0.58rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 5px;
            display: flex; align-items: center; gap: 5px;
        }
        .insumo-section-title i { font-size: 0.65rem; }

        .insumo-table {
            width: 100%; border-collapse: collapse; font-size: 0.73rem;
        }
        .insumo-table th {
            padding: 5px 10px; text-align: left; font-size: 0.58rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em; color: #52525b;
            border-bottom: 1px solid var(--border);
        }
        .insumo-table td {
            padding: 6px 10px; color: #d4d4d8; border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .insumo-table tr:last-child td { border-bottom: none; }
        .insumo-table td:first-child { font-weight: 600; color: #a1a1aa; }

        .tag-sem-ficha {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.68rem; color: #52525b; padding: 4px 10px;
            border: 1px dashed #27272a; border-radius: 6px;
        }

        .item-qty {
            padding: 14px 16px; display: flex; flex-direction: column;
            align-items: flex-end; gap: 4px; border-left: 1px solid var(--border);
            min-width: 80px;
        }
        .qty-val { font-size: 1.05rem; font-weight: 800; color: #fff; font-family: 'JetBrains Mono', monospace; }
        .qty-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }

        /* EMPTY / ERROR */
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 16px; display: block; opacity: 0.3; }
        .empty-state p { font-size: 0.85rem; }

        .error-msg {
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px; padding: 16px 20px; color: #f87171;
            font-size: 0.82rem; display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <!-- HEADER -->
    <div class="page-header">
        <div class="page-title-block">
            <div class="page-label">Moldagem</div>
            <div class="page-title">Insumos de Moldagem</div>
            <div class="page-sub">Luvas e machos das corridas programadas</div>
        </div>
        <div class="filter-bar">
            <div class="filter-group">
                <label>Data início</label>
                <input type="date" id="dataInicio" class="filter-input">
            </div>
            <div class="filter-group">
                <label>Data fim</label>
                <input type="date" id="dataFim" class="filter-input">
            </div>
            <div class="filter-group">
                <label>Forno</label>
                <select id="filtroForno" class="filter-input" style="min-width:100px;">
                    <option value="">Todos</option>
                    <option value="1">Forno 1</option>
                    <option value="2">Forno 2</option>
                    <option value="3">Forno 3</option>
                </select>
            </div>
            <button class="btn-buscar" onclick="buscar()">
                <i class="fa-solid fa-magnifying-glass"></i> Buscar
            </button>
        </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-strip" id="kpiStrip" style="display:none;">
        <div class="kpi-card accent">
            <div class="kpi-value" id="kpiCorridas">0</div>
            <div class="kpi-label">Corridas</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="kpiItens">0</div>
            <div class="kpi-label">Itens</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="kpiComFicha">0</div>
            <div class="kpi-label">Com ficha técnica</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="kpiSemFicha" style="color:#f87171;">0</div>
            <div class="kpi-label">Sem ficha técnica</div>
        </div>
    </div>

    <!-- STATUS -->
    <div id="statusBar"></div>

    <!-- ERROR -->
    <div id="errorMsg" class="error-msg" style="display:none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText"></span>
    </div>

    <!-- CONTENT -->
    <div id="content"></div>
</div>

<script>
    // Default dates: last 7 days
    const hoje = new Date();
    const passado = new Date(hoje);
    passado.setDate(hoje.getDate() - 7);
    document.getElementById('dataInicio').value = passado.toISOString().split('T')[0];
    document.getElementById('dataFim').value    = hoje.toISOString().split('T')[0];

    function fmtDate(iso) {
        if (!iso) return '-';
        const d = new Date(iso);
        return d.toLocaleDateString('pt-BR');
    }

    function parseMachos(str) {
        if (!str) return [];
        return str.split('\n')
            .map(l => l.trim())
            .filter(Boolean)
            .map(l => {
                const parts = l.split(' - ');
                return {
                    nome:    parts[0] ? parts[0].replace(/^MACHO\s*/i, '').trim() : '',
                    qtde:    parts[1] ? parts[1].replace(/^QTDE:\s*/i, '').trim() : '',
                    tipo:    parts[2] ? parts[2].replace(/^TIPO:\s*/i, '').trim() : '',
                    pintura: parts[3] ? parts[3].replace(/^PINTURA:\s*/i, '').trim() : '',
                };
            }).filter(m => m.nome);
    }

    function parseLuvas(str) {
        if (!str) return [];
        return str.split('\n')
            .map(l => l.trim())
            .filter(Boolean)
            .map(l => {
                const parts = l.split(' - ');
                return {
                    nome: parts[0] ? parts[0].replace(/^LUVA:\s*/i, '').trim() : '',
                    qtde: parts[1] ? parts[1].replace(/^QTDE:\s*/i, '').trim() : '',
                };
            }).filter(lv => lv.nome);
    }

    function renderLuvas(luvas) {
        if (!luvas.length) return '';
        return `
        <div>
            <div class="insumo-section-title"><i class="fa-solid fa-ring"></i> Luvas</div>
            <table class="insumo-table">
                <thead><tr>
                    <th>Luva</th><th>Qtde</th>
                </tr></thead>
                <tbody>
                    ${luvas.map(lv => `<tr>
                        <td>${lv.nome}</td>
                        <td>${lv.qtde}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>`;
    }

    function renderItem(item, idx) {
        const luvas = parseLuvas(item.detalhes_luvas);

        let insumoContent = '';
        if (!item.tem_ficha) {
            insumoContent = `<span class="tag-sem-ficha"><i class="fa-solid fa-triangle-exclamation"></i> Sem ficha técnica cadastrada</span>`;
        } else if (!luvas.length) {
            insumoContent = `<span class="tag-sem-ficha"><i class="fa-solid fa-minus"></i> Sem luvas cadastradas</span>`;
        } else {
            insumoContent = `<div class="insumos-wrap">${renderLuvas(luvas)}</div>`;
        }

        return `
        <div class="item-row">
            <div class="item-seq">${item.sequencia || idx + 1}</div>
            <div class="item-main">
                <div class="item-nome">${item.nome_pro || '—'}</div>
                <div class="item-codigo">${item.produto_pcp || ''}</div>
                ${insumoContent}
            </div>
            <div class="item-qty">
                <div class="qty-val">${item.quantidade_programada || 0}</div>
                <div class="qty-label">programado</div>
            </div>
        </div>`;
    }

    function renderCorrida(corrida, idx) {
        const fornoFiltro = document.getElementById('filtroForno').value;
        if (fornoFiltro && (corrida.forno_cor || '').trim() !== fornoFiltro) return '';

        const itens = corrida.itens || [];
        const semFicha = itens.filter(i => !i.tem_ficha).length;
        const semFichaChip = semFicha > 0
            ? `<span class="corrida-chip sem-ficha"><i class="fa-solid fa-triangle-exclamation"></i> ${semFicha} sem ficha</span>`
            : '';

        return `
        <div class="corrida-card" id="corrida-${idx}">
            <div class="corrida-header" onclick="toggleCorrida(${idx})">
                <div class="corrida-num">#${corrida.corrida_cor}</div>
                <div class="corrida-meta">
                    <span class="corrida-chip"><i class="fa-regular fa-calendar"></i> ${fmtDate(corrida.data_cor)}</span>
                    <span class="corrida-chip forno"><i class="fa-solid fa-fire-flame-curved"></i> Forno ${corrida.forno_cor || '?'}</span>
                    ${corrida.material_mat ? `<span class="corrida-chip material"><i class="fa-solid fa-flask"></i> ${corrida.material_mat}</span>` : ''}
                    <span class="corrida-chip nitens"><i class="fa-solid fa-list"></i> ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}</span>
                    ${semFichaChip}
                </div>
                <button class="btn-pdf" onclick="event.stopPropagation(); gerarPDF(${idx})">
                    <i class="fa-solid fa-file-pdf"></i> PDF
                </button>
                <i class="fa-solid fa-chevron-down corrida-toggle"></i>
            </div>
            <div class="corrida-body">
                ${itens.length ? itens.map((it, i) => renderItem(it, i)).join('') : '<div class="empty-state" style="padding:20px;"><p>Nenhum item nesta corrida.</p></div>'}
            </div>
        </div>`;
    }

    function toggleCorrida(idx) {
        const card = document.getElementById('corrida-' + idx);
        card.classList.toggle('open');
    }

    let _corridas = [];

    async function buscar() {
        const dataInicio = document.getElementById('dataInicio').value;
        const dataFim    = document.getElementById('dataFim').value;

        document.getElementById('statusBar').innerHTML = '<div class="spinner-sm"></div> Buscando corridas...';
        document.getElementById('content').innerHTML = '';
        document.getElementById('kpiStrip').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';

        try {
            const token = localStorage.getItem('erus_token') || '';
            const resp = await fetch(`/api/insumos-moldagem?dataInicio=${dataInicio}&dataFim=${dataFim}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await resp.json();

            if (!data.success) throw new Error(data.error || 'Erro desconhecido');

            _corridas = data.corridas || [];
            renderAll();

        } catch (err) {
            document.getElementById('statusBar').innerHTML = '';
            document.getElementById('errorMsg').style.display = 'flex';
            document.getElementById('errorText').textContent = 'Erro ao buscar dados: ' + err.message;
        }
    }

    function renderAll() {
        const fornoFiltro = document.getElementById('filtroForno').value;
        const corridas = fornoFiltro
            ? _corridas.filter(c => (c.forno_cor || '').trim() === fornoFiltro)
            : _corridas;

        const totalItens   = corridas.reduce((s, c) => s + c.itens.length, 0);
        const comFicha     = corridas.reduce((s, c) => s + c.itens.filter(i => i.tem_ficha).length, 0);
        const semFicha     = totalItens - comFicha;

        document.getElementById('kpiCorridas').textContent = corridas.length;
        document.getElementById('kpiItens').textContent    = totalItens;
        document.getElementById('kpiComFicha').textContent = comFicha;
        document.getElementById('kpiSemFicha').textContent = semFicha;
        document.getElementById('kpiStrip').style.display  = 'flex';

        document.getElementById('statusBar').innerHTML =
            corridas.length
                ? `${corridas.length} corridas encontradas de ${document.getElementById('dataInicio').value} a ${document.getElementById('dataFim').value}`
                : '';

        if (!corridas.length) {
            document.getElementById('content').innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-layer-group"></i>
                    <p>Nenhuma corrida programada encontrada no período selecionado.</p>
                </div>`;
            return;
        }

        document.getElementById('content').innerHTML =
            corridas.map((c) => renderCorrida(c, _corridas.indexOf(c))).filter(Boolean).join('');
    }

    function gerarPDF(idx) {
        const c = _corridas[idx];
        if (!c) return;

        function buildLuvasRows(str) {
            if (!str) return '';
            return str.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
                const p = l.split(' - ');
                const nome = p[0] ? p[0].replace(/^LUVA:\s*/i,'').trim() : '';
                const qtde = p[1] ? p[1].replace(/^QTDE:\s*/i,'').trim() : '';
                if (!nome) return '';
                return `<tr><td>${nome}</td><td>${qtde}</td></tr>`;
            }).join('');
        }

        const itensHTML = c.itens.map((item, i) => {
            const luvasRows = buildLuvasRows(item.detalhes_luvas);
            const semFicha  = !item.tem_ficha;

            const luvasTable = luvasRows ? `
                <div class="insumo-block">
                    <div class="insumo-title">LUVAS</div>
                    <table><thead><tr><th>Luva</th><th>Qtde</th></tr></thead>
                    <tbody>${luvasRows}</tbody></table>
                </div>` : '';

            const semFichaMsg = semFicha
                ? `<div class="sem-ficha">⚠ Sem ficha técnica cadastrada</div>` : '';
            const semInsumos = !semFicha && !luvasRows
                ? `<div class="sem-ficha">— Sem luvas cadastradas</div>` : '';

            return `
            <div class="item">
                <div class="item-header">
                    <span class="item-seq">${item.sequencia || i + 1}</span>
                    <span class="item-nome">${item.nome_pro || '—'}</span>
                    <span class="item-cod">${item.produto_pcp || ''}</span>
                    <span class="item-qty">Qtde: <strong>${item.quantidade_programada || 0}</strong></span>
                </div>
                ${semFichaMsg}${semInsumos}${luvasTable}
            </div>`;
        }).join('');

        const dataFmt = fmtDate(c.data_cor);
        const html = `<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Corrida ${c.corrida_cor} — Insumos de Moldagem</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: Arial, sans-serif; font-size: 11px; color: #111; background: #fff; padding: 20px; }
    .cracha { max-width: 780px; margin: 0 auto; }

    /* CABEÇALHO */
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #111; padding-bottom: 10px; margin-bottom: 14px; }
    .header-left { display: flex; flex-direction: column; gap: 2px; }
    .empresa { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #555; }
    .corrida-num { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
    .meta-row { font-size: 10px; color: #333; }
    .meta-row strong { color: #111; }
    .badge { display: inline-block; background: #111; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; }

    /* ITENS */
    .item { border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
