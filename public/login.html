<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso - Plataforma SGP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- PALETA AMARELO QUEIMADO / ÂMBAR --- */
            --color-primary: #f59e0b;       /* Amarelo Ouro */
            --color-primary-hover: #d97706; /* Laranja Queimado */
            --color-glow: rgba(245, 158, 11, 0.3);
            
            --bg-body: #0a0a0a;    /* Preto Profundo */
            --bg-card: #171717;    /* Cinza Chumbo */
            --bg-input: #262626;   /* Cinza Input */
            
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: #f59e0b;
            
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND FX --- */
        .bg-layers { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-glow {
            position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 50% -10%, rgba(217, 119, 6, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(251, 191, 36, 0.05) 0%, transparent 40%);
        }
        
        .ember {
            position: absolute; bottom: -10px; background: var(--color-primary);
            border-radius: 50%; opacity: 0; filter: blur(2px);
            animation: floatUp 8s infinite ease-in;
            box-shadow: 0 0 10px var(--color-primary);
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
        }

        /* --- LOGO EXTERNO (FORA DO CARD) --- */
        .system-branding {
            z-index: 10;
            text-align: center;
            margin-bottom: 30px; /* Distância do card */
            animation: fadeInDown 0.8s ease-out;
        }
        .brand-icon {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #fbbf24, #b45309);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.4));
            margin-bottom: 10px;
            display: inline-block;
        }
        .brand-text {
            font-size: 1.5rem; font-weight: 700; color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CARD PRINCIPAL --- */
        .login-card {
            background: var(--bg-card);
            width: 100%; max-width: 420px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative; z-index: 10;
            overflow: hidden;
            animation: cardShow 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards;
        }

        @keyframes cardShow {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- SLIDER DE FORMULÁRIOS --- */
        .forms-slider {
            display: flex;
            width: 200%;
            transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .form-page {
            width: 50%; padding: 45px 35px;
            display: flex; flex-direction: column;
        }
        .login-card.show-register .forms-slider { transform: translateX(-50%); }

        /* --- TÍTULOS INTERNOS --- */
        h2 { 
            margin: 0 0 8px 0; 
            font-size: 1.4rem; font-weight: 700; color: #fff; 
            text-align: left;
        }
        p.subtitle { 
            color: var(--text-muted); font-size: 0.9rem; 
            margin: 0 0 35px 0; text-align: left;
        }

        /* --- INPUTS E LABELS --- */
        .form-group { margin-bottom: 24px; position: relative; }
        
        label {
            display: block; 
            font-size: 0.9rem; 
            color: #d4d4d4; 
            font-weight: 500;
            margin-bottom: 12px; /* Mais espaço entre label e input */
            margin-left: 2px;
        }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        
        .input-wrapper i.field-icon { 
            position: absolute; left: 16px; 
            color: #737373; font-size: 1rem; pointer-events: none;
            transition: 0.3s;
        }
        
        input {
            width: 100%; 
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 16px 16px 48px; /* Altura confortável */
            border-radius: 10px;
            color: #fff; font-size: 1rem; font-family: inherit;
            transition: all 0.2s ease;
        }
        input::placeholder { color: #525252; font-size: 0.95rem; }

        input:focus { 
            border-color: var(--border-focus); 
            background: #2a2a2a; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15); 
        }
        input:focus + i.field-icon { color: var(--color-primary); }

        .toggle-password {
            position: absolute; right: 16px; color: #737373;
            cursor: pointer; transition: 0.3s; padding: 5px;
        }
        .toggle-password:hover { color: var(--text-main); }

        /* --- LINKS (ESQUECEU SENHA) --- */
        .forgot-pass-link {
            display: block;
            text-align: right;
            margin-top: 10px; /* Abaixo do input */
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }
        .forgot-pass-link:hover { color: var(--color-primary); text-decoration: underline; }

        /* --- BOTÃO (Amarelo Queimado) --- */
        button {
            width: 100%; padding: 16px; border: none; border-radius: 10px;
            /* Gradiente Amarelo/Laranja */
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.5); 
            filter: brightness(1.1);
        }
        button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* --- RODAPÉ --- */
        .toggle-text { 
            margin-top: 30px; text-align: center; 
            font-size: 0.9rem; color: #737373; 
        }
        .toggle-text span { 
            color: var(--color-primary); cursor: pointer; 
            font-weight: 600; margin-left: 5px; transition: 0.2s;
        }
        .toggle-text span:hover { color: #fbbf24; text-decoration: underline; }

        /* --- TOAST --- */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .toast {
            background: #1f1f1f;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px; border-radius: 12px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 300px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--error); }
        .toast i { font-size: 1.2rem; }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--error); }
        .toast-content div:first-child { font-weight: 700; font-size: 0.95rem; color: #fff; margin-bottom: 2px; }
        .toast-content div:last-child { font-size: 0.85rem; color: #a3a3a3; }

        .spinner {
            width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.2);
            border-radius: 50%; border-top-color: #000;
            animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Fundo Animado (Brasas/Âmbar) -->
    <div class="bg-layers">
        <div class="bg-glow"></div>
        <div id="particleField"></div>
    </div>

    <!-- LOGO DO SISTEMA (FORA DO CARD) -->
    <div class="system-branding">
        <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
        <div class="brand-text">SGP ERUS</div>
    </div>

    <div class="login-card" id="mainCard">
        <div class="forms-slider">
            
            <!-- FORMULÁRIO DE LOGIN -->
            <div class="form-page" id="loginPage">
                <h2>Bem-vindo de volta</h2>
                <p class="subtitle">Insira suas credenciais para acessar.</p>

                <!-- autocomplete="off" para evitar sugestões -->
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label>Usuário</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user field-icon"></i>
                            <input type="text" id="loginUser" placeholder="Seu usuário de acesso" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="off" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('loginPass', this)"></i>
                        </div>
                        <!-- Link ESQUECEU abaixo da caixa de texto -->
                        <a class="forgot-pass-link" onclick="notify('Recuperação', 'Contate o administrador do sistema.')">Esqueceu sua senha?</a>
                    </div>

                    <button type="submit" id="btnLogin">
                        <span id="txtLogin">Acessar Sistema</span>
                        <div class="spinner" id="spinLogin"></div>
                    </button>

                    <div class="toggle-text">
                        Não tem acesso? <span onclick="switchMode('register')">Solicitar Cadastro</span>
                    </div>
                </form>
            </div>

            <!-- FORMULÁRIO DE REGISTRO -->
            <div class="form-page" id="registerPage">
                <h2>Nova Conta</h2>
                <p class="subtitle">Preencha os dados para solicitação.</p>

                <form id="registerForm" autocomplete="off">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-badge field-icon"></i>
                            <input type="text" id="regName" placeholder="Ex: João Silva" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Usuário</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-at field-icon"></i>
                            <input type="text" id="regUser" placeholder="Ex: joao.silva" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-key field-icon"></i>
                            <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-check-circle field-icon"></i>
                            <input type="password" id="regPassConfirm" placeholder="Repita a senha" autocomplete="off" required>
                        </div>
                    </div>

                    <button type="submit" id="btnReg">
                        <span id="txtReg">Criar Conta</span>
                        <div class="spinner" id="spinReg"></div>
                    </button>

                    <div class="toggle-text">
                        Já possui conta? <span onclick="switchMode('login')">Voltar ao Login</span>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container">
        <div id="mainToast" class="toast">
            <i id="toastIcon" class="fa-solid"></i>
            <div class="toast-content">
                <div id="toastTitle"></div>
                <div id="toastMsg"></div>
            </div>
        </div>
    </div>

    <script>
        // --- EFEITO DE PARTICULAS (AMBAR) ---
        function initParticles() {
            const field = document.getElementById('particleField');
            for(let i=0; i<25; i++) {
                const e = document.createElement('div');
                e.className = 'ember';
                const size = Math.random() * 4 + 2;
                e.style.width = size + 'px';
                e.style.height = size + 'px';
                e.style.left = Math.random() * 100 + '%';
                e.style.animationDelay = Math.random() * 5 + 's';
                e.style.animationDuration = (Math.random() * 3 + 5) + 's';
                field.appendChild(e);
            }
        }
        initParticles();

        // --- VISIBILIDADE DE SENHA ---
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // --- ALTERNAR FORMULARIOS ---
        function switchMode(mode) {
            const card = document.getElementById('mainCard');
            // Limpar formulários ao trocar para evitar confusão visual
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            
            if(mode === 'register') {
                card.classList.add('show-register');
            } else {
                card.classList.remove('show-register');
            }
        }

        // --- SISTEMA DE NOTIFICAÇÃO ---
        function notify(title, msg, type = 'success') {
            const toast = document.getElementById('mainToast');
            const icon = document.getElementById('toastIcon');
            
            toast.className = `toast ${type} show`;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            
            icon.className = type === 'success' 
                ? 'fa-solid fa-circle-check' 
                : 'fa-solid fa-triangle-exclamation';

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- LOGIN LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const spin = document.getElementById('spinLogin');
            const txt = document.getElementById('txtLogin');

            btn.disabled = true;
            spin.style.display = 'block';
            txt.style.display = 'none';

            try {
                // Mock API Call
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const data = await res.json();

                if(data.success) {
                    notify('Sucesso!', 'Acesso autorizado. Carregando...');
                    
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_user', data.name || user);
                    localStorage.setItem('erus_role', data.role || 'Visitante');
                    localStorage.setItem('erus_last_activity', Date.now().toString());
                    
                    setTimeout(() => window.location.replace('index.html'), 1500);
                } else {
                    notify('Acesso Negado', data.message || 'Credenciais inválidas.', 'error');
                    btn.disabled = false;
                    spin.style.display = 'none';
                    txt.style.display = 'block';
                }
            } catch(err) {
                console.error(err);
                notify('Erro de Conexão', 'Servidor indisponível no momento.', 'error');
                
                // Remover em produção (Apenas para destravar a UI se a API não existir)
                btn.disabled = false;
                spin.style.display = 'none';
                txt.style.display = 'block';
            }
        });

        // --- REGISTRO LOGIC ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('regPassConfirm').value;
            
            const btn = document.getElementById('btnReg');
            const spin = document.getElementById('spinReg');
            const txt = document.getElementById('txtReg');

            if(pass !== confirm) {
                notify('Erro de Validação', 'As senhas não coincidem.', 'error');
                return;
            }

            btn.disabled = true;
            spin.style.display = 'block';
            txt.style.display = 'none';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: name, user, pass })
                });
                const data = await res.json();

                if(data.success) {
                    notify('Conta Criada!', 'Seu cadastro foi realizado com sucesso.');
                    setTimeout(() => {
                        switchMode('login');
                        document.getElementById('loginUser').value = user;
                    }, 2000);
                } else {
                    notify('Falha no Cadastro', data.message || 'Erro ao criar conta.', 'error');
                }
            } catch(err) {
                notify('Erro', 'Falha na comunicação com o servidor.', 'error');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                txt.style.display = 'block';
            }
        });
    </script>
</body>
</html>
