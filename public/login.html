<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #fbbf24;
            --color-primary-dim: #ea580c;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.8);
            --text-main: #f4f4f5;
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at center, rgba(234, 88, 12, 0.08), transparent 70%);
            height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-main);
        }

        .login-card {
            background: var(--bg-card); padding: 40px; border-radius: 16px;
            border: 1px solid var(--border-subtle); width: 100%; max-width: 400px;
            backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .brand-icon {
            width: 60px; height: 60px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; color: #000; font-size: 1.8rem; box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        h2 { margin-bottom: 8px; font-weight: 700; }
        p { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: #a1a1aa; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #52525b; }
        
        input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-subtle);
            padding: 12px 12px 12px 40px; border-radius: 8px; color: #fff; font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--color-primary); background: rgba(0,0,0,0.5); }

        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(to right, var(--color-primary), var(--color-primary-dim));
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(234, 88, 12, 0.3); }
        button:active { transform: translateY(0); }

        #error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h2>Acesso Restrito</h2>
        <p>Fundição Erus - Gestão de Processos</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuário</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Digite seu usuário" required>
                </div>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" id="btnEntrar">ENTRAR NO SISTEMA</button>
            <div id="error-msg">Usuário ou senha incorretos.</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnEntrar');
            const error = document.getElementById('error-msg');

            btn.innerText = "VALIDANDO...";
            error.style.display = "none";

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });

                const data = await res.json();

                if (data.success) {
                    // Limpa tudo antes de começar a nova sessão
                    localStorage.clear();
                    
                    // Define as chaves de acesso
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_last_activity', Date.now().toString());
                    
                    // Redireciona para o index
                    window.location.replace('index.html');
                } else {
                    error.style.display = "block";
                    btn.innerText = "ENTRAR NO SISTEMA";
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
                btn.innerText = "ENTRAR NO SISTEMA";
            }
        });
    </script>
</body>
</html>
