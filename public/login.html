<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #fbbf24;
            --color-primary-dim: #ea580c;
            --bg-body: #050505;
            --bg-card: rgba(15, 15, 18, 0.8);
            --text-main: #f4f4f5;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(234, 88, 12, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden; /* Remove barra de rolagem */
            position: relative;
        }

        /* Efeito de Brasas (Embers) */
        .embers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .ember {
            position: absolute;
            bottom: -10px;
            background: var(--color-primary);
            border-radius: 50%;
            opacity: 0;
            filter: blur(1px);
            animation: rise 5s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }

        /* Background Dinâmico */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 10%, rgba(234, 88, 12, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(251, 191, 36, 0.05) 0%, transparent 40%);
            z-index: 1;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--border-subtle);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardEntrance 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: #000;
            font-size: 2rem;
            position: relative;
            box-shadow: 0 0 30px rgba(234, 88, 12, 0.4);
        }

        .brand-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--color-primary), transparent);
            border-radius: 22px;
            z-index: -1;
            opacity: 0.5;
        }

        h2 {
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to bottom, #fff 30%, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #71717a;
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 22px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.7rem;
            color: #71717a;
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding-left: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #3f3f46;
            transition: all 0.3s ease;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 15px 15px 48px;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        input:focus {
            border-color: var(--color-primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1);
        }

        input:focus + i {
            color: var(--color-primary);
            transform: scale(1.1);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            color: #000;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        /* Efeito Shimmer no Botão */
        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(234, 88, 12, 0.4);
        }

        button:active { transform: translateY(-1px); }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .msg-box {
            font-size: 0.85rem;
            margin-top: 20px;
            display: none;
            padding: 12px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .error { color: #fda4af; background: rgba(159, 18, 57, 0.2); border: 1px solid rgba(225, 29, 72, 0.2); }
        .success { color: #86efac; background: rgba(20, 83, 45, 0.2); border: 1px solid rgba(34, 197, 94, 0.2); }

        .toggle-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #71717a;
        }

        .toggle-text span {
            color: var(--color-primary);
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .toggle-text span:hover {
            text-shadow: 0 0 10px var(--color-primary);
        }

        #registerContainer { display: none; }

        /* Estilização para o Autofill */
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #121214 inset !important;
            -webkit-text-fill-color: #fff !important;
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-glow"></div>
    <div class="embers" id="emberContainer"></div>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-fire-burner"></i>
        </div>
        
        <!-- LOGIN SECTION -->
        <div id="loginContainer">
            <h2>Acesso Restrito</h2>
            <p>Portal Interno Fundição Erus</p>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>ID Usuário</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-hashtag"></i>
                        <input type="text" id="loginUser" placeholder="Seu usuário" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha de Acesso</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="loginPass" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="btnLogin">
                    <span id="txtLogin">AUTENTICAR</span>
                    <div class="spinner" id="spinLogin"></div>
                </button>
                
                <div id="loginMsg" class="msg-box"></div>

                <div class="toggle-text">
                    Novo operador? <span onclick="toggleMode()">Solicitar Acesso</span>
                </div>
            </form>
        </div>

        <!-- REGISTER SECTION -->
        <div id="registerContainer">
            <h2>Novo Registro</h2>
            <p>Cadastre sua credencial operacional</p>

            <form id="registerForm" autocomplete="off">
                <div class="form-group">
                    <label>Nome do Colaborador</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user-gear"></i>
                        <input type="text" id="regName" placeholder="Nome Completo" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Usuário para Login</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-address-card"></i>
                        <input type="text" id="regUser" placeholder="Ex: joao.silva" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Definir Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" required>
                    </div>
                </div>

                <button type="submit" id="btnReg">
                    <span id="txtReg">CRIAR CONTA</span>
                    <div class="spinner" id="spinReg"></div>
                </button>
                
                <div id="regMsg" class="msg-box"></div>

                <div class="toggle-text">
                    Já tem conta? <span onclick="toggleMode()">Voltar ao Login</span>
                </div>
            </form>
        </div>

        <div style="margin-top: 30px; font-size: 0.7rem; color: #3f3f46; letter-spacing: 0.05em;">
            <i class="fa-solid fa-lock" style="color: var(--color-primary-dim);"></i> SISTEMA DE SEGURANÇA END-TO-END
        </div>
    </div>

    <script>
        // --- ANIMAÇÃO DE BRASAS ---
        function createEmbers() {
            const container = document.getElementById('emberContainer');
            const count = 35;
            for (let i = 0; i < count; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                const size = Math.random() * 4 + 1;
                const left = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = Math.random() * 3 + 4;
                
                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${left}%`;
                ember.style.animationDelay = `${delay}s`;
                ember.style.animationDuration = `${duration}s`;
                
                container.appendChild(ember);
            }
        }
        createEmbers();

        // --- LÓGICA DE INTERFACE ---
        const loginContainer = document.getElementById('loginContainer');
        const registerContainer = document.getElementById('registerContainer');

        function toggleMode() {
            document.querySelectorAll('.msg-box').forEach(box => box.style.display = 'none');
            
            if (loginContainer.style.display === 'none') {
                registerContainer.style.opacity = '0';
                setTimeout(() => {
                    registerContainer.style.display = 'none';
                    loginContainer.style.display = 'block';
                    loginContainer.style.animation = 'slideIn 0.5s ease forwards';
                }, 300);
            } else {
                loginContainer.style.opacity = '0';
                setTimeout(() => {
                    loginContainer.style.display = 'none';
                    registerContainer.style.display = 'block';
                    registerContainer.style.animation = 'slideIn 0.5s ease forwards';
                }, 300);
            }
        }

        function setLoading(isLoading, btn, txtSpan, spinner, text) {
            btn.disabled = isLoading;
            txtSpan.innerText = text;
            spinner.style.display = isLoading ? 'block' : 'none';
            btn.style.opacity = isLoading ? '0.8' : '1';
        }

        function showMsg(element, text, type) {
            element.innerHTML = type === 'error' 
                ? `<i class="fa-solid fa-triangle-exclamation"></i> ${text}` 
                : `<i class="fa-solid fa-circle-check"></i> ${text}`;
            element.className = `msg-box ${type}`;
            element.style.display = 'block';
        }

        // --- SUBMISSÃO LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const txt = document.getElementById('txtLogin');
            const spin = document.getElementById('spinLogin');
            const msg = document.getElementById('loginMsg');

            setLoading(true, btn, txt, spin, "VERIFICANDO...");
            msg.style.display = 'none';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                
                const data = await res.json();

                if (data.success) {
                    localStorage.clear();
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_role', data.role || 'padrao'); 
                    localStorage.setItem('erus_user', data.name || user);
                    localStorage.setItem('erus_last_activity', Date.now().toString());
                    
                    showMsg(msg, "Acesso autorizado. Redirecionando...", "success");
                    setTimeout(() => window.location.replace('index.html'), 800);
                } else {
                    showMsg(msg, data.message || "Credenciais inválidas.", "error");
                }
            } catch (err) {
                showMsg(msg, "Servidor indisponível no momento.", "error");
            } finally {
                setLoading(false, btn, txt, spin, "AUTENTICAR");
            }
        });

        // --- SUBMISSÃO REGISTRO ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const btn = document.getElementById('btnReg');
            const txt = document.getElementById('txtReg');
            const spin = document.getElementById('spinReg');
            const msg = document.getElementById('regMsg');

            setLoading(true, btn, txt, spin, "PROCESSANDO...");
            msg.style.display = 'none';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, user, pass })
                });

                const data = await res.json();

                if (data.success) {
                    showMsg(msg, "Conta solicitada com sucesso!", "success");
                    setTimeout(() => {
                        toggleMode(); 
                        document.getElementById('loginUser').value = user;
                        showMsg(document.getElementById('loginMsg'), "Conta criada. Digite sua senha.", "success");
                    }, 1500);
                } else {
                    showMsg(msg, data.message || "Falha ao registrar.", "error");
                }
            } catch (err) {
                showMsg(msg, "Erro de conexão com a rede.", "error");
            } finally {
                setLoading(false, btn, txt, spin, "CRIAR CONTA");
            }
        });
    </script>
</body>
</html>
