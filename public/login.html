<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso Restrito - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #fbbf24;
            --color-primary-dim: #ea580c;
            --bg-body: #050505;
            --bg-card: rgba(18, 18, 22, 0.75);
            --text-main: #f4f4f5;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            overflow: hidden; /* Garantia total sem scroll */
            position: relative;
        }

        /* --- ANIMAÇÕES DE FUNDO --- */
        .bg-layers { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
        .bg-glow {
            position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 15% 15%, rgba(234, 88, 12, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(251, 191, 36, 0.08) 0%, transparent 40%);
        }
        .ember {
            position: absolute; bottom: -10px; background: var(--color-primary);
            border-radius: 50%; opacity: 0; filter: blur(1px);
            animation: rise 6s infinite ease-in;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }

        /* --- CARD PRINCIPAL --- */
        .login-card {
            background: var(--bg-card);
            width: 100%; max-width: 420px;
            border-radius: 28px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
            position: relative; z-index: 10;
            overflow: hidden; /* Para a transição dos forms */
            animation: cardShow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardShow {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- CONTAINER DE TRANSIÇÃO --- */
        .forms-slider {
            display: flex;
            width: 200%; /* Dois forms lado a lado */
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .form-page {
            width: 50%; padding: 40px;
            display: flex; flex-direction: column;
        }

        .login-card.show-register .forms-slider { transform: translateX(-50%); }

        /* --- ELEMENTOS DE UI --- */
        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; color: #000; font-size: 1.8rem;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
        }

        h2 { margin: 0; font-size: 1.6rem; font-weight: 700; text-align: center; color: #fff; }
        p.subtitle { text-align: center; color: #71717a; font-size: 0.9rem; margin: 8px 0 32px 0; }

        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 0.75rem; color: #a1a1aa; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.field-icon { position: absolute; left: 16px; color: #52525b; transition: 0.3s; }
        
        input {
            width: 100%; background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 45px 14px 46px; border-radius: 14px;
            color: #fff; font-size: 0.95rem; font-family: inherit;
            transition: all 0.3s;
        }

        input:focus { border-color: var(--color-primary); background: rgba(0,0,0,0.4); outline: none; box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1); }
        input:focus + i.field-icon { color: var(--color-primary); }

        .toggle-password {
            position: absolute; right: 16px; color: #52525b;
            cursor: pointer; transition: 0.3s; padding: 5px;
        }
        .toggle-password:hover { color: var(--color-primary); }

        button {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(234, 88, 12, 0.3); filter: brightness(1.1); }
        button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .toggle-text { margin-top: 25px; text-align: center; font-size: 0.85rem; color: #71717a; }
        .toggle-text span { color: var(--color-primary); cursor: pointer; font-weight: 700; text-decoration: none; }
        .toggle-text span:hover { text-decoration: underline; }

        /* --- TOAST NOTIFICATION --- */
        #toast-container {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
        }
        .toast {
            background: rgba(18, 18, 22, 0.9);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(15px);
            padding: 16px 24px; border-radius: 16px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 300px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--error); }
        .toast i { font-size: 1.2rem; }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--error); }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
        .toast-msg { font-size: 0.8rem; color: #a1a1aa; }

        .spinner {
            width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%; border-top-color: #000;
            animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="bg-layers">
        <div class="bg-glow"></div>
        <div id="emberField"></div>
    </div>

    <div class="login-card" id="mainCard">
        <div class="forms-slider">
            
            <!-- FORMULÁRIO DE LOGIN -->
            <div class="form-page" id="loginPage">
                <div class="brand-icon"><i class="fa-solid fa-fire-burner"></i></div>
                <h2>Acesso Erus</h2>
                <p class="subtitle">Gestão de Fundição de Alta Precisão</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Usuário</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user field-icon"></i>
                            <input type="text" id="loginUser" placeholder="Seu ID de acesso" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input type="password" id="loginPass" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('loginPass', this)"></i>
                        </div>
                    </div>

                    <button type="submit" id="btnLogin">
                        <span id="txtLogin">ENTRAR NO SISTEMA</span>
                        <div class="spinner" id="spinLogin"></div>
                    </button>

                    <div class="toggle-text">
                        Não tem acesso? <span onclick="switchMode('register')">Solicitar Registro</span>
                    </div>
                </form>
            </div>

            <!-- FORMULÁRIO DE REGISTRO -->
            <div class="form-page" id="registerPage">
                <div class="brand-icon"><i class="fa-solid fa-user-plus"></i></div>
                <h2>Novo Colaborador</h2>
                <p class="subtitle">Crie sua conta para começar</p>

                <form id="registerForm">
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-badge field-icon"></i>
                            <input type="text" id="regName" placeholder="Ex: João Silva" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Usuário</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-at field-icon"></i>
                            <input type="text" id="regUser" placeholder="Ex: joao.silva" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-key field-icon"></i>
                            <input type="password" id="regPass" placeholder="Mín. 6 dígitos" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('regPass', this)"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-circle-check field-icon"></i>
                            <input type="password" id="regPassConfirm" placeholder="Repita a senha" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('regPassConfirm', this)"></i>
                        </div>
                    </div>

                    <button type="submit" id="btnReg">
                        <span id="txtReg">CRIAR CONTA</span>
                        <div class="spinner" id="spinReg"></div>
                    </button>

                    <div class="toggle-text">
                        Já possui conta? <span onclick="switchMode('login')">Voltar ao Login</span>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- SISTEMA DE TOAST -->
    <div id="toast-container">
        <div id="mainToast" class="toast">
            <i id="toastIcon" class="fa-solid"></i>
            <div class="toast-content">
                <div id="toastTitle" class="toast-title"></div>
                <div id="toastMsg" class="toast-msg"></div>
            </div>
        </div>
    </div>

    <script>
        // --- ANIMAÇÃO DE BRASAS ---
        function initEmbers() {
            const field = document.getElementById('emberField');
            for(let i=0; i<30; i++) {
                const e = document.createElement('div');
                e.className = 'ember';
                const size = Math.random() * 4 + 2;
                e.style.width = size + 'px';
                e.style.height = size + 'px';
                e.style.left = Math.random() * 100 + '%';
                e.style.animationDelay = Math.random() * 5 + 's';
                e.style.animationDuration = (Math.random() * 3 + 4) + 's';
                field.appendChild(e);
            }
        }
        initEmbers();

        // --- VISIBILIDADE DE SENHA ---
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // --- TRANSIÇÃO PROFISSIONAL ---
        function switchMode(mode) {
            const card = document.getElementById('mainCard');
            if(mode === 'register') {
                card.classList.add('show-register');
            } else {
                card.classList.remove('show-register');
            }
        }

        // --- SISTEMA DE TOAST (POPUP) ---
        function notify(title, msg, type = 'success') {
            const toast = document.getElementById('mainToast');
            const icon = document.getElementById('toastIcon');
            
            toast.className = `toast ${type} show`;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            
            icon.className = type === 'success' 
                ? 'fa-solid fa-circle-check' 
                : 'fa-solid fa-triangle-exclamation';

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- LÓGICA DE LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const spin = document.getElementById('spinLogin');
            const txt = document.getElementById('txtLogin');

            btn.disabled = true;
            spin.style.display = 'block';
            txt.innerText = 'AUTENTICANDO...';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const data = await res.json();

                if(data.success) {
                    notify('Sucesso!', 'Acesso autorizado. Iniciando sessão...');
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_user', data.name || user);
                    localStorage.setItem('erus_last_activity', Date.now().toString());
                    setTimeout(() => window.location.replace('index.html'), 1500);
                } else {
                    notify('Falha no Acesso', data.message || 'Usuário ou senha incorretos.', 'error');
                }
            } catch(err) {
                notify('Erro de Conexão', 'Não foi possível contatar o servidor.', 'error');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                txt.innerText = 'ENTRAR NO SISTEMA';
            }
        });

        // --- LÓGICA DE REGISTRO ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('regPassConfirm').value;
            const btn = document.getElementById('btnReg');
            const spin = document.getElementById('spinReg');
            const txt = document.getElementById('txtReg');

            // Validação de Senha
            if(pass !== confirm) {
                notify('Erro de Validação', 'As senhas não coincidem.', 'error');
                return;
            }

            btn.disabled = true;
            spin.style.display = 'block';
            txt.innerText = 'PROCESSANDO...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: name, user, pass })
                });
                const data = await res.json();

                if(data.success) {
                    notify('Conta Criada!', 'Seu acesso foi registrado com sucesso.');
                    setTimeout(() => {
                        switchMode('login');
                        document.getElementById('loginUser').value = user;
                    }, 2000);
                } else {
                    notify('Erro no Cadastro', data.message || 'Tente outro nome de usuário.', 'error');
                }
            } catch(err) {
                notify('Erro de Rede', 'Verifique sua conexão e tente novamente.', 'error');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                txt.innerText = 'CRIAR CONTA';
            }
        });
    </script>
</body>
</html>
