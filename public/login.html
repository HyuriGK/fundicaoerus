<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acesso - Plataforma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta baseada na imagem (Roxo/Azul Neon) */
            --color-primary: #a855f7; /* Roxo vibrante */
            --color-primary-dim: #6366f1; /* Azul índigo */
            --color-accent: #d946ef; /* Magenta para detalhes */
            
            --bg-body: #09090b; /* Fundo quase preto */
            --bg-card: #18181b; /* Cinza muito escuro para o card */
            --bg-input: #27272a; /* Fundo dos inputs */
            
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-focus: #a855f7;
            
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* --- FUNDO COM GLOW ROXO (Baseado na imagem) --- */
        .bg-layers { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-glow {
            position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 50% -20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 90%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
        }
        
        /* Partículas sutis */
        .particle {
            position: absolute; bottom: -10px; background: var(--color-primary);
            border-radius: 50%; opacity: 0; filter: blur(2px);
            animation: floatUp 8s infinite ease-in;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.4; }
            100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
        }

        /* --- CARD PRINCIPAL --- */
        .login-card {
            background: var(--bg-card);
            width: 100%; max-width: 400px; /* Largura conforme imagem */
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 20px 60px -10px rgba(0,0,0,0.6);
            position: relative; z-index: 10;
            overflow: hidden;
            animation: cardShow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardShow {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- SLIDER DE FORMULÁRIOS (Logica mantida) --- */
        .forms-slider {
            display: flex;
            width: 200%;
            transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .form-page {
            width: 50%; padding: 40px 32px;
            display: flex; flex-direction: column;
        }
        .login-card.show-register .forms-slider { transform: translateX(-50%); }

        /* --- HEADER E LOGO --- */
        .logo-area {
            text-align: center; margin-bottom: 24px;
        }
        .brand-logo {
            width: 50px; height: 50px; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            /* Logo com gradiente igual da imagem */
            background: linear-gradient(135deg, #3b82f6, #a855f7, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.3));
        }

        h2 { margin: 0; font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin: 8px 0 0 0; }

        /* --- INPUTS E LABELS --- */
        .form-group { margin-bottom: 20px; }
        
        .label-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        
        label {
            display: block; font-size: 0.85rem; color: #e4e4e7; 
            font-weight: 500;
        }

        a.forgot-pass {
            font-size: 0.75rem; color: var(--color-primary);
            text-decoration: none; font-weight: 600;
            transition: 0.2s; cursor: pointer;
        }
        a.forgot-pass:hover { color: var(--color-accent); }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        
        /* Ícones dentro do input conforme imagem */
        .input-wrapper i.field-icon { 
            position: absolute; left: 16px; 
            color: #71717a; font-size: 0.9rem; pointer-events: none;
            transition: 0.3s;
        }
        
        input {
            width: 100%; 
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 16px 14px 42px; /* Espaço para o ícone */
            border-radius: 12px;
            color: #fff; font-size: 0.95rem; font-family: inherit;
            transition: all 0.2s ease;
        }
        input::placeholder { color: #52525b; }

        input:focus { 
            border-color: var(--border-focus); 
            background: #202023; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15); 
        }
        input:focus + i.field-icon { color: var(--color-primary); }

        .toggle-password {
            position: absolute; right: 16px; color: #71717a;
            cursor: pointer; transition: 0.3s; font-size: 0.9rem;
        }
        .toggle-password:hover { color: var(--text-main); }

        /* --- BOTÃO (Gradiente Roxo) --- */
        button {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            /* Gradiente Roxo -> Azul */
            background: linear-gradient(90deg, #d946ef, #8b5cf6, #6366f1);
            background-size: 200% auto;
            color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: all 0.4s ease; margin-top: 8px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        button:hover { 
            background-position: right center;
            transform: translateY(-1px); 
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4); 
        }
        button:disabled { opacity: 0.7; cursor: wait; transform: none; }

        /* --- LINKS DE RODAPÉ --- */
        .toggle-text { 
            margin-top: 24px; text-align: center; 
            font-size: 0.85rem; color: #71717a; 
        }
        .toggle-text span { 
            color: var(--color-primary); cursor: pointer; 
            font-weight: 600; margin-left: 4px; transition: 0.2s;
        }
        .toggle-text span:hover { color: var(--color-accent); text-decoration: underline; }

        /* --- TOAST --- */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .toast {
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(10px);
            padding: 16px 20px; border-radius: 12px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 280px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--error); }
        .toast i { font-size: 1.1rem; }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--error); }
        .toast-content div:first-child { font-weight: 600; font-size: 0.9rem; color: #fff; }
        .toast-content div:last-child { font-size: 0.8rem; color: #a1a1aa; margin-top: 2px; }

        /* Spinner do Botão */
        .spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Fundo Animado (Estilo Roxo/Cosmic) -->
    <div class="bg-layers">
        <div class="bg-glow"></div>
        <div id="particleField"></div>
    </div>

    <div class="login-card" id="mainCard">
        <div class="forms-slider">
            
            <!-- FORMULÁRIO DE LOGIN (Estilo da Imagem) -->
            <div class="form-page" id="loginPage">
                <div class="logo-area">
                    <!-- Ícone abstrato para parecer com o logo da imagem -->
                    <div class="brand-logo"><i class="fa-solid fa-infinity"></i></div>
                    <h2>Bem-vindo de volta</h2>
                    <p class="subtitle">Continue sua jornada de produtividade</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Usuário</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user field-icon"></i>
                            <input type="text" id="loginUser" placeholder="Seu usuário de acesso" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label>Senha</label>
                            <a class="forgot-pass" onclick="notify('Recuperação', 'Contate o admin para resetar sua senha.')">Esqueceu? &rarr;</a>
                        </div>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input type="password" id="loginPass" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('loginPass', this)"></i>
                        </div>
                    </div>

                    <button type="submit" id="btnLogin">
                        <span id="txtLogin">Entrar</span>
                        <i class="fa-solid fa-arrow-right" style="font-size: 0.8rem;" id="iconLogin"></i>
                        <div class="spinner" id="spinLogin"></div>
                    </button>

                    <div class="toggle-text">
                        Novo por aqui? <span onclick="switchMode('register')">Criar conta gratuita &rarr;</span>
                    </div>
                </form>
            </div>

            <!-- FORMULÁRIO DE REGISTRO -->
            <div class="form-page" id="registerPage">
                <div class="logo-area">
                    <div class="brand-logo"><i class="fa-solid fa-user-plus"></i></div>
                    <h2>Criar Conta</h2>
                    <p class="subtitle">Junte-se a nós hoje mesmo</p>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-card field-icon"></i>
                            <input type="text" id="regName" placeholder="Ex: João Silva" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Usuário</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-at field-icon"></i>
                            <input type="text" id="regUser" placeholder="Ex: joao.silva" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-key field-icon"></i>
                            <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-check-circle field-icon"></i>
                            <input type="password" id="regPassConfirm" placeholder="Repita a senha" required>
                        </div>
                    </div>

                    <button type="submit" id="btnReg">
                        <span id="txtReg">Cadastrar</span>
                        <div class="spinner" id="spinReg"></div>
                    </button>

                    <div class="toggle-text">
                        Já tem uma conta? <span onclick="switchMode('login')">Fazer Login</span>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container">
        <div id="mainToast" class="toast">
            <i id="toastIcon" class="fa-solid"></i>
            <div class="toast-content">
                <div id="toastTitle"></div>
                <div id="toastMsg"></div>
            </div>
        </div>
    </div>

    <script>
        // --- EFEITO DE PARTÍCULAS (Revisado para o tema) ---
        function initParticles() {
            const field = document.getElementById('particleField');
            for(let i=0; i<20; i++) {
                const e = document.createElement('div');
                e.className = 'particle';
                const size = Math.random() * 3 + 2;
                e.style.width = size + 'px';
                e.style.height = size + 'px';
                e.style.left = Math.random() * 100 + '%';
                e.style.animationDelay = Math.random() * 5 + 's';
                e.style.animationDuration = (Math.random() * 4 + 6) + 's';
                field.appendChild(e);
            }
        }
        initParticles();

        // --- VISIBILIDADE DE SENHA ---
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // --- ALTERNAR ENTRE LOGIN E REGISTRO ---
        function switchMode(mode) {
            const card = document.getElementById('mainCard');
            if(mode === 'register') {
                card.classList.add('show-register');
            } else {
                card.classList.remove('show-register');
            }
        }

        // --- NOTIFICAÇÕES TOAST ---
        function notify(title, msg, type = 'success') {
            const toast = document.getElementById('mainToast');
            const icon = document.getElementById('toastIcon');
            
            toast.className = `toast ${type} show`;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            
            icon.className = type === 'success' 
                ? 'fa-solid fa-check-circle' 
                : 'fa-solid fa-triangle-exclamation';

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- LÓGICA DE LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const spin = document.getElementById('spinLogin');
            const txt = document.getElementById('txtLogin');
            const icon = document.getElementById('iconLogin');

            // UI Loading
            btn.disabled = true;
            spin.style.display = 'block';
            txt.style.display = 'none';
            if(icon) icon.style.display = 'none';

            try {
                // Simulação de delay de rede para UX
                // Substitua '/api/auth' pela sua rota real
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const data = await res.json();

                if(data.success) {
                    notify('Sucesso', 'Bem-vindo de volta! Redirecionando...');
                    
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_user', data.name || user);
                    localStorage.setItem('erus_role', data.role || 'Visitante');
                    localStorage.setItem('erus_last_activity', Date.now().toString());
                    
                    setTimeout(() => window.location.replace('index.html'), 1500);
                } else {
                    notify('Acesso Negado', data.message || 'Usuário ou senha incorretos.', 'error');
                    btn.disabled = false;
                    spin.style.display = 'none';
                    txt.style.display = 'block';
                    if(icon) icon.style.display = 'block';
                }
            } catch(err) {
                // Fallback para teste visual caso não tenha backend rodando
                console.error(err);
                notify('Erro de Conexão', 'Não foi possível conectar ao servidor.', 'error');
                
                // Remover isto em produção:
                btn.disabled = false;
                spin.style.display = 'none';
                txt.style.display = 'block';
                if(icon) icon.style.display = 'block';
            }
        });

        // --- LÓGICA DE REGISTRO ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('regPassConfirm').value;
            
            const btn = document.getElementById('btnReg');
            const spin = document.getElementById('spinReg');
            const txt = document.getElementById('txtReg');

            if(pass !== confirm) {
                notify('Atenção', 'As senhas digitadas não coincidem.', 'error');
                return;
            }

            btn.disabled = true;
            spin.style.display = 'block';
            txt.style.display = 'none';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: name, user, pass })
                });
                const data = await res.json();

                if(data.success) {
                    notify('Conta Criada', 'Cadastro realizado com sucesso!');
                    setTimeout(() => {
                        switchMode('login');
                        document.getElementById('loginUser').value = user;
                        // Reset form
                        document.getElementById('registerForm').reset();
                    }, 2000);
                } else {
                    notify('Erro', data.message || 'Não foi possível criar a conta.', 'error');
                }
            } catch(err) {
                notify('Erro', 'Falha na comunicação com o servidor.', 'error');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                txt.style.display = 'block';
            }
        });
    </script>
</body>
</html>
