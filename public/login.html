<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #fbbf24;
            --color-primary-dim: #ea580c;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.85);
            --text-main: #f4f4f5;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --accent-glow: rgba(234, 88, 12, 0.15);
        }

        /* Animação de Entrada */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 0 35px rgba(251, 191, 36, 0.4); }
            100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
        }

        body {
            margin: 0; 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            /* Background Dinâmico e Profundo */
            background-image: 
                radial-gradient(circle at 20% 20%, var(--accent-glow), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.05), transparent 40%),
                radial-gradient(circle at center, rgba(234, 88, 12, 0.08), transparent 70%);
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-main);
            overflow: hidden;
        }

        /* Efeito de Vidro (Glassmorphism) */
        .login-card {
            background: var(--bg-card); 
            padding: 50px 40px; 
            border-radius: 24px;
            border: 1px solid var(--border-subtle); 
            width: 100%; 
            max-width: 420px;
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Linha de brilho superior no card */
        .login-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.3), transparent);
            border-radius: 24px;
        }

        .brand-icon {
            width: 70px; 
            height: 70px; 
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            border-radius: 18px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0 auto 24px; 
            color: #000; 
            font-size: 2rem; 
            animation: pulseGlow 3s infinite ease-in-out;
            transition: transform 0.3s ease;
        }

        .brand-icon:hover {
            transform: rotate(-5deg) scale(1.05);
        }

        h2 { 
            margin: 0 0 10px 0; 
            font-weight: 700; 
            letter-spacing: -0.02em;
            font-size: 1.75rem;
            background: linear-gradient(to bottom, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { 
            color: #a1a1aa; 
            font-size: 0.95rem; 
            margin-bottom: 35px; 
            font-weight: 400;
        }

        .form-group { 
            text-align: left; 
            margin-bottom: 24px; 
        }

        label { 
            display: block; 
            font-size: 0.75rem; 
            color: #71717a; 
            margin-bottom: 8px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        .input-wrapper { 
            position: relative; 
            display: flex;
            align-items: center;
        }

        .input-wrapper i { 
            position: absolute; 
            left: 16px; 
            color: #52525b; 
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        
        input {
            width: 100%; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid var(--border-subtle);
            padding: 14px 14px 14px 48px; 
            border-radius: 12px; 
            color: #fff; 
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus { 
            outline: none; 
            border-color: var(--color-primary); 
            background: rgba(0, 0, 0, 0.6); 
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1);
        }

        input:focus + i {
            color: var(--color-primary);
        }

        .form-group:focus-within label {
            color: var(--color-primary);
        }

        button {
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            color: #000; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer;
            transition: all 0.3s ease; 
            margin-top: 10px;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 24px rgba(234, 88, 12, 0.3);
            filter: brightness(1.1);
        }

        button:active { 
            transform: translateY(0); 
        }

        /* Estilo do Spinner de Loading */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #error-msg { 
            color: #fb7185; 
            font-size: 0.85rem; 
            margin-top: 20px; 
            display: none; 
            background: rgba(225, 29, 72, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(225, 29, 72, 0.2);
            animation: fadeInUp 0.3s ease;
        }

        /* Rodapé de Segurança */
        .login-footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #52525b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Acesso Restrito</h2>
        <p>Fundição Erus — Gestão de Processos</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Seu nome de usuário" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Sua senha de acesso" required>
                </div>
            </div>

            <button type="submit" id="btnEntrar">
                <span id="btnText">ENTRAR NO SISTEMA</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
            
            <div id="error-msg">
                <i class="fa-solid fa-circle-exclamation" style="margin-right: 5px;"></i>
                Usuário ou senha incorretos.
            </div>
        </form>

        <div class="login-footer">
            <i class="fa-solid fa-lock"></i>
            Ambiente Seguro & Monitorado
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnEntrar');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const error = document.getElementById('error-msg');

            // Feedback visual de carregamento
            btnText.innerText = "VALIDANDO...";
            btnSpinner.style.display = "block";
            btn.disabled = true;
            error.style.display = "none";

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });

                const data = await res.json();

                if (data.success) {
                    // Limpa tudo antes de começar a nova sessão
                    localStorage.clear();
                    
                    // Define as chaves de acesso
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_last_activity', Date.now().toString());
                    
                    // Redireciona para o index
                    window.location.replace('index.html');
                } else {
                    error.style.display = "block";
                    btnText.innerText = "ENTRAR NO SISTEMA";
                    btnSpinner.style.display = "none";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
                btnText.innerText = "ENTRAR NO SISTEMA";
                btnSpinner.style.display = "none";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
