<style>
    :root {
        /* --- PALETA AMARELO QUEIMADO / ÂMBAR --- */
        --color-primary: #f59e0b;
        /* Amarelo Ouro */
        --color-primary-hover: #d97706;
        /* Laranja Queimado */

        --bg-body: #050505;
        /* Mais preto ainda */
        --bg-card: #0a0a0a;
        /* Cinza Chumbo */
        --bg-input: #171717;
        /* Cinza Input */

        --text-main: #f5f5f5;
        --text-muted: #737373;

        --border-subtle: rgba(255, 255, 255, 0.05);
        --border-focus: #f59e0b;

        --success: #10b981;
        --error: #ef4444;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-body);
        height: 100vh;
        width: 100vw;
        color: var(--text-main);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- SPLIT LAYOUT --- */
    .login-container {
        display: flex;
        width: 1000px;
        max-width: 95vw;
        height: 600px;
        max-height: 90vh;
        background: var(--bg-card);
        border-radius: 24px;
        border: 1px solid var(--border-subtle);
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
        overflow: hidden;
        position: relative;
        z-index: 10;
    }

    /* Lado Esquerdo: Branding / Welcome */
    .split-left {
        flex: 1.1;
        background: linear-gradient(135deg, #451a03 0%, #78350f 50%, #d97706 100%);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 60px;
        color: #fff;
        overflow: hidden;
    }

    .split-left::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
    }

    /* Topografia/Shapes no fundo estilo imagem */
    .bg-shape {
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        filter: blur(40px);
        z-index: 1;
    }

    .shape-1 {
        top: -100px;
        left: -100px;
        animation: morph 15s linear infinite alternate;
    }

    .shape-2 {
        bottom: -150px;
        right: -100px;
        background: rgba(0, 0, 0, 0.1);
        animation: morph 20s linear infinite alternate-reverse;
    }

    @keyframes morph {
        0% {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        100% {
            border-radius: 60% 40% 30% 70% / 60% 50% 40% 50%;
        }
    }

    .left-content {
        position: relative;
        z-index: 2;
    }

    .brand-logo-large {
        width: 80px;
        margin-bottom: 2rem;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
        margin-left: -10px;
    }

    .welcome-title {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 1.2rem;
        background: linear-gradient(to bottom, #fff, rgba(255, 255, 255, 0.7));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .welcome-text {
        font-size: 1.05rem;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.6;
        max-width: 320px;
    }

    /* Lado Direito: Formulário */
    .split-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: var(--bg-card);
        position: relative;
        overflow: hidden;
        /* CRITICAL: Clips the slider */
    }

    .form-viewport {
        width: 100%;
        overflow: hidden;
    }

    .form-slider {
        display: flex;
        width: 200%;
        transition: transform 0.6s cubic-bezier(0.6, 0.05, 0.1, 0.99);
    }

    .form-slide {
        width: 50%;
        padding: 60px;
        /* Padding now inside the slide */
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .form-container-inner {
        width: 100%;
        max-width: 340px;
        margin: 0 auto;
    }

    .show-register .form-slider {
        transform: translateX(-50%);
    }

    h2 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: #fff;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 2.5rem;
    }

    /* --- INPUT STYLES --- */
    .form-group {
        margin-bottom: 20px;
    }

    .input-group {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-group i {
        position: absolute;
        left: 16px;
        color: #525252;
        font-size: 1rem;
        transition: 0.3s;
    }

    input {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
        padding: 14px 16px 14px 48px;
        border-radius: 12px;
        color: #fff;
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.2s;
    }

    input::placeholder {
        color: #404040;
    }

    input:focus {
        outline: none;
        border-color: var(--color-primary);
        background: #1f1f1f;
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
    }

    input:focus+i {
        color: var(--color-primary);
    }

    .toggle-password {
        position: absolute;
        right: 8px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #525252;
        cursor: pointer;
        font-size: 0.9rem;
        transition: 0.2s;
        border-radius: 8px;
        z-index: 2;
    }

    .toggle-password:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
    }

    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        font-size: 0.85rem;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        cursor: pointer;
    }

    .remember-me input {
        width: auto;
        padding: 0;
        cursor: pointer;
    }

    .forgot-link {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 500;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }

    /* --- BUTTONS --- */
    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: var(--color-primary);
        color: #000;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.3);
    }

    button:hover {
        background: #fbbf24;
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(245, 158, 11, 0.4);
    }

    button:active {
        transform: translateY(0);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .toggle-mode {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-muted);
    }

    .toggle-mode span {
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
        margin-left: 4px;
    }

    .toggle-mode span:hover {
        text-decoration: underline;
    }

    /* --- RESPONSIVIDADE --- */
    @media (max-width: 900px) {
        .split-left {
            display: none;
        }

        .login-container {
            width: 450px;
            height: auto;
            padding: 20px 0;
        }

        .split-right {
            padding: 40px;
        }
    }

    /* --- TOAST --- */
    #toast-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
    }

    .toast {
        background: #111;
        border: 1px solid var(--border-subtle);
        padding: 16px 20px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        transform: translateX(120%);
        transition: 0.5s;
        min-width: 280px;
    }

    .toast.show {
        transform: translateX(0);
    }

    .toast.success {
        border-left: 4px solid var(--success);
    }

    .toast.error {
        border-left: 4px solid var(--error);
    }

    .toast i {
        font-size: 1.2rem;
    }

    .toast.success i {
        color: var(--success);
    }

    .toast.error i {
        color: var(--error);
    }

    /* --- SUCCESS TRANSITION OVERLAY --- */
    #success-transfer-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #f59e0b, #78350f, #050505);
        z-index: 99999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease-in;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #success-transfer-overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    .transfer-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, rgba(245, 158, 11, 0.4) 0%, transparent 70%);
        animation: pulseGlow 1.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {

        0%,
        100% {
            transform: scale(1);
            opacity: 0.3;
        }

        50% {
            transform: scale(1.5);
            opacity: 0.6;
        }
    }

    @keyframes finalScale {
        from {
            transform: scale(0.5);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.1);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: none;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>
</head>

<body>

    <!-- Fundo de Partículas sutil -->
    <div id="particleField" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.3;"></div>

    <!-- OVERLAY DE TRANSIÇÃO -->
    <div id="success-transfer-overlay">
        <div class="transfer-glow"></div>
        <img src="logo.png" id="transition-logo"
            style="width: 140px; z-index: 10; filter: drop-shadow(0 0 50px rgba(245, 158, 11, 0.8)) brightness(1.2); opacity: 0;">
    </div>

    <style>
        #success-transfer-overlay.active #transition-logo {
            animation: finalScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes finalScale {
            0% {
                transform: scale(0.6) rotate(-5deg);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }
    </style>

    <div class="login-container" id="mainCard">

        <!-- LADO ESQUERDO: BRANDING -->
        <div class="split-left">
            <div class="bg-shape shape-1"></div>
            <div class="bg-shape shape-2"></div>

            <div class="left-content">
                <img src="logo.png" class="brand-logo-large" alt="Logo SGP ERUS">
                <h1 class="welcome-title">Bem vindo<br>de volta!</h1>
                <p class="welcome-text">Entre com sua conta oficial para acessar o painel de gerenciamento.</p>
            </div>
        </div>

        <!-- LADO DIREITO: FORMULÁRIO -->
        <div class="split-right">
            <div class="form-viewport">
                <div class="form-slider">

                    <!-- LOGIN SLIDE -->
                    <div class="form-slide">
                        <div class="form-container-inner">
                            <h2>Acessar</h2>
                            <p class="subtitle">Bem vindo ao SGP ERUS.</p>

                            <form id="loginForm" autocomplete="off">
                                <div class="form-group">
                                    <div class="input-group">
                                        <i class="fa-solid fa-user"></i>
                                        <input type="text" id="loginUser" placeholder="Seu usuário" required
                                            autocomplete="off">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="input-group">
                                        <i class="fa-solid fa-lock"></i>
                                        <input type="password" id="loginPass" placeholder="Sua senha" required
                                            autocomplete="off">
                                        <i class="fa-solid fa-eye toggle-password"
                                            onclick="togglePass('loginPass', this)"></i>
                                    </div>
                                </div>

                                <div class="form-options">
                                    <label class="remember-me">
                                        <input type="checkbox"> Lembrar de mim
                                    </label>
                                    <a href="#" class="forgot-link"
                                        onclick="notify('Recuperação', 'Contate o administrador.')">Esqueceu senha?</a>
                                </div>

                                <button type="submit" id="btnLogin">
                                    <span id="txtLogin">Entrar</span>
                                    <div class="spinner" id="spinLogin"></div>
                                </button>

                                <div class="toggle-mode">
                                    Novo aqui? <span onclick="switchMode('register')">Solicitar Acesso</span>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- REGISTER SLIDE -->
                    <div class="form-slide">
                        <div class="form-container-inner">
                            <h2 style="font-size: 1.6rem;">Nova Conta</h2>
                            <p class="subtitle">Solicite seu acesso ao sistema.</p>

                            <form id="registerForm" autocomplete="off">
                                <div class="form-group">
                                    <div class="input-group">
                                        <i class="fa-solid fa-id-badge"></i>
                                        <input type="text" id="regName" placeholder="Nome Completo" required
                                            autocomplete="off">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="input-group">
                                        <i class="fa-solid fa-at"></i>
                                        <input type="text" id="regUser" placeholder="Usuário desejado" required
                                            autocomplete="off">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="input-group">
                                        <i class="fa-solid fa-key"></i>
                                        <input type="password" id="regPass" placeholder="Senha" required
                                            autocomplete="off">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="input-group">
                                        <i class="fa-solid fa-check-double"></i>
                                        <input type="password" id="regPassConfirm" placeholder="Confirmar Senha"
                                            required autocomplete="off">
                                    </div>
                                </div>

                                <button type="submit" id="btnReg">
                                    <span id="txtReg">Criar Conta</span>
                                    <div class="spinner" id="spinReg"></div>
                                </button>

                                <div class="toggle-mode">
                                    Já tem conta? <span onclick="switchMode('login')">Fazer Login</span>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container">
        <div id="mainToast" class="toast">
            <i id="toastIcon" class="fa-solid"></i>
            <div class="toast-content" style="display: flex; flex-direction: column;">
                <span id="toastTitle" style="font-weight: 700; color: #fff; font-size: 0.95rem;"></span>
                <span id="toastMsg" style="font-size: 0.85rem; color: #737373;"></span>
            </div>
        </div>
    </div>


    <script>
        // --- EFEITO DE PARTICULAS (AMBAR) ---
        function initParticles() {
            const field = document.getElementById('particleField');
            for (let i = 0; i < 25; i++) {
                const e = document.createElement('div');
                e.className = 'ember';
                const size = Math.random() * 4 + 2;
                e.style.width = size + 'px';
                e.style.height = size + 'px';
                e.style.left = Math.random() * 100 + '%';
                e.style.animationDelay = Math.random() * 5 + 's';
                e.style.animationDuration = (Math.random() * 3 + 5) + 's';
                field.appendChild(e);
            }
        }
        initParticles();

        // --- VISIBILIDADE DE SENHA ---
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // --- ALTERNAR FORMULARIOS ---
        function switchMode(mode) {
            const container = document.getElementById('mainCard');
            // Limpar formulários ao trocar
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();

            if (mode === 'register') {
                container.classList.add('show-register');
            } else {
                container.classList.remove('show-register');
            }
        }

        // --- SISTEMA DE NOTIFICAÇÃO ---
        function notify(title, msg, type = 'success') {
            const toast = document.getElementById('mainToast');
            const icon = document.getElementById('toastIcon');

            toast.className = `toast ${type} show`;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;

            icon.className = type === 'success'
                ? 'fa-solid fa-circle-check'
                : 'fa-solid fa-triangle-exclamation';

            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // --- LOGIN LOGIC ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const spin = document.getElementById('spinLogin');
            const txt = document.getElementById('txtLogin');

            btn.disabled = true;
            spin.style.display = 'block';
            txt.style.display = 'none';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const data = await res.json();

                if (data.success) {
                    notify('Sucesso!', 'Acesso autorizado. Carregando...');
                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_user', data.name || user);
                    localStorage.setItem('erus_role', data.role || 'Visitante');
                    localStorage.setItem('erus_last_activity', Date.now().toString());

                    // Trigger cinematic transition
                    setTimeout(() => {
                        document.getElementById('success-transfer-overlay').classList.add('active');
                        setTimeout(() => window.location.replace('index.html'), 2000);
                    }, 1000);
                } else {
                    notify('Acesso Negado', data.message || 'Credenciais inválidas.', 'error');
                    btn.disabled = false;
                    spin.style.display = 'none';
                    txt.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                notify('Erro de Conexão', 'Servidor indisponível no momento.', 'error');
                btn.disabled = false;
                spin.style.display = 'none';
                txt.style.display = 'block';
            }
        });

        // --- REGISTRO LOGIC ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('regPassConfirm').value;

            const btn = document.getElementById('btnReg');
            const spin = document.getElementById('spinReg');
            const txt = document.getElementById('txtReg');

            if (pass !== confirm) {
                notify('Erro de Validação', 'As senhas não coincidem.', 'error');
                return;
            }

            btn.disabled = true;
            spin.style.display = 'block';
            txt.style.display = 'none';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName: name, user, pass })
                });
                const data = await res.json();

                if (data.success) {
                    notify('Conta Criada!', 'Seu cadastro foi realizado com sucesso.');
                    setTimeout(() => {
                        switchMode('login');
                        document.getElementById('loginUser').value = user;
                    }, 2000);
                } else {
                    notify('Falha no Cadastro', data.message || 'Erro ao criar conta.', 'error');
                }
            } catch (err) {
                notify('Erro', 'Falha na comunicação com o servidor.', 'error');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                txt.style.display = 'block';
            }
        });
    </script>
    <script src="js/activity-logger.js"></script>
</body>

</html>
