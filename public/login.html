<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #fbbf24;
            --color-primary-dim: #ea580c;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.85);
            --text-main: #f4f4f5;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --accent-glow: rgba(234, 88, 12, 0.15);
        }

        /* Animações */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 0 35px rgba(251, 191, 36, 0.4); }
            100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
        }

        body {
            margin: 0; 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 20% 20%, var(--accent-glow), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.05), transparent 40%),
                radial-gradient(circle at center, rgba(234, 88, 12, 0.08), transparent 70%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-main);
            overflow-y: auto; 
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card); 
            padding: 40px 40px; 
            border-radius: 24px;
            border: 1px solid var(--border-subtle); 
            width: 100%; 
            max-width: 420px;
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.3), transparent);
        }

        .brand-icon {
            width: 60px; 
            height: 60px; 
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0 auto 20px; 
            color: #000; 
            font-size: 1.8rem; 
            animation: pulseGlow 3s infinite ease-in-out;
        }

        h2 { 
            margin: 0 0 5px 0; 
            font-weight: 700; 
            font-size: 1.6rem;
            background: linear-gradient(to bottom, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { 
            color: #a1a1aa; 
            font-size: 0.9rem; 
            margin-bottom: 30px; 
        }

        .form-group { text-align: left; margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-size: 0.75rem; 
            color: #a1a1aa; 
            margin-bottom: 6px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .input-wrapper i { 
            position: absolute; left: 16px; color: #52525b; 
            font-size: 1rem; transition: color 0.3s ease; z-index: 10;
        }
        
        input {
            width: 100%; 
            background: rgba(9, 9, 11, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 14px 14px 48px; 
            border-radius: 12px; 
            color: #f4f4f5; 
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            box-sizing: border-box; 
        }

        input:focus { 
            outline: none; 
            border-color: var(--color-primary); 
            background: rgba(0, 0, 0, 0.8); 
            box-shadow: 0 0 0 1px var(--color-primary), 0 0 15px rgba(251, 191, 36, 0.1);
        }
        input:focus + i { color: var(--color-primary); }

        /* Correção Autofill Dark */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #09090b inset !important;
            -webkit-text-fill-color: #f4f4f5 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        button {
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dim));
            color: #000; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer;
            transition: all 0.3s ease; 
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 24px rgba(234, 88, 12, 0.3);
            filter: brightness(1.1);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .msg-box { 
            font-size: 0.85rem; margin-top: 15px; display: none; 
            padding: 10px; border-radius: 8px; animation: fadeInUp 0.3s ease;
        }
        .error { color: #fb7185; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.2); }
        .success { color: #4ade80; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); }

        .toggle-text {
            margin-top: 20px; font-size: 0.85rem; color: #a1a1aa;
        }
        .toggle-text span {
            color: var(--color-primary); cursor: pointer; font-weight: 600;
            text-decoration: underline; text-decoration-color: transparent; transition: all 0.3s;
        }
        .toggle-text span:hover { text-decoration-color: var(--color-primary); }

        #registerContainer { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <!-- MODO LOGIN -->
        <div id="loginContainer">
            <h2>Acesso Restrito</h2>
            <p>Fundição Erus — Gestão de Processos</p>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>Usuário</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginUser" placeholder="Seu usuário" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPass" placeholder="Sua senha" required>
                    </div>
                </div>

                <button type="submit" id="btnLogin">
                    <span id="txtLogin">ENTRAR</span>
                    <div class="spinner" id="spinLogin"></div>
                </button>
                
                <div id="loginMsg" class="msg-box error"></div>

                <div class="toggle-text">
                    Novo colaborador? <span onclick="toggleMode()">Criar uma conta</span>
                </div>
            </form>
        </div>

        <!-- MODO REGISTRO -->
        <div id="registerContainer">
            <h2>Criar Conta</h2>
            <p>Seu acesso será liberado com permissões básicas.</p>

            <form id="registerForm" autocomplete="off">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="regName" placeholder="Ex: João da Silva" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Usuário para Login</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regUser" placeholder="Ex: joao.silva" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPass" placeholder="Crie uma senha forte" required>
                    </div>
                </div>

                <button type="submit" id="btnReg">
                    <span id="txtReg">REGISTRAR E ENTRAR</span>
                    <div class="spinner" id="spinReg"></div>
                </button>
                
                <div id="regMsg" class="msg-box"></div>

                <div class="toggle-text">
                    Já possui acesso? <span onclick="toggleMode()">Fazer Login</span>
                </div>
            </form>
        </div>

        <div style="margin-top: 30px; font-size: 0.75rem; color: #52525b;">
            <i class="fa-solid fa-lock" style="margin-right:5px;"></i> Ambiente Seguro
        </div>
    </div>

    <script>
        const loginContainer = document.getElementById('loginContainer');
        const registerContainer = document.getElementById('registerContainer');
        const msgBoxes = document.querySelectorAll('.msg-box');

        function toggleMode() {
            msgBoxes.forEach(box => box.style.display = 'none');
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();

            if (loginContainer.style.display === 'none') {
                loginContainer.style.display = 'block';
                registerContainer.style.display = 'none';
                loginContainer.style.animation = 'fadeInUp 0.5s';
            } else {
                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
                registerContainer.style.animation = 'fadeInUp 0.5s';
            }
        }

        function setLoading(isLoading, btn, txtSpan, spinner, text) {
            btn.disabled = isLoading;
            txtSpan.innerText = text;
            spinner.style.display = isLoading ? 'block' : 'none';
        }

        function showMsg(element, text, type) {
            element.innerText = text;
            element.className = `msg-box ${type}`;
            element.style.display = 'block';
            if(type === 'error') element.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${text}`;
            if(type === 'success') element.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${text}`;
        }

        // --- LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const txt = document.getElementById('txtLogin');
            const spin = document.getElementById('spinLogin');
            const msg = document.getElementById('loginMsg');

            setLoading(true, btn, txt, spin, "VALIDANDO...");
            msg.style.display = 'none';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                
                const data = await res.json();

                if (data.success) {
                    localStorage.clear();
                    
                    // Salva a permissão que veio do banco de dados (Ex: 'admin', 'operador', 'visitante')
                    // Se não vier nada, define como 'padrao'
                    const userRole = data.role || 'padrao'; 
                    const userName = data.name || user;

                    localStorage.setItem('erus_auth', 'true');
                    localStorage.setItem('erus_role', userRole); 
                    localStorage.setItem('erus_user', userName);
                    
                    window.location.replace('index.html');
                } else {
                    showMsg(msg, "Usuário ou senha incorretos.", "error");
                }
            } catch (err) {
                showMsg(msg, "Erro de conexão.", "error");
            } finally {
                setLoading(false, btn, txt, spin, "ENTRAR");
            }
        });

        // --- REGISTRO ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            const btn = document.getElementById('btnReg');
            const txt = document.getElementById('txtReg');
            const spin = document.getElementById('spinReg');
            const msg = document.getElementById('regMsg');

            setLoading(true, btn, txt, spin, "CRIANDO CONTA...");
            msg.style.display = 'none';

            try {
                // Ao criar conta, seu backend deve salvar o usuário com role='padrao' (nível baixo)
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, user, pass })
                });

                const data = await res.json();

                if (data.success) {
                    showMsg(msg, "Conta criada com sucesso! Redirecionando...", "success");
                    
                    // Opcional: Auto-Login após registro
                    setTimeout(() => {
                        toggleMode(); // Ou preencher o form de login automaticamente
                        document.getElementById('loginUser').value = user;
                        showMsg(document.getElementById('loginMsg'), "Por favor, confirme sua senha para entrar.", "success");
                    }, 1500);
                } else {
                    showMsg(msg, data.message || "Erro ao criar conta.", "error");
                }
            } catch (err) {
                showMsg(msg, "Erro de conexão.", "error");
            } finally {
                setLoading(false, btn, txt, spin, "REGISTRAR E ENTRAR");
            }
        });
    </script>
</body>
</html>
