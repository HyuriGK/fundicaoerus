<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260706-light-sidebar"></script>
    <script src="js/theme-manager.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reuniao de Indicadores - Fundicao Erus</title>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js?v=20260605e"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --panel: #111114;
            --panel-2: #17171b;
            --line: rgba(255,255,255,0.08);
            --muted: #a1a1aa;
            --dim: #71717a;
            --text: #fafafa;
            --amber: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --cyan: #06b6d4;
            --blue: #3b82f6;
            --violet: #8b5cf6;
            --radius: 8px;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-display: 'Outfit', sans-serif;
        }
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-main);
            color: var(--text);
            background: var(--bg);
        }
        .meeting-shell {
            min-height: 100vh;
            padding: 22px 24px 24px;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 18px;
        }
        .meeting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 0 4px;
        }
        .title-block h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(2rem, 3vw, 3.4rem);
            letter-spacing: 0;
            line-height: 1;
        }
        .title-block p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 600;
        }
        .header-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
        }
        .meta-pill {
            height: 38px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            display: inline-flex;
            align-items: center;
            gap: 9px;
            white-space: nowrap;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #0d0d10;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .field, .seg-btn {
            height: 38px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            color: var(--text);
            padding: 0 12px;
            font-weight: 800;
            font-family: var(--font-main);
            outline: none;
        }
        select.field {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: none;
            text-align: center;
            text-align-last: center;
            padding-left: 12px;
            padding-right: 12px;
        }
        select.field::-ms-expand { display: none; }
        .seg-btn {
            min-width: 118px;
            color: var(--muted);
            cursor: pointer;
        }
        .seg-btn.active {
            color: #09090b;
            background: var(--amber);
            border-color: var(--amber);
        }
        .panel-segment {
            display: inline-flex;
            gap: 6px;
            margin-left: auto;
            margin-right: 8px;
        }
        .panel-segment .seg-btn {
            min-width: 86px;
            height: 30px;
            padding: 0 10px;
            font-size: 0.72rem;
        }
        .panel-filter {
            width: 180px;
            height: 30px;
            font-size: 0.72rem;
            padding: 0 9px;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }
        .kpi-card, .panel {
            background: linear-gradient(180deg, var(--panel), #0d0d10);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 18px 34px rgba(0,0,0,0.28);
        }
        .kpi-card {
            min-height: 158px;
            padding: 18px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
        }
        .kpi-label {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kpi-label i { color: var(--accent); font-size: 1rem; }
        .kpi-value {
            font-family: var(--font-mono);
            font-size: clamp(2.05rem, 3vw, 3.8rem);
            font-weight: 800;
            line-height: 1;
            align-self: end;
            color: var(--text);
            white-space: nowrap;
        }
        .kpi-sub {
            color: var(--dim);
            font-size: 0.86rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .good { color: var(--green); }
        .bad { color: var(--red); }
        .accent { color: var(--accent); }
        .content-grid {
            min-height: 0;
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            grid-template-rows: minmax(0, 1fr) minmax(220px, 0.72fr);
            gap: 14px;
        }
        .panel {
            min-height: 0;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }
        .panel.wide { grid-row: span 2; }
        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .panel-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
        }
        .panel-note {
            color: var(--dim);
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .chart-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        .ranking {
            display: grid;
            gap: 10px;
            overflow: hidden;
        }
        .rank-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 11px 12px;
            border-radius: var(--radius);
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.055);
        }
        .rank-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e4e4e7;
            font-weight: 800;
            font-size: 0.94rem;
        }
        .rank-value {
            color: var(--amber);
            font-family: var(--font-mono);
            font-weight: 800;
            white-space: nowrap;
        }
        .health-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: auto;
        }
        .health-item {
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.065);
            background: var(--panel-2);
        }
        .health-label {
            color: var(--dim);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }
        .health-value {
            font-family: var(--font-mono);
            font-size: 1.35rem;
            font-weight: 800;
        }
        .loading {
            color: var(--dim);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        @media (max-width: 1200px) {
            body { overflow: auto; }
            .meeting-shell { min-height: 100vh; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; grid-template-rows: 420px auto; }
            .panel.wide { grid-row: span 1; }
        }
        @media (max-width: 720px) {
            .meeting-shell { padding: 72px 12px 16px; gap: 12px; }
            .meeting-header { align-items: flex-start; flex-direction: column; }
            .header-meta, .control-group, .control-row { width: 100%; }
            .meta-pill, .field, .seg-btn { flex: 1 1 auto; min-width: 0; }
            .kpi-grid { grid-template-columns: 1fr; }
            .kpi-card { min-height: 132px; }
            .kpi-value { font-size: 2rem; }
            .content-grid { grid-template-rows: 360px auto; }
            .health-grid { grid-template-columns: 1fr; }
        }
        body { overflow: auto; }
        .meeting-shell { padding: clamp(12px, 1.2vw, 18px); gap: clamp(10px, 1vw, 14px); }
        .title-block h1 { font-size: clamp(1.7rem, 2.4vw, 2.8rem); }
        .title-block p { margin-top: 5px; font-size: 0.9rem; }
        .meta-pill, .field, .seg-btn { height: 34px; }
        .control-row { padding: 10px 12px; }
        .kpi-grid { grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: clamp(10px, 0.9vw, 14px); }
        .kpi-card { min-height: clamp(104px, 13vh, 136px); padding: clamp(12px, 1.1vw, 16px); gap: 8px; }
        .kpi-label { font-size: clamp(0.66rem, 0.72vw, 0.76rem); }
        .kpi-value { font-size: clamp(1.7rem, 2.25vw, 2.9rem); }
        .kpi-sub { font-size: clamp(0.72rem, 0.75vw, 0.82rem); }
        .content-grid { grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.7fr); grid-template-rows: minmax(300px, 1fr); gap: clamp(10px, 0.9vw, 14px); }
        .panel.wide { grid-row: span 1; }
        .panel { padding: clamp(12px, 1vw, 16px); }
        .panel-head { margin-bottom: 8px; }
        .panel-title { font-size: clamp(0.92rem, 1vw, 1.05rem); }
        .panel-note { font-size: 0.72rem; }
        .ranking { gap: 8px; overflow: auto; min-height: 0; }
        .rank-row { padding: 9px 11px; }
        .rank-name { font-size: 0.84rem; }
        .health-item { padding: 10px 12px; }
        .health-value { font-size: clamp(1rem, 1.2vw, 1.25rem); }
        @media (min-width: 1201px) and (max-height: 820px) {
            .meeting-shell { min-height: auto; }
            .content-grid { grid-template-rows: minmax(300px, 52vh); }
            .kpi-card { min-height: 104px; }
            .rank-row:nth-child(n+5) { display: none; }
        }
    </style>
</head>
<body>
    <main class="meeting-shell erus-sidebar-content-offset erus-fill-layout">
        <section class="control-row">
            <div class="control-group">
                <select class="field" id="monthSelect" aria-label="Mes"></select>
                <select class="field" id="yearSelect" aria-label="Ano"></select>
            </div>
            <div class="control-group">
                <button class="seg-btn active" data-metric="faturamento">Faturamento</button>
                <button class="seg-btn" data-metric="producao">Producao</button>
                <button class="seg-btn" data-metric="refugo">Refugo</button>
            </div>
        </section>

        <section class="kpi-grid">
            <article class="kpi-card" style="--accent:var(--cyan);">
                <div class="kpi-label"><span>Producao Apontada</span><i class="fa-solid fa-industry"></i></div>
                <div class="kpi-value" id="prodKpi">--</div>
                <div class="kpi-sub"><span id="prodQty">-- apontamentos</span><span id="prodTrend">--</span></div>
            </article>
            <article class="kpi-card" style="--accent:var(--amber);">
                <div class="kpi-label"><span>Faturamento</span><i class="fa-solid fa-sack-dollar"></i></div>
                <div class="kpi-value" id="fatKpi">--</div>
                <div class="kpi-sub"><span id="fatDaily">-- media/dia</span><span id="fatTrend">--</span></div>
            </article>
            <article class="kpi-card" style="--accent:var(--red);">
                <div class="kpi-label"><span>Refugo</span><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="kpi-value" id="refKpi">--</div>
                <div class="kpi-sub"><span id="refPct">-- sobre fusao</span><span id="refStatus">--</span></div>
            </article>
            <article class="kpi-card" style="--accent:var(--green);">
                <div class="kpi-label"><span>Conversao Fat./Prod.</span><i class="fa-solid fa-gauge-high"></i></div>
                <div class="kpi-value" id="convKpi">--</div>
                <div class="kpi-sub"><span>peso faturado x produzido</span><span id="convStatus">--</span></div>
            </article>
        </section>

        <section class="content-grid">
            <article class="panel wide">
                <div class="panel-head">
                    <h2 class="panel-title" id="mainChartTitle">Evolucao diaria</h2>
                    <div class="panel-segment">
                        <button class="seg-btn active" data-chart-mode="daily">Diaria</button>
                        <button class="seg-btn" data-chart-mode="monthly">Mensal</button>
                    </div>
                    <select class="field panel-filter" id="sectorSelect" aria-label="Setor">
                        <option value="Todos">Todos setores</option>
                    </select>
                    <span class="panel-note" id="mainChartNote">Faturamento em kg</span>
                </div>
                <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
            </article>
            <article class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">Principais motivos de refugo</h2>
                    <span class="panel-note">Top 5</span>
                </div>
                <div class="ranking" id="scrapRanking"><div class="loading">Carregando...</div></div>
                <div class="health-grid">
                    <div class="health-item"><div class="health-label">Meta refugo</div><div class="health-value">3,50%</div></div>
                    <div class="health-item"><div class="health-label">Producao fusao</div><div class="health-value" id="fusionKg">--</div></div>
                    <div class="health-item"><div class="health-label">Dias com fat.</div><div class="health-value" id="billingDays">--</div></div>
                </div>
            </article>
        </section>
    </main>

    <script>
        const fmtKg = v => Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' kg';
        const fmtTon = v => (Number(v || 0) / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' t';
        const fmtPct = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
        const iso = d => d.toISOString().slice(0, 10);
        const now = new Date();
        let selectedYear = now.getFullYear();
        let selectedMonth = now.getMonth() + 1;
        let chartMode = 'daily';
        let selectedMetric = 'faturamento';
        let selectedSector = 'Todos';
        let dailyChart;
        let dashboardCache = { prodRows: [], fatDaily: [], refRows: [], ref: {}, monthly: null };
        const SECTOR_ORDER = [
            'MOLDAGEM GERAL',
            'MOLDAGEM LEVE',
            'MOLDAGEM MANUAL',
            'MOLDAGEM PESADA',
            'FECHAMENTO MANUAL',
            'ACABAMENTO',
            'FUSAO',
            'EXPEDICAO'
        ];
        const MOLDAGEM_GERAL_TYPES = ['MOLDAGEM MANUAL', 'MOLDAGEM LEVE', 'MOLDAGEM PESADA'];

        async function getJson(url, fallback) {
            try {
                const res = await fetch(url, { cache: 'no-store' });
                return res.ok ? await res.json() : fallback;
            } catch (e) {
                return fallback;
            }
        }

        function setTrend(el, current, previous, inverse) {
            const node = document.getElementById(el);
            const diff = previous > 0 ? ((current - previous) / previous) * 100 : 0;
            const good = inverse ? diff <= 0 : diff >= 0;
            node.className = good ? 'good' : 'bad';
            node.textContent = (diff >= 0 ? '+' : '') + fmtPct(diff);
        }

        function sumDaily(rows) {
            const map = {};
            (rows || []).forEach(r => {
                const key = String(r.data || '').slice(0, 10);
                if (!key) return;
                map[key] = (map[key] || 0) + Number(r.pesoTotal || r.peso_total || 0);
            });
            return map;
        }

        function selectedStartDate() {
            return iso(new Date(selectedYear, selectedMonth - 1, 1));
        }

        function selectedEndDate() {
            return iso(new Date(selectedYear, selectedMonth, 0));
        }

        function setPeriodLabel() {
            const label = document.getElementById('periodLabel');
            if (label) label.textContent = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(new Date(selectedYear, selectedMonth - 1, 1));
        }

        function initControls() {
            const monthSelect = document.getElementById('monthSelect');
            const yearSelect = document.getElementById('yearSelect');
            const months = Array.from({ length: 12 }, (_, i) => {
                const name = new Intl.DateTimeFormat('pt-BR', { month: 'long' }).format(new Date(2026, i, 1));
                return name.charAt(0).toUpperCase() + name.slice(1);
            });
            monthSelect.innerHTML = months.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
            const years = Array.from({ length: 6 }, (_, i) => now.getFullYear() - 4 + i);
            yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
            monthSelect.value = selectedMonth;
            yearSelect.value = selectedYear;
            monthSelect.addEventListener('change', () => { selectedMonth = Number(monthSelect.value); loadMeetingDashboard(); });
            yearSelect.addEventListener('change', () => { selectedYear = Number(yearSelect.value); loadMeetingDashboard(); });
            document.querySelectorAll('[data-chart-mode]').forEach(btn => btn.addEventListener('click', () => {
                chartMode = btn.dataset.chartMode;
                document.querySelectorAll('[data-chart-mode]').forEach(b => b.classList.toggle('active', b === btn));
                renderMainChart();
            }));
            document.querySelectorAll('[data-metric]').forEach(btn => btn.addEventListener('click', () => {
                selectedMetric = btn.dataset.metric;
                document.querySelectorAll('[data-metric]').forEach(b => b.classList.toggle('active', b === btn));
                renderMainChart();
            }));
            document.getElementById('sectorSelect').addEventListener('change', e => {
                selectedSector = e.target.value;
                dashboardCache.monthly = null;
                renderMainChart();
            });
        }

        async function loadMeetingDashboard() {
            setPeriodLabel();
            const startDate = selectedStartDate();
            const endDate = selectedEndDate();
            const prev = new Date(selectedYear, selectedMonth - 2, 1);
            const [prodStats, prodRows, fat, ref, refRaw, refPrev] = await Promise.all([
                getJson(`/api/producao-postgres/stats?startDate=${startDate}&endDate=${endDate}`, { success: false }),
                getJson(`/api/producao-postgres?startDate=${startDate}&endDate=${endDate}&limit=100000`, { success: false, data: [] }),
                getJson(`/api/faturamento-postgres/resumo-dashboard?year=${selectedYear}&month=${selectedMonth}`, { success: false, totalKg: 0, previousTotalKg: 0, daily: [] }),
                getJson(`/api/refugos-new/resumo-dashboard?year=${selectedYear}&month=${selectedMonth}`, { success: false, totalKg: 0, productionKg: 0, scrapPct: 0, byMotive: {} }),
                getJson('/api/refugos-new', { refugoRawData: [] }),
                getJson(`/api/refugos-new/resumo-dashboard?year=${prev.getFullYear()}&month=${prev.getMonth() + 1}`, { success: false, totalKg: 0 })
            ]);

            const prodKg = Number((prodStats.stats && prodStats.stats.totalWeight) || prodStats.totalPeso || prodStats.totalKg || prodStats.pesoTotal || 0);
            const prodCount = Number((prodStats.stats && prodStats.stats.totalRecords) || prodStats.totalRegistros || prodStats.totalApontamentos || (prodRows.data || []).length || 0);
            const fatKg = Number(fat.totalKg || 0);
            const refKg = Number(ref.totalKg || 0);
            const refPct = Number(ref.scrapPct || 0);
            const conv = prodKg > 0 ? (fatKg / prodKg) * 100 : 0;
            const fatDays = new Set((fat.daily || []).map(r => r.data).filter(Boolean)).size;

            document.getElementById('prodKpi').textContent = fmtTon(prodKg);
            document.getElementById('prodQty').textContent = prodCount.toLocaleString('pt-BR') + ' apontamentos';
            document.getElementById('prodTrend').textContent = 'mes atual';
            document.getElementById('fatKpi').textContent = fmtTon(fatKg);
            document.getElementById('fatDaily').textContent = fmtTon(fatDays ? fatKg / fatDays : 0) + ' media/dia';
            setTrend('fatTrend', fatKg, Number(fat.previousTotalKg || 0), false);
            document.getElementById('refKpi').textContent = fmtKg(refKg);
            document.getElementById('refPct').textContent = fmtPct(refPct) + ' sobre fusao';
            document.getElementById('refStatus').className = refPct <= 3.5 ? 'good' : 'bad';
            document.getElementById('refStatus').textContent = refPct <= 3.5 ? 'dentro da meta' : 'acima da meta';
            document.getElementById('convKpi').textContent = fmtPct(conv);
            document.getElementById('convStatus').className = conv >= 75 ? 'good' : '';
            document.getElementById('convStatus').textContent = conv >= 75 ? 'forte' : 'acompanhar';
            document.getElementById('fusionKg').textContent = fmtTon(Number(ref.productionKg || 0));
            document.getElementById('billingDays').textContent = fatDays.toLocaleString('pt-BR');
            const updatedAt = document.getElementById('updatedAt');
            if (updatedAt) updatedAt.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const monthPrefix = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
            const refRows = (refRaw.refugoRawData || []).filter(r => String(r.data || '').slice(0, 7) === monthPrefix);
            dashboardCache = { prodRows: prodRows.data || [], fatDaily: fat.daily || [], refRows, ref, monthly: null };
            renderSectorOptions(dashboardCache.prodRows);
            renderMainChart();
            renderScrap(ref.byMotive || {});
        }

        function renderSectorOptions(rows) {
            const select = document.getElementById('sectorSelect');
            const existing = new Set((rows || []).map(r => normalizeSector(r.setor)).filter(Boolean));
            const ordered = SECTOR_ORDER.filter(s => s === 'MOLDAGEM GERAL' || existing.has(s));
            const extra = Array.from(existing).filter(s => !SECTOR_ORDER.includes(s)).sort();
            const sectors = ordered.concat(extra);
            if (selectedSector !== 'Todos' && !sectors.includes(selectedSector)) selectedSector = 'Todos';
            select.innerHTML = '<option value="Todos">Todos setores</option>' + sectors.map(s => `<option value="${s}">${s}</option>`).join('');
            select.value = selectedSector;
        }

        function normalizeSector(value) {
            return String(value || '').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function matchesSelectedSector(rowSector) {
            if (selectedSector === 'Todos') return true;
            const sector = normalizeSector(rowSector);
            if (selectedSector === 'MOLDAGEM GERAL') return MOLDAGEM_GERAL_TYPES.includes(sector);
            return sector === selectedSector;
        }

        function dailySeries(metric) {
            const days = Array.from({ length: new Date(selectedYear, selectedMonth, 0).getDate() }, (_, i) => String(i + 1).padStart(2, '0'));
            const prodMap = {};
            dashboardCache.prodRows.filter(r => matchesSelectedSector(r.setor)).forEach(r => {
                const d = String(r.data || '').slice(8, 10);
                prodMap[d] = (prodMap[d] || 0) + Number(r.peso_total || r.pesoTotal || 0);
            });
            const fatMap = sumDaily(dashboardCache.fatDaily);
            const refMap = {};
            dashboardCache.refRows.forEach(r => {
                const d = String(r.data || '').slice(8, 10);
                refMap[d] = (refMap[d] || 0) + Number(r.peso_total || r.pesoTotal || 0);
            });
            const keyPrefix = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}-`;
            const values = {
                producao: days.map(d => prodMap[d] || 0),
                faturamento: days.map(d => fatMap[keyPrefix + d] || 0),
                refugo: days.map(d => refMap[d] || 0)
            };
            return { labels: days, values: values[metric] || values.faturamento };
        }

        async function monthlySeries(metric) {
            if (!dashboardCache.monthly) {
                const months = Array.from({ length: 12 }, (_, i) => i + 1);
                const rows = await Promise.all(months.map(async m => {
                    const start = iso(new Date(selectedYear, m - 1, 1));
                    const end = iso(new Date(selectedYear, m, 0));
                    const sectorQuery = selectedSector !== 'Todos' && selectedSector !== 'MOLDAGEM GERAL' ? `&sector=${encodeURIComponent(selectedSector)}` : '';
                    const prodPromise = selectedSector === 'MOLDAGEM GERAL'
                        ? Promise.all(MOLDAGEM_GERAL_TYPES.map(sector => getJson(`/api/producao-postgres/stats?startDate=${start}&endDate=${end}&sector=${encodeURIComponent(sector)}`, { success: false, stats: {} })))
                        : getJson(`/api/producao-postgres/stats?startDate=${start}&endDate=${end}${sectorQuery}`, { success: false, stats: {} });
                    const [prod, fat, ref] = await Promise.all([
                        prodPromise,
                        getJson(`/api/faturamento-postgres/resumo-dashboard?year=${selectedYear}&month=${m}`, { success: false, totalKg: 0 }),
                        getJson(`/api/refugos-new/resumo-dashboard?year=${selectedYear}&month=${m}`, { success: false, totalKg: 0 })
                    ]);
                    const prodWeight = Array.isArray(prod)
                        ? prod.reduce((sum, item) => sum + Number((item.stats && item.stats.totalWeight) || 0), 0)
                        : Number((prod.stats && prod.stats.totalWeight) || 0);
                    return {
                        producao: prodWeight,
                        faturamento: Number(fat.totalKg || 0),
                        refugo: Number(ref.scrapPct || 0)
                    };
                }));
                dashboardCache.monthly = rows;
            }
            const labels = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
            return { labels, values: dashboardCache.monthly.map(r => r[metric] || 0) };
        }

        async function renderMainChart() {
            const labelMap = { faturamento: 'Faturamento', producao: 'Producao', refugo: 'Refugo' };
            const series = chartMode === 'monthly' ? await monthlySeries(selectedMetric) : dailySeries(selectedMetric);
            document.getElementById('mainChartTitle').textContent = chartMode === 'monthly' ? 'Evolucao mensal' : 'Evolucao diaria';
            document.getElementById('mainChartNote').textContent = '';
            const color = '#f59e0b';
            const data = { labels: series.labels, datasets: [{ label: labelMap[selectedMetric], data: series.values, borderColor: color, backgroundColor: color, borderWidth: 1, borderRadius: 5, categoryPercentage: 0.82, barPercentage: 0.9, maxBarThickness: chartMode === 'monthly' ? 62 : 36 }] };
            if (dailyChart) dailyChart.destroy();
            const unit = chartMode === 'monthly' && selectedMetric === 'refugo' ? '%' : 'kg';
            dailyChart = new Chart(document.getElementById('dailyChart'), { type: 'bar', data, options: chartOptions(unit, roundedSuggestedMax(series.values)) });
        }

        function renderScrap(byMotive) {
            const rows = Object.entries(byMotive).map(([name, value]) => ({ name, value: Number(value || 0) })).sort((a, b) => b.value - a.value).slice(0, 5);
            document.getElementById('scrapRanking').innerHTML = rows.length ? rows.map(r => `<div class="rank-row"><div class="rank-name">${r.name}</div><div class="rank-value">${fmtKg(r.value)}</div></div>`).join('') : '<div class="loading">Sem refugo no periodo</div>';
        }

        function roundedSuggestedMax(values) {
            const max = Math.max(0, ...(values || []).map(Number));
            if (!max) return undefined;
            const padded = max * 1.18;
            const magnitude = Math.pow(10, Math.floor(Math.log10(padded)));
            const step = magnitude / 2;
            return Math.ceil(padded / step) * step;
        }

        function chartOptions(unit, suggestedMax) {
            return {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a1a1aa', font: { weight: 700 } } },
                    y: { beginAtZero: true, suggestedMax, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a1a1aa', callback: v => unit === 'kg' ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 't' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' } }
                },
                plugins: { legend: { labels: { color: '#d4d4d8', font: { weight: 800 } } } }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            initControls();
            loadMeetingDashboard();
            setInterval(loadMeetingDashboard, 300000);
        });
    </script>
    <script src="session-guard.js"></script>
</body>
</html>
