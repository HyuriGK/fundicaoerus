<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicação - SGP ERUS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js"></script>
    <style>
        :root {
            --font-main: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --color-primary: #fbbf24;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.6);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-lg: 16px;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.03), transparent 70%);
            min-height: 100vh;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin: 0;
        }

        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        select, textarea, input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.1);
        }

        .btn-send {
            background: var(--color-primary);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.2);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .history-table th {
            text-align: left;
            padding: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
        }

        .history-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .badge-all {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            transform: translateY(100px);
            transition: 0.5s;
            z-index: 100;
        }

        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-bullhorn" style="color: var(--color-primary); margin-right: 15px;"></i>Comunicação</h1>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        </header>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 1.2rem; margin-bottom: 20px;">Nova Mensagem</h2>
            <form id="commForm">
                <div class="form-group">
                    <label>Destinatário</label>
                    <select id="recipientSelect" required>
                        <option value="all">📢 Todos os Usuários</option>
                        <!-- Dynamic users here -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea id="messageContent" rows="4" placeholder="Digite aqui o aviso ou mensagem..." required></textarea>
                </div>
                <button type="submit" class="btn-send" id="btnSubmit">
                    <span>Enviar Mensagem</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <div class="card">
            <h2 style="margin-top: 0; font-size: 1.2rem; margin-bottom: 20px;">Histórico de Envios</h2>
            <div style="overflow-x: auto;">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Para</th>
                            <th>Mensagem</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <!-- History here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast">Mensagem enviada com sucesso!</div>

    <script>
        const API_BASE = '/api';
        const user = localStorage.getItem('erus_user') || 'Admin';
        const role = localStorage.getItem('erus_role') || 'Visitante';

        // Carregar usuários para o SELECT
        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/admin/users`, {
                    headers: { 'x-role': 'desenvolvedor' } // Bypass for load
                });
                const data = await res.json();
                const select = document.getElementById('recipientSelect');
                
                if(data.success) {
                    data.users.forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u.id;
                        opt.textContent = `👤 ${u.name} (@${u.username})`;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('Erro ao carregar usuários:', err);
            }
        }

        // Carregar Histórico
        async function loadHistory() {
            try {
                const res = await fetch(`${API_BASE}/communications/all`, {
                    headers: { 'x-user': user }
                });
                const data = await res.json();
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '';

                if(data.success) {
                    data.communications.forEach(c => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="white-space: nowrap;">${new Date(c.created_at).toLocaleString('pt-BR')}</td>
                            <td>${c.recipient_name ? `👤 ${c.recipient_name}` : '<span class="badge-all">📢 TODOS</span>'}</td>
                            <td title="${c.message}">${c.message.length > 50 ? c.message.substring(0, 50) + '...' : c.message}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error('Erro ao carregar histórico:', err);
            }
        }

        // Enviar Form
        document.getElementById('commForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const recipient = document.getElementById('recipientSelect').value;
            const message = document.getElementById('messageContent').value;

            btn.disabled = true;
            btn.style.opacity = '0.5';

            try {
                const res = await fetch(`${API_BASE}/communications`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-user': user
                    },
                    body: JSON.stringify({
                        recipient_id: recipient === 'all' ? null : recipient,
                        message: message
                    })
                });

                const data = await res.json();
                if(data.success) {
                    showToast('Mensagem enviada com sucesso!');
                    document.getElementById('commForm').reset();
                    loadHistory();
                } else {
                    alert('Erro: ' + data.message);
                }
            } catch (err) {
                alert('Erro ao conectar com o servidor.');
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Init
        loadUsers();
        loadHistory();
    </script>
</body>
</html>
