<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260703-sidebar-mobile5"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicação - SGP ERUS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js?v=20260605e"></script>
    <style>
        :root {
            --font-main: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --color-primary: #fbbf24;
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.6);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.03), transparent 70%);
            height: 100vh;
            overflow: hidden;
            padding: 28px 36px;
        }

        .container {
            width: auto;
            max-width: none;
            height: 100%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header.page-head {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header.page-head h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin: 0;
        }

        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-btn:hover { background: rgba(255,255,255,0.1); }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #commForm { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .card h2 { margin-top: 0; font-size: 1.2rem; margin-bottom: 20px; }
        .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .card-head h2 { margin: 0; }
        .btn-history {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle);
            color: var(--text-main); padding: 9px 16px; border-radius: 10px;
            font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.25s;
        }
        .btn-history:hover { background: rgba(251,191,36,0.1); border-color: var(--border-highlight, rgba(251,191,36,0.25)); color: var(--color-primary); }

        .compose-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }
        .compose-col { display: flex; flex-direction: column; min-height: 0; }
        #messageContent { flex: 1; min-height: 120px; resize: none; }
        @media (max-width: 860px) { .compose-grid { grid-template-columns: 1fr; } }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.1);
        }

        /* ---- Destinatários (checkboxes) ---- */
        .recipients-box {
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(24,24,27,0.7), rgba(9,9,11,0.5));
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .recipients-head {
            padding: 14px 14px 12px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(0,0,0,0.2);
        }
        .recipients-search {
            margin-top: 12px;
            font-size: 0.88rem;
            padding: 10px 12px;
            background: rgba(0,0,0,0.4);
        }
        .recipients-list {
            overflow-y: auto;
            overscroll-behavior: contain;
            flex: 1;
            padding: 8px;
            scrollbar-width: thin;
            scrollbar-color: #3f3f46 rgba(0,0,0,0.35);
        }
        .recipients-list::-webkit-scrollbar { width: 10px; }
        .recipients-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.35); border-radius: 8px; }
        .recipients-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; border: 2px solid rgba(0,0,0,0.35); }
        .recipients-list::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .user-check {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            font-size: 0.92rem;
            border: 1px solid transparent;
            margin-bottom: 2px;
        }
        .user-check:hover { background: rgba(255,255,255,0.05); }
        .user-check:has(input:checked) { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.25); }
        .user-check input { width: 17px; height: 17px; accent-color: var(--color-primary); cursor: pointer; flex-shrink: 0; }
        .user-avatar {
            width: 30px; height: 30px; flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #27272a, #18181b);
            border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 700; color: var(--color-primary);
        }
        .user-check .u-name { font-weight: 500; display: block; line-height: 1.25; }
        .user-check .u-username { color: var(--text-muted); font-size: 0.78rem; }
        .user-check.master { border-bottom: 1px dashed var(--border-subtle); border-radius: 0; font-weight: 700; }
        .recipients-count {
            font-size: 0.78rem; color: var(--text-muted);
            padding: 10px 14px; border-top: 1px solid var(--border-subtle);
            background: rgba(0,0,0,0.2);
        }

        /* ---- Expiração ---- */
        .expiry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .expiry-grid .field-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; }
        .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; }

        .btn-send {
            background: var(--color-primary);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-send:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(251, 191, 36, 0.2); }

        .history-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .history-table th { text-align: left; padding: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
        .history-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .history-table tbody tr { cursor: pointer; transition: background .15s; }
        .history-table tbody tr:hover { background: rgba(251,191,36,0.05); }

        .badge-all { background: rgba(59, 130, 246, 0.2); color: #3b82f6; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .badge-expired { background: rgba(239,68,68,0.18); color: #f87171; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .badge-active { background: rgba(16,185,129,0.18); color: #34d399; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }

        /* ---- Modal full-screen ---- */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 10001;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            display: none;
        }
        .modal-overlay.open { display: flex; }
        #msgModal { z-index: 10003; }
        .msg-modal-inner {
            width: 100%; height: 100%;
            background: var(--bg-body);
            display: flex; flex-direction: column;
            animation: fadeIn 0.25s ease-out;
        }
        .msg-modal-top {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .msg-modal-top h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
        .modal-close {
            width: 40px; height: 40px; border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.04); color: var(--text-muted);
            cursor: pointer; font-size: 1.1rem;
        }
        .modal-close:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .msg-modal-body {
            flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 32px 40px; width: 100%;
            scrollbar-width: thin; scrollbar-color: #3f3f46 rgba(0,0,0,0.35);
        }
        .msg-modal-body::-webkit-scrollbar { width: 10px; }
        .msg-modal-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.35); border-radius: 8px; }
        .msg-modal-body::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; border: 2px solid rgba(0,0,0,0.35); }
        .msg-modal-body::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 28px; }
        .info-item { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px 18px; }
        .info-item .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; }
        .info-item .v { font-size: 1.05rem; font-weight: 600; word-break: break-word; }
        .msg-full {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 12px; padding: 24px; font-size: 1.1rem; line-height: 1.7;
            white-space: pre-wrap; word-break: break-word;
        }

        #toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #10b981; color: #fff; padding: 12px 24px;
            border-radius: 8px; transform: translateY(100px); transition: 0.5s; z-index: 10002;
        }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-head">
                <h2><i class="fa-solid fa-bullhorn" style="color: var(--color-primary); margin-right: 10px;"></i>Nova Mensagem</h2>
                <button type="button" class="btn-history" onclick="openHistory()">
                    <i class="fa-solid fa-clock-rotate-left"></i> Histórico de Envios
                </button>
            </div>
            <form id="commForm">
                <div class="compose-grid">
                    <!-- COLUNA ESQUERDA: destinatários -->
                    <div class="compose-col">
                        <label>Destinatários</label>
                        <div class="recipients-box">
                            <div class="recipients-head">
                                <label class="user-check master" style="margin:0;padding:6px 4px;">
                                    <input type="checkbox" id="checkAll">
                                    <span class="u-name">📢 Todos os Usuários</span>
                                </label>
                                <input type="text" id="userSearch" class="recipients-search" placeholder="🔍 Filtrar usuários...">
                            </div>
                            <div class="recipients-list" id="recipientsList">
                                <!-- Checkboxes dinâmicos -->
                            </div>
                            <div class="recipients-count" id="recipientsCount">Nenhum usuário selecionado</div>
                        </div>
                    </div>

                    <!-- COLUNA DIREITA: mensagem + expiração -->
                    <div class="compose-col">
                        <label>Mensagem</label>
                        <textarea id="messageContent" rows="6" placeholder="Digite aqui o aviso ou mensagem..." required></textarea>

                        <div style="margin-top:20px;">
                            <label>Tempo ativo (some após esse período)</label>
                            <div class="expiry-grid">
                                <div>
                                    <span class="field-label" style="color:var(--text-muted);display:block;margin-bottom:6px;">Dias</span>
                                    <input type="number" id="expDays" min="0" value="0">
                                </div>
                                <div>
                                    <span class="field-label" style="color:var(--text-muted);display:block;margin-bottom:6px;">Horas</span>
                                    <input type="number" id="expHours" min="0" max="23" value="0">
                                </div>
                                <div>
                                    <span class="field-label" style="color:var(--text-muted);display:block;margin-bottom:6px;">Minutos</span>
                                    <input type="number" id="expMinutes" min="0" max="59" value="0">
                                </div>
                            </div>
                            <div class="hint">Deixe tudo em 0 para a mensagem ser <strong>permanente</strong> (sem expiração).</div>
                        </div>

                        <button type="submit" class="btn-send" id="btnSubmit">
                            <i class="fa-solid fa-paper-plane"></i><span>Enviar Mensagem</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

    </div>

    <!-- MODAL HISTÓRICO (full-screen) -->
    <div class="modal-overlay" id="historyModal">
        <div class="msg-modal-inner">
            <div class="msg-modal-top">
                <h2><i class="fa-solid fa-clock-rotate-left" style="color:var(--color-primary);margin-right:12px;"></i>Histórico de Envios</h2>
                <button class="modal-close" onclick="closeHistory()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="msg-modal-body">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Para</th>
                            <th>Mensagem</th>
                            <th>Validade</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <!-- History here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DETALHES (full-screen) -->
    <div class="modal-overlay" id="msgModal">
        <div class="msg-modal-inner">
            <div class="msg-modal-top">
                <h2><i class="fa-solid fa-envelope-open-text" style="color:var(--color-primary);margin-right:12px;"></i>Detalhes da Mensagem</h2>
                <button class="modal-close" onclick="closeMsgModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="msg-modal-body">
                <div class="info-grid" id="modalInfoGrid"></div>
                <label>Conteúdo</label>
                <div class="msg-full" id="modalMessage"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Mensagem enviada com sucesso!</div>

    <script>
        const API_BASE = '/api';
        const user = localStorage.getItem('erus_user') || 'Admin';
        const role = localStorage.getItem('erus_role') || 'Visitante';

        let allUsers = [];
        let allComms = [];

        // ---- Carregar usuários (checkboxes) ----
        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/admin/users`, { headers: { 'x-role': 'desenvolvedor' } });
                const data = await res.json();
                if (data.success) {
                    allUsers = data.users;
                    renderUsers(allUsers);
                }
            } catch (err) {
                console.error('Erro ao carregar usuários:', err);
            }
        }

        function renderUsers(list) {
            const box = document.getElementById('recipientsList');
            box.innerHTML = '';
            list.forEach(u => {
                const initial = (u.name || '?').trim().charAt(0).toUpperCase();
                const lbl = document.createElement('label');
                lbl.className = 'user-check';
                lbl.innerHTML = `
                    <input type="checkbox" class="user-cb" value="${u.id}">
                    <span class="user-avatar">${initial}</span>
                    <span><span class="u-name">${u.name}</span><span class="u-username">@${u.username}</span></span>
                `;
                box.appendChild(lbl);
            });
            box.querySelectorAll('.user-cb').forEach(cb => cb.addEventListener('change', onUserToggle));
            updateCount();
        }

        function getCheckedIds() {
            return Array.from(document.querySelectorAll('.user-cb:checked')).map(cb => cb.value);
        }

        function onUserToggle() {
            // Se marcar manualmente um usuário, desmarca "Todos"
            const checkAll = document.getElementById('checkAll');
            if (getCheckedIds().length > 0) checkAll.checked = false;
            updateCount();
        }

        function updateCount() {
            const checkAll = document.getElementById('checkAll');
            const el = document.getElementById('recipientsCount');
            if (checkAll.checked) { el.textContent = '📢 Enviando para TODOS os usuários'; return; }
            const n = getCheckedIds().length;
            el.textContent = n === 0 ? 'Nenhum usuário selecionado' : `${n} usuário(s) selecionado(s)`;
        }

        document.getElementById('checkAll').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.querySelectorAll('.user-cb').forEach(cb => cb.checked = false);
            }
            updateCount();
        });

        document.getElementById('userSearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u =>
                u.name.toLowerCase().includes(q) || (u.username || '').toLowerCase().includes(q));
            renderUsers(filtered);
        });

        // ---- Histórico ----
        async function loadHistory() {
            try {
                const res = await fetch(`${API_BASE}/communications/all`, { headers: { 'x-user': user } });
                const data = await res.json();
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = '';
                if (data.success) {
                    allComms = data.communications;
                    allComms.forEach(c => {
                        const tr = document.createElement('tr');
                        tr.onclick = () => openMsgModal(c.id);
                        tr.innerHTML = `
                            <td style="white-space: nowrap;">${new Date(c.created_at).toLocaleString('pt-BR')}</td>
                            <td>${c.recipient_name ? `👤 ${c.recipient_name}` : '<span class="badge-all">📢 TODOS</span>'}</td>
                            <td title="${escapeAttr(c.message)}">${c.message.length > 50 ? c.message.substring(0, 50) + '...' : c.message}</td>
                            <td>${validityBadge(c.valid_until)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error('Erro ao carregar histórico:', err);
            }
        }

        function validityBadge(valid_until) {
            if (!valid_until) return '<span class="badge-active">Permanente</span>';
            const exp = new Date(valid_until);
            if (exp < new Date()) return '<span class="badge-expired">Expirada</span>';
            return `<span class="badge-active">Ativa até ${exp.toLocaleString('pt-BR')}</span>`;
        }

        function escapeAttr(s) { return (s || '').replace(/"/g, '&quot;'); }

        // ---- Modal ----
        function openMsgModal(id) {
            const c = allComms.find(x => String(x.id) === String(id));
            if (!c) return;
            const exp = c.valid_until ? new Date(c.valid_until) : null;
            const expStr = !exp ? 'Permanente (sem expiração)' :
                (exp < new Date() ? `Expirada em ${exp.toLocaleString('pt-BR')}` : `Ativa até ${exp.toLocaleString('pt-BR')}`);

            document.getElementById('modalInfoGrid').innerHTML = `
                <div class="info-item"><div class="k">Destinatário</div><div class="v">${c.recipient_name ? '👤 ' + c.recipient_name : '📢 Todos os usuários'}</div></div>
                <div class="info-item"><div class="k">Remetente</div><div class="v">${c.sender_name || '—'}</div></div>
                <div class="info-item"><div class="k">Enviada em</div><div class="v">${new Date(c.created_at).toLocaleString('pt-BR')}</div></div>
                <div class="info-item"><div class="k">Validade</div><div class="v">${expStr}</div></div>
                ${c.subject ? `<div class="info-item"><div class="k">Assunto</div><div class="v">${c.subject}</div></div>` : ''}
                <div class="info-item"><div class="k">ID</div><div class="v">#${c.id}</div></div>
            `;
            document.getElementById('modalMessage').textContent = c.message;
            document.getElementById('msgModal').classList.add('open');
        }

        function closeMsgModal() { document.getElementById('msgModal').classList.remove('open'); }
        document.getElementById('msgModal').addEventListener('click', (e) => { if (e.target.id === 'msgModal') closeMsgModal(); });

        // ---- Modal Histórico ----
        function openHistory() { loadHistory(); document.getElementById('historyModal').classList.add('open'); }
        function closeHistory() { document.getElementById('historyModal').classList.remove('open'); }
        document.getElementById('historyModal').addEventListener('click', (e) => { if (e.target.id === 'historyModal') closeHistory(); });

        // ESC fecha o modal de cima primeiro
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (document.getElementById('msgModal').classList.contains('open')) { closeMsgModal(); return; }
            if (document.getElementById('historyModal').classList.contains('open')) closeHistory();
        });

        // ---- Enviar ----
        document.getElementById('commForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const message = document.getElementById('messageContent').value;
            const checkAll = document.getElementById('checkAll').checked;
            const ids = getCheckedIds();

            if (!checkAll && ids.length === 0) {
                alert('Selecione ao menos um usuário ou marque "Todos os Usuários".');
                return;
            }

            const payload = {
                recipient_ids: checkAll ? [] : ids,
                message: message,
                expiry_days: parseInt(document.getElementById('expDays').value) || 0,
                expiry_hours: parseInt(document.getElementById('expHours').value) || 0,
                expiry_minutes: parseInt(document.getElementById('expMinutes').value) || 0
            };

            btn.disabled = true;
            btn.style.opacity = '0.5';
            try {
                const res = await fetch(`${API_BASE}/communications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-user': user },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Mensagem enviada com sucesso!');
                    document.getElementById('commForm').reset();
                    document.querySelectorAll('.user-cb').forEach(cb => cb.checked = false);
                    updateCount();
                    loadHistory();
                } else {
                    alert('Erro: ' + data.message);
                }
            } catch (err) {
                alert('Erro ao conectar com o servidor.');
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        loadUsers();
        loadHistory();
    </script>
    <script src="session-guard.js"></script>
</body>
</html>
