<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, rgba(234, 88, 12, 0.1), transparent 50%);
        }
        .container { text-align: center; }
        h1 { margin-bottom: 30px; font-weight: 700; color: #f59e0b; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .menu-card {
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: #e4e4e7;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: #ea580c;
            background: rgba(234, 88, 12, 0.05);
            color: #fff;
        }

        .icon-box {
            font-size: 2rem;
            color: #f59e0b;
        }
        
        .card-title { font-weight: 600; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fundição Erus - Sistema Integrado</h1>
        <div class="menu-grid">
            
            <!-- Botão da Carteira -->
            <a href="carteira.html" class="menu-card">
                <div class="icon-box"><i class="fa-solid fa-briefcase"></i></div>
                <div class="card-title">Carteira de Pedidos</div>
            </a>

            <!-- Futuro Botão Produção (Exemplo) -->
            <a href="#" class="menu-card" style="opacity: 0.5; cursor: not-allowed;">
                <div class="icon-box"><i class="fa-solid fa-industry"></i></div>
                <div class="card-title">Produção (Em Breve)</div>
            </a>

        </div>
    </div>
</body>
</html>
