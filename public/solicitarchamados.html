<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/theme-manager.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Chamado TI - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js"></script>
    <style>
        *{user-select:none;-webkit-user-select:none;box-sizing:border-box}
        input,textarea,[contenteditable="true"]{user-select:text!important;-webkit-user-select:text!important;cursor:text}
        :root{
            --font-main:'Inter',sans-serif;
            --font-mono:'JetBrains Mono',monospace;
            --color-primary:#fbbf24;
            --color-primary-dim:#d97706;
            --bg-body:#09090b;
            --bg-card:rgba(24,24,27,0.85);
            --text-main:#f4f4f5;
            --text-muted:#a1a1aa;
            --border-subtle:rgba(255,255,255,0.08);
            --border-highlight:rgba(255,255,255,0.15);
            --status-success:#10b981;
            --status-danger:#ef4444;
            --status-info:#06b6d4;
            --status-warning:#f59e0b;
            --radius-md:12px;
        }
        html,body{height:100vh;width:100vw;overflow:hidden;margin:0;padding:0}
        body{
            font-family:var(--font-main);
            background-color:var(--bg-body);
            color:var(--text-main);
            background-image:
                radial-gradient(circle at 15% 50%,rgba(251,191,36,0.04),transparent 30%),
                radial-gradient(circle at 85% 20%,rgba(6,182,212,0.03),transparent 30%);
            display:flex;flex-direction:column;
        }
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px}

        /* ── Layout ── */
        .page-wrapper{
            display:flex;flex-direction:column;
            height:100vh;overflow:hidden;
        }
        .page-header{
            flex-shrink:0;
            padding:20px 32px 16px;
            border-bottom:1px solid var(--border-subtle);
            display:flex;align-items:center;justify-content:space-between;
            background:rgba(9,9,11,0.6);backdrop-filter:blur(8px);
        }
        .page-header-left{display:flex;align-items:center;gap:14px}
        .page-header-icon{
            width:42px;height:42px;border-radius:10px;
            background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.25);
            display:flex;align-items:center;justify-content:center;
            color:#06b6d4;font-size:1.1rem;flex-shrink:0;
        }
        .page-header h1{margin:0;font-size:1.2rem;font-weight:700;color:#fff}
        .page-header p{margin:2px 0 0;font-size:0.75rem;color:var(--text-muted)}
        .scroll-area{flex:1;overflow-y:auto;padding:28px 32px 32px}

        /* ── Grid ── */
        .content-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:24px;
            max-width:1100px;
        }

        /* ── Card ── */
        .card{
            background:var(--bg-card);
            border:1px solid var(--border-subtle);
            border-radius:16px;
            padding:28px;
            backdrop-filter:blur(10px);
        }
        .card-title{
            font-size:0.7rem;font-weight:700;text-transform:uppercase;
            letter-spacing:0.12em;color:var(--text-muted);
            margin:0 0 20px;display:flex;align-items:center;gap:8px;
        }
        .card-title i{font-size:0.8rem}

        /* ── Form ── */
        .form-group{margin-bottom:18px}
        .form-label{
            display:block;font-size:0.78rem;font-weight:600;
            color:var(--text-main);margin-bottom:7px;
        }
        .form-label span{color:var(--status-danger);margin-left:2px}
        .form-input{
            width:100%;background:rgba(255,255,255,0.04);
            border:1px solid var(--border-subtle);
            border-radius:8px;padding:10px 14px;
            color:var(--text-main);font-family:var(--font-main);
            font-size:0.85rem;outline:none;
            transition:border-color 0.2s,box-shadow 0.2s;
        }
        .form-input:focus{
            border-color:rgba(6,182,212,0.5);
            box-shadow:0 0 0 3px rgba(6,182,212,0.08);
        }
        textarea.form-input{resize:vertical;min-height:110px;line-height:1.5}

        /* ── Urgência ── */
        .urgencia-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        .urgencia-option{display:none}
        .urgencia-label{
            display:flex;flex-direction:column;align-items:center;gap:6px;
            padding:12px 8px;border-radius:10px;cursor:pointer;
            border:1.5px solid var(--border-subtle);
            background:rgba(255,255,255,0.02);
            transition:all 0.2s;text-align:center;
        }
        .urgencia-label:hover{background:rgba(255,255,255,0.05)}
        .urgencia-label i{font-size:1.1rem;transition:color 0.2s}
        .urgencia-label span{font-size:0.72rem;font-weight:600;color:var(--text-muted);transition:color 0.2s;text-transform:uppercase;letter-spacing:0.06em}

        .urgencia-option:checked + .urgencia-label{border-width:2px}
        #urg-baixa:checked + .urgencia-label{border-color:#10b981;background:rgba(16,185,129,0.08)}
        #urg-baixa:checked + .urgencia-label i,
        #urg-baixa:checked + .urgencia-label span{color:#10b981}
        #urg-media:checked + .urgencia-label{border-color:#f59e0b;background:rgba(245,158,11,0.08)}
        #urg-media:checked + .urgencia-label i,
        #urg-media:checked + .urgencia-label span{color:#f59e0b}
        #urg-alta:checked + .urgencia-label{border-color:#ef4444;background:rgba(239,68,68,0.08)}
        #urg-alta:checked + .urgencia-label i,
        #urg-alta:checked + .urgencia-label span{color:#ef4444}
        #urg-critica:checked + .urgencia-label{border-color:#a855f7;background:rgba(168,85,247,0.1)}
        #urg-critica:checked + .urgencia-label i,
        #urg-critica:checked + .urgencia-label span{color:#a855f7}

        /* ── Botão ── */
        .btn-submit{
            width:100%;padding:13px;border:none;border-radius:10px;
            background:linear-gradient(135deg,#06b6d4,#0891b2);
            color:#fff;font-family:var(--font-main);font-size:0.9rem;
            font-weight:700;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:9px;
            transition:all 0.2s;letter-spacing:0.02em;
            box-shadow:0 4px 14px rgba(6,182,212,0.25);
        }
        .btn-submit:hover:not(:disabled){
            background:linear-gradient(135deg,#22d3ee,#06b6d4);
            box-shadow:0 6px 20px rgba(6,182,212,0.35);transform:translateY(-1px);
        }
        .btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none}

        /* ── Sucesso ── */
        .success-banner{
            display:none;align-items:center;gap:12px;
            padding:14px 18px;border-radius:10px;
            background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);
            margin-bottom:18px;
        }
        .success-banner.show{display:flex}
        .success-banner i{color:#10b981;font-size:1.1rem;flex-shrink:0}
        .success-banner span{font-size:0.85rem;font-weight:500;color:#10b981}

        /* ── Lista de chamados do usuário ── */
        .empty-state{
            text-align:center;padding:48px 20px;
            color:var(--text-muted);
        }
        .empty-state i{font-size:2.5rem;margin-bottom:12px;display:block;opacity:0.3}
        .empty-state p{margin:0;font-size:0.85rem}

        .chamado-item{
            padding:16px 18px;border-radius:10px;
            border:1px solid var(--border-subtle);
            background:rgba(255,255,255,0.02);
            margin-bottom:10px;transition:border-color 0.2s;
        }
        .chamado-item:hover{border-color:rgba(255,255,255,0.12)}
        .chamado-item-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
        .chamado-titulo{font-size:0.88rem;font-weight:600;color:#fff;line-height:1.3}
        .chamado-badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
        .badge{
            display:inline-flex;align-items:center;gap:4px;
            padding:3px 9px;border-radius:20px;
            font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
        }
        .badge-baixa{background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.25)}
        .badge-media{background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.25)}
        .badge-alta{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.25)}
        .badge-critica{background:rgba(168,85,247,0.12);color:#a855f7;border:1px solid rgba(168,85,247,0.25)}
        .badge-aberto{background:rgba(6,182,212,0.1);color:#06b6d4;border:1px solid rgba(6,182,212,0.2)}
        .badge-em_andamento{background:rgba(251,191,36,0.1);color:#fbbf24;border:1px solid rgba(251,191,36,0.2)}
        .badge-resolvido{background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.2)}
        .chamado-desc{font-size:0.78rem;color:var(--text-muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chamado-meta{font-size:0.7rem;color:#52525b;margin-top:8px}
        .chamado-resolucao{
            margin-top:10px;padding:10px 12px;border-radius:8px;
            background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);
            font-size:0.78rem;color:#6ee7b7;line-height:1.4;
        }
        .chamado-resolucao strong{display:block;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:#10b981;margin-bottom:3px}

        /* ── User info ── */
        .user-chip{
            display:flex;align-items:center;gap:8px;
            padding:6px 12px;border-radius:8px;
            background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);
            font-size:0.78rem;color:var(--text-muted);
        }
        .user-chip i{color:var(--color-primary);font-size:0.8rem}
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="page-header">
        <div class="page-header-left">
            <div class="page-header-icon"><i class="fa-solid fa-headset"></i></div>
            <div>
                <h1>Solicitar Chamado TI</h1>
                <p>Abra uma solicitação para o setor de Tecnologia da Informação</p>
            </div>
        </div>
        <div class="user-chip" id="userChip">
            <i class="fa-solid fa-circle-user"></i>
            <span id="userChipName">Carregando...</span>
        </div>
    </div>

    <div class="scroll-area">
        <div class="content-grid">

            <!-- COLUNA ESQUERDA: Formulário -->
            <div>
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-plus-circle" style="color:#06b6d4"></i> Novo Chamado</div>

                    <div id="successBanner" class="success-banner">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Chamado aberto com sucesso! O setor de TI foi notificado.</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="titulo">Título do Chamado <span>*</span></label>
                        <input type="text" id="titulo" class="form-input" placeholder="Ex: Computador não liga, Impressora com erro..." maxlength="200">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="descricao">Descrição Detalhada</label>
                        <textarea id="descricao" class="form-input" placeholder="Descreva o problema com o máximo de detalhes possível: o que aconteceu, quando começou, o que você tentou fazer..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nível de Urgência <span>*</span></label>
                        <div class="urgencia-grid">
                            <div>
                                <input type="radio" name="urgencia" id="urg-baixa" class="urgencia-option" value="baixa">
                                <label for="urg-baixa" class="urgencia-label">
                                    <i class="fa-solid fa-circle-check" style="color:#52525b"></i>
                                    <span>Baixa</span>
                                </label>
                            </div>
                            <div>
                                <input type="radio" name="urgencia" id="urg-media" class="urgencia-option" value="media" checked>
                                <label for="urg-media" class="urgencia-label">
                                    <i class="fa-solid fa-circle-minus" style="color:#52525b"></i>
                                    <span>Média</span>
                                </label>
                            </div>
                            <div>
                                <input type="radio" name="urgencia" id="urg-alta" class="urgencia-option" value="alta">
                                <label for="urg-alta" class="urgencia-label">
                                    <i class="fa-solid fa-circle-exclamation" style="color:#52525b"></i>
                                    <span>Alta</span>
                                </label>
                            </div>
                            <div>
                                <input type="radio" name="urgencia" id="urg-critica" class="urgencia-option" value="critica">
                                <label for="urg-critica" class="urgencia-label">
                                    <i class="fa-solid fa-triangle-exclamation" style="color:#52525b"></i>
                                    <span>Crítica</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <button class="btn-submit" id="btnSubmit" onclick="submitChamado()">
                        <i class="fa-solid fa-paper-plane"></i> Enviar Chamado
                    </button>
                </div>
            </div>

            <!-- COLUNA DIREITA: Histórico do usuário -->
            <div>
                <div class="card" style="height:100%;display:flex;flex-direction:column;">
                    <div class="card-title" style="margin-bottom:16px">
                        <i class="fa-solid fa-clock-rotate-left" style="color:#fbbf24"></i>
                        Meus Chamados
                        <span id="countBadge" style="margin-left:auto;font-size:0.7rem;background:rgba(255,255,255,0.06);border:1px solid var(--border-subtle);border-radius:6px;padding:2px 8px;text-transform:none;letter-spacing:0;color:var(--text-muted)"></span>
                    </div>
                    <div id="listaChamados" style="flex:1;overflow-y:auto;">
                        <div class="empty-state">
                            <i class="fa-solid fa-inbox"></i>
                            <p>Carregando seus chamados...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const usuario = localStorage.getItem('erus_user') || 'Usuário';
    document.getElementById('userChipName').textContent = usuario;

    const urgLabels = { baixa: 'Baixa', media: 'Média', alta: 'Alta', critica: 'Crítica' };
    const statusLabels = { aberto: 'Aberto', em_andamento: 'Em Andamento', resolvido: 'Resolvido' };

    function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function badgeUrgencia(u) {
        return `<span class="badge badge-${u}"><i class="fa-solid fa-${u === 'baixa' ? 'circle-check' : u === 'media' ? 'circle-minus' : u === 'alta' ? 'circle-exclamation' : 'triangle-exclamation'}"></i>${urgLabels[u] || u}</span>`;
    }

    function badgeStatus(s) {
        return `<span class="badge badge-${s}">${statusLabels[s] || s}</span>`;
    }

    async function loadMeusChamados() {
        try {
            const r = await fetch(`/api/chamados?usuario=${encodeURIComponent(usuario)}`);
            const data = await r.json();
            const el = document.getElementById('listaChamados');
            const count = document.getElementById('countBadge');
            count.textContent = data.length + (data.length === 1 ? ' chamado' : ' chamados');

            if (!data.length) {
                el.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Você ainda não abriu nenhum chamado.</p></div>`;
                return;
            }

            el.innerHTML = data.map(c => `
                <div class="chamado-item">
                    <div class="chamado-item-header">
                        <div class="chamado-titulo">${c.titulo}</div>
                        <div class="chamado-badges">${badgeUrgencia(c.urgencia)}${badgeStatus(c.status)}</div>
                    </div>
                    ${c.descricao ? `<div class="chamado-desc">${c.descricao}</div>` : ''}
                    <div class="chamado-meta"><i class="fa-regular fa-clock" style="margin-right:4px"></i>${formatDate(c.criado_em)}</div>
                    ${c.status === 'resolvido' && c.resolucao ? `<div class="chamado-resolucao"><strong><i class="fa-solid fa-check"></i> Resolução TI</strong>${c.resolucao}</div>` : ''}
                </div>
            `).join('');
        } catch(e) {
            document.getElementById('listaChamados').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Erro ao carregar chamados.</p></div>`;
        }
    }

    async function submitChamado() {
        const titulo = document.getElementById('titulo').value.trim();
        const descricao = document.getElementById('descricao').value.trim();
        const urgencia = document.querySelector('input[name="urgencia"]:checked')?.value || 'media';

        if (!titulo) {
            document.getElementById('titulo').focus();
            document.getElementById('titulo').style.borderColor = 'rgba(239,68,68,0.6)';
            return;
        }
        document.getElementById('titulo').style.borderColor = '';

        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Enviando...';

        try {
            const r = await fetch('/api/chamados', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, descricao, urgencia, usuario })
            });
            if (!r.ok) throw new Error('Erro ao salvar');

            document.getElementById('titulo').value = '';
            document.getElementById('descricao').value = '';
            document.getElementById('urg-media').checked = true;

            const banner = document.getElementById('successBanner');
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 4000);

            loadMeusChamados();
        } catch(e) {
            alert('Erro ao abrir chamado: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Chamado';
        }
    }

    loadMeusChamados();
</script>
</body>
</html>
