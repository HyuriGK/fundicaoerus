<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260601e"></script>
    <script src="js/theme-manager.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamados TI - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/activity-logger.js?v=20260601c"></script>
    <style>
        *{user-select:none;-webkit-user-select:none;box-sizing:border-box}
        input,textarea,[contenteditable="true"]{user-select:text!important;-webkit-user-select:text!important;cursor:text}
        :root{
            --font-main:'Inter',sans-serif;
            --font-mono:'JetBrains Mono',monospace;
            --color-primary:#fbbf24;
            --bg-body:#09090b;
            --bg-card:rgba(24,24,27,0.85);
            --text-main:#f4f4f5;
            --text-muted:#a1a1aa;
            --border-subtle:rgba(255,255,255,0.08);
            --border-highlight:rgba(255,255,255,0.15);
            --status-success:#10b981;
            --status-danger:#ef4444;
            --status-info:#06b6d4;
            --status-warning:#f59e0b;
        }
        html,body{height:100vh;width:100vw;overflow:hidden;margin:0;padding:0}
        body{
            font-family:var(--font-main);
            background-color:var(--bg-body);
            color:var(--text-main);
            background-image:
                radial-gradient(circle at 10% 40%,rgba(251,191,36,0.03),transparent 30%),
                radial-gradient(circle at 90% 10%,rgba(6,182,212,0.03),transparent 30%);
            display:flex;flex-direction:column;
        }
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px}

        /* ── Layout ── */
        .page-wrapper{display:flex;flex-direction:column;height:100vh;overflow:hidden}
        .page-header{
            flex-shrink:0;padding:18px 32px 14px;
            border-bottom:1px solid var(--border-subtle);
            display:flex;align-items:center;justify-content:space-between;gap:16px;
            background:rgba(9,9,11,0.6);backdrop-filter:blur(8px);
        }
        .page-header-left{display:flex;align-items:center;gap:14px}
        .page-header-icon{
            width:40px;height:40px;border-radius:10px;
            background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.25);
            display:flex;align-items:center;justify-content:center;
            color:#a855f7;font-size:1.05rem;flex-shrink:0;
        }
        .page-header h1{margin:0;font-size:1.15rem;font-weight:700;color:#fff}
        .page-header p{margin:2px 0 0;font-size:0.72rem;color:var(--text-muted)}

        .header-filters{display:flex;gap:8px;align-items:center}
        .filter-btn{
            padding:7px 14px;border-radius:8px;font-size:0.78rem;font-weight:600;
            border:1px solid var(--border-subtle);background:rgba(255,255,255,0.03);
            color:var(--text-muted);cursor:pointer;font-family:var(--font-main);
            transition:all 0.2s;white-space:nowrap;
        }
        .filter-btn:hover{background:rgba(255,255,255,0.06);color:#fff}
        .filter-btn.active{background:rgba(168,85,247,0.1);border-color:rgba(168,85,247,0.35);color:#a855f7}
        .filter-btn.active-aberto{background:rgba(6,182,212,0.1);border-color:rgba(6,182,212,0.35);color:#06b6d4}
        .filter-btn.active-andamento{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.35);color:#fbbf24}
        .filter-btn.active-resolvido{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.35);color:#10b981}

        .scroll-area{flex:1;overflow:hidden;padding:24px 32px 28px;display:flex;flex-direction:column}

        /* ── KPI cards ── */
        .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;flex-shrink:0}
        .kpi-card{
            background:var(--bg-card);border:1px solid var(--border-subtle);
            border-radius:14px;padding:18px 20px;
            display:flex;align-items:center;gap:16px;
            transition:border-color 0.2s;
        }
        .kpi-card:hover{border-color:var(--border-highlight)}
        .kpi-icon{
            width:44px;height:44px;border-radius:10px;
            display:flex;align-items:center;justify-content:center;
            font-size:1.1rem;flex-shrink:0;
        }
        .kpi-info{min-width:0}
        .kpi-value{font-size:1.7rem;font-weight:800;line-height:1;color:#fff;font-family:var(--font-mono)}
        .kpi-label{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-top:3px}

        /* ── Table card ── */
        .table-card{
            background:var(--bg-card);border:1px solid var(--border-subtle);
            border-radius:16px;overflow:hidden;
            flex:1;min-height:0;display:flex;flex-direction:column;
        }
        #tableArea{flex:1;overflow-y:auto;min-height:0}
        .table-header{
            padding:16px 22px;border-bottom:1px solid var(--border-subtle);
            display:flex;align-items:center;justify-content:space-between;gap:12px;
        }
        .table-title{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);display:flex;align-items:center;gap:8px}
        .search-input{
            width:220px;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);
            border-radius:8px;padding:7px 12px;color:var(--text-main);font-family:var(--font-main);
            font-size:0.82rem;outline:none;transition:border-color 0.2s;
        }
        .search-input:focus{border-color:rgba(168,85,247,0.4)}

        table{width:100%;border-collapse:collapse}
        thead th{
            padding:10px 16px;text-align:left;
            font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;
            color:#52525b;border-bottom:1px solid var(--border-subtle);
            white-space:nowrap;
        }
        tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.15s}
        tbody tr:last-child{border-bottom:none}
        tbody tr:hover{background:rgba(255,255,255,0.03)}
        tbody td{padding:13px 16px;font-size:0.82rem;color:var(--text-main);vertical-align:middle}

        .td-titulo{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
        .td-usuario{color:var(--text-muted);font-size:0.78rem}
        .td-date{color:#52525b;font-size:0.75rem;font-family:var(--font-mono);white-space:nowrap}
        .td-tempo{color:#a1a1aa;font-size:0.75rem;font-family:var(--font-mono);white-space:nowrap}
        thead{position:sticky;top:0;z-index:1;background:#111113}

        /* ── Badges ── */
        .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
        .badge-baixa{background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.25)}
        .badge-media{background:rgba(245,158,11,0.12);color:#f59e0b;border:1px solid rgba(245,158,11,0.25)}
        .badge-alta{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.25)}
        .badge-critica{background:rgba(168,85,247,0.12);color:#a855f7;border:1px solid rgba(168,85,247,0.25)}
        .badge-aberto{background:rgba(6,182,212,0.1);color:#06b6d4;border:1px solid rgba(6,182,212,0.2)}
        .badge-em_andamento{background:rgba(251,191,36,0.1);color:#fbbf24;border:1px solid rgba(251,191,36,0.2)}
        .badge-resolvido{background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.2)}

        .empty-state{padding:60px;text-align:center;color:var(--text-muted)}
        .empty-state i{font-size:2.5rem;display:block;margin-bottom:12px;opacity:0.25}
        .empty-state p{margin:0;font-size:0.85rem}

        /* ── Modal ── */
        .modal-overlay{
            display:none;position:fixed;inset:0;z-index:2000;
            align-items:stretch;justify-content:stretch;
            background:rgba(0,0,0,0.72);backdrop-filter:blur(6px);
            padding:20px 24px;
        }
        .modal-overlay.open{display:flex}
        .modal-box{
            width:100%;max-width:none;height:100%;max-height:none;
            background:#111113;border:1px solid rgba(255,255,255,0.1);
            border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
            box-shadow:0 30px 60px rgba(0,0,0,0.6);
        }
        .modal-head{
            padding:22px 26px 18px;border-bottom:1px solid var(--border-subtle);
            display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
        }
        .modal-head-left{display:flex;flex-direction:column;gap:6px;min-width:0}
        .modal-chamado-titulo{font-size:1.05rem;font-weight:700;color:#fff;line-height:1.3}
        .modal-badges{display:flex;gap:6px;flex-wrap:wrap}
        .modal-close{
            width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);
            background:rgba(255,255,255,0.04);color:var(--text-muted);
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            font-size:1rem;transition:all 0.2s;flex-shrink:0;
        }
        .modal-close:hover{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#ef4444}

        .modal-body{padding:22px 26px;overflow-y:auto;flex:1}
        .modal-section{margin-bottom:20px}
        .modal-section-label{
            font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;
            color:#52525b;margin-bottom:8px;
        }
        .modal-section-value{
            font-size:0.85rem;color:var(--text-muted);line-height:1.6;
            background:rgba(255,255,255,0.02);border:1px solid var(--border-subtle);
            border-radius:8px;padding:12px 14px;
        }
        .modal-meta-row{
            display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;
        }
        .modal-meta-item{
            background:rgba(255,255,255,0.02);border:1px solid var(--border-subtle);
            border-radius:8px;padding:12px 14px;
        }
        .modal-meta-item label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#52525b;display:block;margin-bottom:4px}
        .modal-meta-item span{font-size:0.83rem;color:var(--text-main);font-weight:500}

        .status-select{
            width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);
            border-radius:8px;padding:10px 12px;color:var(--text-main);
            font-family:var(--font-main);font-size:0.85rem;outline:none;
            cursor:pointer;transition:border-color 0.2s;
        }
        .status-select:focus{border-color:rgba(168,85,247,0.45)}
        .status-select option{background:#18181b}

        textarea.modal-textarea{
            width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);
            border-radius:8px;padding:10px 14px;color:var(--text-main);
            font-family:var(--font-main);font-size:0.84rem;outline:none;
            resize:vertical;min-height:110px;line-height:1.5;
            transition:border-color 0.2s;
        }
        textarea.modal-textarea:focus{border-color:rgba(168,85,247,0.45)}

        .modal-footer{
            padding:16px 26px;border-top:1px solid var(--border-subtle);
            display:flex;gap:10px;justify-content:flex-end;
        }
        .btn-cancel{
            padding:9px 20px;border-radius:8px;border:1px solid var(--border-subtle);
            background:rgba(255,255,255,0.04);color:var(--text-muted);
            cursor:pointer;font-family:var(--font-main);font-size:0.84rem;font-weight:600;
            transition:all 0.2s;
        }
        .btn-cancel:hover{background:rgba(255,255,255,0.08);color:#fff}
        .btn-save{
            padding:9px 22px;border-radius:8px;border:none;
            background:linear-gradient(135deg,#a855f7,#7c3aed);
            color:#fff;cursor:pointer;font-family:var(--font-main);
            font-size:0.84rem;font-weight:700;
            display:flex;align-items:center;gap:7px;
            transition:all 0.2s;box-shadow:0 4px 12px rgba(168,85,247,0.3);
        }
        .btn-save:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 6px 18px rgba(168,85,247,0.4)}
        .btn-save:disabled{opacity:0.5;cursor:not-allowed}
        .btn-delete{
            padding:9px 16px;border-radius:8px;
            border:1px solid rgba(239,68,68,0.25);
            background:rgba(239,68,68,0.06);color:#ef4444;
            cursor:pointer;font-family:var(--font-main);font-size:0.84rem;font-weight:600;
            transition:all 0.2s;margin-right:auto;
        }
        .btn-delete:hover{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4)}

        /* ── Anexo no modal ── */
        .modal-anexo-wrap{
            border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle);
            background:#0a0a0c;position:relative;cursor:zoom-in;
        }
        .modal-anexo-wrap img{
            width:100%;max-height:380px;object-fit:contain;display:block;
            transition:opacity 0.15s;
        }
        .modal-anexo-wrap:hover img{opacity:0.9}
        .modal-anexo-bar{
            display:flex;align-items:center;justify-content:space-between;
            padding:7px 10px;background:rgba(0,0,0,0.55);border-top:1px solid var(--border-subtle);
        }
        .modal-anexo-name{font-size:0.72rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 70px)}
        .modal-anexo-actions{display:flex;gap:6px;flex-shrink:0}
        .btn-icon-sm{
            width:28px;height:28px;border-radius:6px;border:1px solid var(--border-subtle);
            background:rgba(255,255,255,0.05);color:var(--text-muted);
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            font-size:0.78rem;transition:all 0.2s;
        }
        .btn-icon-sm:hover{background:rgba(255,255,255,0.12);color:#fff}

        /* ── Lightbox ── */
        .lb-overlay{
            display:none;position:fixed;inset:0;z-index:9000;
            background:rgba(0,0,0,0.92);
            align-items:center;justify-content:center;
            flex-direction:column;
        }
        .lb-overlay.open{display:flex}
        .lb-toolbar{
            position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:9001;
        }
        .lb-btn{
            width:38px;height:38px;border-radius:9px;
            border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);
            color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
            font-size:0.95rem;transition:all 0.2s;
        }
        .lb-btn:hover{background:rgba(255,255,255,0.15)}
        .lb-canvas{
            position:relative;width:100%;height:100%;
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;cursor:grab;
        }
        .lb-canvas.dragging{cursor:grabbing}
        .lb-img{
            max-width:none;max-height:none;
            transform-origin:center center;
            user-select:none;-webkit-user-select:none;pointer-events:none;
        }
        .lb-hint{
            position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
            font-size:0.7rem;color:rgba(255,255,255,0.3);white-space:nowrap;
            pointer-events:none;
        }
    </style>
</head>
<body>
<div class="page-wrapper">

    <!-- Header -->
    <div class="page-header">
        <div class="page-header-left">
            <div class="page-header-icon"><i class="fa-solid fa-ticket"></i></div>
            <div>
                <h1>Painel de Chamados TI</h1>
                <p>Gerencie e resolva os chamados abertos pelos colaboradores</p>
            </div>
        </div>
        <div class="header-filters">
            <button class="filter-btn active" id="f-todos" onclick="setFilter('todos')">Todos</button>
            <button class="filter-btn" id="f-aberto" onclick="setFilter('aberto')">Abertos</button>
            <button class="filter-btn" id="f-em_andamento" onclick="setFilter('em_andamento')">Em Andamento</button>
            <button class="filter-btn" id="f-resolvido" onclick="setFilter('resolvido')">Resolvidos</button>
            <button class="filter-btn" onclick="loadChamados()" style="border-color:rgba(168,85,247,0.3);color:#a855f7"> </button>
        </div>
    </div>

    <div class="scroll-area">

        <!-- KPIs -->
        <div class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle)">
                    <i class="fa-solid fa-ticket" style="color:var(--text-muted)"></i>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-total">—</div>
                    <div class="kpi-label">Total</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.2)">
                    <i class="fa-solid fa-inbox" style="color:#06b6d4"></i>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-abertos" style="color:#06b6d4">—</div>
                    <div class="kpi-label">Abertos</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2)">
                    <i class="fa-solid fa-circle-half-stroke" style="color:#fbbf24"></i>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-andamento" style="color:#fbbf24">—</div>
                    <div class="kpi-label">Em Andamento</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon" style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2)">
                    <i class="fa-solid fa-circle-check" style="color:#10b981"></i>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-resolvidos" style="color:#10b981">—</div>
                    <div class="kpi-label">Resolvidos</div>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="table-card">
            <div class="table-header">
                <div class="table-title"><i class="fa-solid fa-list-check" style="color:#a855f7"></i> Chamados</div>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar chamado..." oninput="renderTable()">
            </div>
            <div id="tableArea"></div>
        </div>

    </div>
</div>

<!-- Modal detalhe -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
        <div class="modal-head">
            <div class="modal-head-left">
                <div class="modal-chamado-titulo" id="modalTitulo"></div>
                <div class="modal-badges" id="modalBadges"></div>
            </div>
            <button class="modal-close" onclick="closeModal()"> </button>
        </div>
        <div class="modal-body">
            <div class="modal-meta-row">
                <div class="modal-meta-item">
                    <label><i class="fa-solid fa-user" style="margin-right:4px"></i> Solicitante</label>
                    <span id="modalUsuario"></span>
                </div>
                <div class="modal-meta-item">
                    <label><i class="fa-regular fa-clock" style="margin-right:4px"></i> Aberto em</label>
                    <span id="modalData"></span>
                </div>
                <div class="modal-meta-item">
                    <label><i class="fa-solid fa-stopwatch" style="margin-right:4px"></i> Tempo de resolução</label>
                    <span id="modalTempo">—</span>
                </div>
            </div>
            <div class="modal-section">
                <div class="modal-section-label">Descrição</div>
                <div class="modal-section-value" id="modalDesc"></div>
            </div>
            <div class="modal-section" id="modalAnexoSection" style="display:none">
                <div class="modal-section-label"><i class="fa-solid fa-image" style="margin-right:4px"></i>Anexo</div>
                <div class="modal-anexo-wrap" onclick="openLightbox()">
                    <img id="modalAnexoImg" src="" alt="anexo">
                    <div class="modal-anexo-bar">
                        <span class="modal-anexo-name" id="modalAnexoName"></span>
                        <div class="modal-anexo-actions">
                            <button class="btn-icon-sm" onclick="event.stopPropagation();downloadAnexo()" title="Baixar"> </button>
                            <button class="btn-icon-sm" onclick="event.stopPropagation();openLightbox()" title="Zoom"> </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-section">
                <div class="modal-section-label">Alterar Status</div>
                <select class="status-select" id="modalStatus">
                    <option value="aberto">Aberto</option>
                    <option value="em_andamento">Em Andamento</option>
                    <option value="resolvido">Resolvido</option>
                </select>
            </div>
            <div class="modal-section">
                <div class="modal-section-label">Resolução / Observações TI</div>
                <textarea class="modal-textarea" id="modalResolucao" placeholder="Descreva o que foi feito para resolver o chamado..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-delete" onclick="deleteChamado()" title="Excluir chamado"> </button>
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-save" id="btnSave" onclick="saveChamado()"> Salvar
 </button>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div class="lb-overlay" id="lbOverlay">
    <div class="lb-toolbar">
        <button class="lb-btn" onclick="lbZoom(0.25)" title="Zoom +"> </button>
        <button class="lb-btn" onclick="lbZoom(-0.25)" title="Zoom −"> </button>
        <button class="lb-btn" onclick="lbReset()" title="Resetar"> </button>
        <button class="lb-btn" onclick="downloadAnexo()" title="Baixar"> </button>
        <button class="lb-btn" onclick="closeLightbox()" title="Fechar"> </button>
    </div>
    <div class="lb-canvas" id="lbCanvas">
        <img class="lb-img" id="lbImg" src="" alt="anexo ampliado" draggable="false">
    </div>
    <div class="lb-hint">Scroll para zoom · Arraste para mover · ESC para fechar</div>
</div>

<script>
    // Acesso restrito a desenvolvedor
    const role = (localStorage.getItem('erus_role') || '').toLowerCase();
    if (role !== 'desenvolvedor') {
        document.querySelector('.page-wrapper').innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;color:#a1a1aa">
                <i class="fa-solid fa-lock" style="font-size:3rem;opacity:0.3"></i>
                <p style="margin:0;font-size:1rem">Acesso restrito ao setor de TI.</p>
                <a href="index.html" style="color:#fbbf24;font-size:0.85rem;text-decoration:none">← Voltar ao início</a>
            </div>`;
    }

    const urgLabels = { baixa:'Baixa', media:'Média', alta:'Alta', critica:'Crítica' };
    const urgIcons  = { baixa:'circle-check', media:'circle-minus', alta:'circle-exclamation', critica:'triangle-exclamation' };
    const statusLabels = { aberto:'Aberto', em_andamento:'Em Andamento', resolvido:'Resolvido' };

    let allChamados = [];
    let currentFilter = 'todos';
    let currentId = null;

    function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function formatDuration(criado, resolvido) {
        if (!criado || !resolvido) return '—';
        const diff = new Date(resolvido) - new Date(criado);
        if (diff < 0) return '—';
        const mins  = Math.floor(diff / 60000);
        const hours = Math.floor(mins / 60);
        const days  = Math.floor(hours / 24);
        if (days > 0)  return `${days}d ${hours % 24}h ${mins % 60}min`;
        if (hours > 0) return `${hours}h ${mins % 60}min`;
        return `${mins}min`;
    }

    function badgeUrgencia(u) {
        return `<span class="badge badge-${u}"><i class="fa-solid fa-${urgIcons[u]||'circle'}"></i>${urgLabels[u]||u}</span>`;
    }
    function badgeStatus(s) {
        return `<span class="badge badge-${s}">${statusLabels[s]||s}</span>`;
    }

    async function loadChamados() {
        try {
            const r = await fetch('/api/chamados?todos=1');
            allChamados = await r.json();
            updateKPIs();
            renderTable();
        } catch(e) {
            document.getElementById('tableArea').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Erro ao carregar chamados.</p></div>`;
        }
    }

    function updateKPIs() {
        document.getElementById('kpi-total').textContent     = allChamados.length;
        document.getElementById('kpi-abertos').textContent   = allChamados.filter(c=>c.status==='aberto').length;
        document.getElementById('kpi-andamento').textContent = allChamados.filter(c=>c.status==='em_andamento').length;
        document.getElementById('kpi-resolvidos').textContent= allChamados.filter(c=>c.status==='resolvido').length;
    }

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn[id^="f-"]').forEach(b => {
            b.className = 'filter-btn';
            if (b.id === 'f-' + f) {
                b.classList.add(f === 'todos' ? 'active' : ('active-' + (f === 'em_andamento' ? 'andamento' : f)));
            }
        });
        renderTable();
    }

    function renderTable() {
        const q = (document.getElementById('searchInput').value || '').toLowerCase();
        let data = currentFilter === 'todos' ? allChamados : allChamados.filter(c => c.status === currentFilter);
        if (q) data = data.filter(c =>
            (c.titulo||'').toLowerCase().includes(q) ||
            (c.usuario||'').toLowerCase().includes(q) ||
            (c.descricao||'').toLowerCase().includes(q)
        );

        const area = document.getElementById('tableArea');
        if (!data.length) {
            area.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>Nenhum chamado encontrado.</p></div>`;
            return;
        }

        area.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Título</th>
                    <th>Solicitante</th>
                    <th>Urgência</th>
                    <th>Status</th>
                    <th>Aberto em</th>
                    <th>Tempo resolução</th>
                </tr>
            </thead>
            <tbody>
                ${data.map(c => `
                <tr onclick="openModal(${c.id})">
                    <td style="font-family:var(--font-mono);color:#52525b;font-size:0.75rem">#${c.id}</td>
                    <td class="td-titulo">${c.titulo}</td>
                    <td class="td-usuario"><i class="fa-solid fa-circle-user" style="margin-right:5px;opacity:0.5"></i>${c.usuario}</td>
                    <td>${badgeUrgencia(c.urgencia)}</td>
                    <td>${badgeStatus(c.status)}</td>
                    <td class="td-date">${formatDate(c.criado_em)}</td>
                    <td class="td-tempo">${formatDuration(c.criado_em, c.resolvido_em)}</td>
                </tr>`).join('')}
            </tbody>
        </table>`;
    }

    function openModal(id) {
        const c = allChamados.find(x => x.id === id);
        if (!c) return;
        currentId = id;

        document.getElementById('modalTitulo').textContent = c.titulo;
        document.getElementById('modalBadges').innerHTML = badgeUrgencia(c.urgencia) + badgeStatus(c.status);
        document.getElementById('modalUsuario').textContent = c.usuario;
        document.getElementById('modalData').textContent = formatDate(c.criado_em);
        document.getElementById('modalTempo').textContent = formatDuration(c.criado_em, c.resolvido_em);
        document.getElementById('modalDesc').textContent = c.descricao || 'Sem descrição adicional.';
        document.getElementById('modalStatus').value = c.status;
        document.getElementById('modalResolucao').value = c.resolucao || '';

        const anexoSec = document.getElementById('modalAnexoSection');
        if (c.anexo_base64) {
            document.getElementById('modalAnexoImg').src = c.anexo_base64;
            document.getElementById('modalAnexoName').textContent = c.anexo_nome || 'anexo';
            document.getElementById('lbImg').src = c.anexo_base64;
            anexoSec.style.display = 'block';
        } else {
            anexoSec.style.display = 'none';
            document.getElementById('modalAnexoImg').src = '';
            document.getElementById('lbImg').src = '';
        }

        document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
        currentId = null;
    }

    async function saveChamado() {
        if (!currentId) return;
        const status = document.getElementById('modalStatus').value;
        const resolucao = document.getElementById('modalResolucao').value.trim();
        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Salvando...';
        try {
            const r = await fetch(`/api/chamados/${currentId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status, resolucao })
            });
            if (!r.ok) throw new Error('Erro ao salvar');
            closeModal();
            await loadChamados();
        } catch(e) {
            alert('Erro ao salvar: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar';
        }
    }

    async function deleteChamado() {
        if (!currentId) return;
        if (!await classicConfirm('Excluir este chamado permanentemente?')) return;
        try {
            await fetch(`/api/chamados/${currentId}`, { method: 'DELETE' });
            closeModal();
            await loadChamados();
        } catch(e) {
            alert('Erro ao excluir.');
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (document.getElementById('lbOverlay').classList.contains('open')) closeLightbox();
            else closeModal();
        }
    });

    // ── Download ──
    function downloadAnexo() {
        const img = document.getElementById('modalAnexoImg');
        const name = document.getElementById('modalAnexoName').textContent || 'anexo.png';
        if (!img.src) return;
        const a = document.createElement('a');
        a.href = img.src;
        a.download = name;
        a.click();
    }

    // ── Lightbox ──
    let lbScale = 1, lbX = 0, lbY = 0;
    let lbDragging = false, lbDragStart = null;

    function applyTransform() {
        document.getElementById('lbImg').style.transform = `translate(${lbX}px,${lbY}px) scale(${lbScale})`;
    }

    function lbZoom(delta) {
        lbScale = Math.min(8, Math.max(0.2, lbScale + delta));
        applyTransform();
    }

    function lbReset() { lbScale = 1; lbX = 0; lbY = 0; applyTransform(); }

    function openLightbox() {
        lbReset();
        document.getElementById('lbOverlay').classList.add('open');
    }

    function closeLightbox() {
        document.getElementById('lbOverlay').classList.remove('open');
    }

    const lbCanvas = document.getElementById('lbCanvas');
    const lbOverlay = document.getElementById('lbOverlay');

    // Fecha só via ESC — clicar na imagem/canvas não fecha

    lbCanvas.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.15 : -0.15;
        lbScale = Math.min(8, Math.max(0.2, lbScale + delta));
        applyTransform();
    }, { passive: false });

    lbCanvas.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        lbDragging = true;
        lbDragStart = { x: e.clientX - lbX, y: e.clientY - lbY };
        lbCanvas.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
        if (!lbDragging) return;
        lbX = e.clientX - lbDragStart.x;
        lbY = e.clientY - lbDragStart.y;
        applyTransform();
    });
    window.addEventListener('mouseup', () => {
        lbDragging = false;
        lbCanvas.classList.remove('dragging');
    });

    // Touch zoom/pan
    let lbLastDist = null;
    lbCanvas.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            lbLastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        } else if (e.touches.length === 1) {
            lbDragging = true;
            lbDragStart = { x: e.touches[0].clientX - lbX, y: e.touches[0].clientY - lbY };
        }
    }, { passive: true });
    lbCanvas.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && lbLastDist) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            lbScale = Math.min(8, Math.max(0.2, lbScale * (dist / lbLastDist)));
            lbLastDist = dist;
            applyTransform();
        } else if (e.touches.length === 1 && lbDragging) {
            lbX = e.touches[0].clientX - lbDragStart.x;
            lbY = e.touches[0].clientY - lbDragStart.y;
            applyTransform();
        }
    }, { passive: true });
    lbCanvas.addEventListener('touchend', () => { lbDragging = false; lbLastDist = null; });

    loadChamados();
</script>
    <script src="session-guard.js"></script>
</body>
</html>
