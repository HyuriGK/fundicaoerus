<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260624a"></script>
    <script src="js/activity-logger.js?v=20260605e"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Custo - Fundicao Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --panel: #111113;
            --panel-2: #17171a;
            --line: rgba(255,255,255,0.08);
            --muted: #a1a1aa;
            --dim: #71717a;
            --text: #fafafa;
            --primary: #fbbf24;
            --primary-soft: rgba(251,191,36,0.12);
            --green: #22c55e;
            --blue: #38bdf8;
            --font: 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
        }
        .page {
            height: 100vh;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: flex-end;
        }
        .title h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 0;
            font-weight: 800;
        }
        .title p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: .9rem;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .search {
            width: min(420px, 42vw);
            min-width: 260px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #0f0f12;
            color: var(--text);
            padding: 0 14px;
            font: 500 .9rem var(--font);
            outline: none;
        }
        .search:focus { border-color: rgba(251,191,36,.45); }
        .btn {
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 14px;
            font: 700 .82rem var(--font);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { border-color: rgba(251,191,36,.35); color: var(--primary); }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }
        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px 16px;
        }
        .stat span {
            display: block;
            color: var(--dim);
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .stat strong {
            display: block;
            margin-top: 7px;
            font: 800 1.35rem var(--mono);
        }
        .content {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 16px;
        }
        .tree-panel, .detail-panel {
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }
        .panel-head {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            padding: 0 16px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .tree {
            height: calc(100% - 48px);
            overflow: auto;
            padding: 10px 10px 18px;
        }
        .node {
            --depth: 0;
            margin-left: calc(var(--depth) * 18px);
        }
        .row {
            display: grid;
            grid-template-columns: 34px 92px minmax(180px, 1fr) 145px 96px;
            align-items: center;
            min-height: 38px;
            gap: 10px;
            border-radius: 8px;
            padding: 4px 10px 4px 2px;
            color: var(--text);
            cursor: pointer;
        }
        .row:hover { background: rgba(255,255,255,.04); }
        .row.selected { background: var(--primary-soft); }
        .toggle {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }
        .toggle.has-children:hover { background: rgba(255,255,255,.06); color: var(--primary); }
        .toggle:not(.has-children) { cursor: default; opacity: .25; }
        .code, .mask {
            font-family: var(--mono);
            color: #d4d4d8;
            font-size: .78rem;
        }
        .name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 650;
            font-size: .88rem;
        }
        .badge {
            width: fit-content;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .04em;
        }
        .badge.sintetica {
            background: rgba(56,189,248,.12);
            color: var(--blue);
            border: 1px solid rgba(56,189,248,.25);
        }
        .badge.analitica {
            background: rgba(34,197,94,.12);
            color: var(--green);
            border: 1px solid rgba(34,197,94,.25);
        }
        .children { display: none; }
        .node.open > .children { display: block; }
        .detail-body {
            padding: 18px;
            overflow: auto;
            height: calc(100% - 48px);
        }
        .detail-title {
            font-size: 1.05rem;
            line-height: 1.35;
            font-weight: 800;
            margin: 0 0 14px;
        }
        .detail-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 18px;
        }
        .detail-item {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            background: rgba(255,255,255,.02);
        }
        .detail-item span {
            display: block;
            color: var(--dim);
            font-size: .68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .detail-item strong {
            display: block;
            margin-top: 5px;
            font: 700 .86rem var(--mono);
            color: var(--text);
        }
        .child-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .child-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            background: rgba(255,255,255,.025);
            cursor: pointer;
        }
        .child-card:hover { border-color: rgba(251,191,36,.35); }
        .child-card strong {
            display: block;
            font-size: .82rem;
            margin-bottom: 4px;
        }
        .child-card span {
            color: var(--muted);
            font: 600 .72rem var(--mono);
        }
        .empty, .loading {
            color: var(--muted);
            padding: 24px;
            text-align: center;
        }
        @media (max-width: 980px) {
            body { overflow: auto; }
            .page { height: auto; min-height: 100vh; }
            .topbar { align-items: stretch; flex-direction: column; }
            .actions { justify-content: stretch; }
            .search { width: 100%; }
            .stats, .content { grid-template-columns: 1fr; }
            .tree-panel { height: 70vh; }
            .row { grid-template-columns: 32px 72px minmax(120px, 1fr) 92px; }
            .row .badge { display: none; }
        }
    </style>
</head>
<body>
    <main class="page erus-sidebar-content-offset erus-fill-layout">
        <section class="topbar">
            <div class="title">
                <h1>Centro de Custo</h1>
                <p>Estrutura hierarquica do ERP por sinteticas e analiticas.</p>
            </div>
            <div class="actions">
                <input id="searchInput" class="search" type="search" placeholder="Buscar codigo, nome ou mascara">
                <button id="expandAllBtn" class="btn" type="button"><i class="fa-solid fa-plus"></i>Expandir</button>
                <button id="collapseAllBtn" class="btn" type="button"><i class="fa-solid fa-minus"></i>Recolher</button>
                <button id="reloadBtn" class="btn" type="button"><i class="fa-solid fa-rotate-right"></i>Atualizar</button>
            </div>
        </section>

        <section class="stats">
            <div class="stat"><span>Total</span><strong id="statTotal">0</strong></div>
            <div class="stat"><span>Sinteticas</span><strong id="statSint">0</strong></div>
            <div class="stat"><span>Analiticas</span><strong id="statAna">0</strong></div>
            <div class="stat"><span>Exibindo</span><strong id="statShown">0</strong></div>
        </section>

        <section class="content">
            <div class="tree-panel">
                <div class="panel-head">
                    <span>Plano hierarquico</span>
                    <span id="statusText">Carregando</span>
                </div>
                <div id="tree" class="tree">
                    <div class="loading">Carregando centros de custo...</div>
                </div>
            </div>
            <aside class="detail-panel">
                <div class="panel-head">
                    <span>Detalhes</span>
                    <span id="detailCount">0 filhos</span>
                </div>
                <div id="detail" class="detail-body">
                    <div class="empty">Selecione um centro de custo.</div>
                </div>
            </aside>
        </section>
    </main>

    <script>
        let allItems = [];
        let visibleItems = [];
        let nodeMap = new Map();
        let selectedCodigo = null;

        const el = id => document.getElementById(id);
        const esc = value => String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function parentMask(mask) {
            const idx = String(mask || '').lastIndexOf('.');
            return idx > -1 ? mask.slice(0, idx) : '';
        }

        function buildTree(items) {
            const byMask = new Map();
            nodeMap = new Map();
            items.forEach(item => {
                const node = { ...item, children: [], descendants: [] };
                byMask.set(item.mascara, node);
                nodeMap.set(String(item.codigo), node);
            });
            const roots = [];
            byMask.forEach(node => {
                const parent = byMask.get(parentMask(node.mascara));
                if (parent) parent.children.push(node);
                else roots.push(node);
            });
            byMask.forEach(node => {
                node.descendants = items.filter(item =>
                    item.tipo === 'ANALITICA' &&
                    item.codigo !== node.codigo &&
                    item.mascara.indexOf(node.mascara + '.') === 0
                );
            });
            return roots;
        }

        function matches(item, term) {
            if (!term) return true;
            const hay = `${item.codigo} ${item.nome} ${item.mascara} ${item.tipo}`.toLowerCase();
            return hay.includes(term);
        }

        function filterTree(nodes, term) {
            return nodes.map(node => {
                const children = filterTree(node.children, term);
                if (matches(node, term) || children.length) return { ...node, children, forceOpen: Boolean(term && children.length) };
                return null;
            }).filter(Boolean);
        }

        function renderTree() {
            const term = el('searchInput').value.trim().toLowerCase();
            const roots = buildTree(allItems);
            const filtered = filterTree(roots, term);
            visibleItems = [];
            el('tree').innerHTML = filtered.length ? filtered.map(node => renderNode(node, 0)).join('') : '<div class="empty">Nenhum centro encontrado.</div>';
            el('statShown').textContent = visibleItems.length;
            if (term) document.querySelectorAll('.node[data-force-open="1"]').forEach(node => node.classList.add('open'));
            if (selectedCodigo) markSelected();
        }

        function renderNode(node, depth) {
            visibleItems.push(node);
            const hasChildren = node.children.length > 0;
            const isOpen = depth < 2 || node.forceOpen;
            const typeClass = node.tipo === 'SINTETICA' ? 'sintetica' : 'analitica';
            return `
                <div class="node ${isOpen ? 'open' : ''}" data-codigo="${node.codigo}" data-force-open="${node.forceOpen ? '1' : '0'}" style="--depth:${depth}">
                    <div class="row" onclick="selectNode('${node.codigo}')">
                        <button class="toggle ${hasChildren ? 'has-children' : ''}" type="button" onclick="toggleNode(event, '${node.codigo}')">
                            <i class="fa-solid ${hasChildren ? 'fa-chevron-right' : 'fa-circle'}"></i>
                        </button>
                        <span class="code">${node.codigo}</span>
                        <span class="name" title="${esc(node.nome)}">${esc(node.nome)}</span>
                        <span class="mask">${esc(node.mascara)}</span>
                        <span class="badge ${typeClass}">${node.tipo}</span>
                    </div>
                    <div class="children">${node.children.map(child => renderNode(child, depth + 1)).join('')}</div>
                </div>
            `;
        }

        window.toggleNode = function(event, codigo) {
            event.stopPropagation();
            const node = document.querySelector(`.node[data-codigo="${codigo}"]`);
            if (node) node.classList.toggle('open');
        };

        window.selectNode = function(codigo) {
            selectedCodigo = String(codigo);
            markSelected();
            renderDetail();
        };

        function markSelected() {
            document.querySelectorAll('.row.selected').forEach(row => row.classList.remove('selected'));
            const node = document.querySelector(`.node[data-codigo="${selectedCodigo}"] > .row`);
            if (node) node.classList.add('selected');
        }

        function renderDetail() {
            const item = nodeMap.get(selectedCodigo);
            if (!item) return;
            const filhos = item.descendants || [];
            el('detailCount').textContent = `${filhos.length} analitica${filhos.length === 1 ? '' : 's'}`;
            el('detail').innerHTML = `
                <h2 class="detail-title">${esc(item.nome)}</h2>
                <div class="detail-grid">
                    <div class="detail-item"><span>Codigo</span><strong>${item.codigo}</strong></div>
                    <div class="detail-item"><span>Mascara</span><strong>${esc(item.mascara)}</strong></div>
                    <div class="detail-item"><span>Tipo</span><strong>${item.tipo}</strong></div>
                    <div class="detail-item"><span>Empresa</span><strong>${item.empresa || '-'}</strong></div>
                </div>
                <div class="panel-head" style="height:34px;padding:0;margin:0 0 10px;border:0;">Analiticas dentro</div>
                <div class="child-list">
                    ${filhos.length ? filhos.map(child => `
                        <div class="child-card" onclick="selectNode('${child.codigo}')">
                            <strong>${esc(child.nome)}</strong>
                            <span>${child.codigo} | ${esc(child.mascara)}</span>
                        </div>
                    `).join('') : '<div class="empty" style="padding:12px;">Este item nao possui analiticas abaixo.</div>'}
                </div>
            `;
        }

        function setStats() {
            el('statTotal').textContent = allItems.length;
            el('statSint').textContent = allItems.filter(i => i.tipo === 'SINTETICA').length;
            el('statAna').textContent = allItems.filter(i => i.tipo === 'ANALITICA').length;
        }

        async function loadData() {
            el('statusText').textContent = 'Carregando';
            el('tree').innerHTML = '<div class="loading">Carregando centros de custo...</div>';
            try {
                const res = await fetch('/api/centro-custos/estrutura', { cache: 'no-store' });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Falha ao carregar');
                allItems = json.data || [];
                setStats();
                renderTree();
                el('statusText').textContent = 'Atualizado';
                if (window.erusAudit) window.erusAudit('CONSULTAR_CENTRO_CUSTO', { total: allItems.length });
            } catch (error) {
                el('statusText').textContent = 'Erro';
                el('tree').innerHTML = `<div class="empty">Erro ao carregar: ${esc(error.message)}</div>`;
            }
        }

        el('searchInput').addEventListener('input', renderTree);
        el('expandAllBtn').addEventListener('click', () => document.querySelectorAll('.node').forEach(node => node.classList.add('open')));
        el('collapseAllBtn').addEventListener('click', () => document.querySelectorAll('.node').forEach(node => node.classList.remove('open')));
        el('reloadBtn').addEventListener('click', loadData);
        loadData();
    </script>
</body>
</html>
