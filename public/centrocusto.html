<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260624a"></script>
    <script src="js/activity-logger.js?v=20260605e"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Custo - Fundicao Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --panel: #111113;
            --panel-2: #17171a;
            --line: rgba(255,255,255,0.08);
            --muted: #a1a1aa;
            --dim: #71717a;
            --text: #fafafa;
            --primary: #fbbf24;
            --primary-soft: rgba(251,191,36,0.12);
            --green: #22c55e;
            --blue: #38bdf8;
            --font: 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            overflow: hidden;
        }
        .page {
            height: 100vh;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .filters {
            width: 100%;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .search {
            user-select: text;
            -webkit-user-select: text;
            width: min(420px, 42vw);
            min-width: 260px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #0f0f12;
            color: var(--text);
            padding: 0 14px;
            font: 500 .9rem var(--font);
            outline: none;
        }
        .search:focus { border-color: rgba(251,191,36,.45); }
        .period {
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #0f0f12;
            color: var(--text);
            padding: 0 12px;
            font: 700 .82rem var(--font);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            text-align: center;
            text-align-last: center;
            min-width: 108px;
        }
        .period::-ms-expand { display: none; }
        .btn {
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 14px;
            font: 700 .82rem var(--font);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { border-color: rgba(251,191,36,.35); color: var(--primary); }
        .kpi-row {
            display: grid !important;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px !important;
            width: 100%;
            flex-shrink: 0;
        }
        .kpi-card {
            min-width: 0 !important;
            cursor: default;
        }
        body .kpi-value {
            font-family: var(--mono) !important;
            font-size: 1.35rem !important;
            letter-spacing: 0 !important;
            overflow-wrap: anywhere;
        }
        .content {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 16px;
        }
        .tree-panel, .detail-panel {
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }
        .panel-head {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            padding: 0 16px;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .tree {
            height: calc(100% - 48px);
            overflow: auto;
            padding: 10px 10px 18px;
        }
        .node {
            --depth: 0;
            margin-left: calc(var(--depth) * 18px);
        }
        .row {
            display: grid;
            grid-template-columns: 34px 76px minmax(180px, 1fr) 135px 112px 96px;
            align-items: center;
            min-height: 38px;
            gap: 10px;
            border-radius: 8px;
            padding: 4px 10px 4px 2px;
            color: var(--text);
            cursor: pointer;
        }
        .row:hover { background: rgba(255,255,255,.04); }
        .row.selected { background: var(--primary-soft); }
        .direct-row {
            cursor: default;
            color: var(--muted);
            background: rgba(251,191,36,.045);
        }
        .direct-row:hover { background: rgba(251,191,36,.075); }
        .direct-row .name {
            color: #facc15;
            font-weight: 750;
        }
        .toggle {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }
        .toggle.has-children:hover { background: rgba(255,255,255,.06); color: var(--primary); }
        .toggle:not(.has-children) { cursor: default; opacity: .25; }
        .code, .mask {
            font-family: var(--mono);
            color: #d4d4d8;
            font-size: .78rem;
        }
        .money {
            font-family: var(--mono);
            color: var(--primary);
            font-size: .78rem;
            font-weight: 800;
            text-align: right;
        }
        .name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 650;
            font-size: .88rem;
        }
        .badge {
            width: fit-content;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .04em;
        }
        .badge.sintetica {
            background: rgba(56,189,248,.12);
            color: var(--blue);
            border: 1px solid rgba(56,189,248,.25);
        }
        .badge.analitica {
            background: rgba(34,197,94,.12);
            color: var(--green);
            border: 1px solid rgba(34,197,94,.25);
        }
        .badge.direto {
            background: rgba(251,191,36,.12);
            color: var(--primary);
            border: 1px solid rgba(251,191,36,.25);
        }
        .children { display: none; }
        .node.open > .children { display: block; }
        .detail-body {
            padding: 18px;
            overflow: auto;
            height: calc(100% - 48px);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .detail-body::-webkit-scrollbar { display: none; }
        .detail-title {
            font-size: 1.05rem;
            line-height: 1.35;
            font-weight: 800;
            margin: 0 0 14px;
        }
        .detail-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 18px;
        }
        .detail-item {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            background: rgba(255,255,255,.02);
        }
        .detail-item span {
            display: block;
            color: var(--dim);
            font-size: .68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .detail-item strong {
            display: block;
            margin-top: 5px;
            font: 700 .86rem var(--mono);
            color: var(--text);
        }
        .child-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .child-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            background: rgba(255,255,255,.025);
            cursor: pointer;
        }
        .child-card:hover { border-color: rgba(251,191,36,.35); }
        .child-card strong {
            display: block;
            font-size: .82rem;
            margin-bottom: 4px;
        }
        .child-card span {
            color: var(--muted);
            font: 600 .72rem var(--mono);
        }
        .record-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .record-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            background: rgba(255,255,255,.025);
        }
        .record-card strong {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: .78rem;
            margin-bottom: 5px;
        }
        .record-card small {
            display: block;
            color: var(--muted);
            line-height: 1.45;
        }
        .empty, .loading {
            color: var(--muted);
            padding: 24px;
            text-align: center;
        }
        @media (max-width: 980px) {
            body { overflow: auto; }
            .page { height: auto; min-height: 100vh; }
            .actions { justify-content: stretch; }
            .search { width: 100%; }
            .kpi-row, .content { grid-template-columns: 1fr; }
            .tree-panel { height: 70vh; }
            .row { grid-template-columns: 32px 62px minmax(120px, 1fr) 92px; }
            .row .badge, .row .money { display: none; }
        }
    </style>
</head>
<body>
    <main class="page erus-sidebar-content-offset erus-fill-layout">
        <section class="kpi-row">
            <div class="kpi-card kpi-default">
                <div class="kpi-title">Total</div>
                <div class="kpi-value" id="statTotal">0</div>
                <div class="kpi-subtext">Centros ativos</div>
            </div>
            <div class="kpi-card kpi-info">
                <div class="kpi-title">Sinteticas</div>
                <div class="kpi-value" id="statSint">0</div>
                <div class="kpi-subtext">Grupos de custo</div>
            </div>
            <div class="kpi-card kpi-blue">
                <div class="kpi-title">Analiticas</div>
                <div class="kpi-value" id="statAna">0</div>
                <div class="kpi-subtext">Centros finais</div>
            </div>
            <div class="kpi-card kpi-purple">
                <div class="kpi-title">Total mes</div>
                <div class="kpi-value" id="statCost">R$ 0</div>
                <div class="kpi-subtext">Periodo selecionado</div>
            </div>
            <div class="kpi-card kpi-default">
                <div class="kpi-title">Exibindo</div>
                <div class="kpi-value" id="statShown">0</div>
                <div class="kpi-subtext">No filtro atual</div>
            </div>
        </section>

        <section class="filters">
            <div class="actions">
                <select id="monthSelect" class="period"></select>
                <select id="yearSelect" class="period"></select>
                <input id="searchInput" class="search" type="search" placeholder="Buscar codigo, nome ou mascara">
                <button id="expandAllBtn" class="btn" type="button"><i class="fa-solid fa-plus"></i>Expandir</button>
                <button id="collapseAllBtn" class="btn" type="button"><i class="fa-solid fa-minus"></i>Recolher</button>
                <button id="reloadBtn" class="btn" type="button"><i class="fa-solid fa-rotate-right"></i>Atualizar</button>
            </div>
        </section>

        <section class="content">
            <div class="tree-panel">
                <div class="panel-head">
                    <span>Plano hierarquico</span>
                    <span id="statusText">Carregando</span>
                </div>
                <div id="tree" class="tree">
                    <div class="loading">Carregando centros de custo...</div>
                </div>
            </div>
            <aside class="detail-panel">
                <div class="panel-head">
                    <span>Detalhes</span>
                    <span id="detailCount">0 filhos</span>
                </div>
                <div id="detail" class="detail-body">
                    <div class="empty">Selecione um centro de custo.</div>
                </div>
            </aside>
        </section>
    </main>

    <script>
        let allItems = [];
        let visibleItems = [];
        let nodeMap = new Map();
        let costByMask = new Map();
        let detailRecords = [];
        let selectedCodigo = null;

        const el = id => document.getElementById(id);
        const esc = value => String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtBRL = value => Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const monthNames = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

        function parentMask(mask) {
            const idx = String(mask || '').lastIndexOf('.');
            return idx > -1 ? mask.slice(0, idx) : '';
        }

        function buildTree(items) {
            const byMask = new Map();
            nodeMap = new Map();
            items.forEach(item => {
                const node = { ...item, total_direto: 0, total: 0, registros: 0, children: [], descendants: [] };
                byMask.set(item.mascara, node);
                nodeMap.set(String(item.codigo), node);
            });
            const roots = [];
            byMask.forEach(node => {
                const parent = byMask.get(parentMask(node.mascara));
                if (parent) parent.children.push(node);
                else roots.push(node);
            });
            byMask.forEach(node => {
                node.descendants = items.filter(item =>
                    item.tipo === 'ANALITICA' &&
                    item.codigo !== node.codigo &&
                    item.mascara.indexOf(node.mascara + '.') === 0
                );
                const direct = costByMask.get(node.mascara);
                node.total_direto = direct ? direct.total : 0;
                node.registros = direct ? direct.registros : 0;
                node.total = 0;
                costByMask.forEach((cost, mask) => {
                    if (mask === node.mascara || mask.indexOf(node.mascara + '.') === 0) {
                        node.total += cost.total;
                    }
                });
            });
            return roots;
        }

        function matches(item, term) {
            if (!term) return true;
            const hay = `${item.codigo} ${item.nome} ${item.mascara} ${item.tipo}`.toLowerCase();
            return hay.includes(term);
        }

        function filterTree(nodes, term) {
            return nodes.map(node => {
                const children = filterTree(node.children, term);
                if (matches(node, term) || children.length) return { ...node, children, forceOpen: Boolean(term && children.length) };
                return null;
            }).filter(Boolean);
        }

        function renderTree() {
            const term = el('searchInput').value.trim().toLowerCase();
            const roots = buildTree(allItems);
            const filtered = filterTree(roots, term);
            visibleItems = [];
            el('tree').innerHTML = filtered.length ? filtered.map(node => renderNode(node, 0)).join('') : '<div class="empty">Nenhum centro encontrado.</div>';
            el('statShown').textContent = visibleItems.length;
            if (term) document.querySelectorAll('.node[data-force-open="1"]').forEach(node => node.classList.add('open'));
            if (selectedCodigo) markSelected();
        }

        function renderNode(node, depth) {
            visibleItems.push(node);
            const hasChildren = node.children.length > 0;
            const isDemoResult = String(node.codigo) === '2';
            const isOpen = isDemoResult || node.forceOpen;
            const typeClass = node.tipo === 'SINTETICA' ? 'sintetica' : 'analitica';
            const directRow = hasChildren && node.total_direto > 0 ? `
                    <div class="row direct-row" onclick="selectNode('${node.codigo}')">
                        <span></span>
                        <span class="code">DIRETO</span>
                        <span class="name" title="Lancamento direto nesta sintetica">Lancamento direto nesta sintetica</span>
                        <span class="mask">${esc(node.mascara)}</span>
                        <span class="money">${fmtBRL(node.total_direto)}</span>
                        <span class="badge direto">${node.registros} reg.</span>
                    </div>
            ` : '';
            return `
                <div class="node ${isOpen ? 'open' : ''}" data-codigo="${node.codigo}" data-force-open="${node.forceOpen ? '1' : '0'}" style="--depth:${depth}">
                    <div class="row" onclick="selectNode('${node.codigo}')" ondblclick="toggleNode(event, '${node.codigo}')">
                        <button class="toggle ${hasChildren ? 'has-children' : ''}" type="button" onclick="toggleNode(event, '${node.codigo}')">
                            <i class="fa-solid ${hasChildren ? (isOpen ? 'fa-chevron-down' : 'fa-chevron-right') : 'fa-circle'}"></i>
                        </button>
                        <span class="code">${node.codigo}</span>
                        <span class="name" title="${esc(node.nome)}">${esc(node.nome)}</span>
                        <span class="mask">${esc(node.mascara)}</span>
                        <span class="money">${node.total ? fmtBRL(node.total) : '-'}</span>
                        <span class="badge ${typeClass}">${node.tipo}</span>
                    </div>
                    <div class="children">${directRow}${node.children.map(child => renderNode(child, depth + 1)).join('')}</div>
                </div>
            `;
        }

        window.toggleNode = function(event, codigo) {
            event.stopPropagation();
            const node = document.querySelector(`.node[data-codigo="${codigo}"]`);
            if (!node) return;
            const isOpen = node.classList.toggle('open');
            const icon = node.querySelector(':scope > .row .toggle i');
            if (icon) {
                icon.classList.toggle('fa-chevron-right', !isOpen);
                icon.classList.toggle('fa-chevron-down', isOpen);
            }
        };

        window.selectNode = function(codigo) {
            selectedCodigo = String(codigo);
            markSelected();
            renderDetail();
            loadDetailRecords();
        };

        function markSelected() {
            document.querySelectorAll('.row.selected').forEach(row => row.classList.remove('selected'));
            const node = document.querySelector(`.node[data-codigo="${selectedCodigo}"] > .row`);
            if (node) node.classList.add('selected');
        }

        function renderDetail() {
            const item = nodeMap.get(selectedCodigo);
            if (!item) return;
            const filhos = item.descendants || [];
            el('detailCount').textContent = `${filhos.length} analitica${filhos.length === 1 ? '' : 's'}`;
            el('detail').innerHTML = `
                <h2 class="detail-title">${esc(item.nome)}</h2>
                <div class="detail-grid">
                    <div class="detail-item"><span>Codigo</span><strong>${item.codigo}</strong></div>
                    <div class="detail-item"><span>Mascara</span><strong>${esc(item.mascara)}</strong></div>
                    <div class="detail-item"><span>Tipo</span><strong>${item.tipo}</strong></div>
                    <div class="detail-item"><span>Total periodo</span><strong>${fmtBRL(item.total)}</strong></div>
                    <div class="detail-item"><span>Total direto</span><strong>${fmtBRL(item.total_direto)}</strong></div>
                    <div class="detail-item"><span>Empresa</span><strong>${item.empresa || '-'}</strong></div>
                </div>
                <div class="panel-head" style="height:34px;padding:0;margin:0 0 10px;border:0;">Analiticas dentro</div>
                <div class="child-list">
                    ${filhos.length ? filhos.map(child => `
                        <div class="child-card" onclick="selectNode('${child.codigo}')">
                            <strong>${esc(child.nome)}</strong>
                            <span>${child.codigo} | ${esc(child.mascara)} | ${fmtBRL(child.total || 0)}</span>
                        </div>
                    `).join('') : '<div class="empty" style="padding:12px;">Este item nao possui analiticas abaixo.</div>'}
                </div>
                <div class="panel-head" style="height:34px;padding:0;margin:18px 0 10px;border:0;">Lancamentos do periodo</div>
                <div id="recordList" class="record-list"><div class="empty" style="padding:12px;">Carregando lancamentos...</div></div>
            `;
        }

        function renderRecords() {
            const box = el('recordList');
            if (!box) return;
            if (!detailRecords.length) {
                box.innerHTML = '<div class="empty" style="padding:12px;">Nenhum lancamento para esta mascara no periodo.</div>';
                return;
            }
            box.innerHTML = detailRecords.map(row => `
                <div class="record-card">
                    <strong><span>${esc(row.fornecedor || 'Sem fornecedor')}</span><span>${fmtBRL(row.valor)}</span></strong>
                    <small>${esc(row.documento || 'Sem documento')} | ${formatDate(row.data_emissao)}<br>${esc(row.produto || row.centro_custo_nome || '')}</small>
                </div>
            `).join('');
        }

        function formatDate(value) {
            if (!value) return '-';
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? '-' : d.toLocaleDateString('pt-BR');
        }

        async function loadDetailRecords() {
            const item = nodeMap.get(selectedCodigo);
            if (!item) return;
            try {
                const params = selectedPeriodParams();
                params.set('mascara', item.mascara);
                const res = await fetch(`/api/centro-custos/estrutura-registros?${params.toString()}`, { cache: 'no-store' });
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Falha ao carregar registros');
                detailRecords = json.data || [];
                renderRecords();
            } catch (error) {
                const box = el('recordList');
                if (box) box.innerHTML = `<div class="empty" style="padding:12px;">Erro: ${esc(error.message)}</div>`;
            }
        }

        function setStats() {
            el('statTotal').textContent = allItems.length;
            el('statSint').textContent = allItems.filter(i => i.tipo === 'SINTETICA').length;
            el('statAna').textContent = allItems.filter(i => i.tipo === 'ANALITICA').length;
            el('statCost').textContent = fmtBRL([...costByMask.values()].reduce((sum, item) => sum + item.total, 0));
        }

        function selectedPeriodParams() {
            const params = new URLSearchParams();
            const mes = el('monthSelect').value;
            const ano = el('yearSelect').value;
            if (mes) params.set('mes', mes);
            if (ano) params.set('ano', ano);
            return params;
        }

        function setupPeriod() {
            const now = new Date();
            el('monthSelect').innerHTML = monthNames.map((name, i) => `<option value="${i + 1}">${name}</option>`).join('');
            const year = now.getFullYear();
            el('yearSelect').innerHTML = [year, year - 1, year - 2].map(y => `<option value="${y}">${y}</option>`).join('');
            el('monthSelect').value = String(now.getMonth() + 1);
            el('yearSelect').value = String(year);
        }

        async function loadTotals() {
            const params = selectedPeriodParams();
            const res = await fetch(`/api/centro-custos/estrutura-totais?${params.toString()}`, { cache: 'no-store' });
            const json = await res.json();
            if (!json.success) throw new Error(json.error || 'Falha ao carregar totais');
            costByMask = new Map((json.data || []).map(item => [item.mascara, item]));
        }

        async function loadData() {
            el('statusText').textContent = 'Carregando';
            el('tree').innerHTML = '<div class="loading">Carregando centros de custo...</div>';
            try {
                const [res] = await Promise.all([
                    fetch('/api/centro-custos/estrutura', { cache: 'no-store' }),
                    loadTotals()
                ]);
                const json = await res.json();
                if (!json.success) throw new Error(json.error || 'Falha ao carregar');
                allItems = json.data || [];
                setStats();
                renderTree();
                if (selectedCodigo) {
                    renderDetail();
                    loadDetailRecords();
                }
                el('statusText').textContent = 'Atualizado';
                if (window.erusAudit) window.erusAudit('CONSULTAR_CENTRO_CUSTO', { total: allItems.length });
            } catch (error) {
                el('statusText').textContent = 'Erro';
                el('tree').innerHTML = `<div class="empty">Erro ao carregar: ${esc(error.message)}</div>`;
            }
        }

        el('searchInput').addEventListener('input', renderTree);
        el('monthSelect').addEventListener('change', loadData);
        el('yearSelect').addEventListener('change', loadData);
        function syncToggleIcons() {
            document.querySelectorAll('.node').forEach(node => {
                const icon = node.querySelector(':scope > .row .toggle.has-children i');
                if (!icon) return;
                const isOpen = node.classList.contains('open');
                icon.classList.toggle('fa-chevron-right', !isOpen);
                icon.classList.toggle('fa-chevron-down', isOpen);
            });
        }

        el('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.node').forEach(node => node.classList.add('open'));
            syncToggleIcons();
        });
        el('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.node').forEach(node => node.classList.remove('open'));
            syncToggleIcons();
        });
        el('reloadBtn').addEventListener('click', loadData);
        document.addEventListener('dragstart', event => event.preventDefault());
        setupPeriod();
        loadData();
    </script>
</body>
</html>
