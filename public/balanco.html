<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260706-light-sidebar"></script>
    <script src="js/theme-manager.js"></script>
    <link rel="stylesheet" href="css/dashboard-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balanço Financeiro - Fundição Erus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="js/shared-utils.js"></script>
    <script src="js/activity-logger.js?v=20260605e"></script>
    <style>
        * { user-select:none; -webkit-user-select:none; box-sizing:border-box; outline:none; }
        input, textarea, .selectable-text { user-select:text!important; -webkit-user-select:text!important; }
        :root {
            --font-main:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
            --color-primary:#fbbf24; --color-primary-dim:#d97706;
            --bg-body:#09090b; --bg-card:rgba(24,24,27,0.7);
            --text-main:#f4f4f5; --text-muted:#a1a1aa;
            --border-subtle:rgba(255,255,255,0.08); --border-highlight:rgba(255,255,255,0.15);
            --border-separator:rgba(255,255,255,0.06);
            --status-success:#10b981; --status-danger:#ef4444;
            --status-info:#06b6d4; --status-purple:#a855f7; --status-warning:#f59e0b;
            --radius-md:12px; --shadow-card:0 4px 6px -1px rgba(0,0,0,0.3);
            --shadow-glow:0 0 15px rgba(251,191,36,0.2);
        }
        html,body { height:100vh!important; width:100vw!important; overflow:hidden!important; margin:0!important; padding:0!important; }
        body { font-family:var(--font-main); background-color:var(--bg-body); color:var(--text-main);
            background-image:radial-gradient(circle at 15% 50%,rgba(251,191,36,0.03),transparent 25%),radial-gradient(circle at 85% 30%,rgba(63,63,70,0.05),transparent 25%);
            display:flex; flex-direction:column; }
        ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px} ::-webkit-scrollbar-thumb:hover{background:#52525b}

        .app-layout { position:fixed; inset:0; display:flex; flex-direction:row; height:100vh!important; width:100vw!important; overflow:hidden; background-color:var(--bg-body); }
        .side-menu-trigger { position:fixed; left:0; top:0; bottom:0; width:45px; z-index:2000; background:transparent; }
        .side-menu { position:fixed; left:-320px; top:20px; bottom:20px; width:300px; background:rgba(9,9,11,0.95); backdrop-filter:blur(20px) saturate(2); border:1px solid var(--border-subtle); border-left:none; border-radius:0 20px 20px 0; z-index:2001; transition:all 0.4s cubic-bezier(0.4,0,0.2,1); display:flex; flex-direction:column; padding:40px 30px; box-shadow:10px 0 40px rgba(0,0,0,0.6); }
        .side-menu-trigger:hover+.side-menu,.side-menu:hover{left:0}

        .dashboard-content { flex:1; height:100%; padding:20px 24px 15px 24px; display:grid; grid-template-rows:min-content min-content minmax(0,1fr); grid-template-columns:100%; gap:0; min-height:0; width:100%; min-width:0; overflow:hidden; box-sizing:border-box; }
        body .dashboard-content { gap: 0 !important; }
        .dashboard-content>div{min-height:0}

        /* KPI */
        .kpi-row { grid-row:1; display:flex!important; width:100%!important; gap:12px!important; flex-shrink:0; }
        .kpi-card { flex:1!important; min-width:0!important; background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:16px 20px; display:flex; flex-direction:column; gap:6px; backdrop-filter:blur(8px); transition:all 0.3s; box-shadow:var(--shadow-card); }
        .kpi-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.4); }
        .month-btn.active, .month-btn.all-btn.active { background:#27272a!important; border-color:#3f3f46!important; color:#fff!important; }
        .month-btn.active:hover { background:#3f3f46!important; border-color:#52525b!important; color:#fff!important; }
        .month-btn:not(.active):hover { background:rgba(255,255,255,0.06)!important; border-color:rgba(255,255,255,0.18)!important; color:#fff!important; }
        .kpi-label { font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:700; display:flex; align-items:center; gap:6px; }
        .kpi-value { font-family:var(--font-mono); font-size:1.5rem; font-weight:700; color:var(--text-main); letter-spacing:-0.02em; line-height:1; transition:filter 0.2s; }
        .kpi-value.danger{color:var(--status-danger)} .kpi-value.success{color:var(--status-success)}
        .kpi-sub { font-size:0.72rem; color:var(--text-muted); margin-top:2px; }
        .kpi-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; margin-bottom:4px; }
        .kpi-icon.red{background:rgba(239,68,68,0.12);color:#ef4444}
        .kpi-icon.green{background:rgba(16,185,129,0.12);color:#10b981}
        .kpi-icon.yellow{background:rgba(251,191,36,0.12);color:#fbbf24}

        /* TOOLBAR */
        .toolbar-row { grid-row:2; display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:nowrap; }
        .toolbar-left { display:flex; align-items:center; gap:8px; flex-wrap:nowrap; flex-shrink:0; }
        .toolbar-spacer { flex:1; min-width:0; }
        .toolbar-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
        .toolbar-search { background:rgba(255,255,255,0.03); border:1px solid var(--border-subtle); color:var(--text-main); padding:8px 14px; border-radius:8px; font-family:var(--font-main); font-size:0.82rem; outline:none; transition:all 0.2s; width:190px; }
        .toolbar-search::placeholder{color:var(--text-muted)}
        .toolbar-search:focus{border-color:var(--color-primary);background:rgba(251,191,36,0.04)}
        body .year-select, body .month-select {
            height: 36px;
            min-width: 108px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: #0f0f12;
            background-image: none !important;
            color: #fff !important;
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: .76rem;
            font-weight: 800;
            text-align: center !important;
            text-align-last: center !important;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        body .year-select::-ms-expand, body .month-select::-ms-expand { display: none; }
        body .year-select option, body .month-select option { background:#18181b; color:#fff; text-align:center; }
        body .year-select:hover, body .month-select:hover { border-color: rgba(255,255,255,0.18)!important; color:#fff!important; }
        body .year-select:focus, body .month-select:focus { border-color: var(--border-subtle)!important; color:#fff!important; box-shadow:none!important; outline:none!important; }
        #yearSelect, #monthSelect {
            color:#fff!important;
            text-align:center!important;
            text-align-last:center!important;
            background-image:none!important;
            padding-left:12px!important;
            padding-right:12px!important;
        }

        /* Seletor de gráfico */
        .chart-select { background:rgba(255,255,255,0.02)!important; border:1px solid rgba(255,255,255,0.1); color:#f4f4f5; border-radius:8px; font-family:var(--font-mono); font-size:0.72rem; font-weight:700; padding:8px 12px; cursor:pointer; outline:none; transition:all 0.2s; letter-spacing:0.04em; text-align:center; text-align-last:center;
            appearance:none; -webkit-appearance:none;
            background-image:url('data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22292%22 height%3D%22292%22%3E%3Cpath fill%3D%22%23fbbf24%22 d%3D%22M287 69a18 18 0 0 0-13-5H18a18 18 0 0 0-13 5 18 18 0 0 0 0 26l128 128c4 4 8 5 13 5s9-1 13-5L287 95a18 18 0 0 0 0-26z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat:no-repeat; background-position:right 10px center; background-size:8px; background-image:none!important; }
        .chart-select::-ms-expand { display:none; }
        #chartSelect {
            text-align:center!important;
            text-align-last:center!important;
            background-image:none!important;
            padding-left:12px!important;
            padding-right:12px!important;
        }
        .chart-select option{background:#18181b;color:#f4f4f5}
        .chart-select:hover{border-color:rgba(255,255,255,0.18)!important}
        .chart-select:focus{border-color:rgba(255,255,255,0.1)!important;box-shadow:none!important;outline:none!important}
        .month-btn:focus, .month-btn:focus-visible, .btn-glass:focus, .btn-back:focus {
            outline:none!important;
            box-shadow:none!important;
        }

        /* CHARTS */
        .charts-row { grid-row:3; display:flex; gap:15px; min-height:0; height:100%; overflow:hidden; }
        .chart-panel { flex:1; display:flex; flex-direction:column; background:#111114; border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:16px; min-height:0; overflow:hidden; position:relative; }
        .chart-panel.is-hidden { display:none!important; }
        .chart-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0; }
        .chart-panel-title { font-size:0.82rem; font-weight:700; color:var(--text-main); text-transform:uppercase; letter-spacing:0.06em; }
        .chart-canvas-wrapper { position:relative; flex:1; min-height:0; width:100%; }
        .chart-canvas-wrapper canvas { position:absolute; inset:0; width:100%!important; height:100%!important; }

        /* LOADING */
        .loading-overlay { position:absolute; inset:0; background:rgba(9,9,11,0.7); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(4px); border-radius:var(--radius-md); }
        .spinner { width:36px; height:36px; border:3px solid rgba(251,191,36,0.15); border-top-color:var(--color-primary); border-radius:50%; animation:spin 0.7s linear infinite; }
        @keyframes spin{to{transform:rotate(360deg)}}

        /* TOAST */
        .toast-container{position:fixed;bottom:20px;right:20px;z-index:5000;display:flex;flex-direction:column;gap:10px}
        .toast{background:#18181b;border:1px solid var(--border-subtle);border-left:4px solid var(--color-primary);color:#fff;padding:16px 20px;border-radius:6px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.5);font-size:0.9rem;display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease-out forwards;min-width:320px}
        .toast.danger{border-left-color:var(--status-danger)} .toast.success{border-left-color:var(--status-success)}
        .toast-content{display:flex;flex-direction:column} .toast-title{font-weight:600;font-size:0.95rem} .toast-subtitle{font-size:0.75rem;color:#a1a1aa;margin-top:4px}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

        /* PAGE HEADER */
        .page-header-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 0 24px;flex-shrink:0}
        .header-brand{display:flex;align-items:center;gap:16px}
        .brand-icon{width:45px;height:45px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dim));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-size:1.3rem;box-shadow:var(--shadow-glow)}
        .page-title{font-size:1.4rem;font-weight:700;color:#fff;margin:0;line-height:1.2}
        .page-subtitle{font-size:0.85rem;color:var(--text-muted);margin:2px 0 0 0;font-weight:400}
        .header-actions{display:flex;align-items:center;gap:12px}
        .btn-back{background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.2);padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:8px;transition:all 0.3s;text-decoration:none}
        .btn-back:hover{background:rgba(239,68,68,0.2);border-color:#ef4444;color:#fff;transform:translateY(-2px)}
        .btn-glass{background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);color:var(--text-muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:0.85rem;display:flex;align-items:center;gap:8px;transition:all 0.3s;text-decoration:none}
        .btn-glass:hover{background:rgba(255,255,255,0.08);border-color:var(--border-highlight);color:#fff;transform:translateY(-2px)}

        /* MODAL */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:3000;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
        .modal-overlay.open{display:flex}
        .modal-card{background:#09090b;color:#f4f4f5;font-family:var(--font-main)}
        .modal-card.fullscreen{max-width:none;max-height:none;width:100vw;height:100vh;border-radius:0;border:none;margin:0;padding:14px 18px;background:#09090b;overflow-y:hidden;display:flex;flex-direction:column}
        .modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);padding-bottom:15px;margin-bottom:20px;flex-shrink:0}
        .modal-title{font-size:1.3rem;color:var(--color-primary);font-weight:800;text-transform:uppercase;letter-spacing:0.02em}
        .modal-close{color:var(--status-danger);cursor:pointer;font-size:2rem;transition:transform 0.2s;line-height:1}
        .modal-close:hover{transform:scale(1.1);color:#ff0000}
        #recordsModal .toolbar-row{display:none!important}
        #recordsModal .toolbar-group{display:flex;align-items:center;gap:12px}
        .modal-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0;flex-wrap:wrap}
        .modal-count-badge{background:rgba(251,191,36,0.08);color:var(--color-primary);font-family:var(--font-mono);font-size:0.75rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(251,191,36,0.15)}
        .modal-total-badge{background:rgba(239,68,68,0.08);color:#ef4444;font-family:var(--font-mono);font-size:0.75rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(239,68,68,0.15)}
        .modal-total-badge.rec{background:rgba(16,185,129,0.08);color:#10b981;border-color:rgba(16,185,129,0.15)}
        .table-container{flex:1;overflow-y:auto;min-height:0;border:1px solid var(--border-subtle);border-radius:8px}
        .modal-table,#recordsModal #dataTable{width:100%;border-collapse:collapse;font-size:0.8rem;table-layout:fixed}
        .modal-table thead th,#recordsModal #dataTable thead th{position:sticky;top:0;z-index:10;background:#0d0d10;padding:11px 8px;text-align:center;font-size:0.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);white-space:nowrap}
        .modal-table thead th:last-child,#recordsModal #dataTable thead th:last-child{border-right:none}
        .modal-table tbody tr,#recordsModal #dataTable tbody tr{border-bottom:1px solid var(--border-separator);transition:background 0.15s}
        .modal-table tbody tr:hover,#recordsModal #dataTable tbody tr:hover{background:rgba(255,255,255,0.03)}
        .modal-table tbody td,#recordsModal #dataTable tbody td{padding:9px 8px;vertical-align:middle;white-space:nowrap;text-align:center;border-right:1px solid var(--border-separator);overflow:hidden;text-overflow:ellipsis}
        .modal-table tbody td:last-child,#recordsModal #dataTable tbody td:last-child{border-right:none}
        .td-code{font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted)}
        .td-valor-pag{font-family:var(--font-mono);font-weight:700;color:var(--status-danger)}
        .td-valor-rec{font-family:var(--font-mono);font-weight:700;color:var(--status-success)}
        .td-date{font-family:var(--font-mono);font-size:0.72rem;color:var(--status-info)}
        .td-hist{max-width:340px;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);text-align:left!important}
        .filter-input-table{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border-subtle);color:var(--color-primary);padding:7px 2px;font-family:var(--font-mono);font-size:0.68rem;text-align:center;outline:none;box-sizing:border-box}
        .modal-esc-hint{text-align:center;color:var(--text-muted);margin-top:12px;font-size:0.78rem;flex-shrink:0}
        .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-muted);gap:12px}
        .empty-state i{font-size:2.5rem;opacity:0.3} .empty-state span{font-size:0.85rem;opacity:0.5}
    </style>
</head>
<body>
<div class="app-layout">
    <div class="side-menu-trigger"></div>
    <nav class="side-menu"></nav>

    <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;">

        <!-- Dashboard Content -->
        <div class="dashboard-content">

            <!-- KPI Row -->
            <div class="kpi-row">
                <!-- KPI Recebimentos -->
                <div id="kpiCardRec" class="kpi-card" onclick="toggleValor()" style="cursor:pointer;" title="Clique para ocultar/mostrar">
                    <div class="kpi-icon green"><i class="fas fa-arrow-down"></i></div>
                    <div class="kpi-label">Total Entradas <i class="fas fa-eye-slash" id="kpiEyeIcon" style="font-size:0.6rem;color:var(--text-muted);"></i></div>
                    <div class="kpi-value success" id="kpiTotalRec">R$ —</div>
                    <div class="kpi-sub" id="kpiTotalRecQtd">— registros</div>
                </div>
                <!-- KPI Pagamentos -->
                <div id="kpiCardPag" class="kpi-card" onclick="toggleValor()" style="cursor:pointer;" title="Clique para ocultar/mostrar">
                    <div class="kpi-icon red"><i class="fas fa-arrow-up"></i></div>
                    <div class="kpi-label">Total Saídas</div>
                    <div class="kpi-value danger" id="kpiTotalPag">R$ —</div>
                    <div class="kpi-sub" id="kpiTotalPagQtd">— registros</div>
                </div>
                <!-- KPI Saldo -->
                <div class="kpi-card" onclick="toggleValor()" style="cursor:pointer;" title="Clique para ocultar/mostrar">
                    <div class="kpi-icon yellow"><i class="fas fa-balance-scale"></i></div>
                    <div class="kpi-label">Saldo</div>
                    <div class="kpi-value" id="kpiSaldo">R$ —</div>
                    <div class="kpi-sub" id="kpiSaldoSub">—</div>
                </div>
                <!-- KPI Maior Recebimento -->
                <div class="kpi-card" onclick="toggleValor()" style="cursor:pointer;" title="Clique para ocultar/mostrar">
                    <div class="kpi-icon green"><i class="fas fa-chart-bar"></i></div>
                    <div class="kpi-label">Maior Entrada</div>
                    <div class="kpi-value success" id="kpiMaiorRec">R$ —</div>
                    <div class="kpi-sub" id="kpiMaiorRecInfo">—</div>
                </div>
                <!-- KPI Maior Pagamento -->
                <div class="kpi-card" onclick="toggleValor()" style="cursor:pointer;" title="Clique para ocultar/mostrar">
                    <div class="kpi-icon red"><i class="fas fa-chart-bar"></i></div>
                    <div class="kpi-label" id="kpiMaiorLabel">Maior Saída</div>
                    <div class="kpi-value danger" id="kpiMaior">R$ —</div>
                    <div class="kpi-sub" id="kpiMaiorInfo">—</div>
                </div>
            </div>

            <!-- Toolbar Row -->
            <div class="toolbar-row">
                <div class="toolbar-left">
                    <select class="year-select" id="yearSelect" onchange="onYearChange()">
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                    </select>
                    <select class="month-select" id="monthSelect" onchange="onMonthSelectChange()">
                        <option value="all">ANO</option>
                        <option value="1">JAN</option>
                        <option value="2">FEV</option>
                        <option value="3">MAR</option>
                        <option value="4">ABR</option>
                        <option value="5">MAI</option>
                        <option value="6">JUN</option>
                        <option value="7">JUL</option>
                        <option value="8">AGO</option>
                        <option value="9">SET</option>
                        <option value="10">OUT</option>
                        <option value="11">NOV</option>
                        <option value="12">DEZ</option>
                    </select>
                </div>
                <div class="toolbar-spacer"></div>
                <div class="toolbar-right">
                    <button id="btnViewDiaria" class="month-btn active" onclick="setBalanceChartView('diaria')">EVOLUÇÃO DIÁRIA</button>
                    <button id="btnViewMensal" class="month-btn" onclick="setBalanceChartView('mensal')">EVOLUÇÃO MENSAL</button>
                    <select class="chart-select" id="chartSelect" onchange="onChartSelectChange()">
                        <option value="pagamentos">GRÁFICOS DE PAGAMENTOS</option>
                        <option value="recebimentos">GRÁFICOS DE RECEBIMENTOS</option>
                        <option value="variacao">GRAFICOS DE VARIACAO</option>
                    </select>
                    <button class="month-btn active" onclick="openModal()">REGISTROS</button>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="charts-row" id="chartsRow">

                <!-- Gráfico mensal -->
                <div class="chart-panel is-hidden" id="chartPanelMensal" style="flex:1;">
                    <div id="chartLoadingMensal" class="loading-overlay" style="display:none;"><div class="spinner"></div></div>
                    <div class="chart-panel-header">
                        <span class="chart-panel-title" id="titleMensal"><i class="fas fa-chart-bar" style="margin-right:8px;color:var(--color-primary);"></i>Pagamentos por Mês</span>
                        <span style="font-size:0.65rem;color:var(--text-muted);font-family:var(--font-mono);" id="chartSubtitleMensal">—</span>
                    </div>
                    <div class="chart-canvas-wrapper"><canvas id="barChartMensal"></canvas></div>
                </div>

                <!-- Gráfico diário -->
                <div class="chart-panel" id="chartPanelDiario" style="flex:1.6;">
                    <div id="chartLoadingDiario" class="loading-overlay" style="display:none;"><div class="spinner"></div></div>
                    <div class="chart-panel-header">
                        <span class="chart-panel-title" id="titleDiario"><i class="fas fa-calendar-day" style="margin-right:8px;color:var(--color-primary);"></i>Pagamentos Diários</span>
                        <span style="font-size:0.65rem;color:var(--text-muted);font-family:var(--font-mono);" id="chartSubtitleDiario">—</span>
                    </div>
                    <div class="chart-canvas-wrapper"><canvas id="barChartDiario"></canvas></div>
                </div>

                <div class="chart-panel is-hidden" id="chartPanelVariacao" style="flex:1.6;">
                    <div id="chartLoadingVariacao" class="loading-overlay" style="display:none;"><div class="spinner"></div></div>
                    <div class="chart-panel-header">
                        <span class="chart-panel-title" id="titleVariacao"><i class="fas fa-chart-line" style="margin-right:8px;color:#10b981;"></i>Variação Diária</span>
                        <span style="font-size:0.65rem;color:var(--text-muted);font-family:var(--font-mono);" id="chartSubtitleVariacao">—</span>
                    </div>
                    <div class="chart-canvas-wrapper"><canvas id="barChartVariacao"></canvas></div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- MODAL PAGAMENTOS -->
<div id="recordsModal" class="modal-overlay">
    <div class="modal-card fullscreen">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitleText" style="color:#fff !important;"><i class="fa-solid fa-list-check" style="margin-right:15px;"></i>Registros de Pagamentos</h2>
            <span class="modal-close" onclick="closeModal()" title="Fechar (ESC)">&times;</span>
        </div>
        <div class="table-container">
            <table class="modal-table" id="dataTable">
                <thead id="modalThead"></thead>
                <tbody id="table-body">
                    <tr><td colspan="6"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><span>Carregando...</span></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API_BASE = window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1' ? 'http://localhost:3000' : '';

let allPagamentos = [], allRecebimentos = [];
let filteredData = [], modalData = [];
let chartMensalInst = null, chartDiarioInst = null, chartVariacaoInst = null;
let activeMonth = 'all', activeYear = '2026';
let selectedBarFilter = null;
let valorOculto = true;
const kpiVals = { kpiTotalPag:'R$ —', kpiTotalRec:'R$ —', kpiSaldo:'R$ —', kpiMaior:'R$ —', kpiMaiorRec:'R$ —', kpiMaiorInfo:'—', kpiMaiorRecInfo:'—', kpiSaldoSub:'—' };
let activeView = 'pagamentos'; // 'pagamentos' | 'recebimentos' | 'variacao'
let activeChartView = 'diaria'; // 'diaria' | 'mensal'

const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

const PEDIDOS_BAR_COLOR = '#ea580c';
const PAL_PAG  = { bar:PEDIDOS_BAR_COLOR, border:PEDIDOS_BAR_COLOR, dimBar:'rgba(234,88,12,0.18)', daily:PEDIDOS_BAR_COLOR, dailyBorder:PEDIDOS_BAR_COLOR, tip:'rgba(234,88,12,0.3)', tipTitle:PEDIDOS_BAR_COLOR };
const PAL_REC  = { bar:PEDIDOS_BAR_COLOR, border:PEDIDOS_BAR_COLOR, dimBar:'rgba(234,88,12,0.18)', daily:PEDIDOS_BAR_COLOR, dailyBorder:PEDIDOS_BAR_COLOR, tip:'rgba(234,88,12,0.3)', tipTitle:PEDIDOS_BAR_COLOR };

function fmt(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2}).format(v||0); }
function fmtDate(d){ if(!d)return'—'; const p=d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function fmtDateTime(d){
    if(!d)return 'Nao informada';
    return new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
}

function axisMoney(v){
    const n=Number(v)||0;
    if(n>=1000000) return 'R$ '+(n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
    if(n<10000) return 'R$ '+n.toLocaleString('pt-BR',{maximumFractionDigits:0});
    if(n>=1000) return 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';
    return 'R$ '+n.toLocaleString('pt-BR',{maximumFractionDigits:0});
}
function roundedAxisMax(value){
    const n=Number(value)||0;
    if(n<=0) return 1000;
    const target=n*1.2;
    let step=100;
    if(target>=1000000) step=100000;
    else if(target>=100000) step=10000;
    else if(target>=10000) step=1000;
    else if(target>=1000) step=500;
    return Math.ceil(target/step)*step;
}
function showToast(title,msg,type='default'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className=`toast${type==='danger'?' danger':type==='success'?' success':''}`;
    const ic=type==='danger'?'fa-exclamation-circle':type==='success'?'fa-check-circle':'fa-info-circle';
    t.innerHTML=`<i class="fas ${ic}" style="font-size:1.2rem;color:${type==='danger'?'#ef4444':type==='success'?'#10b981':'#fbbf24'}"></i><div class="toast-content"><div class="toast-title">${title}</div><div class="toast-subtitle">${msg}</div></div>`;
    c.appendChild(t);
    setTimeout(()=>{t.style.animation='slideIn 0.3s reverse forwards';setTimeout(()=>t.remove(),300);},4000);
}

// --- Toggle ocultar ---
function toggleValor(){
    valorOculto=!valorOculto;
    document.getElementById('kpiEyeIcon').className=valorOculto?'fas fa-eye-slash':'fas fa-eye';
    applyVisibility();
    if(window.erusAudit) window.erusAudit(valorOculto?'OCULTAR_VALORES_BALANCO':'VISUALIZAR_VALORES_BALANCO',{});
}
function applyVisibility(){
    const mask='-----';
    Object.keys(kpiVals).forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.textContent=valorOculto?mask:kpiVals[id];
    });
}

// --- Load ---
async function loadData(){
    document.getElementById('chartLoadingMensal').style.display='flex';
    document.getElementById('chartLoadingDiario').style.display='flex';
    try {
        const [rPag,rRec,rSync] = await Promise.all([
            fetch(`${API_BASE}/api/balanco/pagamentos`).then(r=>r.json()),
            fetch(`${API_BASE}/api/balanco/recebimentos`).then(r=>r.json()),
            fetch(`${API_BASE}/api/balanco/sync-status`).then(r=>r.json()).catch(()=>({success:false,last_sync_at:null})),
        ]);
        if(!rPag.success) throw new Error(rPag.error);
        if(!rRec.success) throw new Error(rRec.error);
        allPagamentos  = rPag.data  || [];
        allRecebimentos= rRec.data  || [];
        applyFilters();
        showToast('Ultima sincronizacao',fmtDateTime(rSync.last_sync_at),'success');
    } catch(e){
        showToast('Erro',e.message,'danger');
    } finally {
        document.getElementById('chartLoadingMensal').style.display='none';
        document.getElementById('chartLoadingDiario').style.display='none';
    }
}

// --- Filtros ---
function onYearChange(){ selectedBarFilter=null; activeYear=document.getElementById('yearSelect').value; resetMonth(); applyFilters(); if(window.erusAudit)window.erusAudit('SELECT_PERIODO_BALANCO',{ano:activeYear,mes:'ANO'}); }
function onMonthSelectChange(){ selectedBarFilter=null; activeMonth=document.getElementById('monthSelect').value; applyFilters(); if(window.erusAudit)window.erusAudit('SELECT_PERIODO_BALANCO',{ano:activeYear,mes:activeMonth}); }
function setMonthValue(month){ activeMonth=String(month); document.getElementById('monthSelect').value=activeMonth; }
function resetMonth(){ setMonthValue('all'); }
function setBalanceChartView(view,audit=true){
    selectedBarFilter=null;
    activeChartView=view;
    if(view==='mensal') setMonthValue('all');
    if(view==='diaria') setMonthValue(String(new Date().getMonth()+1));
    document.getElementById('btnViewDiaria').classList.toggle('active', view==='diaria');
    document.getElementById('btnViewMensal').classList.toggle('active', view==='mensal');
    updateChartVisibility();
    if(audit&&window.erusAudit)window.erusAudit('SELECT_VISAO_BALANCO',{visao:view,ano:activeYear,mes:activeMonth});
}
function updateChartVisibility(){
    const isVariacao = activeView === 'variacao';
    document.getElementById('chartPanelDiario').classList.toggle('is-hidden', isVariacao || activeChartView!=='diaria');
    document.getElementById('chartPanelMensal').classList.toggle('is-hidden', isVariacao || activeChartView!=='mensal');
    document.getElementById('chartPanelVariacao').classList.toggle('is-hidden', !isVariacao);
    if(isVariacao){
        renderChartVariacao();
        setTimeout(()=>{ if(chartVariacaoInst) chartVariacaoInst.resize(); },40);
        return;
    }
    if(activeChartView==='diaria'){
        renderChartDiario();
        setTimeout(()=>{ if(chartDiarioInst) chartDiarioInst.resize(); },40);
    } else {
        renderChartMensal();
        setTimeout(()=>{ if(chartMensalInst) chartMensalInst.resize(); },40);
    }
}

function onChartSelectChange(){
    selectedBarFilter=null;
    activeView = document.getElementById('chartSelect').value;
    applyFilters();
    if(window.erusAudit)window.erusAudit('SELECT_GRAFICO_BALANCO',{grafico:activeView,ano:activeYear,mes:activeMonth});
}

function getCurrentData(){
    if(activeView==='pagamentos') return allPagamentos;
    if(activeView==='recebimentos') return allRecebimentos;
    return [];
}

function applyFilters(){
    const src=getCurrentData();
    filteredData=src.filter(r=>{
        if(!r.data)return false;
        if(r.data.split('-')[0]!==activeYear)return false;
        if(activeMonth!=='all'&&parseInt(r.data.split('-')[1])!==parseInt(activeMonth))return false;
        return true;
    });
    modalData=[...filteredData];
    renderKPIs();
    updateChartLabels();
    updateChartVisibility();
    renderModalTable();
}

function rowMatchesSelectedBar(r){
    if(!selectedBarFilter || !r.data)return true;
    if(selectedBarFilter.type==='day')return r.data===selectedBarFilter.key;
    if(selectedBarFilter.type==='month')return r.data.startsWith(selectedBarFilter.key);
    return true;
}

function setSelectedBarFilter(type,key,label){
    if(selectedBarFilter && selectedBarFilter.type===type && selectedBarFilter.key===key){
        selectedBarFilter=null;
        return false;
    }
    selectedBarFilter={type,key,label};
    return true;
}

function isSelectedBar(type,key){
    return selectedBarFilter && selectedBarFilter.type===type && selectedBarFilter.key===key;
}

function getModalSourceData(){
    if(activeView==='variacao'){
        const baseEntradas=selectedBarFilter ? allRecebimentos.filter(rowMatchesSelectedBar) : filterByPeriod(allRecebimentos);
        const baseSaidas=selectedBarFilter ? allPagamentos.filter(rowMatchesSelectedBar) : filterByPeriod(allPagamentos);
        const entradas=baseEntradas.map(r=>({...r,tipoMovimento:'Entrada'}));
        const saidas=baseSaidas.map(r=>({...r,tipoMovimento:'Saída'}));
        return [...entradas,...saidas].sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    }
    return filteredData.filter(rowMatchesSelectedBar);
}

function updateChartLabels(){
    if(activeView==='variacao'){
        document.getElementById('modalTitleText').innerHTML=`<i class="fa-solid fa-list-check" style="margin-right:15px;"></i>Registros de Variação`;
        const totalBadge=document.getElementById('modalTotal');
        if(totalBadge) totalBadge.className='modal-total-badge rec';
        return;
    }
    const isPag = activeView==='pagamentos';
    const pal = isPag ? PAL_PAG : PAL_REC;
    const acento = isPag ? 'var(--color-primary)' : '#10b981';
    document.getElementById('titleMensal').innerHTML=`<i class="fas fa-chart-bar" style="margin-right:8px;color:${acento};"></i>${isPag?'Pagamentos':'Recebimentos'} por Mês`;
    document.getElementById('titleDiario').innerHTML=`<i class="fas fa-calendar-day" style="margin-right:8px;color:${acento};"></i>${isPag?'Pagamentos':'Recebimentos'} Diários`;
    document.getElementById('modalTitleText').innerHTML=`<i class="fa-solid fa-list-check" style="margin-right:15px;"></i>Registros de ${isPag?'Pagamentos':'Recebimentos'}`;
    const badge=document.getElementById('modalTotal');
    if(badge) badge.className=`modal-total-badge${isPag?'':' rec'}`;
}

// --- KPIs ---
function filterByPeriod(src){
    return src.filter(r=>{
        if(!r.data)return false;
        if(r.data.split('-')[0]!==activeYear)return false;
        if(activeMonth!=='all'&&parseInt(r.data.split('-')[1])!==parseInt(activeMonth))return false;
        return true;
    });
}

function renderKPIs(){
    const pagPeriodo = filterByPeriod(allPagamentos);
    const recPeriodo = filterByPeriod(allRecebimentos);

    // Total Saídas
    const totalPag = pagPeriodo.reduce((s,r)=>s+r.valor,0);
    kpiVals.kpiTotalPag = fmt(totalPag);
    document.getElementById('kpiTotalPagQtd').textContent = `${pagPeriodo.length.toLocaleString('pt-BR')} registros`;

    // Total Entradas
    const totalRec = recPeriodo.reduce((s,r)=>s+r.valor,0);
    kpiVals.kpiTotalRec = fmt(totalRec);
    document.getElementById('kpiTotalRecQtd').textContent = `${recPeriodo.length.toLocaleString('pt-BR')} registros`;

    // Saldo
    const saldo = totalRec - totalPag;
    kpiVals.kpiSaldo = fmt(Math.abs(saldo));
    kpiVals.kpiSaldoSub = saldo >= 0 ? 'Saldo positivo' : 'Saldo negativo';
    document.getElementById('kpiSaldo').className = 'kpi-value ' + (saldo >= 0 ? 'success' : 'danger');

    // Maior saída
    if(pagPeriodo.length>0){
        const m=pagPeriodo.reduce((a,b)=>b.valor>a.valor?b:a);
        kpiVals.kpiMaior = fmt(m.valor);
        kpiVals.kpiMaiorInfo = fmtDate(m.data)+(m.historico?` · ${m.historico.substring(0,28)}`:'');
    } else { kpiVals.kpiMaior='R$ —'; kpiVals.kpiMaiorInfo='—'; }

    // Maior entrada
    if(recPeriodo.length>0){
        const m=recPeriodo.reduce((a,b)=>b.valor>a.valor?b:a);
        kpiVals.kpiMaiorRec = fmt(m.valor);
        kpiVals.kpiMaiorRecInfo = fmtDate(m.data)+(m.historico?` · ${m.historico.substring(0,28)}`:'');
    } else { kpiVals.kpiMaiorRec='R$ —'; kpiVals.kpiMaiorRecInfo='—'; }

    applyVisibility();
}

// --- Gráfico Mensal ---
function renderChartMensal(){
    const isPag=activeView==='pagamentos';
    const pal=isPag?PAL_PAG:PAL_REC;
    const allSrc=isPag?allPagamentos:allRecebimentos;
    const labels=[],valores=[];
    for(let m=1;m<=12;m++){
        labels.push(MESES[m-1]);
        const key=`${activeYear}-${String(m).padStart(2,'0')}`;
        valores.push(allSrc.filter(r=>r.data&&r.data.startsWith(key)).reduce((s,r)=>s+(Number(r.valor)||0),0));
    }
    document.getElementById('chartSubtitleMensal').textContent=activeYear;
    const maxVal=Math.max(...valores,0);
    const yMax=roundedAxisMax(maxVal);
    if(chartMensalInst)chartMensalInst.destroy();
    chartMensalInst=new Chart(document.getElementById('barChartMensal').getContext('2d'),{
        type:'bar', plugins:[ChartDataLabels],
        data:{ labels, datasets:[{
            data:valores,
            backgroundColor:labels.map((_,i)=>{
                const key=`${activeYear}-${String(i+1).padStart(2,'0')}`;
                const sel=isSelectedBar('month',key);
                return sel?'#ffffff':pal.bar;
            }),
            borderColor:labels.map((_,i)=>{
                const key=`${activeYear}-${String(i+1).padStart(2,'0')}`;
                return isSelectedBar('month',key)?'#ffffff':pal.border;
            }), borderWidth:1, borderRadius:8, borderSkipped:false
        }]},
        options:{
            responsive:true,maintainAspectRatio:false,animation:{duration:350},
            interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{display:false},
                datalabels:{display:false},
                tooltip:{backgroundColor:'rgba(9,9,11,0.95)',borderColor:pal.tip,borderWidth:1,titleColor:pal.tipTitle,bodyColor:'#f4f4f5',callbacks:{label:ctx=>' '+fmt(ctx.parsed.y)}}
            },
            scales:{
                x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#71717a',font:{family:"'JetBrains Mono',monospace",size:10},maxRotation:0}},
                y:{min:0,max:yMax,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#71717a',font:{family:"'JetBrains Mono',monospace",size:9},callback:v=>axisMoney(v)}}
            },
            onClick:(evt,els)=>{
                if(!els.length)return;
                const month=els[0].index+1;
                const key=`${activeYear}-${String(month).padStart(2,'0')}`;
                const selected=setSelectedBarFilter('month',key,labels[els[0].index]);
                setMonthValue(selected ? month : 'all');
                applyFilters();
            }
        }
    });
}

// --- Gráfico Diário ---
function renderChartDiario(){
    const isPag=activeView==='pagamentos';
    const pal=isPag?PAL_PAG:PAL_REC;
    const byDay={};
    filteredData.forEach(r=>{if(r.data)byDay[r.data]=(byDay[r.data]||0)+(Number(r.valor)||0);});
    const monthForChart = activeMonth === 'all' ? String(new Date().getMonth() + 1) : activeMonth;
    const daysInMonth = new Date(parseInt(activeYear), parseInt(monthForChart), 0).getDate();
    const dias = [];
    for(let day=1; day<=daysInMonth; day++){
        dias.push(`${activeYear}-${String(monthForChart).padStart(2,'0')}-${String(day).padStart(2,'0')}`);
    }
    const valores=dias.map(d=>byDay[d] || 0);
    const labels=dias.map(d=>{const p=d.split('-');return`${p[2]}/${p[1]}`;});
    const subtitle=`${MESES[parseInt(monthForChart)-1]}/${activeYear}`;
    document.getElementById('chartSubtitleDiario').textContent=subtitle;
    const maxVal=Math.max(...valores,0);
    const yMax=roundedAxisMax(maxVal);
    if(chartDiarioInst)chartDiarioInst.destroy();
    chartDiarioInst=new Chart(document.getElementById('barChartDiario').getContext('2d'),{
        type:'bar', plugins:[ChartDataLabels],
        data:{ labels, datasets:[{
            data:valores,
            backgroundColor:dias.map(d=>isSelectedBar('day',d)?'#ffffff':pal.daily),
            borderColor:dias.map(d=>isSelectedBar('day',d)?'#ffffff':pal.dailyBorder),
            borderWidth:1, borderRadius:6, borderSkipped:false
        }]},
        options:{
            responsive:true,maintainAspectRatio:false,animation:{duration:350},
            interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{display:false},
                datalabels:{display:false},
                tooltip:{backgroundColor:'rgba(9,9,11,0.95)',borderColor:pal.tip,borderWidth:1,titleColor:pal.tipTitle,bodyColor:'#f4f4f5',callbacks:{title:ctx=>dias[ctx[0].dataIndex]?fmtDate(dias[ctx[0].dataIndex]):'',label:ctx=>' '+fmt(ctx.parsed.y)}}
            },
            scales:{
                x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#71717a',font:{family:"'JetBrains Mono',monospace",size:dias.length>20?8:10},maxRotation:dias.length>15?45:0,autoSkip:true,maxTicksLimit:31}},
                y:{min:0,max:yMax,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#71717a',font:{family:"'JetBrains Mono',monospace",size:9},callback:v=>axisMoney(v)}}
            },
            onClick:(evt,els)=>{ if(!els.length)return; setSelectedBarFilter('day',dias[els[0].index],labels[els[0].index]); renderChartDiario(); }
        }
    });
}

function sumRowsByKey(rows, keyFn){
    return rows.reduce((acc,r)=>{
        if(!r.data)return acc;
        const key=keyFn(r.data);
        if(key)acc[key]=(acc[key]||0)+(Number(r.valor)||0);
        return acc;
    },{});
}

function buildVariacaoData(){
    if(activeChartView==='mensal'){
        const recByMonth=sumRowsByKey(allRecebimentos,d=>d.split('-')[0]===activeYear?d.slice(0,7):null);
        const pagByMonth=sumRowsByKey(allPagamentos,d=>d.split('-')[0]===activeYear?d.slice(0,7):null);
        const labels=[],keys=[],entradas=[],saidas=[],variacao=[];
        for(let m=1;m<=12;m++){
            const key=`${activeYear}-${String(m).padStart(2,'0')}`;
            keys.push(key);
            labels.push(MESES[m-1]);
            const entrada=recByMonth[key]||0;
            const saida=pagByMonth[key]||0;
            entradas.push(entrada);
            saidas.push(saida);
            variacao.push(entrada-saida);
        }
        return { labels, keys, entradas, saidas, variacao, subtitle:activeYear };
    }

    const monthForChart = activeMonth === 'all' ? String(new Date().getMonth() + 1) : activeMonth;
    const monthKey=`${activeYear}-${String(monthForChart).padStart(2,'0')}`;
    const recByDay=sumRowsByKey(allRecebimentos,d=>d.startsWith(monthKey)?d:null);
    const pagByDay=sumRowsByKey(allPagamentos,d=>d.startsWith(monthKey)?d:null);
    const daysInMonth = new Date(parseInt(activeYear), parseInt(monthForChart), 0).getDate();
    const labels=[],keys=[],entradas=[],saidas=[],variacao=[];
    for(let day=1; day<=daysInMonth; day++){
        const key=`${monthKey}-${String(day).padStart(2,'0')}`;
        keys.push(key);
        labels.push(`${String(day).padStart(2,'0')}/${String(monthForChart).padStart(2,'0')}`);
        const entrada=recByDay[key]||0;
        const saida=pagByDay[key]||0;
        entradas.push(entrada);
        saidas.push(saida);
        variacao.push(entrada-saida);
    }
    return { labels, keys, entradas, saidas, variacao, subtitle:`${MESES[parseInt(monthForChart)-1]}/${activeYear}` };
}

function renderChartVariacao(){
    const data=buildVariacaoData();
    let acumulado=0;
    const acumulados=data.variacao.map(v=>acumulado+=v);
    const maxBar=Math.max(...data.variacao.map(v=>Math.abs(v)),0);
    const maxLine=Math.max(...acumulados.map(v=>Math.abs(v)),0);
    const yMax=roundedAxisMax(maxBar);
    const yLineMax=roundedAxisMax(maxLine);

    document.getElementById('titleVariacao').innerHTML=`<i class="fas fa-chart-line" style="margin-right:8px;color:#10b981;"></i>Variação ${activeChartView==='mensal'?'Mensal':'Diária'}`;
    document.getElementById('chartSubtitleVariacao').textContent=data.subtitle;

    if(chartVariacaoInst)chartVariacaoInst.destroy();
    chartVariacaoInst=new Chart(document.getElementById('barChartVariacao').getContext('2d'),{
        type:'bar',
        data:{
            labels:data.labels,
            datasets:[
                {
                    type:'bar',
                    label:'Variação',
                    data:data.variacao,
                    backgroundColor:data.variacao.map((v,i)=>isSelectedBar(activeChartView==='mensal'?'month':'day',data.keys[i])?'#ffffff':v>=0?'rgba(16,185,129,0.82)':'rgba(239,68,68,0.82)'),
                    borderColor:data.variacao.map((v,i)=>isSelectedBar(activeChartView==='mensal'?'month':'day',data.keys[i])?'#ffffff':v>=0?'#10b981':'#ef4444'),
                    borderWidth:1,
                    borderRadius:6,
                    borderSkipped:false,
                    yAxisID:'y'
                },
                {
                    type:'line',
                    label:'Acumulado',
                    data:acumulados,
                    borderColor:'#fbbf24',
                    backgroundColor:'rgba(251,191,36,0.08)',
                    borderWidth:2,
                    pointRadius:2,
                    pointHoverRadius:4,
                    tension:0.28,
                    fill:false,
                    yAxisID:'y1'
                }
            ]
        },
        options:{
            responsive:true,maintainAspectRatio:false,animation:{duration:350},
            interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{display:false},
                tooltip:{
                    backgroundColor:'rgba(9,9,11,0.95)',
                    borderColor:'rgba(251,191,36,0.35)',
                    borderWidth:1,
                    titleColor:'#fbbf24',
                    bodyColor:'#f4f4f5',
                    callbacks:{
                        title:ctx=>activeChartView==='mensal'?data.labels[ctx[0].dataIndex]:fmtDate(data.keys[ctx[0].dataIndex]),
                        label:ctx=>{
                            const i=ctx.dataIndex;
                            if(ctx.datasetIndex===1)return ' Acumulado: '+fmt(acumulados[i]);
                            return [
                                ' Entradas: '+fmt(data.entradas[i]),
                                ' Saídas: '+fmt(data.saidas[i]),
                                ' Variação: '+fmt(data.variacao[i])

                    }

                y:{min:-yMax,max:yMax,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#71717a',font:{family:"'JetBrains Mono',monospace",size:9},callback:v=>axisMoney(v)}},

            },
            onClick:(evt,els)=>{
                if(!els.length)return;
                const i=els[0].index;
                setSelectedBarFilter(activeChartView==='mensal'?'month':'day',data.keys[i],data.labels[i]);
                renderChartVariacao();
            }
        }
    });
}

// --- Modal ---
function buildModalThead(){
    if(activeView==='variacao'){
        const cols=[{w:'9%',l:'TIPO'},{w:'9%',l:'COD.'},{w:'14%',l:'VALOR'},{w:'11%',l:'DATA'},{w:'',l:'HISTORICO'}];
        document.getElementById('modalThead').innerHTML=`
        <tr>${cols.map(c=>`<th style="${c.w?'width:'+c.w:''}">${c.l}</th>`).join('')}</tr>
        <tr>${cols.map((_,i)=>`<th><input class="filter-input-table modal-col-filter" data-col="${i}" placeholder="..."></th>`).join('')}</tr>`;
        document.querySelectorAll('.modal-col-filter').forEach(inp=>{
            inp.addEventListener('input',()=>{
                const fs=[...document.querySelectorAll('.modal-col-filter')].map(i=>i.value.toLowerCase());
                modalData=getModalSourceData().filter(r=>{
                    const cols=[r.tipoMovimento||'',String(r.codigo||''),fmt(r.valor),fmtDate(r.data),r.historico||''];
                    return fs.every((f,i)=>!f||cols[i].toLowerCase().includes(f));
                });
                renderModalTable();
            });
        });
        return;
    }
    const isPag=activeView==='pagamentos';
    const cols=isPag
        ?[{w:'11%',l:'DATA BAIXA'},{w:'9%',l:'CÓD. PAG.'},{w:'9%',l:'CÓD. DESPESA'},{w:'',l:'HISTÓRICO'},{w:'',l:'NOME DESPESA'},{w:'14%',l:'VALOR'}]
        :[{w:'9%',l:'CÓD. REC.'},{w:'14%',l:'VALOR'},{w:'11%',l:'DATA PAG.'},{w:'',l:'QUEM PAGOU'}];
    document.getElementById('modalThead').innerHTML=`
        <tr>${cols.map(c=>`<th style="${c.w?'width:'+c.w:''}">${c.l}</th>`).join('')}</tr>
        <tr>${cols.map((_,i)=>`<th><input class="filter-input-table modal-col-filter" data-col="${i}" placeholder="..."></th>`).join('')}</tr>`;
    document.querySelectorAll('.modal-col-filter').forEach(inp=>{
        inp.addEventListener('input',()=>{
            const fs=[...document.querySelectorAll('.modal-col-filter')].map(i=>i.value.toLowerCase());
            modalData=getModalSourceData().filter(r=>{
                const cols=activeView==='pagamentos'
                    ?[fmtDate(r.data),String(r.codigo||''),String(r.despesa||''),r.historico||'',r.nomeDespesa||'',fmt(r.valor)]
                    :[String(r.codigo||''),fmt(r.valor),fmtDate(r.data),r.historico||''];
                return fs.every((f,i)=>!f||cols[i].toLowerCase().includes(f));
            });
            renderModalTable();
        });
    });
}
function openModal(){
    buildModalThead();
    modalData=getModalSourceData();
    updateChartLabels();
    renderModalTable();
    document.getElementById('recordsModal').classList.add('open');
    if(window.erusAudit)window.erusAudit('ABRIR_REGISTROS_BALANCO',{tipo:activeView,ano:activeYear,mes:activeMonth,registros:modalData.length});
}
function closeModal(){ document.getElementById('recordsModal').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

function onModalSearch(){
    const s=(document.getElementById('modalSearch')?.value||'').toLowerCase();
    modalData=getModalSourceData().filter(r=>!s||(r.historico||'').toLowerCase().includes(s)||String(r.codigo||'').toLowerCase().includes(s)||(r.tipoMovimento||'').toLowerCase().includes(s));
    renderModalTable();
}

function renderModalTable(){
    const tbody=document.getElementById('table-body') || document.getElementById('modalTableBody');
    const total=modalData.reduce((s,r)=>s+r.valor,0);
    const isPag=activeView==='pagamentos';
    const countEl=document.getElementById('modalCount');
    const totalEl=document.getElementById('modalTotal');
    if(countEl) countEl.textContent=`${modalData.length.toLocaleString('pt-BR')} registros`;
    if(totalEl) totalEl.textContent=valorOculto?'••••••':fmt(total);
    const mask='••••••';
    if(modalData.length===0){ tbody.innerHTML=`<tr><td colspan="6"><div class="empty-state"><i class="fas fa-search"></i><span>Nenhum registro encontrado</span></div></td></tr>`; return; }
    if(activeView==='variacao'){
        tbody.innerHTML=modalData.map(r=>`<tr>
            <td class="${r.tipoMovimento==='Entrada'?'td-valor-rec':'td-valor-pag'}">${r.tipoMovimento||'—'}</td>
            <td class="td-code">${r.codigo||'—'}</td>
            <td class="${r.tipoMovimento==='Entrada'?'td-valor-rec':'td-valor-pag'}">${valorOculto?mask:fmt(r.valor)}</td>
            <td class="td-date">${fmtDate(r.data)}</td>
            <td class="td-hist">${r.historico||'—'}</td>
        </tr>`).join('');
        return;
    }
    if(isPag){
        tbody.innerHTML=modalData.map(r=>`<tr>
            <td class="td-date">${fmtDate(r.data)}</td>
            <td class="td-code">${r.codigo||'—'}</td>
            <td class="td-code">${r.despesa||'—'}</td>
            <td class="td-hist">${r.historico||'—'}</td>
            <td class="td-hist" style="max-width:200px;">${r.nomeDespesa||'—'}</td>
            <td class="td-valor-pag">${valorOculto?mask:fmt(r.valor)}</td>
        </tr>`).join('');
    } else {
        tbody.innerHTML=modalData.map(r=>`<tr>
            <td class="td-code">${r.codigo||'—'}</td>
            <td class="td-valor-rec">${valorOculto?mask:fmt(r.valor)}</td>
            <td class="td-date">${fmtDate(r.data)}</td>
            <td class="td-hist">${r.historico||'—'}</td>
        </tr>`).join('');
    }
}

// --- Export ---
function exportarCSV(){
    if(filteredData.length===0){showToast('Atenção','Nenhum dado','danger');return;}
    const isPag=activeView==='pagamentos';
    const header=isPag?'Código,Cód.Despesa,Nome Despesa,Valor,Data,Histórico':'Código,Valor,Data,Histórico';
    const rows=filteredData.map(r=>isPag
        ?`${r.codigo},"${r.despesa||''}","${r.nomeDespesa||''}",${r.valor.toFixed(2)},${r.data},"${(r.historico||'').replace(/"/g,'""')}"`
        :`${r.codigo},${r.valor.toFixed(2)},${r.data},"${(r.historico||'').replace(/"/g,'""')}"`
    );
    const csv=[header,...rows].join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`${activeView}_${new Date().toISOString().split('T')[0]}.csv`; a.click(); URL.revokeObjectURL(url);
    showToast('Exportado',`${filteredData.length} registros`,'success');
    if(window.erusAudit)window.erusAudit('EXPORTAR_CSV_BALANCO',{tipo:activeView,ano:activeYear,mes:activeMonth,registros:filteredData.length,arquivo:a.download});
}

// --- Init ---
window.addEventListener('DOMContentLoaded',()=>{
    const now=new Date();
    const curYear=String(now.getFullYear());
    const curMonth=String(now.getMonth()+1);
    activeYear=curYear; activeMonth=curMonth;
    const ys=document.getElementById('yearSelect');
    if([...ys.options].some(o=>o.value===curYear))ys.value=curYear;
    else{ys.value='2026';activeYear='2026';}
    const ms=document.getElementById('monthSelect');
    if(ms) ms.value=activeMonth;
    setBalanceChartView('diaria',false);
    loadData();
});
