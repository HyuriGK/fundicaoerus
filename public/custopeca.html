<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <script src="js/auth-guard.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/sidebar.js?v=20260703-sidebar-mobile5"></script>
    <script src="js/confirm-dialog.js?v=20260617"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custo de Produção - Fundição Erus</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="js/activity-logger.js?v=20260605e"></script>

    <style>
        :root {
            --bg-app: #060608;
            --bg-card: rgba(24, 24, 27, 0.4);
            --bg-input: #121214;
            --bg-modal: #0d0d0f;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-highlight: rgba(251, 191, 36, 0.12);
            --primary: #fbbf24;
            --primary-dim: #d97706;
            --primary-glow: rgba(251, 191, 36, 0.05);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --text-dim: #4b4b52;
            --danger: #ef4444;
            --success: #10b981;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --font-ui: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        input { user-select: text !important; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(251, 191, 36, 0.03), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(234, 88, 12, 0.02), transparent 40%);
        }

        /* --- SIDE NAVIGATION --- */
        .side-menu-trigger { position: fixed; left: 0; top: 0; bottom: 0; width: 40px; z-index: 2000; }
        .side-menu {
            position: fixed; left: -320px; top: 0; bottom: 0; width: 300px;
            background: rgba(9, 9, 11, 0.98); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-subtle); z-index: 2010; transition: var(--transition);
            display: flex; flex-direction: column; padding: 40px 24px; box-shadow: 20px 0 50px rgba(0, 0, 0, 0.8);
        }
        .side-menu-trigger:hover + .side-menu, .side-menu:hover { left: 0; }
        .side-btn {
            width: 100%; padding: 14px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle); color: var(--text-muted); font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: var(--transition);
            text-decoration: none; margin-bottom: 12px;
        }
        .side-btn:hover { background: rgba(251, 191, 36, 0.08); border-color: var(--primary); color: var(--primary); transform: translateX(6px); }

        /* --- HEADER --- */
        header { padding: 30px 40px 10px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header-title h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -1px; }
        .header-title p { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }

        /* --- MAIN LAYOUT --- */
        .app-content { flex: 1; display: grid; grid-template-columns: 1fr 380px; gap: 30px; padding: 20px 40px 40px; overflow: hidden; }
        .scrollable-area { overflow-y: auto; padding-right: 15px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
        .scrollable-area::-webkit-scrollbar { width: 6px; }
        .scrollable-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* --- SECTOR GRID --- */
        .sector-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .sim-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
            padding: 24px; display: flex; flex-direction: column; gap: 15px; transition: var(--transition);
            position: relative; overflow: hidden;
        }
        .dim-layer { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 4000; display: none; }
        .sim-card:hover { border-color: rgba(251, 191, 36, 0.25); background: rgba(30, 30, 32, 0.4); transform: translateY(-2px); }
        .sim-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--primary); opacity: 0.3; }
        .sim-card-header { display: flex; justify-content: space-between; align-items: center; }
        .sim-card-title-group { display: flex; align-items: center; gap: 10px; }
        .sim-card-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary); }
        .btn-gear { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: var(--transition); padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-gear:hover { color: var(--primary); background: rgba(251, 191, 36, 0.1); transform: rotate(45deg); }
        .sim-card-icon { font-size: 1.1rem; color: var(--primary); opacity: 0.8; }
        .card-result { margin-top: 5px; padding-top: 15px; border-top: 1px dashed var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
        .card-result-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        .card-result-value { font-family: var(--font-mono); font-weight: 700; color: #fff; font-size: 1.1rem; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .input-group input {
            background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 8px;
            padding: 10px 12px; color: #fff; font-family: var(--font-mono); font-size: 0.9rem; transition: border-color 0.2s; width: 100%;
        }
        .input-group input:focus { border-color: var(--primary); outline: none; }

        /* --- SUMMARY PANEL --- */
        .summary-panel {
            background: linear-gradient(180deg, rgba(24, 24, 27, 0.8), rgba(9, 9, 11, 0.95));
            border: 1px solid var(--border-highlight); border-radius: var(--radius-xl);
            padding: 35px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px); height: fit-content;
        }
        .summary-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px; }
        .summary-line { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
        .summary-label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .summary-value { font-family: var(--font-mono); font-weight: 600; color: #fff; }
        .total-box { background: rgba(251, 191, 36, 0.08); border: 1px solid var(--primary); border-radius: var(--radius-lg); padding: 30px 20px; text-align: center; margin-top: 10px; }
        .total-label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary); margin-bottom: 8px; }
        .total-large { font-size: 2.5rem; font-weight: 900; font-family: var(--font-mono); color: #fff; letter-spacing: -1px; }

        /* --- FULLSCREEN MODAL --- */
        #modalOverlay {
            position: fixed; inset: 0; background: #0d0d0f; z-index: 9999;
            display: none; flex-direction: column; opacity: 1; pointer-events: auto;
        }
        .modal-header-nav {
            padding: 30px 60px; border-bottom: 1px solid var(--border-subtle);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-content-container { flex: 1; overflow-y: auto; padding: 50px 60px; display: grid; grid-template-columns: 1fr 400px; gap: 50px; }
        .modal-body-main { display: flex; flex-direction: column; gap: 40px; }
        .modal-sidebar { background: rgba(255,255,255,0.02); border-radius: var(--radius-xl); padding: 30px; border: 1px solid var(--border-subtle); height: fit-content; }

        .section-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        
        .labor-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .labor-table th { text-align: left; font-size: 0.65rem; text-transform: uppercase; color: var(--text-dim); padding: 0 15px 10px; border-bottom: 1px solid var(--border-subtle); }
        .labor-table td { padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid transparent; }
        .labor-table td:first-child { border-radius: 12px 0 0 12px; }
        .labor-table td:last-child { border-radius: 0 12px 12px 0; }

        .table-input { background: transparent; border: none; color: #fff; width: 100%; font-family: var(--font-mono); font-size: 0.95rem; outline: none; }
        .btn-add-row { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: var(--transition); margin-top: 15px; width: fit-content; display: flex; align-items: center; gap: 8px; }
        .btn-add-row:hover { background: var(--success); color: #000; }

        .save-bar { padding: 30px 60px; border-top: 1px solid var(--border-subtle); display: flex; gap: 20px; justify-content: flex-end; }
        .btn-main { padding: 14px 30px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: var(--transition); border: none; font-size: 0.9rem; text-transform: uppercase; }
        .btn-save { background: var(--primary); color: #000; }
        .btn-save:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-cancel { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border-subtle); }

        .kpi-modal { text-align: center; margin-bottom: 25px; }
        .kpi-modal-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .kpi-modal-value { font-size: 1.8rem; font-weight: 800; font-family: var(--font-mono); color: #fff; }

        .print-only { display: none !important; }

        @media print { 
            .side-menu, .side-menu-trigger, .summary-panel, .btn-gear, #modalOverlay, .app-content, header { display: none !important; }
            .print-only { display: block !important; position: fixed; bottom: 0; width: 100%; padding: 20px; text-align: right; color: #000; font-size: 10px; }
        }
    </style>
</head>

<body>
    <!-- Overlay for closing context -->
    <div id="globalOverlay" class="dim-layer"></div>

    <div class="side-menu-trigger"></div>
    <nav class="side-menu">
        <button class="side-btn" id="printBtn"> Gerar PDF</button>
        <button class="side-btn" id="resetBtn"> Resetar Tudo</button>
        <a href="index.html" class="side-btn"><i class="fa-solid fa-arrow-left"></i> Início</a>
    </nav>

    <!-- FULLSCREEN MODAL -->
    <div id="modalOverlay">
        <div class="modal-header-nav">
            <div>
                <h2 id="modalTitle" style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 800;">Detalhamento</h2>
                <p id="modalSubtitle" style="color: var(--primary); font-size: 0.75rem; font-weight: 700; text-transform: uppercase;"></p>
            </div>
            <button class="btn-gear" id="closeXBtn" style="font-size: 1.5rem;"> </button>
        </div>

        <div class="modal-content-container">
            <div class="modal-body-main">
                <section>
                    <div class="section-title"><i class="fa-solid fa-flask"></i> Insumos</div>
                    <div id="matList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;"></div>
                </section>
                <section>
                    <div class="section-title"><i class="fa-solid fa-users"></i> Mão de Obra</div>
                    <table class="labor-table">
                        <thead>
                            <tr>
                                <th>Cargo</th><th>Qtd</th><th>Salário</th><th>Total</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="laborList"></tbody>
                    </table>
                    <button class="btn-add-row" id="addLaborBtn"> Novo Grupo</button>
                </section>
            </div>
            <aside class="modal-sidebar">
                <div class="input-group" style="margin-bottom: 20px;">
                    <label id="prodLabel">Produção Mensal</label>
                    <input type="number" id="prodInput">
                </div>
                <div class="input-group" style="margin-bottom: 30px;">
                    <label>Encargos (%)</label>
                    <input type="number" id="chargesInput">
                </div>
                <div class="kpi-modal">
                    <div class="kpi-modal-label">Custo Mão de Obra / kg</div>
                    <div class="kpi-modal-value" id="derivedRateLabel" style="color: var(--primary);">R$ 0,00</div>
                </div>
            </aside>
        </div>
        <div class="save-bar">
            <button class="btn-main btn-cancel" id="cancelBtn">Descartar</button>
            <button class="btn-main btn-save" id="saveBtn">Salvar</button>
        </div>
    </div>

    <header>
        <div class="header-title">
            <h1>Calculadora de Custo</h1>
            <p>Controle de produção por setor operativo</p>
        </div>
    </header>

    <main class="app-content">
        <div class="scrollable-area">
            <section class="config-card">
                <div class="input-group">
                    <label>Identificação</label>
                    <input type="text" id="pieceName" placeholder="Peça..." oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>Peso Peça (kg)</label>
                    <input type="number" id="pieceWeight" value="1.0" step="0.1" oninput="calculate()">
                </div>
            </section>
            <div id="mainGrid" class="sector-grid"></div>
        </div>
        <aside class="summary-panel">
            <h3 class="summary-title"><i class="fa-solid fa-coins"></i> Resumo</h3>
            <div id="summaryLines"></div>
            <div class="total-box">
                <div class="total-label">Custo Total</div>
                <div id="grandTotalLabel" class="total-large">R$ 0,00</div>
            </div>
        </aside>
    </main>

    <div class="print-only">
        Gerado em: <span id="printDate"></span> | Custo Total: <span id="printTotal"></span>
    </div>

    <script>
        const MASTER_KEY = 'ERUS_CALC_V5_STABLE';
        const SECTORS_DEFAULT = {
            MOL: { name: 'Moldagem', icon: 'fa-box-open', mType: 'areia', w: 0, 
                   mats: [{ l: 'Areia/kg', v: 0.85, m: 'areia' }, { l: 'Frete/kg', v: 0.15, m: 'areia' }],
                   labor: [{ l: 'Equipe', qty: 2, s: 3500 }], prod: 10000, enc: 0, lMult: 'piece' },
            FUS: { name: 'Fusão', icon: 'fa-fire', mType: 'piece', 
                   mats: [{ l: 'Liga/kg', v: 12.00, m: 'piece' }],
                   labor: [{ l: 'Operadores', qty: 1, s: 4000 }], prod: 8000, enc: 0 },
            DES: { name: 'Desmoldagem', icon: 'fa-burst', mType: 'piece', labor: [{ l: 'Aux', qty: 1, s: 2000 }], prod: 10000, enc: 0 },
            ACB: { name: 'Acabamento', icon: 'fa-hammer', mType: 'piece', labor: [{ l: 'Equipe', qty: 2, s: 2800 }], prod: 8000, enc: 0 },
            USI: { name: 'Usinagem', icon: 'fa-gears', mType: 'piece', labor: [], prod: 5000, enc: 0 },
            EXP: { name: 'Expedição', icon: 'fa-truck', mType: 'piece', labor: [], prod: 15000, enc: 0 },
            ADM: { name: 'Administrativo', icon: 'fa-city', mType: 'piece', labor: [{ l: 'ADM', qty: 1, s: 3500 }], prod: 10000, enc: 0 }
        };

        let SECTORS = JSON.parse(JSON.stringify(SECTORS_DEFAULT));
        let activeSector = null;
        let tempLabor = [];

        function fmt(n) { return 'R$ ' + (n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }

        function calculate() {
            const pW = parseFloat(document.getElementById('pieceWeight').value) || 0;
            let grand = 0;
            Object.keys(SECTORS).forEach(id => {
                const s = SECTORS[id];
                const sW = s.w || 0;
                let total = 0;
                (s.mats || []).forEach(m => total += (m.v * (m.m === 'areia' ? sW : pW)));
                const wages = (s.labor || []).reduce((a, g) => a + (g.qty * g.s), 0) * (1 + (s.enc || 0)/100);
                total += (s.prod > 0 ? (wages / s.prod) : 0) * (s.lMult === 'areia' ? sW : pW);
                const valEl = document.getElementById(`val-${id}`);
                if (valEl) valEl.textContent = fmt(total);
                const sumEl = document.getElementById(`sum-${id}`);
                if (sumEl) sumEl.textContent = fmt(total);
                grand += total;
            });
            document.getElementById('grandTotalLabel').textContent = fmt(grand);
            document.getElementById('printTotal').textContent = fmt(grand);
        }

        function renderGrid() {
            const grid = document.getElementById('mainGrid');
            const summary = document.getElementById('summaryLines');
            grid.innerHTML = ''; summary.innerHTML = '';
            Object.keys(SECTORS).forEach(id => {
                const s = SECTORS[id];
                const card = document.createElement('div');
                card.className = 'sim-card';
                if (id === 'ADM') card.style.gridColumn = 'span 2';
                card.innerHTML = `
                    <div class="sim-card-header">
                        <div class="sim-card-title-group">
                            <span class="sim-card-title">${s.name}</span>
                            <button class="btn-gear" data-sector="${id}"> </button>
                        </div>
                        <i class="fa-solid ${s.icon} sim-card-icon"></i>
                    </div>
                    ${(s.mType === 'areia' || id === 'MOL') ? `
                        <div class="input-group">
                            <label>Peso Bolo (kg)</label>
                            <input type="number" class="w-input" data-sector="${id}" value="${s.w || 0}">
                        </div>` : ''}
                    <div class="card-result">
                        <span class="card-result-label">Subtotal</span>
                        <span class="card-result-value" id="val-${id}">R$ 0,00</span>
                    </div>`;
                grid.appendChild(card);
                summary.innerHTML += `<div class="summary-line"><span class="summary-label">${s.name}</span><span class="summary-value" id="sum-${id}">R$ 0,00</span></div>`;
            });
            calculate();
        }

        // --- THE FIX: ROBUST MODAL CONTROL ---
        function showModal(id) {
            console.log("Opening modal:", id);
            activeSector = id;
            const s = SECTORS[id];
            tempLabor = JSON.parse(JSON.stringify(s.labor || []));
            
            document.getElementById('modalSubtitle').textContent = s.name;
            document.getElementById('prodInput').value = s.prod || 0;
            document.getElementById('chargesInput').value = s.enc || 0;
            
            const mList = document.getElementById('matList');
            mList.innerHTML = '';
            (s.mats || []).forEach((m, idx) => {
                mList.innerHTML += `<div class="input-group"><label>${m.l}</label><input type="number" class="mat-item-input" data-idx="${idx}" value="${m.v}"></div>`;
            });

            renderLabor();
            updateModalStats();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function hideModal() {
            console.log("Hiding modal");
            document.getElementById('modalOverlay').style.display = 'none';
            activeSector = null;
        }

        function renderLabor() {
            const list = document.getElementById('laborList');
            list.innerHTML = '';
            tempLabor.forEach((g, idx) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="text" class="table-input" value="${g.l}" oninput="tempLabor[${idx}].l=this.value"></td>
                    <td><input type="number" class="table-input" value="${g.qty}" oninput="tempLabor[${idx}].qty=parseFloat(this.value)||0; updateModalStats()"></td>
                    <td><input type="number" class="table-input" value="${g.s}" oninput="tempLabor[${idx}].s=parseFloat(this.value)||0; updateModalStats()"></td>
                    <td id="row-t-${idx}" style="font-family: var(--font-mono);">${fmt(g.qty * g.s)}</td>
                    <td><button class="btn-remove-row" onclick="tempLabor.splice(${idx},1); renderLabor(); updateModalStats()"> </button></td>`;
                list.appendChild(row);
            });
        }

        function updateModalStats() {
            const base = tempLabor.reduce((a, g) => a + (g.qty * g.s), 0);
            const enc = parseFloat(document.getElementById('chargesInput').value) || 0;
            const prod = parseFloat(document.getElementById('prodInput').value) || 0;
            const rate = prod > 0 ? ((base * (1 + enc/100)) / prod) : 0;
            document.getElementById('derivedRateLabel').textContent = fmt(rate);
            tempLabor.forEach((g, idx) => {
                const el = document.getElementById(`row-t-${idx}`);
                if (el) el.textContent = fmt(g.qty * g.s);
            });
        }

        // --- EVENT DELEGATION ---
        document.body.addEventListener('click', e => {
            const gear = e.target.closest('.btn-gear');
            if (gear) showModal(gear.dataset.sector);
        });

        document.getElementById('mainGrid').addEventListener('input', e => {
            const wIn = e.target.closest('.w-input');
            if (wIn) {
                SECTORS[wIn.dataset.sector].w = parseFloat(wIn.value) || 0;
                save(); calculate();
            }
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const s = SECTORS[activeSector];
            s.labor = JSON.parse(JSON.stringify(tempLabor));
            s.prod = parseFloat(document.getElementById('prodInput').value) || 0;
            s.enc = parseFloat(document.getElementById('chargesInput').value) || 0;
            const matInputs = document.querySelectorAll('.mat-item-input');
            matInputs.forEach(inp => s.mats[inp.dataset.idx].v = parseFloat(inp.value) || 0);
            save(); calculate(); hideModal();
        });

        document.getElementById('cancelBtn').addEventListener('click', hideModal);
        document.getElementById('closeXBtn').addEventListener('click', hideModal);
        document.getElementById('addLaborBtn').addEventListener('click', () => {
            tempLabor.push({ l: 'Novo', qty: 1, s: 0 }); renderLabor();
        });

        function save() { localStorage.setItem(MASTER_KEY, JSON.stringify(SECTORS)); }
        function load() {
            const saved = localStorage.getItem(MASTER_KEY);
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    Object.keys(p).forEach(k => {
                        if (SECTORS[k]) SECTORS[k] = { ...SECTORS[k], ...p[k] };
                    });
                } catch(e) {}
            }
        }

        document.getElementById('resetBtn').addEventListener('click', async () => { if(await classicConfirm('Resetar todas as configurações?')) { localStorage.clear(); location.reload(); }});
        document.getElementById('printBtn').addEventListener('click', () => { 
            document.getElementById('printDate').textContent = new Date().toLocaleString();
            window.print(); 
        });

        load(); renderGrid();
    </script>

</body>
