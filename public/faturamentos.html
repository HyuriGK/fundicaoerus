<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Faturamento (ERP) - Fundição Erus</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        /* CSS Variables - Burnt Orange Theme */
        :root {
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-primary: #f59e0b;
            /* Amber 500 */
            --color-primary-dim: #ea580c;
            /* Orange 600 */
            --bg-body: #09090b;
            /* Zinc 950 */
            --bg-card: rgba(24, 24, 27, 0.7);
            /* Zinc 900 Glass */
            --text-main: #f4f4f5;
            /* Zinc 100 */
            --text-muted: #a1a1aa;
            /* Zinc 400 */
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-separator: rgba(255, 255, 255, 0.06);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --status-success: #10b981;
            --status-danger: #ef4444;
        }

        /* Reset & Base */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image: radial-gradient(circle at 15% 50%, rgba(234, 88, 12, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(12px);
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .app-title i {
            color: var(--color-primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-highlight);
            color: #fff;
        }

        button.primary {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--color-primary);
        }

        button.primary:hover {
            background: rgba(245, 158, 11, 0.25);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Table Container */
        .table-wrapper {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .table-scroll {
            flex: 1;
            overflow: auto;
        }

        /* Scrollbar Customization */
        .table-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .table-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead {
            background: rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border-subtle);
            white-space: nowrap;
            background: #151518;
            /* Solid background for sticky header */
        }

        /* Align Right for Numbers */
        th.text-right,
        td.text-right {
            text-align: right;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-separator);
            color: var(--text-main);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Footer Summary */
        .table-footer {
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .footer-info span {
            color: var(--text-muted);
            margin-right: 8px;
        }

        .footer-total {
            color: var(--color-primary);
            font-weight: 700;
            font-size: 1rem;
        }

        /* Loading Overlay */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(245, 158, 11, 0.3);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: #18181b;
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.2rem;
            padding: 4px;
            color: var(--text-muted);
        }

        .close-modal:hover {
            color: #fff;
            background: none;
            border: none;
        }

        .modal-body {
            padding: 16px 24px;
            flex: 1;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-main);
            font-family: var(--font-main);
            margin-bottom: 12px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--color-primary-dim);
        }

        .client-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
        }

        .client-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-separator);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .client-item:last-child {
            border-bottom: none;
        }

        .client-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .client-item.excluded {
            background: rgba(239, 68, 68, 0.1);
        }

        .client-item.excluded .client-name {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .client-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }

        .client-checkbox:checked {
            background: var(--status-danger);
            border-color: var(--status-danger);
        }

        .client-checkbox:checked::after {
            content: '×';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .client-name {
            font-size: 0.9rem;
            flex: 1;
        }

        .client-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* NEW: Date Filter Styles */
        .filter-bar {
            background: var(--bg-card);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .filter-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-main);
        }

        /* NEW: Vertical Separators */
        th,
        td {
            border-right: 1px solid var(--border-separator);
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }

        /* NEW: Column Filters & Truncation */
        .col-filter-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            margin-top: 4px;
        }

        td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
            /* Adjust as needed */
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="color: var(--text-muted);">Carregando dados do ERP...</div>
    </div>

    <!-- Client Filter Modal -->
    <div id="clientModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Filtrar Clientes (Ocultar)</div>
                <button class="close-modal" onclick="closeClientModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
                    <i class="fa-solid fa-circle-info"></i> Marque os clientes que deseja <b>OCULTAR</b> da tabela.
                </div>
                <input type="text" class="search-box" id="clientSearch" placeholder="Buscar cliente..."
                    onkeyup="filterClientList()">
                <div class="client-list" id="clientListContainer"></div>
            </div>
            <div class="modal-header" style="justify-content: flex-end; border-top: 1px solid var(--border-subtle);">
                <button onclick="closeClientModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="app-title">
            <i class="fa-solid fa-server"></i> Relatório de Faturamento (ERP)
        </div>
        <div class="header-actions">
            <button onclick="openClientModal()">
                <i class="fa-solid fa-filter"></i> Filtrar Clientes
            </button>
            <button onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <button class="primary" onclick="loadData()">
                <i class="fa-solid fa-rotate-right"></i> Atualizar
            </button>
        </div>
    </header>

    <!-- Filter Bar for Date Range -->
    <div class="filter-bar">
        <div class="filter-group">
            <label class="filter-label">Período:</label>
            <input type="date" id="startDate" class="filter-input">
            <span style="color: var(--text-muted);">-</span>
            <input type="date" id="endDate" class="filter-input">
        </div>
        <button class="primary" style="padding: 4px 12px; font-size: 0.85rem;" onclick="loadData()">Filtrar</button>
    </div>

    <!-- Main -->
    <main>
        <div class="table-wrapper">
            <div class="table-scroll">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <!-- Column Headers with Filter Inputs - NO NF COLUMN -->
                            <th style="min-width: 100px;">Data <input type="text" class="col-filter-input"
                                    onkeyup="filterColumn(0, this.value)"></th>
                            <!-- NF REMOVED -->
                            <th style="min-width: 60px;">Série <input type="text" class="col-filter-input"
                                    onkeyup="filterColumn(1, this.value)"></th>
                            <th style="min-width: 80px;">Cód. Cli <input type="text" class="col-filter-input"
                                    onkeyup="filterColumn(2, this.value)"></th>
                            <th style="min-width: 150px;">Cliente <input type="text" class="col-filter-input"
                                    onkeyup="filterColumn(3, this.value)"></th>
                            <th style="min-width: 80px;">Cód. Item <input type="text" class="col-filter-input"
                                    onkeyup="filterColumn(4, this.value)"></th>
                            <th style="min-width: 150px;">Descrição <input type="text" class="col-filter-input"
                                    onkeyup="filterColumn(5, this.value)"></th>
                            <th class="text-right" style="min-width: 80px;">Qtd <input type="text"
                                    class="col-filter-input" onkeyup="filterColumn(6, this.value)"></th>
                            <th class="text-right" style="min-width: 100px;">Valor Unit. <input type="text"
                                    class="col-filter-input" onkeyup="filterColumn(7, this.value)"></th>
                            <th class="text-right" style="min-width: 100px;">Valor Total <input type="text"
                                    class="col-filter-input" onkeyup="filterColumn(8, this.value)"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"> <!-- Rows via JS --> </tbody>
                </table>
            </div>
            <!-- Footer -->
            <div class="table-footer">
                <div class="footer-info"><span>Registros:</span> <b id="totalRecords">0</b></div>
                <div class="footer-total">Total: <span id="totalValue">R$ 0,00</span></div>
            </div>
        </div>
    </main>

    <script>
        // Global Data Stores
        let allData = [];
        let excludedClients = new Set();
        let clientStats = {};
        let colFilters = {};

        // Formatting Helpers
        const formatCurrency = (val) => val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatNumber = (val) => val.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        };

        // --- LOAD DATA & PREFERENCES ---
        async function loadData() {
            const spinner = document.getElementById('loading-screen');
            const tbody = document.getElementById('tableBody');

            spinner.style.display = 'flex';

            // Get Dates
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            try {
                // 1. Load Preferences First
                await loadPreferences();

                // 2. Load Data with Filters
                let url = '/api/faturamento-postgres/detalhado?limit=5000';
                if (startDate) url += `&startDate=${startDate}`;
                if (endDate) url += `&endDate=${endDate}`;

                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    allData = result.data;
                    processClients(allData);
                    renderTable();
                } else {
                    alert('Erro ao carregar dados: ' + (result.message || 'Desconhecido'));
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 20px; color: var(--status-danger);">Erro ao carregar dados.</td></tr>';
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão com o servidor.');
            } finally {
                spinner.style.display = 'none';
            }
        }

        // --- PREFERENCES LOGIC ---
        async function loadPreferences() {
            try {
                const res = await fetch('/api/preferences/excluded_clients');
                const json = await res.json();
                if (json.success && json.data && Array.isArray(json.data)) {
                    excludedClients = new Set(json.data);
                    console.log('Preferências carregadas:', excludedClients.size, 'clientes excluídos.');
                }
            } catch (e) {
                console.warn('Falha ao carregar preferências', e);
            }
        }

        async function savePreferences() {
            try {
                const arrayData = Array.from(excludedClients);
                console.log('Salvando preferências...', arrayData.length, 'clientes.');
                await fetch('/api/preferences/excluded_clients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: arrayData })
                });
            } catch (e) {
                console.error('Erro ao salvar preferências', e);
            }
        }

        function processClients(data) {
            clientStats = {};
            data.forEach(item => {
                const name = (item.clienteNome || 'Desconhecido').trim();
                clientStats[name] = (clientStats[name] || 0) + 1;
            });
        }

        // --- FILTERING LOGIC ---
        function filterColumn(colIndex, value) {
            colFilters[colIndex] = value.toLowerCase();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // 1. Filter by Excluded Clients
            let visibleData = allData.filter(item => {
                const name = (item.clienteNome || 'Desconhecido').trim();
                return !excludedClients.has(name);
            });

            // 2. Filter by Columns
            if (Object.keys(colFilters).length > 0) {
                visibleData = visibleData.filter(item => {
                    // Map item properties to column indices (matching render order)
                    // 0:Data, 1:Serie, 2:CodCli, 3:Cliente, 4:CodItem, 5:Desc, 6:Qtd, 7:V.Unit, 8:V.Total
                    const rowValues = [
                        formatDate(item.data),
                        String(item.serie || ''),
                        String(item.clienteCodigo || ''),
                        String(item.clienteNome || ''),
                        String(item.codigoItem || ''),
                        String(item.descricao || ''),
                        formatNumber(item.quantidade),
                        formatNumber(item.valorUnitario),
                        formatCurrency(item.valorTotal)
                    ];

                    return Object.entries(colFilters).every(([idx, term]) => {
                        if (!term) return true;
                        return rowValues[idx].toLowerCase().includes(term);
                    });
                });
            }

            if (visibleData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 20px; color: var(--text-muted);">Nenhum registro encontrado.</td></tr>';
                updateSummary({ totalRegistros: 0, totalFaturado: 0 });
                return;
            }

            const rows = visibleData.map(item => `
                <tr>
                    <td title="${formatDate(item.data)}">${formatDate(item.data)}</td>
                    <td title="${item.serie}">${item.serie || ''}</td>
                    <td title="${item.clienteCodigo}">${item.clienteCodigo || ''}</td>
                    <td title="${item.clienteNome}">${item.clienteNome || ''}</td>
                    <td title="${item.codigoItem}">${item.codigoItem || ''}</td>
                    <td title="${item.descricao}">${item.descricao || ''}</td>
                    <td class="text-right">${formatNumber(item.quantidade)}</td>
                    <td class="text-right">${formatNumber(item.valorUnitario)}</td>
                    <td class="text-right" style="color: var(--color-primary); font-weight:600;">${formatCurrency(item.valorTotal)}</td>
                </tr>
            `).join('');

            tbody.innerHTML = rows;
            updateSummary(calculateSummary(visibleData));
        }

        function calculateSummary(data) {
            return {
                totalRegistros: data.length,
                totalFaturado: data.reduce((acc, curr) => acc + (curr.valorTotal || 0), 0)
            };
        }

        function updateSummary(summary) {
            document.getElementById('totalRecords').textContent = summary.totalRegistros.toLocaleString('pt-BR');
            document.getElementById('totalValue').textContent = formatCurrency(summary.totalFaturado);
        }

        // --- CLIENT MODAL LOGIC (UPDATED WITH PERSISTENCE) ---
        function openClientModal() {
            document.getElementById('clientModal').style.display = 'flex';
            renderClientList();
            document.getElementById('clientSearch').focus();
        }

        function closeClientModal() {
            document.getElementById('clientModal').style.display = 'none';
        }

        function renderClientList() {
            const container = document.getElementById('clientListContainer');
            const searchTerm = document.getElementById('clientSearch').value.toLowerCase();
            const clients = Object.keys(clientStats).sort();

            container.innerHTML = clients.map(client => {
                if (searchTerm && !client.toLowerCase().includes(searchTerm)) return '';
                const isExcluded = excludedClients.has(client);
                return `
                    <div class="client-item ${isExcluded ? 'excluded' : ''}" onclick="toggleClientExclusion('${client.replace(/'/g, "\\'")}')">
                        <input type="checkbox" class="client-checkbox" ${isExcluded ? 'checked' : ''} onclick="event.stopPropagation(); toggleClientExclusion('${client.replace(/'/g, "\\'")}')">
                        <span class="client-name">${client}</span>
                        <span class="client-count">${clientStats[client]}</span>
                    </div>
                `;
            }).join('');
        }

        function filterClientList() { renderClientList(); }

        function toggleClientExclusion(clientName) {
            if (excludedClients.has(clientName)) { excludedClients.delete(clientName); }
            else { excludedClients.add(clientName); }

            renderClientList();
            renderTable();
            savePreferences(); // SAVE TO DB
        }

        // Window Events (Close Modal)
        window.onclick = function (e) { if (e.target === document.getElementById('clientModal')) closeClientModal(); }
        window.onkeydown = function (e) { if (e.key === 'Escape') closeClientModal(); }

        // Start
        document.addEventListener('DOMContentLoaded', () => {
            // Set default Date (e.g., current month)
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);

            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = lastDay;

            loadData();
        });
    </script>
</body>

</html>
