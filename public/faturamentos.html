<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Faturamento (ERP) - Fundição Erus</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        /* CSS Variables - Burnt Orange Theme */
        :root {
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-primary: #f59e0b;
            /* Amber 500 */
            --color-primary-dim: #ea580c;
            /* Orange 600 */
            --bg-body: #09090b;
            /* Zinc 950 */
            --bg-card: rgba(24, 24, 27, 0.7);
            /* Zinc 900 Glass */
            --text-main: #f4f4f5;
            /* Zinc 100 */
            --text-muted: #a1a1aa;
            /* Zinc 400 */
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-separator: rgba(255, 255, 255, 0.06);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --status-success: #10b981;
            --status-danger: #ef4444;
        }

        /* Reset & Base */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image: radial-gradient(circle at 15% 50%, rgba(234, 88, 12, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(63, 63, 70, 0.05), transparent 25%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(12px);
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .app-title i {
            color: var(--color-primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-highlight);
            color: #fff;
        }

        button.primary {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--color-primary);
        }

        button.primary:hover {
            background: rgba(245, 158, 11, 0.25);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Table Container */
        .table-wrapper {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .table-scroll {
            flex: 1;
            overflow: auto;
        }

        /* Scrollbar Customization */
        .table-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .table-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead {
            background: rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border-subtle);
            white-space: nowrap;
            background: #151518;
            /* Solid background for sticky header */
        }

        /* Align Right for Numbers */
        th.text-right,
        td.text-right {
            text-align: right;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-separator);
            color: var(--text-main);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Footer Summary */
        .table-footer {
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .footer-info span {
            color: var(--text-muted);
            margin-right: 8px;
        }

        .footer-total {
            color: var(--color-primary);
            font-weight: 700;
            font-size: 1rem;
        }

        /* Loading Overlay */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(245, 158, 11, 0.3);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="color: var(--text-muted);">Carregando dados do ERP...</div>
    </div>

    <!-- Header -->
    <header>
        <div class="app-title">
            <i class="fa-solid fa-server"></i>
            Relatório de Faturamento (ERP)
        </div>
        <div class="header-actions">
            <!-- Back to dashboard index -->
            <button onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <button class="primary" onclick="loadData()">
                <i class="fa-solid fa-rotate-right"></i> Atualizar
            </button>
        </div>
    </header>

    <!-- Main -->
    <main>
        <div class="table-wrapper">
            <div class="table-scroll">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>NF</th>
                            <th>Série</th>
                            <th>Cód. Cli</th>
                            <th>Cliente</th>
                            <th>Cód. Item</th>
                            <th>Descrição</th>
                            <th class="text-right">Qtd</th>
                            <th class="text-right">Valor Unit.</th>
                            <th class="text-right">Valor Total</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <div class="footer-info">
                    <span>Registros:</span> <b id="totalRecords">0</b>
                </div>
                <div class="footer-total">
                    Total: <span id="totalValue">R$ 0,00</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // formatting helpers
        const formatCurrency = (val) => val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatNumber = (val) => val.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        };

        async function loadData() {
            const spinner = document.getElementById('loading-screen');
            const tbody = document.getElementById('tableBody');

            spinner.style.display = 'flex';

            try {
                // Fetching from the endpoint that connects to Firebird/Postgres
                const response = await fetch('/api/faturamento-postgres/detalhado?limit=5000');
                const result = await response.json();

                if (result.success) {
                    renderTable(result.data);
                    // Use server summary if available, otherwise calculate client-side
                    updateSummary(result.summary || calculateSummary(result.data));
                } else {
                    alert('Erro ao carregar dados: ' + (result.message || 'Desconhecido'));
                    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px; color: var(--status-danger);">Erro ao carregar dados.</td></tr>';
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão com o servidor.');
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px; color: var(--status-danger);">Erro de conexão.</td></tr>';
            } finally {
                spinner.style.display = 'none';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px; color: var(--text-muted);">Nenhum registro encontrado.</td></tr>';
                return;
            }

            const rows = data.map(item => `
                <tr>
                    <td>${formatDate(item.data)}</td>
                    <td>${item.notaFiscal || ''}</td>
                    <td>${item.serie || ''}</td>
                    <td>${item.clienteCodigo || ''}</td>
                    <td>${item.clienteNome || ''}</td>
                    <td>${item.codigoItem || ''}</td>
                    <td>${item.descricao || ''}</td>
                    <td class="text-right">${formatNumber(item.quantidade)}</td>
                    <td class="text-right">${formatNumber(item.valorUnitario)}</td>
                    <td class="text-right" style="color: var(--color-primary); font-weight:600;">${formatCurrency(item.valorTotal)}</td>
                </tr>
            `).join('');

            tbody.innerHTML = rows;
        }

        function calculateSummary(data) {
            if (!data) return { totalRegistros: 0, totalFaturado: 0 };
            return {
                totalRegistros: data.length,
                totalFaturado: data.reduce((acc, curr) => acc + (curr.valorTotal || 0), 0)
            };
        }

        function updateSummary(summary) {
            document.getElementById('totalRecords').textContent = summary.totalRegistros.toLocaleString('pt-BR');
            document.getElementById('totalValue').textContent = formatCurrency(summary.totalFaturado);
        }

        // Init
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
